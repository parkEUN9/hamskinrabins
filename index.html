<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff4f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>햄스킨라빈스</title>
<style>
/* 앱(WebView)에서 쓸 때를 기준으로 잡은 규칙
   - 두 번 탭 확대·길게 눌러 선택·당겨서 새로고침을 막는다
   - 글자를 넣는 곳(.tin)만 선택을 다시 허용한다 */
*{
  box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation
}
input,textarea,.tin{-webkit-user-select:text;user-select:text;touch-action:auto}
:root{
  --bg:#fff4f7; --card:#fffdfb; --line:#f3d9e0; --ink:#4d3a41; --ink2:#9d8189;
  --acc:#f2688f; --acc2:#5fc4ad; --gold:#f0b93f; --no:#e2705f;
  --sh:0 2px 0 #f0dbe1;
}
html,body{margin:0;padding:0;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(circle at 12% 8%, #ffe6ee 0 20%, transparent 45%),
    radial-gradient(circle at 88% 4%, #ddf5ee 0 18%, transparent 40%),
    var(--bg);
  color:var(--ink);
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  font-size:14.5px;line-height:1.5;min-height:100vh;overflow-x:hidden;
  padding:0 0 calc(76px + env(safe-area-inset-bottom));
}
#app{
  max-width:520px;margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top)) calc(9px + env(safe-area-inset-right)) 0 calc(9px + env(safe-area-inset-left))
}

/* ---------- 헤더 ---------- */
header{margin-bottom:8px}
.brand{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.brand h1{margin:0;font-size:18.5px;letter-spacing:-.4px}
.brand .logo{
  width:32px;height:32px;border-radius:11px;background:linear-gradient(#ffd0de,#ffb0c6);
  display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--sh)
}
/* 헤더 버튼은 아이 손가락 기준으로 38px 은 넘긴다 (특히 🎁선물상자는 자주 누른다) */
.brand .lv{
  margin-left:auto;font-size:11px;font-weight:700;background:var(--card);border:2px solid var(--line);
  border-radius:12px;padding:0 9px;min-height:38px;display:flex;align-items:center;
  cursor:pointer;white-space:nowrap
}
.brand .hbtn{
  width:38px;height:38px;flex:none;border-radius:12px;background:var(--card);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative;
  box-shadow:var(--sh)
}
.brand .hbtn:active{transform:translateY(1px)}
/* 선물이 준비되면 상자가 살랑살랑 흔들린다 */
.brand .hbtn.rdy{border-color:#f0c65a;background:linear-gradient(#fff7e0,#ffeec4);animation:wig 1.1s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.brand .hbtn .bg{
  position:absolute;right:-3px;top:-4px;background:var(--no);color:#fff;font-size:8.5px;font-weight:800;
  border-radius:9px;padding:0 3px;line-height:13px;box-shadow:0 0 0 1.5px #fff
}
.purse{display:flex;gap:7px}
.purse div{
  flex:1;background:var(--card);border:2px solid var(--line);border-radius:13px;
  padding:5px 4px;text-align:center;box-shadow:var(--sh)
}
.purse div[onclick]{cursor:pointer}
.purse div[onclick]:active{transform:translateY(1px)}
.purse .n{font-size:15px;font-weight:800;line-height:1.15}
.purse .t{font-size:10px;color:var(--ink2)}

/* ---------- 공통 ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:19px;padding:11px;box-shadow:var(--sh);margin-bottom:9px}
.card h3{margin:0 0 7px;font-size:14.5px;display:flex;align-items:center;gap:5px}
.card h3 small{margin-left:auto;font-weight:400;font-size:11px;color:var(--ink2)}
.muted{color:var(--ink2);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{
  border:2px solid #d94f76;background:linear-gradient(#ff8fae,var(--acc));color:#fff;
  font:inherit;font-weight:800;font-size:13.5px;padding:9px 13px;border-radius:14px;
  cursor:pointer;box-shadow:0 3px 0 #c94168;transition:transform .06s
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c94168}
/* 작은 버튼도 아이 손가락으로 누를 수 있게 40px 은 넘긴다 */
.btn.sm{font-size:12px;padding:9px 10px;border-radius:12px;min-height:40px}
.btn.w{background:linear-gradient(#fffdfb,#fdeef2);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 #ecd3da}
.btn.w:active{box-shadow:0 1px 0 #ecd3da}
.btn.g{background:linear-gradient(#86dcc7,var(--acc2));border-color:#43a892;box-shadow:0 3px 0 #3d9a84}
.btn.g:active{box-shadow:0 1px 0 #3d9a84}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.bar{height:8px;border-radius:99px;background:#f6e2e8;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,#ffc46e,var(--acc));border-radius:99px;transition:width .25s}
.tin{
  width:100%;font:inherit;font-size:15px;font-weight:700;text-align:center;color:var(--ink);
  background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;outline:none
}
.tin:focus{border-color:var(--acc);box-shadow:0 0 0 3px #ffe1ea}
.tag{display:inline-block;background:#fdeef2;border:1px solid var(--line);border-radius:8px;padding:1px 6px;font-size:10.5px}
.hs{display:inline-block;line-height:0}
.hs svg{width:100%;height:100%;display:block;overflow:visible}
.big{width:138px;height:138px;margin:2px auto 6px}
.burst{animation:burst .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes burst{0%{transform:scale(.25) rotate(-16deg);opacity:0}60%{transform:scale(1.14) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.stars{color:var(--gold);letter-spacing:-1px}

/* ---------- 스쿱 무대 ---------- */
#stage{
  position:relative;border-radius:18px;overflow:hidden;margin-bottom:9px;
  background:linear-gradient(#ffe9f0 0 62%,#f7e2cd 62%);
  border:2px solid #f0c4d2;box-shadow:var(--sh);padding:22px 9px 11px;text-align:center
}
#stage .stripe{
  position:absolute;left:0;right:0;top:0;height:16px;
  background:repeating-linear-gradient(135deg,#ff9fba 0 12px,#fff0f4 12px 24px);
  border-bottom:2px solid #f0c4d2
}
/* 반짝 게이지 — 예전 「보장까지」 를 눈에 보이는 막대로 바꾼 것 */
#stage .pity{
  max-width:300px;margin:9px auto 0;background:rgba(255,255,255,.72);
  border:2px solid #f3d0dc;border-radius:14px;padding:6px 9px 7px
}
#stage .pity .lab{font-size:11.5px;font-weight:700;margin-bottom:4px;line-height:1.35}
#stage .pity .bar{height:10px;background:#f4cfdb}
#stage .pity .bar>div{background:linear-gradient(90deg,#ffe07a,#ffb14a)}
#tubbig{width:206px;max-width:78%;margin:0 auto;position:relative}
#tubbig svg{width:100%;height:auto;display:block;overflow:visible}
#tubbig.dig{animation:dig .5s ease-in-out}
@keyframes dig{
  0%{transform:rotate(0) translateY(0)}
  25%{transform:rotate(-4deg) translateY(-5px)}
  50%{transform:rotate(3deg) translateY(2px)}
  75%{transform:rotate(-2deg) translateY(-3px)}
  100%{transform:rotate(0) translateY(0)}
}
#stage .spoon{
  position:absolute;right:4%;top:-4px;font-size:36px;transform-origin:80% 90%;
  animation:sway 2.6s ease-in-out infinite alternate
}
@keyframes sway{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
#stage .pickname{font-size:16px;font-weight:800;margin-top:6px}
#stage .picksub{font-size:11.5px;color:#8a6b74}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks span{position:absolute;font-size:20px;animation:fly .8s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}

/* ---------- 통 진열 ---------- */
.tubs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(min-width:430px){.tubs{grid-template-columns:repeat(4,1fr)}}
.tub{
  position:relative;border:2px solid var(--line);background:var(--card);border-radius:14px;
  padding:6px 3px 5px;cursor:pointer;box-shadow:var(--sh);font:inherit;text-align:center;overflow:hidden
}
.tub:active{transform:translateY(2px)}
.tub.on{border-color:var(--acc);box-shadow:0 0 0 3px #ffd9e4}
.tub .dome{
  display:block;width:46px;height:32px;margin:0 auto 3px;border-radius:50% 50% 32% 32%;
  background:linear-gradient(160deg,var(--c2),var(--c));box-shadow:inset -4px -5px 0 rgba(0,0,0,.08)
}
.tub .nm{display:block;font-size:10.5px;font-weight:700;line-height:1.2;word-break:keep-all}
.tub .pr{display:block;font-size:9.5px;color:var(--ink2);margin-top:1px}
.tub .gr{position:absolute;left:3px;top:2px;font-size:9px;color:var(--gold);letter-spacing:-1.5px}
.tub .new{position:absolute;right:3px;top:1px;font-size:9px}
.tub.locked{opacity:.42;cursor:pointer}

/* ---------- 🏠 방 고르기 줄 ---------- */
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:7px}
.rooms>div{
  background:var(--card);border:2px solid var(--line);border-radius:13px;padding:5px 2px 4px;
  text-align:center;font-size:10.5px;font-weight:700;cursor:pointer;box-shadow:var(--sh);
  line-height:1.25;word-break:keep-all;min-height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center
}
.rooms>div.on{border-color:var(--acc);background:#ffeaf1;color:var(--acc)}
.rooms>div .e{display:block;font-size:17px;line-height:1.15}
.rooms>div i{display:block;font-style:normal;font-size:8.5px;font-weight:700;color:var(--ink2)}
.rooms>div.on i{color:var(--acc)}

/* ---------- 테라스 ---------- */
/* 테라스 색은 전부 변수로 뺐다 — 🎨테마를 고르면 applyTheme() 가 :root 값만 바꿔준다 */
:root{
  --tsky:#ffeef4; --tsky2:#f3e3cf; --tawn1:#ff9fba; --tawn2:#fff5f8; --tawnb:#ef8ba9;
  --tflo1:#f7e6d0; --tflo2:#eed6b8; --tflob:#e7c9a4; --tline:#f0c4d2
}
#terrace{
  position:relative;height:300px;border-radius:18px;overflow:hidden;margin-bottom:9px;
  background:linear-gradient(var(--tsky) 0 56%,var(--tsky2) 56%);
  border:2px solid var(--tline);box-shadow:var(--sh);contain:paint
}
#terrace .awn{
  position:absolute;left:0;right:0;top:0;height:34px;
  background:repeating-linear-gradient(90deg,var(--tawn1) 0 22px,var(--tawn2) 22px 44px);
  border-bottom:3px solid var(--tawnb);border-radius:0 0 10px 10px
}
#terrace .awn:after{
  content:'';position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:repeating-linear-gradient(90deg,var(--tawn1) 0 22px,var(--tawn2) 22px 44px);
  clip-path:polygon(0 0,100% 0,100% 40%,95% 100%,90% 40%,85% 100%,80% 40%,75% 100%,70% 40%,65% 100%,60% 40%,55% 100%,50% 40%,45% 100%,40% 40%,35% 100%,30% 40%,25% 100%,20% 40%,15% 100%,10% 40%,5% 100%,0 40%)
}
#terrace .floor{
  position:absolute;left:0;right:0;bottom:0;height:44%;
  background:
    repeating-conic-gradient(var(--tflo1) 0 25%, var(--tflo2) 0 50%) 0 0/28px 28px;
  border-top:3px solid var(--tflob)
}
/* 테마마다 하늘에 뜨는 작은 장식 */
#terrace .tsp{position:absolute;line-height:1;z-index:1;animation:twk 2.6s ease-in-out infinite}
#terrace .deco{position:absolute;transform:translateX(-50%);line-height:1;filter:drop-shadow(0 2px 1px rgba(140,90,100,.2))}
#terrace .hint{
  position:absolute;left:8px;top:41px;font-size:10.5px;color:#8a4a67;z-index:5;
  background:rgba(255,255,255,.85);border-radius:9px;padding:2px 7px
}
#terrace .none{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:12.5px;color:#8a4a67;z-index:5}
#terrace .tham{
  position:absolute;transform:translateX(-50%);text-align:center;cursor:pointer;
  animation:stroll var(--dur,9s) ease-in-out infinite alternate
}
#terrace .tham .hs{width:var(--w,82px);height:var(--w,82px);display:block;margin:0 auto;animation:wob 2.5s ease-in-out infinite alternate}
#terrace .tham b{
  display:block;font-size:10.5px;font-weight:700;color:#8a4a67;background:rgba(255,255,255,.92);
  border-radius:9px;padding:1px 6px;width:fit-content;margin:0 auto;white-space:nowrap
}
#terrace .tham b i{font-style:normal;font-size:8.5px;color:#d4568a;letter-spacing:-.5px}
/* 좁은 폰에서는 테라스가 360px 밖에 안 돼서 이름표끼리 많이 겹친다 — 조금 작게 만든다 */
@media(max-width:429px){
  #terrace .tham b{font-size:9.5px;padding:1px 5px;border-radius:8px}
  #terrace .tham b i{font-size:8px}
  #terrace .tham .hb{font-size:9px;padding:1px 5px}
}
/* 말풍선 — 이모지뿐 아니라 짧은 말도 띄운다. translateX(-50%) 를 키프레임에도 넣어야 한다 */
#terrace .tham .hb{
  position:absolute;left:50%;top:-11px;transform:translateX(-50%);
  font-size:9.5px;font-weight:700;color:#8a4a67;background:rgba(255,255,255,.95);
  border:1.5px solid #f3d0dc;border-radius:10px;padding:1px 6px;white-space:nowrap;
  animation:mumble 5.5s ease-in-out infinite
}
#terrace .tham:active .hs{animation:none;transform:scale(.9)}
#terrace .tham.hop .hs{animation:thop .75s ease-out}

/* ⚽ 공 쫓아가기 — 공이 지나가는 쪽으로 우르르 달려갔다 돌아온다.
   stroll 과 마찬가지로 translateX(-50%) 를 키프레임마다 다시 써줘야 가운데 정렬이 안 깨진다. */
#terrace .tham.chase{animation:chase 2.8s cubic-bezier(.4,0,.5,1)}
@keyframes chase{
  0%  {transform:translateX(-50%) translateX(0)}
  38% {transform:translateX(-50%) translateX(var(--cx,60px))}
  55% {transform:translateX(-50%) translateX(var(--cx,60px))}
  100%{transform:translateX(-50%) translateX(0)}
}
#terrace .tham.chase .hs{animation:runwob .28s ease-in-out infinite alternate}
@keyframes runwob{from{transform:translateY(0) rotate(-11deg)}to{transform:translateY(-7px) rotate(11deg)}}

/* 🎵 춤추기 */
#terrace .tham.dance{animation:dance 1.15s ease-in-out infinite}
@keyframes dance{
  0%  {transform:translateX(-50%) translateX(-9px) rotate(-7deg)}
  25% {transform:translateX(-50%) translateX(0)    rotate(0deg) translateY(-13px)}
  50% {transform:translateX(-50%) translateX(9px)  rotate(7deg)}
  75% {transform:translateX(-50%) translateX(0)    rotate(0deg) translateY(-13px)}
  100%{transform:translateX(-50%) translateX(-9px) rotate(-7deg)}
}
#terrace .tham.dance .hs{animation:dwob .575s ease-in-out infinite alternate}
@keyframes dwob{from{transform:scale(.94) rotate(-6deg)}to{transform:scale(1.07) rotate(6deg)}}
#terrace .fx.note{font-size:16px;opacity:.9;animation:noteup 2.6s ease-out forwards}
@keyframes noteup{
  0%{transform:translate(0,0) rotate(-15deg);opacity:0}
  15%{opacity:1}
  100%{transform:translate(var(--nx,20px),-150px) rotate(20deg);opacity:0}
}
/* 춤출 때 바닥에 도는 조명 — 바깥 상자로 잘라서 바닥 밖으로 새지 않게 한다 */
#terrace .disco{
  position:absolute;left:0;right:0;bottom:0;height:44%;z-index:0;pointer-events:none;overflow:hidden
}
#terrace .disco i{
  position:absolute;left:50%;top:50%;width:240%;aspect-ratio:1;margin:-120% 0 0 -120%;
  background:repeating-conic-gradient(from 0deg,rgba(255,140,190,.26) 0 12%,transparent 0 25%);
  animation:discospin 3.2s linear infinite
}
@keyframes discospin{to{transform:rotate(360deg)}}
@keyframes wob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
@keyframes stroll{from{transform:translateX(-50%) translateX(calc(var(--d) * -1))}to{transform:translateX(-50%) translateX(var(--d))}}
@keyframes mumble{
  0%,72%{opacity:0;transform:translateX(-50%) translateY(5px)}
  80%,94%{opacity:1;transform:translateX(-50%) translateY(-3px)}
  100%{opacity:0;transform:translateX(-50%) translateY(-3px)}}
@keyframes thop{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-24px) rotate(-8deg) scale(1.06)}
  50%{transform:translateY(0)}72%{transform:translateY(-11px) rotate(6deg)}100%{transform:translateY(0) rotate(0)}}
#terrace .fx{position:absolute;pointer-events:none;z-index:6}
#terrace .fx.ball{bottom:16px;font-size:26px;animation:ballroll 3.4s cubic-bezier(.4,0,.5,1) forwards}
#terrace .fx.bub{animation:bubup 3s ease-out forwards}
#terrace .fx.heart{font-size:20px;transform:translate(-50%,0);animation:heartup 1s ease-out forwards}
/* 굴러갔다가 오른쪽 끝에서 톡 튕겨 되돌아온다 (구르는 방향도 같이 바뀐다) */
@keyframes ballroll{
  0%  {left:-10%; transform:rotate(0)}
  46% {left:96%;  transform:rotate(1080deg)}
  54% {left:96%;  transform:rotate(1080deg)}
  100%{left:-10%; transform:rotate(0)}
}
@keyframes bubup{0%{transform:translateY(0) scale(.5);opacity:0}18%{opacity:.95}100%{transform:translateY(-190px) scale(1.2);opacity:0}}
@keyframes heartup{0%{transform:translate(-50%,0) scale(.4);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-56px) scale(1.15);opacity:0}}

.toys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.toy{background:var(--card);border:2px solid var(--line);border-radius:13px;padding:6px 2px;text-align:center;cursor:pointer;box-shadow:var(--sh)}
.toy.on{border-color:var(--acc);box-shadow:0 0 0 3px #ffd9e4}
.toy .e{font-size:19px;line-height:1.15}
.toy .n{font-size:10px;font-weight:700;margin-top:1px;word-break:keep-all}
.toy .c{font-size:9px;color:var(--ink2)}
.toy:active{transform:translateY(1px)}

.slot{display:flex;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:14px;padding:6px 8px;margin-bottom:6px;background:#fffdfb;cursor:pointer}
.slot.on{border-style:solid}
.slot .hs{width:44px;height:44px;flex:0 0 44px}
.slot .ph{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:#fdeef2;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2)}
.slot .info{flex:1;min-width:0;font-size:12px}
/* 좁은 폰(360px)에서 「놀러 가기 ▸」 같은 꼬리말이 본문과 겹치지 않게 줄이지 않고 붙여 둔다 */
.slot > .muted{flex:0 0 auto;white-space:nowrap;font-size:10.5px}

/* ---------- 도감 ---------- */
.dexgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:430px){.dexgrid{grid-template-columns:repeat(5,1fr)}}
.dcard{border:2px solid var(--line);background:var(--card);border-radius:13px;padding:5px 3px;text-align:center;box-shadow:var(--sh);cursor:pointer;position:relative}
.dcard.lock{opacity:.5;filter:grayscale(.7)}
.dcard .hs{width:100%;aspect-ratio:1;display:block}
.dcard .nm{font-size:10px;font-weight:700;line-height:1.2;word-break:keep-all}
.dcard .st{position:absolute;left:3px;top:2px;font-size:8.5px;color:var(--gold);letter-spacing:-1.5px}
.dcard .qm{font-size:30px;line-height:1.9;opacity:.35}
.dcard.g4{border-color:#f0c65a;background:linear-gradient(#fffaeb,#fff3d4)}
.dcard.g3{border-color:#d3b6ec}

/* ---------- 카드 그리드 ---------- */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:7px}
.shopgrid.wide{grid-template-columns:repeat(auto-fill,minmax(152px,1fr))}
.scard{background:var(--card);border:2px solid var(--line);border-radius:15px;box-shadow:var(--sh);padding:7px 5px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.scard .ic{font-size:22px;line-height:1.1}
.scard .ic .hs{width:46px;height:46px;display:block}
.scard b{font-size:12px}
.scard .fx{font-size:10px;color:var(--ink2);line-height:1.45}
.scard .pr{font-size:11px;font-weight:700}
.scard.locked{opacity:.5}
.scard .btn{width:100%;margin-top:2px}

/* ---------- 도장판 ---------- */
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.stamp{
  aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);background:#fff8fa;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;line-height:1
}
.stamp .d{font-size:8px;color:var(--ink2);font-weight:700;margin-top:1px}
.stamp.got{border-style:solid;border-color:#f0c65a;background:linear-gradient(#fffaeb,#ffeff6);box-shadow:var(--sh)}
.stamp.now{border-style:solid;border-color:var(--acc);background:#ffe6ee;animation:pls 1.1s ease-in-out infinite}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 컵 고르기 ----------
   숨은 햄쮜(.rev)는 컵(.body) 뒤에 겹쳐 두고, 맞히면 컵이 위로 떠오르며 사라진다. */
.cups{display:flex;gap:9px;justify-content:center;margin:12px 0 2px}
.cup{position:relative;width:31%;max-width:96px;cursor:pointer;text-align:center}
.cup .rev{
  position:absolute;left:50%;bottom:19px;width:58px;height:58px;margin-left:-29px;z-index:1;
  animation:revpop .5s .18s ease-out backwards
}
@keyframes revpop{from{transform:scale(.5) translateY(10px);opacity:0}to{transform:scale(1);opacity:1}}
.cup .body{
  position:relative;z-index:2;
  height:76px;border-radius:16px 16px 42% 42%/16px 16px 30px 30px;
  background:linear-gradient(#fffdfb,#ffe0ea);border:2.5px solid #f0a8c4;box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;font-size:27px;transition:transform .18s
}
.cup:active .body{transform:translateY(2px)}
.cup.up .body{animation:cupup .5s ease-out forwards}
@keyframes cupup{to{transform:translateY(-54px) rotate(-12deg);opacity:0}}
.cup .lb{font-size:10.5px;font-weight:700;margin-top:4px;color:var(--ink2);min-height:14px}

/* ---------- 🔔 손님 주문받기 ----------
   콘 → 맛 → 토핑 순서로 아래에서 위로 쌓아 올린다(고른 것이 바로 그림에 붙는다).
   주문서 말풍선은 고르는 동안 계속 띄워 둔다 — 저학년은 외우게 하면 안 된다. */
.ord{text-align:center}
.ord .bub{
  display:inline-block;max-width:94%;background:#fff;border:2.5px solid var(--line);border-radius:15px;
  padding:8px 12px;font-size:12.5px;font-weight:700;line-height:1.7;box-shadow:var(--sh);position:relative
}
.ord .bub:after,.ord .bub:before{content:'';position:absolute;left:50%;border:8px solid transparent}
.ord .bub:before{bottom:-16px;margin-left:-8px;border-top-color:var(--line)}
.ord .bub:after{bottom:-12px;margin-left:-8px;border-top-color:#fff}
.ord .who{width:70px;height:70px;display:inline-block;margin-top:11px;animation:wob 2.5s ease-in-out infinite alternate}
/* 만들고 있는 아이스크림 — .scard .ic 와 겹치지 않게 icec 로 따로 둔다 */
.icec{position:relative;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;margin-top:4px}
.icec>span{animation:icpop .34s ease-out}
.icec .tp{font-size:21px;line-height:1;margin-bottom:-7px;z-index:3}
.icec .sc{
  width:52px;height:46px;border-radius:50% 50% 46% 46%;z-index:2;margin-bottom:-10px;
  background:radial-gradient(circle at 34% 28%, var(--c2,#fff), var(--c,#ffa8c2) 74%);
  border:2px solid rgba(0,0,0,.06);box-shadow:inset -5px -6px 9px rgba(0,0,0,.10)
}
.icec .ph{
  font-size:11px;font-weight:700;color:var(--ink2);animation:none;line-height:1.5;
  border:2px dashed var(--line);border-radius:13px;padding:13px 15px;background:#fffafc
}
/* 콘 세 가지 — 와플콘·무지개콘은 삼각형, 예쁜 컵은 둥근 컵 */
.cone{display:block;position:relative;z-index:1;width:48px;height:54px;flex:0 0 auto}
.cone.waffle,.cone.rain{clip-path:polygon(3% 0,97% 0,50% 100%)}
.cone.waffle{background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 2px,transparent 2px 8px),
  repeating-linear-gradient(-45deg,rgba(140,88,36,.32) 0 2px,transparent 2px 8px),
  linear-gradient(#e9b77a,#c68c4c)}
.cone.rain{background:linear-gradient(90deg,#ff9fba 0 20%,#ffd98a 20% 40%,#a8e6a3 40% 60%,#9fd4f5 60% 80%,#cbaaf0 80% 100%)}
.cone.cupc{
  height:42px;margin-top:12px;
  background:linear-gradient(#fffdfb,#ffe0ea);border:2.5px solid #f0a8c4;
  border-radius:7px 7px 42% 42%/7px 7px 24px 24px
}
.cone.sm{width:30px;height:34px;margin:0 auto 3px}
.cone.cupc.sm{height:26px;margin-top:8px;border-width:2px;border-radius:5px 5px 42% 42%/5px 5px 15px 15px}
@keyframes icpop{from{transform:scale(.4) translateY(-9px);opacity:0}to{transform:scale(1);opacity:1}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts button{
  background:var(--card);border:2px solid var(--line);border-radius:13px;padding:7px 2px 6px;
  font:inherit;font-size:10.5px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:var(--sh);
  word-break:keep-all;line-height:1.25
}
.opts button .e{display:block;font-size:22px;line-height:1.25}
.opts button .sw{display:block;width:27px;height:27px;border-radius:50%;margin:1px auto 3px;border:2px solid rgba(0,0,0,.07)}
.opts button:active{transform:translateY(2px)}
.stepn{font-size:12px;font-weight:800;color:var(--acc);margin-top:10px;text-align:center}
.score{display:grid;gap:4px;margin-top:9px;font-size:11.5px}
.score div{display:flex;justify-content:space-between;gap:6px;background:#fff7fa;border:1.5px solid var(--line);border-radius:10px;padding:5px 9px}
.score div b{color:var(--acc)}
.score div.tot{background:#ffeaf1;border-color:var(--acc);font-weight:800;font-size:12.5px}

/* ---------- 🏆 꾸미기 대회 ---------- */
.runway{
  position:relative;border-radius:15px;overflow:hidden;padding:13px 8px 26px;text-align:center;
  background:linear-gradient(#fff4f9,#ffe0ec);border:2.5px solid var(--line);margin-top:2px
}
.runway .spot{
  position:absolute;left:50%;top:-46%;width:150%;aspect-ratio:1;margin-left:-75%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 60%)
}
.runway .rug{position:absolute;left:0;right:0;bottom:0;height:20px;
  background:repeating-linear-gradient(90deg,#f2a2c1 0 13px,#ffc4d9 13px 26px)}
.runway .hs{width:104px;height:104px;display:inline-block;position:relative;z-index:2;
  animation:wob 2.5s ease-in-out infinite alternate}
.runway .rk{position:relative;z-index:2;font-size:32px;line-height:1.2}
.runway .cap{position:relative;z-index:2;font-size:12.5px;font-weight:800;line-height:1.6}

/* ---------- 사진첩 ---------- */
.photo{background:#fff;border:2px solid var(--line);border-radius:13px;padding:7px 7px 5px;box-shadow:0 3px 0 #eed7de}
.photo .pic{
  position:relative;border-radius:10px;overflow:hidden;height:120px;
  display:flex;align-items:flex-end;justify-content:center;gap:1px;padding:0 5px 7px
}
.photo .pic .sky{position:absolute;inset:0}
.photo .pic .fl{position:absolute;left:0;right:0;bottom:0;height:36%}
.photo .pic .hs{width:54px;height:54px;position:relative;z-index:2;flex:0 0 auto}
.photo .pic .cn{position:absolute;font-size:13px;z-index:3;opacity:.9}
.photo .cap{font-size:11.5px;font-weight:700;text-align:center;margin-top:5px;line-height:1.3;word-break:keep-all}
.photo .dt{font-size:9px;color:var(--ink2);text-align:center}
.photo.sm{padding:4px 4px 3px;border-radius:10px;cursor:pointer}
.photo.sm .pic{height:62px;padding:0 2px 3px;border-radius:7px}
.photo.sm .pic .hs{width:27px;height:27px}
.photo.sm .pic .cn{font-size:8px}
.photo.sm .cap{font-size:8.5px;margin-top:2px}
.photo.sm .dt{font-size:7px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.frames div{
  border:2px solid var(--line);background:var(--card);border-radius:12px;padding:5px 2px;text-align:center;
  font-size:10.5px;font-weight:700;cursor:pointer;box-shadow:var(--sh)
}
.frames div.on{border-color:var(--acc);background:#ffeaf1;color:var(--acc)}
.frames div .e{display:block;font-size:18px;line-height:1.2}
/* 테라스 오른쪽 위 작은 버튼 두 개 — 카드를 늘리지 않고 그림에서 바로 누르게 한다 */
#photocam,#tthemebtn{
  position:absolute;right:8px;z-index:6;cursor:pointer;
  background:rgba(255,255,255,.9);border:2px solid #f3d0dc;border-radius:12px;
  font-size:17px;line-height:1;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center
}
#photocam{top:38px}
#tthemebtn{top:81px}

/* ---------- 꾸미기(옷장) ---------- */
.wprev{
  width:150px;height:150px;margin:0 auto 4px;position:relative;
  background:radial-gradient(circle at 50% 62%, #fff 0 46%, #ffeef4 47%, #ffe3ec 72%, transparent 74%);
}
.wprev .hs{width:100%;height:100%}
.wprev .sp{position:absolute;font-size:14px;animation:twk 1.6s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.wrow{display:flex;gap:5px;margin-bottom:8px}
.wrow div{
  flex:1;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:12px;
  padding:5px 2px;font-size:11px;font-weight:700;cursor:pointer;box-shadow:var(--sh)
}
.wrow div.on{border-color:var(--acc);background:#ffeaf1;color:var(--acc)}
.wrow div .e{font-size:17px;display:block;line-height:1.2}
.wpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:430px){.wpick{grid-template-columns:repeat(4,1fr)}}
.wpick .it{
  border:2px solid var(--line);background:var(--card);border-radius:13px;padding:5px 3px;text-align:center;
  box-shadow:var(--sh);cursor:pointer;position:relative
}
.wpick .it.on{border-color:var(--acc);background:#ffeaf1;box-shadow:0 0 0 3px #ffd9e4}
.wpick .it.no{opacity:.55}
.wpick .it .e{font-size:24px;line-height:1.25}
.wpick .it .n{font-size:10px;font-weight:700;word-break:keep-all;line-height:1.2}
.wpick .it .p{font-size:10px;color:var(--ink2);font-weight:700}
.wpick .it .chk{position:absolute;right:3px;top:1px;font-size:11px}

/* ---------- 💞 믹스쮜 ---------- */
.mixrow{display:flex;align-items:center;justify-content:center;gap:4px}
.mslot{
  flex:1;max-width:92px;text-align:center;border:2px dashed var(--line);border-radius:14px;
  background:#fffdfb;padding:6px 3px
}
.mslot.on{border-style:solid;border-color:var(--acc);background:#fff2f6}
.mslot .hs{width:100%;aspect-ratio:1;display:block}
.mslot .ph{display:block;font-size:26px;color:var(--ink2);line-height:1.5}
.mslot b{display:block;font-size:10px;word-break:keep-all;line-height:1.2;margin-top:1px}
.mplus{font-size:15px;color:var(--ink2);flex:none}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
@media(min-width:430px){.mgrid{grid-template-columns:repeat(6,1fr)}}
.mpick{
  border:2px solid var(--line);background:var(--card);border-radius:11px;padding:3px 1px;
  text-align:center;cursor:pointer;position:relative
}
.mpick.on{border-color:var(--acc);background:#ffeaf1;box-shadow:0 0 0 3px #ffd9e4}
.mpick .hs{width:100%;aspect-ratio:1;display:block}
.mpick .nm{font-size:8.5px;font-weight:700;line-height:1.15;word-break:keep-all}
.mpick .ht{font-size:8px;color:var(--ink2)}
.mixgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:430px){.mixgrid{grid-template-columns:repeat(5,1fr)}}
.mcard{
  border:2px solid #e8c6ea;background:linear-gradient(#fff8fd,#ffeef8);border-radius:13px;
  padding:5px 3px;text-align:center;box-shadow:var(--sh);cursor:pointer;position:relative
}
.mcard .hs{width:100%;aspect-ratio:1;display:block}
.mcard .nm{font-size:9.5px;font-weight:700;line-height:1.2;word-break:keep-all}
.mcard .st{position:absolute;left:3px;top:2px;font-size:8.5px;color:var(--gold);letter-spacing:-1.5px}

/* ---------- 스티커 ---------- */
.stkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:430px){.stkgrid{grid-template-columns:repeat(5,1fr)}}
.stk{
  border:2px dashed var(--line);border-radius:14px;background:#fff8fa;padding:6px 3px;text-align:center;
  opacity:.5;filter:grayscale(.8)
}
.stk.got{
  border-style:solid;border-color:#f0c65a;background:linear-gradient(#fffaeb,#ffeff6);opacity:1;filter:none;
  box-shadow:var(--sh);transform:rotate(-2deg)
}
.stk.got:nth-child(even){transform:rotate(2deg)}
.stk .e{font-size:23px;line-height:1.3}
.stk .n{font-size:9.5px;font-weight:700;word-break:keep-all;line-height:1.2}

/* ---------- 하단 탭 ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:2px;background:var(--card);border-top:2px solid var(--line);box-shadow:0 -3px 12px rgba(160,110,130,.10);
  padding:4px calc(4px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left))}
nav button{flex:1;max-width:130px;border:0;background:none;font:inherit;font-size:11px;font-weight:700;color:var(--ink2);padding:6px 0 5px;border-radius:12px;cursor:pointer;line-height:1.15;position:relative;min-height:48px}
nav button i{display:block;font-size:22px;font-style:normal;margin-bottom:1px;height:26px;line-height:26px}
nav button.on{color:var(--acc);background:#fdeef2;font-weight:700}
nav .dot{position:absolute;top:5px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--no);box-shadow:0 0 0 2px #fff;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- 모달 / 토스트 ---------- */
#veil{position:fixed;inset:0;background:rgba(80,50,60,.42);z-index:100;display:none;align-items:flex-end;justify-content:center}
#veil.on{display:flex}
#modal{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(120,70,90,.22);animation:up .22s ease-out;
  padding:12px 11px calc(22px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}
#modal h2{margin:0 0 9px;font-size:17px;display:flex;align-items:center;gap:6px}
/* 「닫기」도 손가락으로 누를 수 있게 넉넉히 — 글자만 작으면 아이가 못 닫는다 */
#modal h2 .x{
  margin-left:auto;margin-right:-6px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;
  background:#fdeef2;border:1.5px solid var(--line);border-radius:11px;
  min-width:52px;min-height:38px;display:flex;align-items:center;justify-content:center;flex:none
}
.reslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.rcard{border:2px solid var(--line);background:var(--card);border-radius:13px;padding:4px 2px;text-align:center;box-shadow:var(--sh)}
.rcard .hs{width:100%;aspect-ratio:1;display:block}
.rcard .nm{font-size:9.5px;font-weight:700;word-break:keep-all;line-height:1.2}
.rcard.g4{border-color:#f0c65a;background:linear-gradient(#fffaeb,#fff3d4)}
.rcard.g3{border-color:#d3b6ec}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:92%;max-width:420px}
#toast div{background:rgba(60,40,48,.92);color:#fff;font-size:13px;padding:8px 13px;border-radius:14px;animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.pop{position:fixed;z-index:90;pointer-events:none;font-weight:800;font-size:15px;color:#d9527a;text-shadow:0 1px 0 #fff;animation:pup .8s ease-out forwards}
@keyframes pup{to{transform:translateY(-42px);opacity:0}}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <span class="logo">🍨</span>
      <h1>햄스킨라빈스</h1>
      <span class="lv" id="h-lv" onclick="openLevel()">가게 Lv.1</span>
      <span class="hbtn" id="h-gift" onclick="openGift()" title="선물상자">🎁<span class="bg" id="gift-bg">!</span></span>
      <span class="hbtn" onclick="openSettings()" title="설정">⚙️</span>
    </div>
    <div class="purse">
      <div><div class="n" id="h-coin">0</div><div class="t">🪙 코인</div></div>
      <div><div class="n" id="h-top">0</div><div class="t">🍒 토핑</div></div>
      <div onclick="go('dex')"><div class="n" id="h-dex">0/31</div><div class="t">🐹 햄쮜</div></div>
      <div onclick="go('dex')"><div class="n" id="h-stk">0/14</div><div class="t">🏅 스티커</div></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav>
  <button data-t="scoop" class="on"><i>🍨</i>뜨기</button>
  <button data-t="play"><i>🏠</i>놀이방</button>
  <button data-t="dex"><i>📖</i>31도감</button>
  <button data-t="store"><i>🛒</i>상점<span class="dot" id="s-dot" style="display:none"></span></button>
</nav>

<div id="veil"><div id="modal"></div></div>
<div id="toast"></div>

<script>
/* ==================================================================
   0. 잡동사니
================================================================== */
/* 오늘 날짜 — 하루에 한 번짜리 기능들이 쓴다 */
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dateLabel(t){ const d=new Date(t); return `${d.getMonth()+1}월 ${d.getDate()}일`; }
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rnd=(a,b)=>Math.random()*(b-a)+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function wpick(w){
  let t=0; for(const k in w) t+=w[k];
  let r=Math.random()*t;
  for(const k in w){ r-=w[k]; if(r<=0) return k; }
  return Object.keys(w)[0];
}
function fmt(n){
  n=Math.floor(n);
  if(n>=100000000) return (n/100000000).toFixed(2).replace(/\.?0+$/,'')+'억';
  if(n>=10000) return (n/10000).toFixed(n>=100000?0:2).replace(/\.?0+$/,'')+'만';
  return n.toLocaleString('ko-KR');
}
function toast(msg){
  const t=$('#toast'), d=document.createElement('div');
  d.innerHTML=msg; t.appendChild(d);
  setTimeout(()=>d.remove(),2100);
  while(t.children.length>3) t.firstChild.remove();
}
function popAt(x,y,txt){
  const d=document.createElement('div');
  d.className='pop'; d.textContent=txt; d.style.left=x+'px'; d.style.top=y+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),820);
}

/* ---------- 소리 ----------
   파일 없이 브라우저가 직접 소리를 만든다(WebAudio). 전부 작고 부드러운 소리. */
let AC=null;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } }
  if(AC && AC.state==='suspended') AC.resume();
  return AC||null;
}
function note(f,at,dur,vol,type){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  const t=a.currentTime+at;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}

    const a=A.hand||{x:80,y:74};
    g+=WEAR.hand.items[w.hand].d(a.x,a.y);
  }
  if(w.hat && WEAR.hat.items[w.hat]){
    const a=A.hat||{x:F.x,y:sh.top};
    g+=`<g transform="translate(${a.x},${a.y})${a.s?` scale(${a.s})`:''}">${WEAR.hat.items[w.hat].d()}</g>`;
  }
  return g;
}

/* 햄쮜 그림은 같은 조합이면 결과가 똑같다 — 한 번 만든 그림은 모아두고 다시 쓴다.
   도감(31마리)·사진첩·상점처럼 한 화면에서 수십 개를 그리는 곳이 눈에 띄게 빨라진다. */
let _uid=0;
const _svgCache=new Map();
const SVG_CACHE_MAX=800;
function hamKey(h){
  const w=h.wear||{};
  return h.shape+'|'+h.color+'|'+h.pattern+'|'+h.grade+'|'+(h.cone||'')+'|'+(w.hat||'')+'|'+(w.neck||'')+'|'+(w.hand||'');
}
function hamSVG(h){
  const k=hamKey(h);
  let v=_svgCache.get(k);
  if(v===undefined){
    v=buildHamSVG(h);
    if(_svgCache.size>=SVG_CACHE_MAX) _svgCache.clear();
    _svgCache.set(k,v);
  }
  return v;
}
function buildHamSVG(h){
  const sh=SHAPES[h.shape], c=h.colorObj||COLORS[h.color], F=sh.face;
  const id='hc'+(++_uid);
  const fx=F.x, fy=F.y, s=F.s;
  let g='';

  if(h.grade>=4) g+=`<circle cx="50" cy="54" r="46" fill="#ffe9a8" opacity=".45"/>`;
  if(h.grade>=3) g+=`<circle cx="50" cy="54" r="44" fill="${c.light}" opacity=".35"/>`;

  if(sh.tail) g+=`<path d="M82 78 q10 1 8 9" stroke="${c.dark}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  if(sh.feet) g+=`<ellipse cx="${fx-15}" cy="87" rx="8" ry="5" fill="${c.dark}" opacity=".55"/><ellipse cx="${fx+15}" cy="87" rx="8" ry="5" fill="${c.dark}" opacity=".55"/>`;

  /* 여러 도형을 합친 모양(구름)은 확대 복사본을 뒤에 깔아 윤곽선을 만든다 */
  if(sh.grp) g+=`<g transform="translate(50,58) scale(1.05) translate(-50,-58)" opacity=".34">${sh.body(`fill="${c.dark}"`)}</g>`;

  g+=sh.ears(c);
  g+=sh.body(`fill="${c.base}" ${sh.grp?'':`stroke="${c.dark}" stroke-width="2" stroke-opacity=".4"`}`);
  g+=`<clipPath id="${id}">${sh.body('')}</clipPath>`;

  let p='';
  if(h.pattern==='spot'){
    p=`<circle cx="${fx-22}" cy="${fy-14}" r="7" fill="${c.dark}" opacity=".45"/>
       <circle cx="${fx+24}" cy="${fy+2}" r="9" fill="${c.dark}" opacity=".4"/>
       <circle cx="${fx+4}"  cy="${fy+26}" r="6" fill="${c.dark}" opacity=".35"/>`;
  }else if(h.pattern==='stripe'){
    p=`<rect x="0" y="${fy-18}" width="100" height="7" fill="${c.dark}" opacity=".34"/>
       <rect x="0" y="${fy+4}"  width="100" height="7" fill="${c.dark}" opacity=".3"/>
       <rect x="0" y="${fy+26}" width="100" height="7" fill="${c.dark}" opacity=".26"/>`;
  }else if(h.pattern==='patch'){
    p=`<ellipse cx="${fx-13}" cy="${fy-2}" rx="17" ry="15" fill="${c.dark}" opacity=".42"/>`;
  }else if(h.pattern==='tux'){
    p=`<ellipse cx="${fx}" cy="${fy+34}" rx="42" ry="26" fill="${c.light}"/>`;
  }else if(h.pattern==='socks'){
    p=`<rect x="0" y="76" width="100" height="30" fill="${c.light}"/>`;
  }
  if(p) g+=`<g clip-path="url(#${id})">${p}</g>`;

  if(sh.shine) g+=`<g clip-path="url(#${id})"><ellipse cx="${fx-14}" cy="${fy-22}" rx="11" ry="7" fill="#fff" opacity=".5" transform="rotate(-20 ${fx-14} ${fy-22})"/></g>`;

  g+=`<ellipse cx="${fx}" cy="${fy+9*s}" rx="${14*s}" ry="${10*s}" fill="${c.light}"/>`;
  g+=`<ellipse cx="${fx-21*s}" cy="${fy+8*s}" rx="${6*s}" ry="${3.6*s}" fill="${c.cheek}" opacity=".7"/>
      <ellipse cx="${fx+21*s}" cy="${fy+8*s}" rx="${6*s}" ry="${3.6*s}" fill="${c.cheek}" opacity=".7"/>`;

  const er=4.8*s;
  g+=`<circle cx="${fx-10.5*s}" cy="${fy}" r="${er}" fill="#3d3450"/><circle cx="${fx+10.5*s}" cy="${fy}" r="${er}" fill="#3d3450"/>
      <circle cx="${fx-9*s}" cy="${fy-1.7*s}" r="${1.6*s}" fill="#fff"/><circle cx="${fx+12*s}" cy="${fy-1.7*s}" r="${1.6*s}" fill="#fff"/>`;

  g+=`<ellipse cx="${fx}" cy="${fy+7*s}" rx="${3.4*s}" ry="${2.6*s}" fill="#d98a9c"/>
      <path d="M${fx} ${fy+10*s} q${-4*s} ${5*s} ${-8*s} ${1.6*s} M${fx} ${fy+10*s} q${4*s} ${5*s} ${8*s} ${1.6*s}"
            stroke="${c.dark}" stroke-width="${2*s}" fill="none" stroke-linecap="round"/>`;

  const ax=sh.acc?sh.acc.x:fx+16, ay=sh.acc?sh.acc.y:sh.top;
  if(h.grade===2) g+=`<path d="M${ax+2} ${ay-2} q11 -8 13 5 q-11 7 -13 -5 z" fill="#7fc47a"/><path d="M${ax+2} ${ay-2} q7 -1 11 3" stroke="#5aa057" stroke-width="1.4" fill="none"/>`;
  if(h.grade===3) g+=`<g transform="translate(${ax},${ay-4})">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-6" rx="4" ry="6" fill="#f7a8c0" transform="rotate(${a})"/>`).join('')}<circle r="3.2" fill="#ffe07a"/></g>`;
  if(h.grade===4) g+=`<path d="M${ax-16} ${ay-2} l4 -13 l8 8 l4 -12 l4 12 l8 -8 l4 13 z" fill="#ffd75e" stroke="#e0ac2c" stroke-width="1.5" stroke-linejoin="round"/>
                      <text x="12" y="26" font-size="14">✨</text><text x="80" y="82" font-size="12">✨</text>`;

  /* 아이스크림 가게 햄쮜는 콘을 하나씩 들고 있다 — 손에 소품을 들면 콘은 내려놓는다 */
  if(h.cone && !(h.wear&&h.wear.hand)) g+=`<g transform="translate(86,74) scale(.34)">
      <path d="M-14 -4 L0 34 L14 -4 Z" fill="#e0b06a" stroke="#bd8a4b" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="0" cy="-14" r="17" fill="${h.cone}" stroke="rgba(0,0,0,.12)" stroke-width="2"/></g>`;

  /* 꾸미기 소품 */
  g+=wearSVG(h,h.wear);

  return `<svg viewBox="0 0 100 100">${g}</svg>`;
}
function hamPic(h,style){ return `<span class="hs" style="${style||''}">${hamSVG(h)}</span>`; }

   한 마리는 한 방에만 있을 수 있다 — 그래야 "누구를 데려갈까" 고민이 남는다.
================================================================== */
const ROOMS=[
  {dn:'첫째 방', lv:1},
  {dn:'둘째 방', lv:5},
  {dn:'셋째 방', lv:10},
  {dn:'넷째 방', lv:15}
];
function roomOk(i){ return !!ROOMS[i] && S.lv>=ROOMS[i].lv; }
function openRooms(){ return ROOMS.filter((r,i)=>roomOk(i)).length; }
/* 방 한 칸을 꺼낸다 — 없으면 그때 만든다 */
function room(i){
  if(i===undefined) i=S.room|0;
  if(!Array.isArray(S.rooms)) S.rooms=[];
  if(!S.rooms[i]) S.rooms[i]={name:'', theme:'day', seat:[]};
  const r=S.rooms[i];
  if(!Array.isArray(r.seat)) r.seat=[];
  while(r.seat.length<seats()) r.seat.push(null);
  if(typeof r.name!=='string') r.name='';
  if(!THEMES[r.theme]) r.theme='day';
  /* 자리 한도 밖에 남은 햄쮜는 앞으로 당겨온다 — 안 그러면 화면에 안 보이는데
     다른 방으로도 못 옮기는 미아가 된다 */
  for(let j=seats(); j<r.seat.length; j++){
    const k=r.seat[j]; if(!k) continue;
    r.seat[j]=null;
    const free=r.seat.slice(0,seats()).indexOf(null);
    if(free>=0) r.seat[free]=k;
  }
  return r;
}
function roomName(i){ if(i===undefined) i=S.room|0; return room(i).name || ROOMS[i].dn; }
function roomEm(i){ return THEMES[room(i).theme].em; }
function seatArr(){ return room().seat; }
function roomHams(i){ return room(i).seat.slice(0,seats()).filter(k=>k&&S.dex[k]); }
/* 모든 방을 돌며 그 햄쮜가 어디에 있는지 찾는다 */
function whereSeated(k){
  for(let i=0;i<openRooms();i++){
    const j=room(i).seat.indexOf(k);
    if(j>=0) return {r:i, s:j};
  }
  return null;
}
function unseat(k){
  for(let i=0;i<openRooms();i++){
    const s=room(i).seat;
    s.forEach((x,j)=>{ if(x===k) s[j]=null; });
  }
}
function goRoom(i){
  if(!roomOk(i)){ sfx('boo'); toast(`🔒 가게 Lv.${ROOMS[i].lv} 가 되면 열려요`); return; }
  S.room=i; room(i); applyTheme(); sfx('tap'); save(); renderView();
}
function playMul(){ return (1+upgLv('charm')*0.15)*(1+S.lv*0.05); }
function gradeW(){
  const bonus=upgLv('luck')*2;                 /* ★3 이상 확률 +2%p 씩 */
  return {1:58-bonus, 2:28, 3:11+bonus*0.75, 4:3+bonus*0.25};
}
function expNeed(lv){ return Math.floor(60*Math.pow(lv,1.3)); }
function dexCount(){ return Object.keys(S.dex).filter(k=>!isMix(k)).length; }
function unlocked(){ return FKEYS.filter(k=>S.open.includes(k)); }

/* 친밀도 */
function hearts(k){ const d=S.dex[k]; return d?Math.min(5,Math.floor((d.bond||0)/20)):0; }
function heartStr(k){ const n=hearts(k); return '💗'.repeat(n)+'🤍'.repeat(5-n); }
function totalHearts(){ return Object.keys(S.dex).reduce((a,k)=>a+hearts(k),0); }
/* 방을 여러 개 꾸미면 모든 방의 햄쮜가 함께 벌어준다 — 방을 늘릴 이유 */
function autoIncome(){
  let c=0;
  for(let i=0;i<openRooms();i++)
    roomHams(i).forEach(k=>{ c+=S.dex[k].g*(1+0.3*hearts(k))*0.3; });
  return c*(1+upgLv('regul')*0.25)*(1+S.lv*0.08);
}
function hamOf(k,wearOv){
  const d=S.dex[k], m=d&&d.mix;
  const wear = wearOv!==undefined ? wearOv : (d?d.w:null);

    return {shape:m.shape, color:k, colorObj:m.col, pattern:d.p, grade:d.g, cone:m.cone, wear};

}

/* 저장이 막힌 환경(앱 설정에서 저장이 꺼진 경우 등)이면 한 번만 알려준다 */
let _saveWarned=false;
function save(){
  S.t=Date.now();
  try{ localStorage.setItem(SAVE,JSON.stringify(S)); }
  catch(e){
    if(!_saveWarned){
      _saveWarned=true;
      toast('⚠️ 저장이 되지 않는 상태예요 — ⚙️설정의 <b>저장 코드</b>를 복사해두세요');
    }
  }
}
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(SAVE); }catch(e){}
  if(!raw) return false;
  try{
    const d=JSON.parse(raw);
    if(!d||typeof d.coin!=='number') return false;
    S=Object.assign(freshState(),d);
    if(!Array.isArray(S.open)||!S.open.length) S.open=['vanilla','straw','choco','milk'];
    if(!S.dex||typeof S.dex!=='object') S.dex={};
    if(!S.upg||typeof S.upg!=='object') S.upg={};
    if(!S.play||typeof S.play!=='object') S.play={toy:'pet',ballAt:0,bubbleAt:0};
    if(!S.stats) S.stats={scoop:0,pet:0,best4:0};
    if(!Array.isArray(S.closet)) S.closet=[];
    if(!Array.isArray(S.badge)) S.badge=[];
    if(!Array.isArray(S.coupon)) S.coupon=[];
    if(!S.stamp||typeof S.stamp!=='object') S.stamp={d:'',n:0,all:0};
    if(S.stamp.all==null) S.stamp.all=0;
    if(!S.star ||typeof S.star !=='object') S.star={d:'',k:null};
    if(!S.cup  ||typeof S.cup  !=='object') S.cup={at:0,win:0,play:0};
    if(!S.ord  ||typeof S.ord  !=='object') S.ord={at:0,done:0,perfect:0};
    if(!S.cont ||typeof S.cont !=='object') S.cont={d:'',best:0,win:0,play:0};
    if(!Array.isArray(S.album)) S.album=[];
    if(S.vib==null) S.vib=true;
    if(S.giftAt==null) S.giftAt=0;
    /* 🏠 옛 저장본(방이 하나뿐이던 때)에는 rooms 대신 seat / theme 이 들어 있다 → 첫째 방으로 옮긴다.
       판정은 반드시 **원본 d** 로 한다 — S 는 freshState() 가 이미 기본 방 하나를 넣어둬서
       S.rooms 를 보면 옛 저장본도 "방 있음"으로 보이고 앉아 있던 햄쮜가 사라진다. */
    if(!Array.isArray(d.rooms)||!d.rooms.length){
      S.rooms=[{name:'', theme:(THEMES[d.theme]?d.theme:'day'),
                seat:Array.isArray(d.seat)?d.seat.slice():[null,null]}];
    }
    delete S.seat; delete S.theme;
    S.rooms=S.rooms.slice(0,ROOMS.length);
    S.room=clamp(S.room|0, 0, ROOMS.length-1);
    for(let i=0;i<ROOMS.length;i++) if(S.rooms[i]) room(i);   /* 자리 수·배경 보정 */
    if(!roomOk(S.room)) S.room=0;
    /* 같은 햄쮜가 두 방에 겹쳐 있으면(옛 저장본 꼬임) 앞쪽만 남긴다 */
    {
      const seen={};
      for(let i=0;i<ROOMS.length;i++){
        const r=S.rooms[i]; if(!r) continue;
        r.seat.forEach((k,j)=>{ if(!k) return; if(seen[k]) r.seat[j]=null; else seen[k]=1; });
      }
    }
    Object.keys(S.dex).forEach(k=>{
      const e=S.dex[k];
      if(e.bond==null) e.bond=0;
      if(!e.p) e.p='plain';
      if(!e.g) e.g=1;
      if(e.n==null) e.n=1;
      if(!e.w||typeof e.w!=='object') e.w={hat:null,neck:null,hand:null};
    });
    /* 가게를 닫아둔 동안에도 단골 손님이 절반 속도로 벌어둔다 */
    const dt=clamp((Date.now()-(d.t||Date.now()))/1000,0,OFFLINE_MAX);
    const inc=autoIncome();
    if(dt>60 && inc>0){
      const got=Math.floor(inc*dt*OFFLINE_RATE);
      if(got>0){ S.coin+=got; awayReport={dt,got}; }
    }
    return true;
  }catch(e){ return false; }
}
function addExp(v){
  S.exp+=v; let up=0;
  while(S.exp>=expNeed(S.lv)){ S.exp-=expNeed(S.lv); S.lv++; up++; }
  if(up) onLevelUp();
}
function onLevelUp(){
  S.top+=2; sfx('gift');
  const news=FLAVORS.filter(f=>f.lv===S.lv);
  toast(`🎉 가게 Lv.${S.lv}! 🍒토핑 +2`+(news.length?`<br>새 통 <b>${news.map(f=>f.n).join('·')}</b> 을(를) 상점에서 살 수 있어요`:''));
  save();
}

const GOLD_TOP=3;                       /* 골든 스쿱에 드는 🍒토핑 */
function doScoop(n){
  if(digging) return;
  if(!sel){ sfx('boo'); toast('먼저 아래에서 통을 골라주세요 🍨'); return; }
  const f=FL[sel], cost=scoopCost(f)*n;
  if(S.coin<cost){ sfx('boo'); toast(`🪙 코인이 ${fmt(cost-S.coin)} 더 필요해요 — 🏠놀이방에서 햄쮜와 놀면 모여요`); return; }
  S.coin-=cost;
  dig(f,()=>finishScoop(sel,n,false));
}
/* 골든 스쿱 — 평소 값에 토핑을 얹으면 ★3 이상이 확정으로 나온다 */
function goldScoop(){
  if(digging) return;
  if(!sel){ toast('먼저 통을 골라주세요 🍨'); return; }
  const f=FL[sel], cost=scoopCost(f);
  if(S.top<GOLD_TOP){ sfx('boo'); toast(`🍒 토핑이 ${GOLD_TOP-S.top}개 더 필요해요`); return; }
  if(S.coin<cost){ sfx('boo'); toast(`🪙 코인이 ${fmt(cost-S.coin)} 더 필요해요`); return; }
  S.top-=GOLD_TOP; S.coin-=cost;
  dig(f,()=>finishScoop(sel,1,true));
}
function dig(f,after){
  digging=true; sfx('scoop'); vib(18);
  const t=$('#tubbig'); if(t){ t.classList.remove('dig'); void t.offsetWidth; t.classList.add('dig'); }
  sparkle(f);
  setTimeout(()=>{ digging=false; after(); },420);
}
function sparkle(f){
  const st=$('#stage'); if(!st) return;
  const box=document.createElement('div'); box.className='sparks';
  for(let i=0;i<8;i++){
    const s=document.createElement('span');
    s.textContent=pick(['✨','🍨','💗','⭐']);
    s.style.left=rnd(28,72)+'%'; s.style.top=rnd(30,60)+'%';
    s.style.setProperty('--dx',rnd(-70,70).toFixed(0)+'px');
    s.style.setProperty('--dy',rnd(-80,-30).toFixed(0)+'px');
    s.style.animationDelay=(i*0.05).toFixed(2)+'s';
    box.appendChild(s);
  }

}
/* 한 번 뜨기 = 햄쮜 한 마리. 무늬와 등급이 무작위 */
function rollOne(k,forceHigh){
  const f=FL[k];
  let g=+wpick(gradeW());
  S.pity++;
  if(S.pity>=15 && g<3){ g=3; }           /* 15번 안에 ★3 이상은 반드시 */
  if(forceHigh && g<3){ g=Math.random()<0.22?4:3; }   /* 골든 스쿱 */
  if(g>=3) S.pity=0;
  const p=wpick(PAT_W);
  const d=S.dex[k];
  const res={k, g, p, isNew:!d, up:false};
  if(!d){
    S.dex[k]={g, p, n:1, bond:0, w:{hat:null,neck:null,hand:null}};
    S.top+=2; addExp(26);
  }else{
    d.n++;
    if(g>d.g || (g===d.g && Math.random()<0.5)){ d.g=Math.max(d.g,g); d.p=p; res.up=g>0&&g>=d.g; }
    res.up=g>=d.g;
    addExp(5);
  }
  if(g===3){ S.top+=1; }
  if(g===4){ S.top+=2; S.stats.best4++; }
  S.stats.scoop++;
  return res;
}
function finishScoop(k,n,forceHigh){
  const out=[];
  for(let i=0;i<n;i++) out.push(rollOne(k,forceHigh));
  const best=out.reduce((a,o)=>Math.max(a,o.g),0);
  const anyNew=out.some(o=>o.isNew);
  sfx(anyNew?'nw':best>=4?'star4':best>=3?'heart':'tap');   /* 뜨는 소리는 dig() 가 이미 냈다 */
  if(anyNew||best>=4) vib([0,35,55,35]); else if(best>=3) vib(28);
  checkBadges();
  save(); renderHUD(); renderScoopTab();
  showResult(FL[k], out, forceHigh);
}

      </div>
      <div class="reslist">${out.map(o=>`
        <div class="rcard g${o.g}">
          <span class="hs">${hamSVG({shape:f.shape,color:f.color,pattern:o.p,grade:o.g,cone:f.c})}</span>

      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn" onclick="closeModal()">확인</button>

function saveName(k){
  const i=$('#nm-in');
  let v=i?String(i.value||'').trim():'';
  v=v.replace(/[<>&"'`]/g,'').slice(0,8);          /* 이름에 태그가 섞이지 않게 */

  else toast(`${baseName(k)} 라고 부를게요 🐹`);

}
function seatFirst(k){
  const at=whereSeated(k);
  if(at){ S.room=at.r; applyTheme(); go('play'); toast(`${nameOf(k)} 은(는) 이미 <b>${roomName(at.r)}</b> 에 있어요`); return; }
  /* 지금 방에 빈자리가 없으면 다른 방의 빈자리를 찾아본다 */
  let ri=S.room|0, i=room(ri).seat.findIndex(x=>!x);
  if(i<0){
    for(let j=0;j<openRooms();j++){ const s=room(j).seat.findIndex(x=>!x); if(s>=0){ ri=j; i=s; break; } }
  }
  if(i<0){ go('play'); toast('방이 다 꽉 찼어요 — 자리를 눌러 바꿔주세요'); return; }
  room(ri).seat[i]=k; S.room=ri; applyTheme(); save(); go('play');
  toast(`${nameOf(k)} 이(가) <b>${roomName(ri)}</b> 으로 왔어요 🏠`);
}

const TOYS={
  pet   :{em:'🖐️', name:'쓰담쓰담', tip:'코인을 물어와요',        bond:2,  one:1},
  treat :{em:'🍒', name:'토핑 주기', tip:'제일 좋아해요 (🍒1)',    bond:12, one:1},

  bubble:{em:'🫧', name:'비눗방울', tip:'폴짝폴짝 뛰어올라요',     bond:4,  cd:60000},
  dance :{em:'🎵', name:'춤추기',   tip:'노래를 틀면 다 같이 춤춰요', bond:7, cd:45000}
};
const TOY_KEYS=Object.keys(TOYS);
const DECO=[

function deco(){ return DECO.filter(d=>d.lv<=S.lv); }
function seatHams(){ return roomHams(S.room|0); }

function petHam(k,ev){
  const d=S.dex[k]; if(!d) return;
  const now=Date.now();
  if(now-(d.petAt||0)<2200){ toast(`${nameOf(k)} 은(는) 지금 배부른가봐요 😌`); return; }
  d.petAt=now;
  const sm=starMul(k);                      /* 🌟오늘의 친구는 두 배 */
  const gain=Math.ceil((5+d.g*4)*(1+hearts(k)*0.2)*playMul()*sm);
  S.coin+=gain; S.stats.pet++;
  addBond(k,TOYS.pet.bond*sm);
  if(ev){ popAt(ev.clientX-16, ev.clientY-18, (sm>1?'🌟':'')+'🪙+'+fmt(gain)); fxHeart(ev); }
  if(sm>1 && Math.random()<0.5) toast(`🌟 오늘의 친구 <b>${nameOf(k)}</b> — 두 배로 받았어요!`);
  sfx('coin'); vib(10); checkBadges(); save(); renderHUD(); refreshBond();
}
function treatHam(k,ev){
  if(S.top<1){ sfx('boo'); toast('🍒 토핑이 없어요 — ⭐3 이상을 뜨거나 🫧비눗방울로 모아요'); return; }
  S.top-=1; addBond(k,TOYS.treat.bond);
  if(ev){ fxHeart(ev); popAt(ev.clientX-16, ev.clientY-18, '💗+'+TOYS.treat.bond); }
  sfx('heart'); save(); renderHUD(); refreshBond();
  toast(`${nameOf(k)} 이(가) 오물오물 먹었어요 😋`);
}
function addBond(k,v){
  const d=S.dex[k]; if(!d) return;
  const b0=hearts(k);
  d.bond=clamp((d.bond||0)+v,0,100);
  if(hearts(k)>b0){
    addExp(8); sfx('star4'); checkBadges();
    toast(`💗 ${nameOf(k)} 와(과) 더 친해졌어요! 하트 ${hearts(k)}개 — 코인을 더 많이 물어와요`);
  }
}
function playAll(kind){
  const t=TOYS[kind], now=Date.now(), key=kind+'At', last=S.play[key]||0;
  const list=seatHams();
  if(!list.length){ sfx('boo'); toast('이 방에 함께 놀 햄쮜가 없어요 🪑'); return; }
  if(now-last<t.cd){ toast(`${t.em} 잠깐 쉬는 중이에요 (${Math.ceil((t.cd-(now-last))/1000)}초 뒤)`); return; }
  S.play[key]=now;
  list.forEach(k=>addBond(k,t.bond));
  let got='';
  if(kind==='ball'){
    const g=Math.ceil(list.reduce((a,k)=>a+(6+S.dex[k].g*5),0)*playMul());
    S.coin+=g; got=`🪙+${fmt(g)}`;
  }else if(kind==='dance'){
    const g=Math.ceil(list.reduce((a,k)=>a+(8+S.dex[k].g*6),0)*playMul());
    S.coin+=g;
    const t2=list.length>=4?2:1; S.top+=t2;                /* 많이 모여 출수록 신난다 */
    got=`🪙+${fmt(g)} · 🍒+${t2}`;
    S.stats.dance=(S.stats.dance||0)+1;
  }else{
    const g=Math.min(3,1+Math.floor(list.length/2));
    S.top+=g; got=`🍒+${g}`;
  }
  fxToy(kind);
  if(kind==='ball') chaseBall();
  else if(kind==='dance') danceAll();
  else hop();
  sfx(kind==='dance'?'tune':kind==='ball'?'coin':'heart'); vib(kind==='dance'?[0,25,60,25,60,25]:12);
  checkBadges(); save(); renderHUD(); refreshBond();
  toast(`${t.em} ${t.name}! 다 같이 신났어요 ${got}`);
}
function pickToy(k){
  S.play.toy=k; save();

  const t=$('#toytip'); if(t) t.innerHTML=toyTipHTML();
}
function toyTipHTML(){
  const t=TOYS[S.play.toy||'pet'];
  return t.one ? `${t.em} <b>${t.name}</b> — ${t.tip}. <b>햄쮜를 톡 누르세요!</b>`
               : `${t.em} <b>${t.name}</b> — ${t.tip}. <b>방 아무 곳이나 누르세요!</b>`;
}
function terraceBg(){ const t=TOYS[S.play.toy||'pet']; if(!t.one) playAll(S.play.toy); }
function tapHam(k,ev){
  ev.stopPropagation();
  const kind=S.play.toy||'pet', t=TOYS[kind];
  if(!t.one){ playAll(kind); return; }
  const i=seatHams().indexOf(k); hop(i<0?null:i);
  if(kind==='pet') petHam(k,ev);
  else treatHam(k,ev);
}
function hop(idx){
  const els=$$('#terrace .tham');
  const list=idx==null?els:(els[idx]?[els[idx]]:[]);
  list.forEach((el,i)=>setTimeout(()=>{
    el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop');
    setTimeout(()=>el.classList.remove('hop'),800);
  }, i*110));
}
/* 공이 왼쪽에서 오른쪽으로 굴러가니, 왼쪽에 있는 햄쮜부터 차례로 뛰쳐나가 뒤를 쫓는다 */
function chaseBall(){
  const els=$$('#terrace .tham');
  els.forEach(el=>{
    const l=parseFloat(el.style.left)||50;
    const dist=Math.min(78, (100-l)*0.85 + 26);           /* 오른쪽 끝일수록 조금만 움직인다 */
    el.style.setProperty('--cx', dist.toFixed(0)+'px');
    el.style.animationDelay='0s';
    el.classList.remove('chase'); void el.offsetWidth;
    setTimeout(()=>{
      el.classList.add('chase');
      setTimeout(()=>{ el.classList.remove('chase'); el.style.removeProperty('--cx'); },2900);
    }, Math.max(0, l*11));                                 /* 공이 제 앞을 지날 때 출발한다 */
  });
}
/* 노래를 틀면 다 같이 춤춘다 — 12초쯤 추고 조명도 돈다 */
function danceAll(){
  const r=$('#terrace'); if(!r) return;
  const els=$$('#terrace .tham');
  els.forEach((el,i)=>{
    el.classList.remove('dance'); void el.offsetWidth;
    el.style.animationDelay=(i*0.14).toFixed(2)+'s';
    el.classList.add('dance');
  });
  const d=document.createElement('div'); d.className='disco'; d.innerHTML='<i></i>';
  r.insertBefore(d, r.firstChild);
  setTimeout(()=>{
    els.forEach(el=>{ el.classList.remove('dance'); el.style.animationDelay=''; });
    d.remove();
  }, 11500);
}
function fxToy(kind){
  const r=$('#terrace'); if(!r) return;
  if(kind==='ball'){
    const b=document.createElement('span'); b.className='fx ball'; b.textContent='⚽';
    r.appendChild(b); setTimeout(()=>b.remove(),3600);
  }else if(kind==='dance'){
    /* 음표는 띄엄띄엄 몇 개만 — 많으면 정신없다 */
    for(let i=0;i<6;i++){
      const n=document.createElement('span'); n.className='fx note';
      n.textContent=pick(['🎵','🎶']);
      n.style.left=rnd(14,84).toFixed(1)+'%'; n.style.bottom=rnd(55,100).toFixed(0)+'px';
      n.style.setProperty('--nx', rnd(-28,28).toFixed(0)+'px');
      n.style.animationDelay=(i*1.6).toFixed(2)+'s';
      r.appendChild(n); setTimeout(()=>n.remove(),12500);
    }
  }else{
    for(let i=0;i<10;i++){
      const b=document.createElement('span'); b.className='fx bub'; b.textContent='🫧';
      b.style.left=rnd(5,92).toFixed(1)+'%'; b.style.bottom=rnd(8,60).toFixed(0)+'px';
      b.style.fontSize=rnd(13,26).toFixed(0)+'px'; b.style.animationDelay=(i*0.11).toFixed(2)+'s';
      r.appendChild(b); setTimeout(()=>b.remove(),3400);
    }
  }
}
function fxHeart(ev){
  const r=$('#terrace'); if(!r||!ev) return;
  const box=r.getBoundingClientRect();
  for(let i=0;i<3;i++){
    const s=document.createElement('span'); s.className='fx heart'; s.textContent=pick(['💗','💕','💖']);
    s.style.left=(ev.clientX-box.left+rnd(-14,14))+'px';
    s.style.top=(ev.clientY-box.top-10)+'px';
    s.style.animationDelay=(i*0.12).toFixed(2)+'s';
    r.appendChild(s); setTimeout(()=>s.remove(),1400);
  }
}

/* ---------- 꾸미기(옷장) ----------
   소품은 한 번 사면 옷장에 남아서 모든 햄쮜가 돌려 입는다. */
let closetSlot='hat';
function wearPriceHTML(it){ return it.top?`🍒${it.top}`:`🪙${fmt(it.coin)}`; }
function canAffordWear(it){ return it.top ? S.top>=it.top : S.coin>=it.coin; }
function openCloset(k,slot){
  if(!S.dex[k]){ toast('먼저 이 햄쮜를 만나야 해요 🍨'); return; }
  if(slot) closetSlot=slot;
  const sl=closetSlot, w=wearOf(k), items=WEAR[sl].items;
  const tabs=WEAR_SLOTS.map(s=>{
    const on=wearOf(k)[s];
    return `<div class="${s===sl?'on':''}" onclick="openCloset('${k}','${s}')">
      <span class="e">${on?WEAR[s].items[on].em:WEAR[s].em}</span>${WEAR[s].name}</div>`;
  }).join('');
  const cards=Object.keys(items).map(key=>{
    const it=items[key], own=ownWear(sl,key), on=w[sl]===key;
    return `<div class="it ${on?'on':''} ${own||canAffordWear(it)?'':'no'}"
                onclick="${own?`equipWear('${k}','${sl}','${key}')`:`buyWear('${sl}','${key}','${k}')`}">
      ${on?'<span class="chk">✅</span>':''}
      <div class="e">${it.em}</div><div class="n">${it.name}</div>
      <div class="p">${own?(on?'입고 있어요':'입히기'):wearPriceHTML(it)}</div>
    </div>`;
  }).join('');
  const ownAny=WEAR_SLOTS.some(s=>Object.keys(WEAR[s].items).some(key=>ownWear(s,key)));
  openModal(`<h2>👗 ${nameOf(k)} 꾸미기<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="wprev">
      <span class="sp" style="left:4%;top:14%">✨</span><span class="sp" style="right:6%;top:26%;animation-delay:.5s">💗</span>
      <span class="sp" style="left:12%;bottom:8%;animation-delay:.9s">⭐</span>
      <span class="hs">${hamSVG(hamOf(k))}</span>
    </div>
    <div class="muted" style="text-align:center;margin-bottom:8px">
      ${wearCount(k)?`${wearCount(k)}가지를 입었어요${isFullSet(k)?' — <b>풀코디!</b> 🎀':''}`:'무엇을 입혀볼까요?'}
    </div>
    <div class="wrow">${tabs}</div>
    <div class="wpick">${cards}</div>
    <div class="row" style="justify-content:center;margin-top:10px">
      ${ownAny?`<button class="btn w sm" onclick="randomWear('${k}')">🎲 마음대로 꾸미기</button>`:''}
      ${wearCount(k)?`<button class="btn w sm" onclick="stripWear('${k}')">🧺 다 벗기</button>`:''}
      <button class="btn sm" onclick="openRename('${k}')">✏️ 이름 바꾸기</button>
    </div>
    <div class="muted" style="margin-top:8px;line-height:1.6">
      한 번 산 소품은 <b>옷장에 남아서</b> 다른 햄쮜도 돌려 입을 수 있어요.<br>
      머리·목·손을 다 채우면 <b>풀코디 스티커</b> 를 받아요 🎀
    </div>`);
}
/* k 를 주면 사자마자 그 햄쮜가 입는다. 상점에서는 k 없이 옷장에만 넣는다. */
function buyWear(slot,key,k){
  const it=WEAR[slot].items[key];
  if(ownWear(slot,key)){                                    /* 이미 있으면 두 번 사지 않는다 */
    if(k) equipWear(k,slot,key); else toast(`${it.em} ${it.name} 은(는) 이미 옷장에 있어요`);
    return;
  }
  if(!canAffordWear(it)){
    sfx('boo');
    toast(it.top?`🍒 토핑이 ${it.top-S.top}개 더 필요해요`:`🪙 코인이 ${fmt(it.coin-Math.floor(S.coin))} 더 필요해요`);
    return;
  }
  if(it.top) S.top-=it.top; else S.coin-=it.coin;
  S.closet.push(slot+'_'+key);
  sfx('coin');
  toast(`${it.em} <b>${it.name}</b> 을(를) 옷장에 넣었어요!`);
  if(k) equipWear(k,slot,key);
  else{ checkBadges(); save(); renderHUD(); renderView(); }
}
function equipWear(k,slot,key){
  const d=S.dex[k]; if(!d) return;
  if(!d.w) d.w={hat:null,neck:null,hand:null};
  d.w[slot]=(d.w[slot]===key)?null:key;                     /* 같은 걸 또 누르면 벗는다 */
  sfx(d.w[slot]?'heart':'tap');
  checkBadges(); save(); renderHUD(); renderView(); openCloset(k,slot);
}
function stripWear(k){
  const d=S.dex[k]; if(!d) return;
  d.w={hat:null,neck:null,hand:null};
  sfx('tap'); save(); renderHUD(); renderView(); openCloset(k);
}
function randomWear(k){
  const d=S.dex[k]; if(!d) return;
  d.w={hat:null,neck:null,hand:null};
  WEAR_SLOTS.forEach(s=>{
    const own=Object.keys(WEAR[s].items).filter(key=>ownWear(s,key));
    if(own.length && Math.random()<0.85) d.w[s]=pick(own);
  });
  sfx('star4'); checkBadges(); save(); renderHUD(); renderView(); openCloset(k);
  toast('🎲 짜잔! 이렇게 꾸며봤어요');
}
function openRename(k){
  openModal(`<h2>✏️ 이름 바꾸기<span class="x" onclick="openCloset('${k}')">뒤로</span></h2>
    <div class="big">${hamSVG(hamOf(k))}</div>
    <div class="card" style="margin:0">
      <h3>어떻게 불러줄까요?</h3>
      <input id="nm-in" class="tin" maxlength="8" placeholder="${baseName(k)}" value="${S.dex[k].name||''}"
             onkeydown="if(event.key==='Enter'){renameHam('${k}')}">
      <div class="row" style="margin-top:8px">
        <button class="btn" onclick="renameHam('${k}')">💕 이 이름으로!</button>
        <button class="btn w" onclick="resetName('${k}')">원래 이름(${baseName(k)})</button>
      </div>
      <div class="muted" style="margin-top:6px">한글 8자까지 쓸 수 있어요</div>
    </div>`);
  setTimeout(()=>{ const i=$('#nm-in'); if(i) i.focus(); },120);
}
function renameHam(k){
  const i=$('#nm-in');
  let v=i?String(i.value||'').trim().replace(/[<>&"'`]/g,'').slice(0,8):'';
  if(!v){ resetName(k); return; }
  S.dex[k].name=v; sfx('heart'); save(); renderView();
  toast(`💕 이제 <b>${v}</b> 라고 부를게요!`);
  openCloset(k);
}
function resetName(k){
  delete S.dex[k].name; sfx('tap'); save(); renderView();
  toast(`${baseName(k)} 로 되돌렸어요`);
  openCloset(k);
}

function canBuyTub(f){
  if(S.open.includes(f.k)) return false;
  if(f.lv>S.lv) return false;
  return f.top ? S.top>=f.top : S.coin>=f.coin;
}
function storeDot(){
  return FLAVORS.some(canBuyTub) || UPG_KEYS.some(k=>upgLv(k)<UPG[k].max && S.coin>=upgCost(k));
}
function renderStoreTab(){
  const next=FLAVORS.filter(f=>!S.open.includes(f.k));
  const shown=next.slice(0,8);
  const tubs=shown.map(f=>{
    const lock=f.lv>S.lv, ok=canBuyTub(f);
    return `<div class="scard ${lock?'locked':''}">
      <span class="ic"><span style="display:block;width:44px;height:31px;margin:0 auto;border-radius:50% 50% 32% 32%;background:linear-gradient(160deg,${f.c2},${f.c});box-shadow:inset -4px -5px 0 rgba(0,0,0,.08)"></span></span>
      <b>${f.n}</b>

      <span class="pr">${f.top?`🍒 ${f.top}`:`🪙 ${fmt(f.coin)}`}</span>
      <button class="btn ${ok?'g':'w'} sm" ${ok?'':'disabled'} onclick="buyTub('${f.k}')">${lock?'잠김':'사기'}</button>
    </div>`;
  }).join('');

    return `<div class="scard">
      <span class="ic">${u.em}</span><b>${u.name}</b>
      <span class="fx">${u.desc}<br>지금 <b>Lv.${lv}</b> / ${u.max}</span>
      <span class="pr">${max?'✨ 최대':'🪙 '+fmt(c)}</span>
      <button class="btn ${max||S.coin<c?'w':'g'} sm" ${max||S.coin<c?'disabled':''} onclick="buyUpg('${k}')">${max?'완료':'올리기'}</button>
    </div>`;
  }).join('');
  const wears=WEAR_SLOTS.map(sl=>Object.keys(WEAR[sl].items).map(key=>{

      <span class="pr">${own?'✅ 가지고 있어요':wearPriceHTML(it)}</span>
      <button class="btn ${own?'w':(ok?'g':'w')} sm" ${own||!ok?'disabled':''} onclick="buyWear('${sl}','${key}','')">${own?'옷장에 있음':'사기'}</button>
    </div>`;
  }).join('')).join('');

  $('#view').innerHTML=`
  <div class="card">
    <h3>🍧 새 아이스크림 통 <small>${unlocked().length} / 31가지</small></h3>
    ${next.length
      ? `<div class="muted" style="margin-bottom:7px">통을 늘리면 그 통에 사는 <b>새 햄쮜</b>를 뜰 수 있어요.</div>
         <div class="shopgrid">${tubs}</div>
         ${next.length>shown.length?`<div class="muted" style="margin-top:7px">…그 밖에 ${next.length-shown.length}가지가 더 기다리고 있어요</div>`:''}`
      : '<div class="muted">✨ 31가지 통을 모두 갖췄어요!</div>'}
  </div>
  <div class="card">
    <h3>👗 꾸미기 소품 <small>${(S.closet||[]).length} / ${WEAR_SLOTS.reduce((a,s)=>a+Object.keys(WEAR[s].items).length,0)}가지</small></h3>
    <div class="muted" style="margin-bottom:7px">한 번 사면 <b>모든 햄쮜가 돌려 입어요.</b> 🏠놀이방에서 입혀주세요!</div>
    <div class="shopgrid">${wears}</div>
  </div>
  <div class="card">
    <h3>🔧 가게 키우기</h3>
    <div class="shopgrid">${ups}</div>
  </div>
  <div class="card">
    <h3>🍒 토핑은 어디서 나와요?</h3>
    <div class="muted" style="line-height:1.8">
      ⭐3개 이상 뜰 때 · 🔔손님 주문받기 · 🏆꾸미기 대회 · 🙈숨바꼭질 · 📅도장판 · 🏅스티커<br>
      더 자세한 건 <span style="text-decoration:underline;cursor:pointer" onclick="openHelp()"><b>❓도움말</b></span> 에 있어요.
    </div>
  </div>`;
}
function buyTub(k){
  const f=FL[k];
  if(S.open.includes(k)) return;
  if(f.lv>S.lv){ sfx('boo'); toast(`🔒 가게 Lv.${f.lv} 가 되면 살 수 있어요`); return; }
  if(f.top){ if(S.top<f.top){ sfx('boo'); toast(`🍒 토핑이 ${f.top-S.top}개 더 필요해요`); return; } S.top-=f.top; }
  else{ if(S.coin<f.coin){ sfx('boo'); toast(`🪙 코인이 ${fmt(f.coin-S.coin)} 더 필요해요`); return; } S.coin-=f.coin; }
  S.open.push(k); addExp(20); sel=k; sfx('gift'); checkBadges(); save(); renderAll();
  openModal(`<h2>🍧 새 통이 들어왔어요!<span class="x" onclick="closeModal()">닫기</span></h2>
    <div style="text-align:center">
      <span style="display:inline-block;width:104px;height:74px;border-radius:50% 50% 32% 32%;background:linear-gradient(160deg,${f.c2},${f.c});box-shadow:inset -6px -8px 0 rgba(0,0,0,.08)"></span>
      <div style="font-size:16px;font-weight:800;margin-top:7px">${f.n} 통</div>
      <div class="muted" style="margin-top:4px">이 통에는 <b>${f.hn}</b> 이(가) 산대요.<br>푹 떠서 만나보세요 🐹</div>
    </div>
    <div class="row" style="justify-content:center;margin-top:11px">
      <button class="btn" onclick="closeModal();go('scoop')">🍨 뜨러 가기</button></div>`);
}
function buyUpg(k){
  const u=UPG[k], c=upgCost(k);
  if(upgLv(k)>=u.max){ toast('이미 최대예요'); return; }
  if(S.coin<c){ sfx('boo'); toast(`🪙 코인이 ${fmt(c-S.coin)} 더 필요해요`); return; }
  S.coin-=c; S.upg[k]=upgLv(k)+1; sfx('coin');
  if(k==='seat') for(let i=0;i<ROOMS.length;i++) if(S.rooms[i]) S.rooms[i].seat.push(null);
  addExp(14); save(); renderAll();
  toast(`${u.em} ${u.name} Lv.${upgLv(k)} 로 올렸어요!`);
}

/* ---------- 🔔 손님 주문받기 ----------
   가게 놀이의 핵심. 손님 햄쮜가 주문서를 말하고, 아이가 콘 → 맛 → 토핑을
   차례로 골라 아이스크림을 만들어 준다. 세 가지를 다 맞히면 대성공.
   주문서는 만드는 동안 계속 보이고, ↩다시 고르기로 되돌릴 수 있어서 틀려도 부담이 없다. */
const ORDER_CD=4*60*1000;
/* 콘은 이모지 대신 CSS 로 그린다 — 이모지 콘(🍦)은 아이스크림이 이미 얹혀 있어서 쓸 수 없다.
   em 은 말풍선·채점표에서 글자로 쓸 때만 쓴다. */
const CONES={
  waffle:{em:'🧇', n:'와플콘',   cls:'waffle'},
  cup   :{em:'🍨', n:'예쁜 컵',  cls:'cupc'},
  rain  :{em:'🌈', n:'무지개콘', cls:'rain'}
};
const TOPS={
  choco :{em:'🍫', n:'초코시럽'},
  candy :{em:'🍬', n:'알사탕'},
  cherry:{em:'🍒', n:'체리'},
  cookie:{em:'🍪', n:'쿠키'}
};
function coneHTML(k,sm){ return `<span class="cone ${CONES[k].cls}${sm?' sm':''}"></span>`; }
const CONE_KEYS=Object.keys(CONES), TOP_KEYS=Object.keys(TOPS);
const ORD_STEP=['cn','fl','tp'];
let ordCur=null;
function ordLeft(){ return Math.max(0, ORDER_CD-(Date.now()-(S.ord.at||0))); }
function newOrder(){
  const own=Object.keys(S.dex); if(!own.length) return null;
  const pool=unlocked(); if(!pool.length) return null;
  const fl=pick(pool);
  /* 맛 후보는 정답 하나 + 가진 통 중에서 세 가지 (통이 적으면 있는 만큼만) */
  const opts=[fl], want=Math.min(4,pool.length);
  while(opts.length<want){ const c=pick(pool); if(opts.indexOf(c)<0) opts.push(c); }
  opts.sort(()=>Math.random()-0.5);
  return {who:pick(own), want:{cn:pick(CONE_KEYS), fl, tp:pick(TOP_KEYS)},
          got:{cn:null,fl:null,tp:null}, opts, step:0, done:false, hit:0, pay:null};
}
function openOrder(){
  if(!Object.keys(S.dex).length){ sfx('boo'); toast('먼저 햄쮜를 만나야 손님이 와요 🍨'); return; }
  if(ordLeft()>0){ sfx('boo'); toast(`🔔 다음 손님은 ${Math.ceil(ordLeft()/60000)}분 뒤에 와요`); return; }
  ordCur=newOrder(); if(!ordCur) return;
  sfx('tap'); renderOrder();
}
function icecHTML(g){
  const f=g.fl?FL[g.fl]:null;
  return `<div class="icec">
    ${g.tp?`<span class="tp">${TOPS[g.tp].em}</span>`:''}
    ${f?`<span class="sc" style="--c:${f.c};--c2:${f.c2}"></span>`:''}
    ${g.cn?coneHTML(g.cn):'<span class="ph">여기에<br>만들어 줘요</span>'}
  </div>`;
}
function ordPick(v){
  if(!ordCur||ordCur.done) return;
  const st=ordCur.step; if(st<0||st>2) return;
  ordCur.got[ORD_STEP[st]]=v;
  ordCur.step++;
  sfx(st===1?'scoop':'tap'); vib(12);
  if(ordCur.step>=3) finishOrder(); else renderOrder();
}
function ordBack(){
  if(!ordCur||ordCur.done||ordCur.step<=0) return;
  ordCur.step--; ordCur.got[ORD_STEP[ordCur.step]]=null;
  sfx('tap'); renderOrder();
}
function finishOrder(){
  const c=ordCur, w=c.want, g=c.got;
  c.hit=(g.cn===w.cn?1:0)+(g.fl===w.fl?1:0)+(g.tp===w.tp?1:0);
  c.done=true;
  S.ord.at=Date.now(); S.ord.done=(S.ord.done||0)+1;
  const m=1+S.lv*0.25;
  let coin,tops=0,bond,exp;
  if(c.hit===3){ S.ord.perfect=(S.ord.perfect||0)+1; coin=Math.ceil(160*m); tops=ri(1,3); bond=10; exp=9; }
  else if(c.hit===2){ coin=Math.ceil(90*m); tops=ri(0,1); bond=5; exp=5; }
  else { coin=Math.ceil(45*m); bond=3; exp=3; }
  c.pay={coin,tops};
  S.coin+=coin; S.top+=tops;
  addBond(c.who,bond); addExp(exp);
  sfx(c.hit===3?'nw':(c.hit?'coin':'boo')); vib(c.hit===3?[0,30,50,30]:14);
  checkBadges(); save(); renderHUD(); renderOrder();
  setTimeout(()=>{ if(tab==='scoop'||tab==='play') renderView(); },10);
}
function renderOrder(){
  const c=ordCur; if(!c) return;
  const w=c.want, g=c.got;
  const head=c.done
    ? ['음… 그래도 고마워요!','괜찮아요, 잘 먹을게요!','거의 다 맞았어요! 맛있어요 😋','완벽해요!! 최고예요 🎉'][c.hit]
    : `안녕! <b>${CONES[w.cn].em}${CONES[w.cn].n}</b>에<br>
       <b style="color:var(--acc)">${FL[w.fl].n}</b> 맛을 담고
       <b>${TOPS[w.tp].em}${TOPS[w.tp].n}</b>를 올려주세요!`;
  let bot;
  if(c.done){
    const row=(ok,lab,mine)=>`<div><span>${lab}</span><span>${mine} ${ok?'⭕':'❌'}</span></div>`;
    bot=`<div class="score">
      ${row(g.cn===w.cn,'🍦 콘',   CONES[g.cn].em+CONES[g.cn].n)}
      ${row(g.fl===w.fl,'🍨 맛',   FL[g.fl].n)}
      ${row(g.tp===w.tp,'🍒 토핑', TOPS[g.tp].em+TOPS[g.tp].n)}
      <div class="tot"><span>${c.hit===3?'🏆 딱 맞았어요!':(c.hit?'👍 잘했어요':'🙂 다음엔 더 잘할 거예요')}</span>
        <b>🪙+${fmt(c.pay.coin)}${c.pay.tops?' · 🍒+'+c.pay.tops:''}</b></div></div>
    <div class="muted" style="text-align:center;margin-top:8px;line-height:1.6">
      ${nameOf(c.who)} 와(과) 더 친해졌어요 💗<br>
      대접한 손님 <b>${S.ord.done}</b>명 · 딱 맞힌 주문 <b>${S.ord.perfect}</b>번</div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="btn" onclick="closeModal()">또 오세요! 👋</button></div>`;
  }else{
    const st=c.step;
    let opts;
    if(st===0){
      opts=`<div class="opts c3">${CONE_KEYS.map(k=>
        `<button onclick="ordPick('${k}')">${coneHTML(k,1)}${CONES[k].n}</button>`).join('')}</div>`;
    }else if(st===1){
      opts=`<div class="opts${c.opts.length<4?' c3':''}">${c.opts.map(k=>
        `<button onclick="ordPick('${k}')"><span class="sw" style="background:radial-gradient(circle at 34% 28%,${FL[k].c2},${FL[k].c} 74%)"></span>${FL[k].n}</button>`).join('')}</div>`;
    }else{
      opts=`<div class="opts">${TOP_KEYS.map(k=>
        `<button onclick="ordPick('${k}')"><span class="e">${TOPS[k].em}</span>${TOPS[k].n}</button>`).join('')}</div>`;
    }
    bot=`<div class="stepn">${['① 콘을 골라요','② 맛을 담아요','③ 토핑을 올려요'][st]}</div>
      ${opts}
      <div class="row" style="justify-content:center;margin-top:9px">
        ${st>0?'<button class="btn w sm" onclick="ordBack()">↩ 다시 고르기</button>':''}
        <div class="muted">주문서를 보고 그대로 만들어 주세요!</div></div>`;
  }
  openModal(`<h2>🔔 손님이 왔어요<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="ord">
      <div class="bub">${head}</div>
      <div><span class="who hs">${hamSVG(hamOf(c.who))}</span></div>
      ${icecHTML(g)}
    </div>
    ${bot}`);
}

/* ---------- 🏆 꾸미기 대회 ----------
   하루에 한 번. 오늘의 주제 소품을 입고 나가면 점수가 확 오른다 →
   사둔 소품 17가지를 골고루 쓰게 만드는 장치. */
function contTheme(){
  const all=[];
  WEAR_SLOTS.forEach(s=>Object.keys(WEAR[s].items).forEach(k=>all.push([s,k])));
  /* 날짜로 정해지므로 하루 종일 주제가 바뀌지 않는다 */
  const d=new Date(), seed=d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate();
  return all[seed%all.length];
}
function contThemeItem(){ const [s,k]=contTheme(); return WEAR[s].items[k]; }
function contReady(){ return S.cont.d!==todayKey(); }
let contRes=null, contWarn=null;
function openContest(){
  if(!Object.keys(S.dex).length){ sfx('boo'); toast('먼저 햄쮜를 만나야 대회에 나갈 수 있어요 🍨'); return; }
  contRes=null; contWarn=null; sfx('tap'); renderContPick();
}
function renderContPick(){
  const [ts,tk]=contTheme(), it=WEAR[ts].items[tk];
  const own=Object.keys(S.dex).sort((a,b)=>(wearOf(b)[ts]===tk?1:0)-(wearOf(a)[ts]===tk?1:0)||wearCount(b)-wearCount(a));
  const cards=own.map(k=>{
    const on=wearOf(k)[ts]===tk;
    return `<div class="scard" style="${on?'border-color:var(--acc);box-shadow:0 0 0 3px #ffd9e4':''}">
      <span class="ic">${hamPic(hamOf(k))}</span>
      <b>${nameOf(k)}</b>
      <span class="fx">소품 ${wearCount(k)}개 · ${heartStr(k)}</span>
      <span class="fx" style="${on?'color:var(--acc);font-weight:700':''}">${on?it.em+' 주제 입었어요!':'주제 소품 없음'}</span>
      ${k===contWarn
        ? `<button class="btn sm" onclick="joinContest('${k}',1)">그래도 내보내기</button>`
        : `<button class="btn ${on?'':'w'} sm" onclick="joinContest('${k}')">🏆 내보내기</button>`}
    </div>`;
  }).join('');
  openModal(`<h2>🏆 꾸미기 대회<span class="x" onclick="closeModal()">닫기</span></h2>
    ${contReady()
      ? `${contWarn?`<div class="card" style="margin:0 0 8px;font-size:12px;line-height:1.7;border-color:var(--acc)">
             ⚠️ <b>${nameOf(contWarn)}</b> 는 아직 아무것도 안 입었어요.<br>
             먼저 <b>👗꾸미기</b> 로 리본이나 모자를 입혀주면 점수가 훨씬 높아요!
             (대회는 <b>하루에 한 번</b>이에요)</div>`:''}
         <div class="muted" style="line-height:1.7;margin-bottom:8px">
           오늘의 주제는 <b style="color:var(--acc);font-size:13px">${it.em} ${it.name}</b> 예요!<br>
           주제 소품을 입고 나가면 점수를 <b>많이</b> 받아요. 하루에 한 번 나갈 수 있어요.</div>
         <div class="shopgrid wide">${cards}</div>
         <div class="muted" style="margin-top:8px">👗 소품이 없으면 놀이방의 <b>꾸미기</b> 나 🛒상점에서 먼저 사주세요.</div>`
      : `<div class="muted" style="text-align:center;line-height:1.8">
           오늘 대회는 벌써 끝났어요 🎀<br>내일 또 새로운 주제로 열려요!<br>
           <b>내 최고 점수 ${S.cont.best}점</b> · 1등 ${S.cont.win}번 (나간 횟수 ${S.cont.play}번)</div>
         <div class="row" style="justify-content:center;margin-top:11px">
           <button class="btn" onclick="closeModal()">알았어요</button></div>`}`);
}
function joinContest(k,ok){
  if(!contReady()){ sfx('boo'); toast('오늘 대회는 이미 끝났어요 🎀'); return; }
  if(!S.dex[k]) return;
  /* 아무것도 안 입힌 채로 하루 한 번을 써버리지 않게 한 번 되묻는다 */
  if(!ok && wearCount(k)===0){ contWarn=k; sfx('boo'); renderContPick(); return; }
  contWarn=null;
  const [ts,tk]=contTheme(), w=wearOf(k), d=S.dex[k], n=wearCount(k);
  const rows=[];
  rows.push([`👗 꾸민 소품 ${n}개`, n*20]);
  rows.push([`${WEAR[ts].items[tk].em} 오늘의 주제`, w[ts]===tk?40:0]);
  if(n===3) rows.push(['✨ 머리·목·손 풀코디', 20]);
  rows.push([`💗 하트 ${hearts(k)}개`, hearts(k)*4]);
  rows.push([`⭐ ${d.g}개`, d.g*5]);
  rows.push(['🙂 심사위원 기분', ri(0,15)]);
  const tot=rows.reduce((a,r)=>a+r[1],0);
  const rank= tot>=115?1:(tot>=75?2:3);
  const m=1+S.lv*0.25;
  const pay=[null,{t:5,c:Math.ceil(200*m),b:12,e:12},
                  {t:3,c:Math.ceil(120*m),b:8, e:8},
                  {t:1,c:Math.ceil(60*m), b:5, e:5}][rank];
  S.cont.d=todayKey(); S.cont.play=(S.cont.play||0)+1;
  S.cont.best=Math.max(S.cont.best||0,tot);
  if(rank===1) S.cont.win=(S.cont.win||0)+1;
  S.top+=pay.t; S.coin+=pay.c;
  addBond(k,pay.b); addExp(pay.e);
  contRes={k,rows,tot,rank,pay};
  sfx(rank===1?'star4':'nw'); vib(rank===1?[0,30,50,30,50,30]:[0,30,50,30]);
  checkBadges(); save(); renderHUD(); renderContResult();
  setTimeout(()=>{ if(tab==='scoop'||tab==='play') renderView(); },10);
}
function renderContResult(){
  const r=contRes; if(!r) return;
  const medal=['','🥇','🥈','🥉'][r.rank];
  const word=['',`${medal} 1등이에요!! 우와 🎉`,`${medal} 2등이에요! 잘했어요`,`${medal} 3등이에요, 참가상!`][r.rank];

    <div class="runway">
