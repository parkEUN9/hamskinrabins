<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff4f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>햄스킨라빈스</title>
<style>
/* 앱(WebView)에서 쓸 때를 기준으로 잡은 규칙
   - 두 번 탭 확대·길게 눌러 선택·당겨서 새로고침을 막는다
   - 글자를 넣는 곳(.tin)만 선택을 다시 허용한다 */
*{
  box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation
}
input,textarea,.tin{-webkit-user-select:text;user-select:text;touch-action:auto}
:root{
  --bg:#fff4f7; --card:#fffdfb; --line:#f3d9e0; --ink:#4d3a41; --ink2:#9d8189;
  --acc:#f2688f; --acc2:#5fc4ad; --gold:#f0b93f; --no:#e2705f;
  --sh:0 2px 0 #f0dbe1;
}
html,body{margin:0;padding:0;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(circle at 12% 8%, #ffe6ee 0 20%, transparent 45%),
    radial-gradient(circle at 88% 4%, #ddf5ee 0 18%, transparent 40%),
    var(--bg);
  color:var(--ink);
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  font-size:14.5px;line-height:1.5;min-height:100vh;overflow-x:hidden;
  padding:0 0 calc(76px + env(safe-area-inset-bottom));
}
#app{
  max-width:520px;margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top)) calc(9px + env(safe-area-inset-right)) 0 calc(9px + env(safe-area-inset-left))
}

/* ---------- 헤더 ---------- */
header{margin-bottom:7px}
.brand{display:flex;align-items:center;gap:4px;margin-bottom:6px}
/* ⚠️ 제목이 두 줄로 접히면 헤더가 통째로 한 줄 더 커진다(136px → 화면의 17%).
   좁으면 말줄임표로 잘리게 두고, 절대 줄바꿈하지 않는다. */
.brand h1{margin:0;font-size:16px;letter-spacing:-.6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand .logo{
  width:28px;height:28px;border-radius:10px;background:linear-gradient(#ffd0de,#ffb0c6);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--sh)
}
/* 헤더 버튼은 아이 손가락 기준으로 38px 은 넘긴다 (특히 🎁선물상자는 자주 누른다) */
.brand .lv{
  margin-left:auto;font-size:10.5px;font-weight:700;background:var(--card);border:2px solid var(--line);
  border-radius:11px;padding:0 6px;min-height:34px;display:flex;align-items:center;
  cursor:pointer;white-space:nowrap;flex:none
}
.brand .hbtn{
  width:34px;height:34px;flex:none;border-radius:11px;background:var(--card);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;position:relative;
  box-shadow:var(--sh)
}
.brand .hbtn:active{transform:translateY(1px)}
/* 선물이 준비되면 상자가 살랑살랑 흔들린다 */
.brand .hbtn.rdy{border-color:#f0c65a;background:linear-gradient(#fff7e0,#ffeec4);animation:wig 1.1s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.brand .hbtn .bg{
  position:absolute;right:-3px;top:-4px;background:var(--no);color:#fff;font-size:8.5px;font-weight:800;
  border-radius:9px;padding:0 3px;line-height:13px;box-shadow:0 0 0 1.5px #fff
}
.purse{display:flex;gap:7px}
.purse div{
  flex:1;background:var(--card);border:2px solid var(--line);border-radius:13px;
  padding:4px 3px;text-align:center;box-shadow:var(--sh);min-width:0
}
/* 📋 오늘 다 한 것 — 작은 단추 두 줄로 접어 둔다(다시 보기용) */
.todone{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}
.todone .btn{font-size:11px;padding:6px 4px}
.purse div[onclick]{cursor:pointer}
.purse div[onclick]:active{transform:translateY(1px)}
.purse .n{font-size:14.5px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.purse .t{font-size:10px;color:var(--ink2)}

/* ---------- 공통 ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:19px;padding:11px;box-shadow:var(--sh);margin-bottom:9px}
.card h3{margin:0 0 7px;font-size:14.5px;display:flex;align-items:center;gap:5px}
.card h3 small{margin-left:auto;font-weight:400;font-size:11px;color:var(--ink2)}
/* 📖 접었다 펼치는 머리글 — 눌러도 되는 곳이라고 보이게 삼각형을 붙인다 */
.card h3.fold{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.card h3.fold:active{opacity:.6}
.card h3.fold .cv{
  flex:0 0 auto;width:17px;height:17px;border-radius:6px;background:var(--line);
  color:var(--acc);font-size:10px;line-height:17px;text-align:center;font-weight:900
}
.card h3.fold small{margin-right:3px}
.muted{color:var(--ink2);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{
  border:2px solid #d94f76;background:linear-gradient(#ff8fae,var(--acc));color:#fff;
  font:inherit;font-weight:800;font-size:13.5px;padding:9px 13px;border-radius:14px;
  cursor:pointer;box-shadow:0 3px 0 #c94168;transition:transform .06s
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c94168}
/* 작은 버튼도 아이 손가락으로 누를 수 있게 40px 은 넘긴다 */
.btn.sm{font-size:12px;padding:9px 10px;border-radius:12px;min-height:40px}
.btn.w{background:linear-gradient(#fffdfb,#fdeef2);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 #ecd3da}
.btn.w:active{box-shadow:0 1px 0 #ecd3da}
.btn.g{background:linear-gradient(#86dcc7,var(--acc2));border-color:#43a892;box-shadow:0 3px 0 #3d9a84}
.btn.g:active{box-shadow:0 1px 0 #3d9a84}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.bar{height:8px;border-radius:99px;background:#f6e2e8;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,#ffc46e,var(--acc));border-radius:99px;transition:width .25s}
.tin{
  width:100%;font:inherit;font-size:15px;font-weight:700;text-align:center;color:var(--ink);
  background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;outline:none
}
.tin:focus{border-color:var(--acc);box-shadow:0 0 0 3px #ffe1ea}
.tag{display:inline-block;background:#fdeef2;border:1px solid var(--line);border-radius:8px;padding:1px 6px;font-size:10.5px}
.hs{display:inline-block;line-height:0}
.hs svg{width:100%;height:100%;display:block;overflow:visible}
.big{width:138px;height:138px;margin:2px auto 6px}
/* 🧸 창 안에서 놀아줄 때 그 아이가 실제로 움직인다 — 눌러도 아무 일이 없으면 논 것 같지가 않다 */
#hambig{position:relative}
#hambig .fxo{position:absolute;pointer-events:none;font-size:21px;will-change:transform,opacity;
             animation:fxup 1.15s ease-out forwards}
@keyframes fxup{0%{transform:translateY(8px) scale(.5);opacity:0}
                22%{opacity:1}100%{transform:translateY(-52px) scale(1.15);opacity:0}}
.pact-hop  {animation:pacthop .6s cubic-bezier(.25,1.5,.4,1) 2}
@keyframes pacthop{0%,100%{transform:translateY(0)}34%{transform:translateY(-15px)}62%{transform:translateY(0) scaleY(.93)}}
.pact-dance{animation:pactdance .48s ease-in-out 5}
@keyframes pactdance{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-5px)}}
.pact-yum  {animation:pactyum .34s ease-in-out 5}
@keyframes pactyum{0%,100%{transform:scale(1,1)}50%{transform:scale(1.07,.93)}}
.pact-sleep{animation:pactsleep 1.6s ease-in-out 2}
@keyframes pactsleep{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(4px) rotate(-4deg)}}
/* ⚽ 공이 왼쪽에서 굴러 들어와 한 번 통 튀고 오른쪽으로 빠져나간다.
   ⚽ 이모지만 떠오르게 했더니 「공이 안 나온다」는 말을 들었다 — 굴러야 공놀이다. */
#hambig .fxball{position:absolute; left:-26%; top:54%; font-size:30px; pointer-events:none;
                will-change:transform,opacity; animation:fxball 1.55s cubic-bezier(.3,.06,.4,1) forwards}
@keyframes fxball{
  0%  {transform:translate(0,0) rotate(0);            opacity:0}
  12% {opacity:1}
  44% {transform:translate(56px,0) rotate(330deg)}
  56% {transform:translate(70px,-22px) rotate(430deg)}
  70% {transform:translate(88px,0) rotate(520deg)}
  100%{transform:translate(170px,0) rotate(880deg);   opacity:0}
}
.pact-roll {animation:pactroll .5s ease-in-out 3}
@keyframes pactroll{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-11px) rotate(-9deg)}75%{transform:translateX(11px) rotate(9deg)}}
.burst{animation:burst .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes burst{0%{transform:scale(.25) rotate(-16deg);opacity:0}60%{transform:scale(1.14) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.stars{color:var(--gold);letter-spacing:-1px}

/* ---------- 스쿱 무대 ---------- */
#stage{
  position:relative;border-radius:18px;overflow:hidden;margin-bottom:9px;
  background:linear-gradient(#ffe9f0 0 62%,#f7e2cd 62%);
  border:2px solid #f0c4d2;box-shadow:var(--sh);padding:22px 9px 11px;text-align:center
}
#stage .stripe{
  position:absolute;left:0;right:0;top:0;height:16px;
  background:repeating-linear-gradient(135deg,#ff9fba 0 12px,#fff0f4 12px 24px);
  border-bottom:2px solid #f0c4d2
}
/* 반짝 게이지 — 예전 「보장까지」 를 눈에 보이는 막대로 바꾼 것 */
#stage .pity{
  max-width:300px;margin:9px auto 0;background:rgba(255,255,255,.72);
  border:2px solid #f3d0dc;border-radius:14px;padding:6px 9px 7px
}
#stage .pity .lab{font-size:11.5px;font-weight:700;margin-bottom:4px;line-height:1.35}
#stage .pity .bar{height:10px;background:#f4cfdb}
#stage .pity .bar>div{background:linear-gradient(90deg,#ffe07a,#ffb14a)}
#tubbig{width:206px;max-width:78%;margin:0 auto;position:relative}
#tubbig svg{width:100%;height:auto;display:block;overflow:visible}
#tubbig.dig{animation:dig .5s ease-in-out}
@keyframes dig{
  0%{transform:rotate(0) translateY(0)}
  25%{transform:rotate(-4deg) translateY(-5px)}
  50%{transform:rotate(3deg) translateY(2px)}
  75%{transform:rotate(-2deg) translateY(-3px)}
  100%{transform:rotate(0) translateY(0)}
}
#stage .spoon{
  position:absolute;right:4%;top:-4px;font-size:36px;transform-origin:80% 90%;
  animation:sway 2.6s ease-in-out infinite alternate
}
@keyframes sway{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
#stage .pickname{font-size:16px;font-weight:800;margin-top:6px}
#stage .picksub{font-size:11.5px;color:#8a6b74}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks span{position:absolute;font-size:20px;animation:fly .8s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}

/* ---------- 통 진열 ---------- */
.tubs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(min-width:430px){.tubs{grid-template-columns:repeat(4,1fr)}}
.tub{
  position:relative;border:2px solid var(--line);background:var(--card);border-radius:14px;
  padding:6px 3px 5px;cursor:pointer;box-shadow:var(--sh);font:inherit;text-align:center;overflow:hidden
}
.tub:active{transform:translateY(2px)}
.tub.on{border-color:var(--acc);box-shadow:0 0 0 3px #ffd9e4}
.tub .dome{
  display:block;width:46px;height:32px;margin:0 auto 3px;border-radius:50% 50% 32% 32%;
  background:linear-gradient(160deg,var(--c2),var(--c));box-shadow:inset -4px -5px 0 rgba(0,0,0,.08)
}
.tub .nm{display:block;font-size:10.5px;font-weight:700;line-height:1.2;word-break:keep-all}
.tub .pr{display:block;font-size:9.5px;color:var(--ink2);margin-top:1px}
.tub .gr{position:absolute;left:3px;top:2px;font-size:9px;color:var(--gold);letter-spacing:-1.5px}
.tub .new{position:absolute;right:3px;top:1px;font-size:9px}
.tub.locked{opacity:.42;cursor:pointer}

/* ---------- 🏠 방 고르기 줄 ---------- */
.rooms{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:7px}
/* 방을 다 열면 열한 칸이라 다섯 칸짜리 줄로는 세 줄이 된다 — 칸을 좁혀 두 줄에 담는다 */
.rooms.many{grid-template-columns:repeat(6,1fr);gap:3px;font-size:9.5px}
.rooms.many>div{padding:4px 1px 3px;min-height:48px}
.rooms.many>div .e{font-size:15px}
.rooms>div{
  background:var(--card);border:2px solid var(--line);border-radius:13px;padding:5px 2px 4px;
  text-align:center;font-size:10.5px;font-weight:700;cursor:pointer;box-shadow:var(--sh);
  line-height:1.25;word-break:keep-all;min-height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center
}
.rooms>div.on{border-color:var(--acc);background:#ffeaf1;color:var(--acc)}
.rooms>div .e{display:block;font-size:17px;line-height:1.15}
.rooms>div i{display:block;font-style:normal;font-size:8.5px;font-weight:700;color:var(--ink2)}
.rooms>div.on i{color:var(--acc)}

/* ---------- 테라스 ---------- */
/* 테라스 색은 전부 변수로 뺐다 — 🎨테마를 고르면 applyTheme() 가 :root 값만 바꿔준다 */
:root{
  --tsky:#ffeef4; --tsky2:#f3e3cf; --tawn1:#ff9fba; --tawn2:#fff5f8; --tawnb:#ef8ba9;
  --tflo1:#f7e6d0; --tflo2:#eed6b8; --tflob:#e7c9a4; --tline:#f0c4d2
}
#terrace{
  position:relative;height:300px;border-radius:18px;overflow:hidden;margin-bottom:9px;
  background:linear-gradient(var(--tsky) 0 56%,var(--tsky2) 56%);
  border:2px solid var(--tline);box-shadow:var(--sh);contain:paint
}
#terrace .awn{
  position:absolute;left:0;right:0;top:0;height:34px;
  background:repeating-linear-gradient(90deg,var(--tawn1) 0 22px,var(--tawn2) 22px 44px);
  border-bottom:3px solid var(--tawnb);border-radius:0 0 10px 10px
}
#terrace .awn:after{
  content:'';position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:repeating-linear-gradient(90deg,var(--tawn1) 0 22px,var(--tawn2) 22px 44px);
  clip-path:polygon(0 0,100% 0,100% 40%,95% 100%,90% 40%,85% 100%,80% 40%,75% 100%,70% 40%,65% 100%,60% 40%,55% 100%,50% 40%,45% 100%,40% 40%,35% 100%,30% 40%,25% 100%,20% 40%,15% 100%,10% 40%,5% 100%,0 40%)
}
#terrace .floor{
  position:absolute;left:0;right:0;bottom:0;height:44%;
  background:
    repeating-conic-gradient(var(--tflo1) 0 25%, var(--tflo2) 0 50%) 0 0/28px 28px;
  border-top:3px solid var(--tflob)
}
/* 🌳 마당 — 차양이 없고 바닥이 잔디다 */
#terrace.yard{background:linear-gradient(var(--tsky) 0 52%,var(--tsky2) 52%)}
#terrace.yard .floor{
  height:50%;
  background:
    repeating-linear-gradient(84deg,rgba(255,255,255,.22) 0 3px,transparent 3px 11px),
    repeating-conic-gradient(var(--tflo1) 0 25%, var(--tflo2) 0 50%) 0 0/34px 34px
}
#terrace.yard .hint{top:8px}
#terrace.yard #photocam{top:8px}
/* 날씨 그림은 흐릿해지면 못 알아보니 또렷하게 둔다 */
#terrace.yard .tsp{animation:twk2 3.4s ease-in-out infinite}
@keyframes twk2{0%,100%{opacity:.8;transform:scale(.96)}50%{opacity:1;transform:scale(1.1)}}
#terrace.yard .deco{z-index:2}
/* 🌻 뒷마당 — 날씨는 앞마당과 같이 쓰고, 바닥만 이랑을 낸 텃밭이다.
   뒤쪽에 낮은 덤불 줄을 그어서 「집 뒤편」처럼 보이게 했다. */
#terrace.yard.back .floor{
  background:
    repeating-linear-gradient(97deg,rgba(126,86,44,.20) 0 5px,transparent 5px 17px),
    repeating-conic-gradient(var(--tflo1) 0 25%, var(--tflo2) 0 50%) 0 0/30px 30px
}
#terrace.yard.back:before{
  content:'';position:absolute;left:-6px;right:-6px;top:43%;height:27px;z-index:1;pointer-events:none;
  background:repeating-radial-gradient(circle at 13px 21px,#7cbd88 0 12px,transparent 12px 14px);
  opacity:.9
}
/* 🧊 냉장고 — 차양 대신 냉동실 칸, 벽에는 선반 두 칸.
   선반은 z-index 1 이라 햄쮜(3~7) 뒤에 깔린다 — 앞을 가리면 안 된다. */
#terrace.fridge .fzr{
  position:absolute;left:0;right:0;top:0;height:37px;z-index:1;
  background:linear-gradient(#fbfeff,#e4f1f8);
  border-bottom:3px solid var(--tawnb);border-radius:0 0 11px 11px
}
#terrace.fridge .fzr:after{
  content:'';position:absolute;right:15px;top:13px;width:46px;height:9px;border-radius:5px;
  background:var(--tawnb);opacity:.6
}
#terrace.fridge .shelf{
  position:absolute;left:7px;right:7px;height:5px;border-radius:3px;z-index:1;pointer-events:none;
  background:linear-gradient(#ffffff,#cde3ef);box-shadow:0 2px 0 rgba(115,158,180,.22)
}
#terrace.fridge .shelf.s1{top:30%}
#terrace.fridge .shelf.s2{top:46%}
#terrace.fridge .floor{
  background:repeating-linear-gradient(90deg,var(--tflo1) 0 17px,var(--tflo2) 17px 34px)
}
/* 테마마다 하늘에 뜨는 작은 장식 */
#terrace .tsp{position:absolute;line-height:1;z-index:1;animation:twk 2.6s ease-in-out infinite}
#terrace .deco{position:absolute;transform:translateX(-50%);line-height:1;z-index:1;
  filter:drop-shadow(0 2px 1px rgba(140,90,100,.2))}   /* 배경보다 위, 햄쮜(z 3~7)보다 아래 */
/* 눌러서 노는 것은 살짝 흔들려서 눌러보라고 알려준다 */
#terrace .deco.tapme{cursor:pointer;animation:tapme 2.4s ease-in-out infinite}
#terrace .deco.rbounce{animation:rbounce .85s ease-out}
@keyframes tapme{0%,86%,100%{transform:translateX(-50%) rotate(0)}90%{transform:translateX(-50%) rotate(-7deg) scale(1.06)}95%{transform:translateX(-50%) rotate(7deg) scale(1.06)}}
@keyframes rbounce{0%,100%{transform:translateX(-50%) scale(1)}30%{transform:translateX(-50%) scale(1.24) rotate(-8deg)}60%{transform:translateX(-50%) scale(1.1) rotate(6deg)}}
/* 🎂 생일 파티 자리 — 아이가 고른 꾸미기가 위에 걸리고, 케이크가 앞에 놓인다 */
.pty{
  position:relative;border:2px solid var(--line);border-radius:16px;overflow:hidden;
  background:linear-gradient(#fff7fb 58%,#ffe7f0);padding:25px 7px 9px;box-shadow:var(--sh)
}
.pty .dc{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-around;
  font-size:16px;padding:3px 5px 0;pointer-events:none}
.pty .dc span:nth-child(2n){transform:translateY(6px)}
.pty .who{display:flex;align-items:flex-end;justify-content:center;gap:1px;flex-wrap:wrap}
.pty .who .hs{width:50px;height:50px;display:block;flex:0 1 auto;min-width:0}
.pty .who .me{width:74px;height:74px}
.pty .cake{text-align:center;font-size:37px;line-height:1.08;margin-top:1px}
.pty .cake .cd{display:block;font-size:12px;letter-spacing:2px;margin-bottom:-5px}
/* 고르는 칸 — 케이크·꾸미기·선물 */
.ptpick{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.ptpick.g4{grid-template-columns:repeat(4,1fr)}
.ptpick div{
  border:2px solid var(--line);background:var(--card);border-radius:12px;padding:5px 1px 4px;
  text-align:center;cursor:pointer;box-shadow:var(--sh);min-width:0
}
.ptpick div .e{font-size:21px;line-height:1.15;display:block}
.ptpick div .n{font-size:9.5px;font-weight:700;line-height:1.3;display:block;word-break:keep-all}
.ptpick div.on{border-color:var(--acc);background:#ffeaf1;color:var(--acc)}
/* 🧩 짝 맞추기 카드 — 뒤집는 맛이 나야 해서 진짜로 <b>돌린다</b>(rotateY).
   ⚠️ 카드를 뒤집을 때 창을 다시 그리면 안 된다 — 그리는 순간 돌아가던 게 끊긴다.
   그래서 mgTap 은 그 카드의 class 만 건드린다. */
.memgrid{display:grid;gap:7px;margin:2px 0 0}
.memgrid.c3{grid-template-columns:repeat(3,1fr)}
.memgrid.c4{grid-template-columns:repeat(4,1fr)}
.mcd{aspect-ratio:1;perspective:640px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mcd .in{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;transition:transform .34s ease
}
.mcd.up .in,.mcd.got .in{transform:rotateY(180deg)}
.mcd .bk,.mcd .ft{
  position:absolute;inset:0;border-radius:13px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden
}
.mcd .bk{background:linear-gradient(150deg,#ffd9e6,#ffeef4 55%,#e7f0ff);font-size:21px;box-shadow:var(--sh)}
.mcd .ft{background:#fff;transform:rotateY(180deg);padding:2px}
.mcd .ft .hs{width:100%;height:100%;display:block}
.mcd.got{cursor:default}
.mcd.got .ft{border-color:var(--acc);background:#fff6f9}
.mcd.got{animation:mgpop .42s ease-out}
@keyframes mgpop{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
.mcd.miss .ft{border-color:#e3b0b0;background:#fff1f1}
/* 🥚 알 — 부모가 앉은 방 바닥에 놓인다. 눌러서 품어준다.
   ⚠️ 햄쮜(z 3~7)보다 <b>뒤</b>에 둔다 — 앞에 두면 알이 아이들을 가린다. */
#terrace .eggnest{
  position:absolute;left:50%;bottom:2px;transform:translateX(-50%);z-index:2;cursor:pointer;
  line-height:0;filter:drop-shadow(0 3px 2px rgba(120,80,90,.22))
}
#terrace .eggnest svg{display:block}
#terrace .eggnest .lab{
  position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);
  background:rgba(255,255,255,.94);border:1.6px solid var(--line);border-radius:9px;
  padding:1px 6px;font-size:9.5px;font-weight:800;color:var(--ink);white-space:nowrap;line-height:1.5
}
/* 오늘 품어줄 수 있으면 살짝 갸웃거려서 눌러보라고 알려준다 */
#terrace .eggnest.tapme{animation:eggwob 2.6s ease-in-out infinite}
@keyframes eggwob{0%,80%,100%{transform:translateX(-50%) rotate(0)}
  86%{transform:translateX(-50%) rotate(-6deg)}93%{transform:translateX(-50%) rotate(6deg)}}
/* 다 품었으면 계속 흔들흔들 — 곧 나올 것 같게 */
#terrace .eggnest.pop{animation:eggpop 1s ease-in-out infinite}
@keyframes eggpop{0%,100%{transform:translateX(-50%) rotate(-5deg) scale(1)}
  50%{transform:translateX(-50%) rotate(5deg) scale(1.06)}}
/* 🛝 마당 놀이기구 — 큰 그림. 누르면 햄쮜가 걸어가서 타고 논다 */
#terrace.yard{height:344px}
#terrace .ride{
  position:absolute;transform:translateX(-50%);line-height:0;z-index:2;cursor:pointer;
  filter:drop-shadow(0 3px 2px rgba(120,80,90,.22));animation:rideidle 3.2s ease-in-out infinite
}
#terrace .ride svg{display:block;width:100%;height:auto}
#terrace .ride.rbounce{animation:rbounce .9s ease-out}
@keyframes rideidle{0%,92%,100%{transform:translateX(-50%) rotate(0)}96%{transform:translateX(-50%) rotate(-1.2deg)}}
/* 타는 동안은 놀이기구보다 앞에 — 사다리·활강로 위에 올라탄 게 보이게 */
#terrace .tham.riding{z-index:9;animation-play-state:paused} /* 산책을 멈춰야 타는 자리가 흔들리지 않는다 */
#terrace .tham.riding .hs{animation:none}
#terrace .tham.riding .hb{opacity:0}          /* 타는 중에는 말풍선만 감춘다 */
/* 🌙 때에 따라 놀이방 위에 얇게 덧칠하는 한 장.
   테마 색을 건드리지 않고 위에 얹기만 하므로 아이가 고른 배경이 그대로 남는다.
   햄쮜(z 3~7)까지 같이 물들어야 밤 같아 보이므로 z 8 에 두고, 글자와 단추만 그 위로 올린다. */
#terrace .tod{position:absolute;inset:0;z-index:8;pointer-events:none;transition:background .8s,backdrop-filter .8s}
#terrace .tod.dawn {background:linear-gradient(180deg,rgba(255,196,150,.26),rgba(255,236,205,.10))}
#terrace .tod.day  {background:none}
#terrace .tod.eve  {background:linear-gradient(180deg,rgba(255,140,90,.30),rgba(120,80,150,.16))}
#terrace .tod.night{background:linear-gradient(180deg,rgba(24,26,72,.56),rgba(38,32,78,.40))}
/* 🌟 밤에만 지나가는 별똥별 — 누르면 소원을 빈다 */
/* 자리를 옮기면 📸사진·🎨꾸미기 단추(오른쪽 위)나 날씨 글자(왼쪽 위)와 겹친다 —
   흔들리는 폭(-16px)까지 재서 가운데 위 빈 하늘에 뒀다. 옮길 일이 있으면 다시 재보세요. */
#terrace .wish{
  position:absolute;left:56%;top:24%;z-index:11;cursor:pointer;font-size:23px;line-height:1;
  filter:drop-shadow(0 0 7px rgba(255,246,190,.95));animation:wishfly 3.6s ease-in-out infinite
}
/* 🧊 냉장고만은 선반 두 칸이 가로로 지나가서, 그 사이 빈 칸으로 올린다 */
#terrace.fridge .wish{top:15%}
@keyframes wishfly{
  0%,100%{transform:translate(0,0) rotate(0deg);opacity:.9}
  50%    {transform:translate(-16px,13px) rotate(-14deg);opacity:1}
}
#terrace .hint{
  position:absolute;left:8px;top:41px;font-size:10.5px;color:#8a4a67;z-index:9;
  background:rgba(255,255,255,.85);border-radius:9px;padding:2px 7px
}
#terrace .none{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:12.5px;color:#8a4a67;z-index:9}
#terrace .tham{
  position:absolute;transform:translateX(-50%);text-align:center;cursor:pointer;
  animation:stroll var(--dur,9s) ease-in-out infinite alternate
}
#terrace .tham .hs{width:var(--w,82px);height:var(--w,82px);display:block;margin:0 auto;animation:wob 2.5s ease-in-out infinite alternate}
#terrace .tham b{
  display:block;font-size:10.5px;font-weight:700;color:#8a4a67;background:rgba(255,255,255,.92);
  border-radius:9px;padding:1px 6px;width:fit-content;margin:0 auto;white-space:nowrap
}
#terrace .tham b i{font-style:normal;font-size:8.5px;color:#d4568a;letter-spacing:-.5px}
/* 좁은 폰에서는 테라스가 360px 밖에 안 돼서 이름표끼리 많이 겹친다 — 조금 작게 만든다 */
@media(max-width:429px){
  #terrace .tham b{font-size:9.5px;padding:1px 5px;border-radius:8px}
  #terrace .tham b i{font-size:8px}
  #terrace .tham .hb{font-size:9px;padding:1px 5px}
}
/* 말풍선 — 이모지뿐 아니라 짧은 말도 띄운다. translateX(-50%) 를 키프레임에도 넣어야 한다 */
#terrace .tham .hb{
  position:absolute;left:50%;top:-11px;transform:translateX(-50%);
  font-size:9.5px;font-weight:700;color:#8a4a67;background:rgba(255,255,255,.95);
  border:1.5px solid #f3d0dc;border-radius:10px;padding:1px 6px;white-space:nowrap;
  animation:mumble 5.5s ease-in-out infinite
}
#terrace .tham:active .hs{animation:none;transform:scale(.9)}
#terrace .tham.hop .hs{animation:thop .75s ease-out}

/* ⚽ 공 쫓아가기 — 공이 지나가는 쪽으로 우르르 달려갔다 돌아온다.
   stroll 과 마찬가지로 translateX(-50%) 를 키프레임마다 다시 써줘야 가운데 정렬이 안 깨진다. */
#terrace .tham.chase{animation:chase 2.8s cubic-bezier(.4,0,.5,1)}
@keyframes chase{
  0%  {transform:translateX(-50%) translateX(0)}
  38% {transform:translateX(-50%) translateX(var(--cx,60px))}
  55% {transform:translateX(-50%) translateX(var(--cx,60px))}
  100%{transform:translateX(-50%) translateX(0)}
}
#terrace .tham.chase .hs{animation:runwob .28s ease-in-out infinite alternate}
@keyframes runwob{from{transform:translateY(0) rotate(-11deg)}to{transform:translateY(-7px) rotate(11deg)}}

/* 🎵 춤추기 */
#terrace .tham.dance{animation:dance 1.15s ease-in-out infinite}
@keyframes dance{
  0%  {transform:translateX(-50%) translateX(-9px) rotate(-7deg)}
  25% {transform:translateX(-50%) translateX(0)    rotate(0deg) translateY(-13px)}
  50% {transform:translateX(-50%) translateX(9px)  rotate(7deg)}
  75% {transform:translateX(-50%) translateX(0)    rotate(0deg) translateY(-13px)}
  100%{transform:translateX(-50%) translateX(-9px) rotate(-7deg)}
}
#terrace .tham.dance .hs{animation:dwob .575s ease-in-out infinite alternate}
@keyframes dwob{from{transform:scale(.94) rotate(-6deg)}to{transform:scale(1.07) rotate(6deg)}}
/* 😴 낮잠 — 살짝 기울여 천천히 숨 쉬듯 */
#terrace .tham.nap{animation:napsway 3.2s ease-in-out infinite}
@keyframes napsway{
  0%,100%{transform:translateX(-50%) rotate(-4deg)}
  50%    {transform:translateX(-50%) rotate(4deg)}
}
#terrace .tham.nap .hs{animation:napbr 2.2s ease-in-out infinite alternate}
@keyframes napbr{from{transform:scale(.97)}to{transform:scale(1.04)}}
#terrace .fx.zzz{font-size:19px;animation:zzzup 4.6s ease-out forwards}
@keyframes zzzup{
  0%{transform:translate(0,0) scale(.6);opacity:0}
  14%{opacity:.95}
  100%{transform:translate(16px,-46px) scale(1.12);opacity:0}
}
#terrace .fx.gift{animation:giftpop 2.6s ease-out forwards}
@keyframes giftpop{
  0%{transform:translateY(10px) scale(.4);opacity:0}
  20%{transform:translateY(-6px) scale(1.15);opacity:1}
  45%{transform:translateY(0) scale(1);opacity:1}
  100%{transform:translateY(-22px) scale(.9);opacity:0}
}
#terrace .fx.note{font-size:16px;opacity:.9;animation:noteup 2.6s ease-out forwards}
@keyframes noteup{
  0%{transform:translate(0,0) rotate(-15deg);opacity:0}
  15%{opacity:1}
  100%{transform:translate(var(--nx,20px),-150px) rotate(20deg);opacity:0}
}
/* 춤출 때 바닥에 도는 조명 — 바깥 상자로 잘라서 바닥 밖으로 새지 않게 한다 */
#terrace .disco{
  position:absolute;left:0;right:0;bottom:0;height:44%;z-index:0;pointer-events:none;overflow:hidden
}
#terrace .disco i{
  position:absolute;left:50%;top:50%;width:240%;aspect-ratio:1;margin:-120% 0 0 -120%;
  background:repeating-conic-gradient(from 0deg,rgba(255,140,190,.26) 0 12%,transparent 0 25%);
  animation:discospin 3.2s linear infinite
}
@keyframes discospin{to{transform:rotate(360deg)}}
@keyframes wob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
@keyframes stroll{from{transform:translateX(-50%) translateX(calc(var(--d) * -1))}to{transform:translateX(-50%) translateX(var(--d))}}
@keyframes mumble{
  0%,72%{opacity:0;transform:translateX(-50%) translateY(5px)}
  80%,94%{opacity:1;transform:translateX(-50%) translateY(-3px)}
  100%{opacity:0;transform:translateX(-50%) translateY(-3px)}}
@keyframes thop{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-24px) rotate(-8deg) scale(1.06)}
  50%{transform:translateY(0)}72%{transform:translateY(-11px) rotate(6deg)}100%{transform:translateY(0) rotate(0)}}
#terrace .fx{position:absolute;pointer-events:none;z-index:6}
#terrace .fx.ball{bottom:16px;font-size:26px;animation:ballroll 3.4s cubic-bezier(.4,0,.5,1) forwards}
#terrace .fx.bub{animation:bubup 3s ease-out forwards}
#terrace .fx.heart{font-size:20px;transform:translate(-50%,0);animation:heartup 1s ease-out forwards}
/* 굴러갔다가 오른쪽 끝에서 톡 튕겨 되돌아온다 (구르는 방향도 같이 바뀐다) */
@keyframes ballroll{
  0%  {left:-10%; transform:rotate(0)}
  46% {left:96%;  transform:rotate(1080deg)}
  54% {left:96%;  transform:rotate(1080deg)}
  100%{left:-10%; transform:rotate(0)}
}
@keyframes bubup{0%{transform:translateY(0) scale(.5);opacity:0}18%{opacity:.95}100%{transform:translateY(-190px) scale(1.2);opacity:0}}
@keyframes heartup{0%{transform:translate(-50%,0) scale(.4);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-56px) scale(1.15);opacity:0}}

/* 💌 햄쮜 편지 — 진짜 편지지처럼 줄이 그어진 종이 위에 손글씨 느낌으로 */
.letter{
  background:
    repeating-linear-gradient(#fffdf7 0 27px, #f6e3ea 27px 28px);
  border:2.5px solid var(--line); border-radius:16px; padding:12px 14px 14px;
  box-shadow:var(--sh); text-align:center
}
.letter .hs{width:76px;height:76px;margin:0 auto 4px;display:block}
.letter .body{font-size:14px;font-weight:700;line-height:28px;color:var(--ink);word-break:keep-all}
/* 인사말과 맺음말은 살짝 다른 색으로 — 「편지답게」 읽히도록 */
.letter .body .hi{color:var(--acc)}
.letter .body .by{display:block;margin-top:6px;color:var(--ink2)}
.letter .sign{margin-top:10px;font-size:11.5px;color:var(--ink2);text-align:right;line-height:28px}
.mailrow{
  display:flex;align-items:center;gap:9px;padding:7px 9px;margin-bottom:6px;cursor:pointer;
  background:var(--card);border:2px solid var(--line);border-radius:14px;box-shadow:var(--sh)
}
.mailrow.new{border-color:var(--acc);background:linear-gradient(#fff6f9,var(--card))}
.mailrow .hs{width:42px;height:42px;flex:0 0 42px;display:block}
.mailrow .info{flex:1;min-width:0;font-size:12.5px;line-height:1.5;text-align:left}
.mailrow .info .pv{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mailrow .em{font-size:19px}
/* 🎂 기념일 알림 줄 */
.annivrow{
  display:flex;align-items:center;gap:9px;padding:7px 9px;margin-top:6px;
  background:linear-gradient(#fff7e6,var(--card));border:2px solid #f0c65a;border-radius:14px;box-shadow:var(--sh)
}
.annivrow .hs{width:42px;height:42px;flex:0 0 42px;display:block}
.annivrow .info{flex:1;min-width:0;font-size:12.5px;line-height:1.5;text-align:left}
.toys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.toy{background:var(--card);border:2px solid var(--line);border-radius:13px;padding:6px 2px;text-align:center;cursor:pointer;box-shadow:var(--sh)}
.toy.on{border-color:var(--acc);box-shadow:0 0 0 3px #ffd9e4}
.toy .e{font-size:19px;line-height:1.15}
.toy .n{font-size:10px;font-weight:700;margin-top:1px;word-break:keep-all}
.toy .c{font-size:9px;color:var(--ink2)}
/* 놀이마다 하트가 얼마나 오르는지 — 안 적어두면 어느 놀이가 좋은지 알 길이 없다 */
.toy .h{font-size:9.5px;font-weight:800;color:var(--acc);line-height:1.4}
.toy:active{transform:translateY(1px)}
.toy.no{opacity:.5}

.slot{display:flex;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:14px;padding:6px 8px;margin-bottom:6px;background:#fffdfb;cursor:pointer}
.slot.on{border-style:solid}
.slot .hs{width:44px;height:44px;flex:0 0 44px}
.slot .ph{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:#fdeef2;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2)}
.slot .info{flex:1;min-width:0;font-size:12px}
/* 좁은 폰(360px)에서 「놀러 가기 ▸」 같은 꼬리말이 본문과 겹치지 않게 줄이지 않고 붙여 둔다 */
.slot > .muted{flex:0 0 auto;white-space:nowrap;font-size:10.5px}

/* ---------- 도감 ---------- */
.dexgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
/* 📖 도감 줄 세우기 — 통 50가지를 그냥 늘어놓으면 찾고 싶은 아이를 못 찾는다 */
.dexsort{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.dexsort button{
  font:inherit;font-size:10.5px;font-weight:700;line-height:1.4;padding:5px 2px;cursor:pointer;
  border:2px solid var(--line);background:var(--bg);color:var(--ink2);border-radius:11px;word-break:keep-all
}
.dexsort button.on{border-color:var(--acc);background:var(--card);color:var(--ink);box-shadow:0 0 0 2px #ffd9e4}
@media(min-width:430px){.dexgrid{grid-template-columns:repeat(5,1fr)}}
.dcard{border:2px solid var(--line);background:var(--card);border-radius:13px;padding:5px 3px;text-align:center;box-shadow:var(--sh);cursor:pointer;position:relative}
.dcard.lock{opacity:.5;filter:grayscale(.7)}
.dcard .hs{width:100%;aspect-ratio:1;display:block}
.dcard .nm{font-size:10px;font-weight:700;line-height:1.2;word-break:keep-all}
.dcard .st{position:absolute;left:3px;top:2px;font-size:8.5px;color:var(--gold);letter-spacing:-1.5px}
/* 🕵️탐정 힌트가 하트·짝꿍·특별 햄쮜를 물어보므로 카드에서 그것들이 보여야 한다.
   하트를 💗🤍 다섯 개로 늘어놓으면 카드가 좁아서 8px 밖에 안 되고, 🤍는 흰 카드에 묻혀
   아예 안 보인다 → 「💗3」 처럼 개수로 적고 글자를 키운다.
   카드가 아주 좁을 때 「💗」와 숫자가 두 줄로 쪼개지므로 nowrap 으로 한 줄에 붙여둔다. */
.dcard .ht{
  display:inline-block;margin-top:2px;font-size:12px;font-weight:800;line-height:1.4;
  white-space:nowrap;color:var(--ink);background:var(--line);border-radius:999px;padding:0 7px
}
.dcard .kd{position:absolute;left:3px;bottom:2px;font-size:9px;line-height:1;z-index:2}
.dcard .qm{font-size:30px;line-height:1.9;opacity:.35}
.dcard .chk{position:absolute;right:3px;top:1px;font-size:13px;z-index:2}
.dcard.g5{border-color:#e98cc8;background:linear-gradient(#fff0fa,#ffe4f4,#e9f2ff)}
.dcard.g4{border-color:#f0c65a;background:linear-gradient(#fffaeb,#fff3d4)}
.dcard.g3{border-color:#d3b6ec}

/* ---------- 카드 그리드 ---------- */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:7px}
.shopgrid.wide{grid-template-columns:repeat(auto-fill,minmax(152px,1fr))}
.scard{background:var(--card);border:2px solid var(--line);border-radius:15px;box-shadow:var(--sh);padding:7px 5px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.scard .ic{font-size:22px;line-height:1.1}
.scard .ic .hs{width:46px;height:46px;display:block}
.scard b{font-size:12px}
.scard .fx{font-size:10px;color:var(--ink2);line-height:1.45}
.scard .pr{font-size:11px;font-weight:700}
.scard.locked{opacity:.5}
.scard .btn{width:100%;margin-top:2px}

/* ---------- 🎯 오늘의 심부름 ---------- */
.errs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.errs>div{
  border:2px solid var(--line);border-radius:12px;background:#fff8fa;
  padding:6px 3px 5px;text-align:center;cursor:pointer;box-shadow:var(--sh)
}
.errs>div .e{display:block;font-size:19px;line-height:1.3}
.errs>div .t{display:block;font-size:9.5px;font-weight:800;line-height:1.25;word-break:keep-all}
.errs>div .p{display:block;font-size:9.5px;font-weight:800;color:var(--acc);margin-top:1px}
.errs>div.done{border-color:#7fc9a8;background:linear-gradient(#eefaf3,#fff6fa);cursor:default}
.errs>div.done .p{color:#3f9c74}
.errs>div:not(.done):active{transform:translateY(2px)}

/* ---------- 도장판 ---------- */
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.stamp{
  aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);background:#fff8fa;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;line-height:1
}
.stamp .d{font-size:8px;color:var(--ink2);font-weight:700;margin-top:1px}
.stamp.got{border-style:solid;border-color:#f0c65a;background:linear-gradient(#fffaeb,#ffeff6);box-shadow:var(--sh)}
.stamp.now{border-style:solid;border-color:var(--acc);background:#ffe6ee;animation:pls 1.1s ease-in-out infinite}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 컵 고르기 ----------
   숨은 햄쮜(.rev)는 컵(.body) 뒤에 겹쳐 두고, 맞히면 컵이 위로 떠오르며 사라진다. */
.cups{display:flex;gap:9px;justify-content:center;margin:12px 0 2px}
.cup{position:relative;width:31%;max-width:96px;cursor:pointer;text-align:center}
.cup .rev{
  position:absolute;left:50%;bottom:19px;width:58px;height:58px;margin-left:-29px;z-index:1;
  animation:revpop .5s .18s ease-out backwards
}
@keyframes revpop{from{transform:scale(.5) translateY(10px);opacity:0}to{transform:scale(1);opacity:1}}
.cup .body{
  position:relative;z-index:2;
  height:76px;border-radius:16px 16px 42% 42%/16px 16px 30px 30px;
  background:linear-gradient(#fffdfb,#ffe0ea);border:2.5px solid #f0a8c4;box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;font-size:27px;transition:transform .18s
}
.cup:active .body{transform:translateY(2px)}
.cup.up .body{animation:cupup .5s ease-out forwards}
@keyframes cupup{to{transform:translateY(-54px) rotate(-12deg);opacity:0}}
.cup .lb{font-size:10.5px;font-weight:700;margin-top:4px;color:var(--ink2);min-height:14px}

/* ---------- 🔔 주문 놀이 ----------
   콘 → 맛 → 토핑 순서로 아래에서 위로 쌓아 올린다(고른 것이 바로 그림에 붙는다).
   주문서 말풍선은 고르는 동안 계속 띄워 둔다 — 저학년은 외우게 하면 안 된다. */
.ord{text-align:center}
.ord .bub{
  display:inline-block;max-width:94%;background:#fff;border:2.5px solid var(--line);border-radius:15px;
  padding:8px 12px;font-size:12.5px;font-weight:700;line-height:1.7;box-shadow:var(--sh);position:relative
}
.ord .bub:after,.ord .bub:before{content:'';position:absolute;left:50%;border:8px solid transparent}
.ord .bub:before{bottom:-16px;margin-left:-8px;border-top-color:var(--line)}
.ord .bub:after{bottom:-12px;margin-left:-8px;border-top-color:#fff}
/* 🙈 기억 손님 — 주문서가 잠깐 뒤에 사라진다. 보통 손님과 한눈에 구별되어야 한다 */
.ord .bub.memo{border-color:var(--acc);background:linear-gradient(#fff6f9,#fff)}
.ord .bub.memo:before{border-top-color:var(--acc)}
.ord .bub.memo:after{border-top-color:#fff}
.ord .bub.hid{background:linear-gradient(#f6efff,#fff)}
.ord .who{width:70px;height:70px;display:inline-block;margin-top:11px;animation:wob 2.5s ease-in-out infinite alternate}
/* 손님 세 명 진행 칸 */
.ordbar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
/* 🎁특별 햄쮜 여섯 마리 — 3+3 으로 떨어지게 3칸 고정 */
.spgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ordbar>div{
  min-height:26px;border:2px dashed var(--line);border-radius:10px;background:#fff8fa;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink2)
}
.ordbar>div.now{border-style:solid;border-color:var(--acc);background:#ffeaf1;color:var(--acc);animation:pls 1.1s ease-in-out infinite}
.ordbar>div.done{border-style:solid;background:#fff3f7;color:var(--ink)}
.ordbar>div.done.h3{border-color:#f0c65a;background:linear-gradient(#fffaeb,#ffeff6)}
/* 만들고 있는 아이스크림 — .scard .ic 와 겹치지 않게 icec 로 따로 둔다 */
.icec{position:relative;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;margin-top:4px}
.icec>span{animation:icpop .34s ease-out}
.icec .tp{font-size:21px;line-height:1;margin-bottom:-7px;z-index:3}
.icec .sc{
  width:52px;height:46px;border-radius:50% 50% 46% 46%;z-index:2;margin-bottom:-10px;
  background:radial-gradient(circle at 34% 28%, var(--c2,#fff), var(--c,#ffa8c2) 74%);
  border:2px solid rgba(0,0,0,.06);box-shadow:inset -5px -6px 9px rgba(0,0,0,.10)
}
.icec .ph{
  font-size:11px;font-weight:700;color:var(--ink2);animation:none;line-height:1.5;
  border:2px dashed var(--line);border-radius:13px;padding:13px 15px;background:#fffafc
}
/* 콘 세 가지 — 와플콘·무지개콘은 삼각형, 예쁜 컵은 둥근 컵 */
.cone{display:block;position:relative;z-index:1;width:48px;height:54px;flex:0 0 auto}
.cone.waffle,.cone.rain{clip-path:polygon(3% 0,97% 0,50% 100%)}
.cone.waffle{background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 2px,transparent 2px 8px),
  repeating-linear-gradient(-45deg,rgba(140,88,36,.32) 0 2px,transparent 2px 8px),
  linear-gradient(#e9b77a,#c68c4c)}
.cone.rain{background:linear-gradient(90deg,#ff9fba 0 20%,#ffd98a 20% 40%,#a8e6a3 40% 60%,#9fd4f5 60% 80%,#cbaaf0 80% 100%)}
/* 예쁜 컵은 SVG 로 그린다 — 굽 달린 파르페 컵 */
.cone.cupc{height:58px;margin-top:4px;background:none;border:0;border-radius:0}
.cone.cupc svg{display:block;width:100%;height:100%;overflow:visible}
.cone.sm{width:30px;height:34px;margin:0 auto 3px}
.cone.cupc.sm{height:37px;margin:0 auto 1px}
@keyframes icpop{from{transform:scale(.4) translateY(-9px);opacity:0}to{transform:scale(1);opacity:1}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts button{
  background:var(--card);border:2px solid var(--line);border-radius:13px;padding:9px 2px 8px;
  font:inherit;font-size:10.5px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:var(--sh);
  word-break:keep-all;line-height:1.25;min-height:56px
}
.opts button .e{display:block;font-size:22px;line-height:1.25}
.opts button .sw{display:block;width:27px;height:27px;border-radius:50%;margin:1px auto 3px;border:2px solid rgba(0,0,0,.07)}
.opts button:active{transform:translateY(2px)}
.stepn{font-size:12px;font-weight:800;color:var(--acc);margin-top:10px;text-align:center}
.score{display:grid;gap:4px;margin-top:9px;font-size:11.5px}
.score div{display:flex;justify-content:space-between;gap:6px;background:#fff7fa;border:1.5px solid var(--line);border-radius:10px;padding:5px 9px}
.score div b{color:var(--acc)}
.score div.tot{background:#ffeaf1;border-color:var(--acc);font-weight:800;font-size:12.5px}

/* ---------- 🏆 꾸미기 대회 ---------- */
.runway{
  position:relative;border-radius:15px;overflow:hidden;padding:13px 8px 26px;text-align:center;
  background:linear-gradient(#fff4f9,#ffe0ec);border:2.5px solid var(--line);margin-top:2px
}
.runway .spot{
  position:absolute;left:50%;top:-46%;width:150%;aspect-ratio:1;margin-left:-75%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 60%)
}
.runway .rug{position:absolute;left:0;right:0;bottom:0;height:20px;
  background:repeating-linear-gradient(90deg,#f2a2c1 0 13px,#ffc4d9 13px 26px)}
.runway .hs{width:104px;height:104px;display:inline-block;position:relative;z-index:2;
  animation:wob 2.5s ease-in-out infinite alternate}
.runway .rk{position:relative;z-index:2;font-size:32px;line-height:1.2}
.runway .cap{position:relative;z-index:2;font-size:12.5px;font-weight:800;line-height:1.6}

/* ---------- 사진첩 ---------- */
.photo{background:#fff;border:2px solid var(--line);border-radius:13px;padding:7px 7px 5px;box-shadow:0 3px 0 #eed7de}
.photo .pic{
  position:relative;border-radius:10px;overflow:hidden;height:120px;
  display:flex;align-items:flex-end;justify-content:center;gap:1px;padding:0 5px 7px
}
.photo .pic .sky{position:absolute;inset:0}
.photo .pic .fl{position:absolute;left:0;right:0;bottom:0;height:36%}
.photo .pic .hs{width:54px;height:54px;position:relative;z-index:2;flex:0 0 auto}
.photo .pic .cn{position:absolute;font-size:13px;z-index:3;opacity:.9}
.photo .cap{font-size:11.5px;font-weight:700;text-align:center;margin-top:5px;line-height:1.3;word-break:keep-all}
.photo .dt{font-size:9px;color:var(--ink2);text-align:center}
.photo.sm{padding:4px 4px 3px;border-radius:10px;cursor:pointer}
.photo.sm .pic{height:62px;padding:0 2px 3px;border-radius:7px}
/* ⚠️ 작은 사진은 <b>줄어들 수 있어야</b> 한다 — 여섯 마리가 찍힌 사진이
   27px×6 을 그대로 차지하면 3칸짜리 사진첩이 창보다 넓어진다(372/353).
   flex 로 줄이면 그림은 비율을 지킨 채 작아진다. */
.photo.sm .pic .hs{width:27px;aspect-ratio:1;height:auto;flex:0 1 auto;min-width:0}
.photo.sm .pic .cn{font-size:8px}
.photo.sm .cap{font-size:8.5px;margin-top:2px}
.photo.sm .dt{font-size:7px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.album>*{min-width:0}
.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.frames div{
  border:2px solid var(--line);background:var(--card);border-radius:12px;padding:5px 2px;text-align:center;
  font-size:10.5px;font-weight:700;cursor:pointer;box-shadow:var(--sh)
}
.frames div.on{border-color:var(--acc);background:#ffeaf1;color:var(--acc)}
.frames div .e{display:block;font-size:18px;line-height:1.2}
/* 테라스 오른쪽 위 작은 버튼 두 개 — 카드를 늘리지 않고 그림에서 바로 누르게 한다 */
#photocam,#tthemebtn{
  position:absolute;right:8px;z-index:10;cursor:pointer;
  background:rgba(255,255,255,.9);border:2px solid #f3d0dc;border-radius:12px;
  font-size:17px;line-height:1;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center
}
#photocam{top:38px}
#tthemebtn{top:81px}

/* ---------- 꾸미기(옷장) ---------- */
.wprev{
  width:150px;height:150px;margin:0 auto 4px;position:relative;
  background:radial-gradient(circle at 50% 62%, #fff 0 46%, #ffeef4 47%, #ffe3ec 72%, transparent 74%);
}
.wprev .hs{width:100%;height:100%}
.wprev .sp{position:absolute;font-size:14px;animation:twk 1.6s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.wrow{display:flex;gap:5px;margin-bottom:8px}
.wrow div{
  flex:1;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:12px;
  padding:5px 2px;font-size:11px;font-weight:700;cursor:pointer;box-shadow:var(--sh)
}
.wrow div.on{border-color:var(--acc);background:#ffeaf1;color:var(--acc)}
.wrow div .e{font-size:17px;display:block;line-height:1.2}
.wpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:430px){.wpick{grid-template-columns:repeat(4,1fr)}}
.wpick .it{
  border:2px solid var(--line);background:var(--card);border-radius:13px;padding:5px 3px;text-align:center;
  box-shadow:var(--sh);cursor:pointer;position:relative
}
.wpick .it.on{border-color:var(--acc);background:#ffeaf1;box-shadow:0 0 0 3px #ffd9e4}
.wpick .it.no{opacity:.55}
.wpick .it .e{font-size:24px;line-height:1.25}
.wpick .it .n{font-size:10px;font-weight:700;word-break:keep-all;line-height:1.2}
.wpick .it .p{font-size:10px;color:var(--ink2);font-weight:700}
.wpick .it .chk{position:absolute;right:3px;top:1px;font-size:11px}

/* ---------- 💞 믹스쮜 ---------- */
.mixrow{display:flex;align-items:center;justify-content:center;gap:4px}
.mslot{
  flex:1;max-width:92px;text-align:center;border:2px dashed var(--line);border-radius:14px;
  background:#fffdfb;padding:6px 3px
}
.mslot.on{border-style:solid;border-color:var(--acc);background:#fff2f6}
.mslot .hs{width:100%;aspect-ratio:1;display:block}
.mslot .ph{display:block;font-size:26px;color:var(--ink2);line-height:1.5}
.mslot b{display:block;font-size:10px;word-break:keep-all;line-height:1.2;margin-top:1px}
.mplus{font-size:15px;color:var(--ink2);flex:none}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
@media(min-width:430px){.mgrid{grid-template-columns:repeat(6,1fr)}}
.mpick{
  border:2px solid var(--line);background:var(--card);border-radius:11px;padding:3px 1px;
  text-align:center;cursor:pointer;position:relative
}
.mpick.on{border-color:var(--acc);background:#ffeaf1;box-shadow:0 0 0 3px #ffd9e4}
.mpick .hs{width:100%;aspect-ratio:1;display:block}
.mpick .nm{font-size:8.5px;font-weight:700;line-height:1.15;word-break:keep-all}
.mpick .ht{font-size:8px;color:var(--ink2)}
.mixgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:430px){.mixgrid{grid-template-columns:repeat(5,1fr)}}
.mcard{
  border:2px solid #e8c6ea;background:linear-gradient(#fff8fd,#ffeef8);border-radius:13px;
  padding:5px 3px;text-align:center;box-shadow:var(--sh);cursor:pointer;position:relative
}
.mcard .hs{width:100%;aspect-ratio:1;display:block}
.mcard .nm{font-size:9.5px;font-weight:700;line-height:1.2;word-break:keep-all}
.mcard .st{position:absolute;left:3px;top:2px;font-size:8.5px;color:var(--gold);letter-spacing:-1.5px}

/* ---------- 스티커 ---------- */
.stkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:430px){.stkgrid{grid-template-columns:repeat(5,1fr)}}
.stk{
  border:2px dashed var(--line);border-radius:14px;background:#fff8fa;padding:6px 3px;text-align:center;
  opacity:.5;filter:grayscale(.8)
}
.stk.got{
  border-style:solid;border-color:#f0c65a;background:linear-gradient(#fffaeb,#ffeff6);opacity:1;filter:none;
  box-shadow:var(--sh);transform:rotate(-2deg)
}
.stk.got:nth-child(even){transform:rotate(2deg)}
.stk .e{font-size:23px;line-height:1.3}
.stk .n{font-size:9.5px;font-weight:700;word-break:keep-all;line-height:1.2}

/* ---------- 하단 탭 ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:2px;background:var(--card);border-top:2px solid var(--line);box-shadow:0 -3px 12px rgba(160,110,130,.10);
  padding:4px calc(4px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left))}
nav button{flex:1;max-width:130px;border:0;background:none;font:inherit;font-size:11px;font-weight:700;color:var(--ink2);padding:6px 0 5px;border-radius:12px;cursor:pointer;line-height:1.15;position:relative;min-height:48px}
nav button i{display:block;font-size:22px;font-style:normal;margin-bottom:1px;height:26px;line-height:26px}
nav button.on{color:var(--acc);background:#fdeef2;font-weight:700}
nav .dot{position:absolute;top:5px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--no);box-shadow:0 0 0 2px #fff;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- 모달 / 토스트 ---------- */
#veil{position:fixed;inset:0;background:rgba(80,50,60,.42);z-index:100;display:none;align-items:flex-end;justify-content:center}
#veil.on{display:flex}
#modal{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(120,70,90,.22);animation:up .22s ease-out;
  padding:12px 11px calc(22px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}
#modal h2{margin:0 0 9px;font-size:17px;display:flex;align-items:center;gap:6px}
/* 「닫기」도 손가락으로 누를 수 있게 넉넉히 — 글자만 작으면 아이가 못 닫는다 */
#modal h2 .x{
  margin-left:auto;margin-right:-6px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;
  background:#fdeef2;border:1.5px solid var(--line);border-radius:11px;
  min-width:52px;min-height:38px;display:flex;align-items:center;justify-content:center;flex:none
}
/* 🍨 여러 마리를 한꺼번에 떴을 때의 요약 — 50마리를 하나씩 세지 않아도 알 수 있게 */
.rsum{background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:8px 10px;margin-bottom:8px;box-shadow:var(--sh)}
.rsum .chips{display:flex;flex-wrap:wrap;gap:5px}
.rsum .line{margin-top:6px;font-size:13px;color:var(--ink2)}
.rsum .line b{color:var(--ink)}
.rsum .up{margin-top:6px;font-size:13.5px;font-weight:700;color:var(--acc);word-break:keep-all}
.rchip{display:inline-block;font-size:11.5px;font-weight:700;line-height:1.9;white-space:nowrap;
  padding:0 8px;border-radius:999px;border:2px solid var(--line);background:var(--bg)}
.rchip.c5{border-color:#e98cc8;background:linear-gradient(#fff0fa,#ffe4f4)}
.rchip.c4{border-color:#f0c65a;background:#fffaeb}
.rchip.c3{border-color:#d3b6ec}
.reslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.rcard{border:2px solid var(--line);background:var(--card);border-radius:13px;padding:4px 2px;text-align:center;box-shadow:var(--sh)}

/* 오늘 날짜 — 하루에 한 번짜리 기능들이 쓴다 */
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
/* 날짜만 바뀌면 값이 바뀌는 씨앗 — 하루 종일 같은 것을 뽑게 할 때 쓴다 */
function daySeed(){ const d=new Date(); return d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate(); }
function dateLabel(t){ const d=new Date(t); return `${d.getMonth()+1}월 ${d.getDate()}일`; }
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rnd=(a,b)=>Math.random()*(b-a)+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function wpick(w){
  let t=0; for(const k in w) t+=w[k];
  let r=Math.random()*t;
  for(const k in w){ r-=w[k]; if(r<=0) return k; }
  return Object.keys(w)[0];
}
/* ---------- 조사 붙이기 ----------
   이름 끝 글자의 받침을 보고 을/를 · 은/는 · 이/가 · 으로/로 를 골라 준다.
   아이가 읽는 글에 「곰인형 을(를)」 같은 게 나오면 안 된다.
   <b> 같은 태그는 빼고 마지막 글자를 본다 — 조사는 태그 밖에 붙는다. */
function jong(s){
  s=String(s).replace(/<[^>]*>/g,'').trim();
  if(!s) return false;
  const c=s.charCodeAt(s.length-1)-0xac00;
  if(c>=0 && c<11172) return (c%28)!==0;          /* 한글 — 받침이 있으면 true */
  return /[013678lmnr]$/i.test(s);                /* 숫자·영문은 흔한 경우만 */
}
function eul (s){ return s+(jong(s)?'을':'를'); }
function eun (s){ return s+(jong(s)?'은':'는'); }
function ega (s){ return s+(jong(s)?'이':'가'); }
/* 으로/로 만 규칙이 하나 더 있다 — ㄹ 받침은 「로」 (하늘로, 서울로) */
function wagwa(s){ return s+(jong(s)?'과':'와'); }
function euro(s){
  const t=String(s).replace(/<[^>]*>/g,'').trim();
  const c=t.charCodeAt(t.length-1)-0xac00;
  if(c>=0 && c<11172 && c%28===8) return s+'로';
  return s+(jong(s)?'으로':'로');
}
/* 30초·2분처럼 아이가 읽기 쉬운 단위로 */
function cdLabel(ms){
  const sec=Math.round(ms/1000);
  return sec>=60 ? (sec%60?(sec/60).toFixed(1).replace('.0',''):sec/60)+'분마다' : sec+'초마다';
}
function fmt(n){
  n=Math.floor(n);
  /* 소수점 뒤의 0 만 지운다 — 예전엔 정수 끝의 0 까지 지워서 300만이 「3만」으로 나왔다 */
  const cut=t=>t.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
  if(n>=100000000) return cut((n/100000000).toFixed(2))+'억';
  if(n>=10000) return cut((n/10000).toFixed(n>=100000?0:2))+'만';
  return n.toLocaleString('ko-KR');
}
function toast(msg){
  const t=$('#toast'), d=document.createElement('div');
  d.innerHTML=msg; t.appendChild(d);
  setTimeout(()=>d.remove(),2100);
  while(t.children.length>3) t.firstChild.remove();
}
function popAt(x,y,txt){
  const d=document.createElement('div');
  d.className='pop'; d.textContent=txt; d.style.left=x+'px'; d.style.top=y+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),820);
}

/* ---------- 소리 ----------
   파일 없이 브라우저가 직접 소리를 만든다(WebAudio). 전부 작고 부드러운 소리. */
let AC=null;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } }
  if(AC && AC.state==='suspended') AC.resume();
  return AC||null;
}
function note(f,at,dur,vol,type){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  const t=a.currentTime+at;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}

  nw   :()=>[0,.10,.20,.32].forEach((t,i)=>note([784,988,1175,1568][i],t,.22,.10,'triangle')),

  tune :()=>{ [523,659,784,659,523,784,1047].forEach((f,i)=>note(f, i*0.16, .15, .07, 'triangle')); },
  boo  :()=>{ note(300,0,.14,.08,'sine'); note(220,.12,.18,.07,'sine'); }

function sfx(k){ if(S&&S.snd===false) return; const f=SFX[k]; if(f) try{ f(); }catch(e){} }

/* ==================================================================
   💞 합체 모양 — 짝꿍 햄쮜는 색만 섞는 게 아니라 「특징만 모아」 한 마리로 만든다.
   몸은 첫째 아이 것 하나로 매끈하게 가고, 둘째 아이는 **귀 · 장식 · 품에 안은 작은 표식**으로 얹는다.
   전에는 세로로 반씩 잘라 붙였는데 가운데 이음매가 그대로 보여서 「이상하다」는 말을 들었다 —
   한 마리로 안 보이고 두 마리를 붙여놓은 것 같았다. 지금은 어디까지나 한 마리인데
   귀 모양과 무늬, 그리고 안고 있는 작은 열매로 둘째 아이가 누구인지 보인다.
   만든 모양은 SHAPES·ANCHOR 에 그대로 등록한다 — 그래야 도감·꾸미기·사진첩이
   보통 모양과 똑같이 다룬다(모자 자리까지 포함해서).
================================================================== */
function mixShapeKey(sa,sb){ return 'mx_'+sa+'_'+sb; }
function ensureMixShape(sa,sb){
  const key=mixShapeKey(sa,sb);
  if(SHAPES[key]) return key;

const WEAR_SLOTS=Object.keys(WEAR);
function ownWear(slot,key){ return (S.closet||[]).includes(slot+'_'+key); }
function wearOf(k){ const d=S.dex[k]; return (d&&d.w)||{}; }
function wearCount(k){ const w=wearOf(k); return WEAR_SLOTS.filter(s=>w[s]).length; }
function isFullSet(k){ return ['hat','neck','hand'].every(s=>wearOf(k)[s]); }
function dressedCount(){ return Object.keys(S.dex).filter(k=>wearCount(k)>0).length; }
/* 소품 그림 조각 */
function wearSVG(h,w){
  if(!w) return '';
  const sh=SHAPES[h.shape], F=sh.face, A=ANCHOR[h.shape]||{}; let g='';
  if(w.neck && WEAR.neck.items[w.neck]) g+=WEAR.neck.items[w.neck].d(F.x, F.y+23*F.s, Math.min(sh.w,24));
  if(w.hand && WEAR.hand.items[w.hand]){
    const a=A.hand||{x:80,y:74};
    g+=WEAR.hand.items[w.hand].d(a.x,a.y);
  }
  if(w.hat && WEAR.hat.items[w.hat]){
    const a=A.hat||{x:F.x,y:sh.top};
    g+=`<g transform="translate(${a.x},${a.y})${a.s?` scale(${a.s})`:''}">${WEAR.hat.items[w.hat].d()}</g>`;
  }
  /* 🍨 콘은 여기서 그리지 않는다 — 햄쮜가 콘 「위에 올라타는」 것이라 buildHamSVG 에서 몸 전체를 올려놓는다 */
  return g;
}

/* 햄쮜 그림은 같은 조합이면 결과가 똑같다 — 한 번 만든 그림은 모아두고 다시 쓴다.
   도감·사진첩·상점처럼 한 화면에서 수십 개를 그리는 곳이 눈에 띄게 빨라진다. */
let _uid=0;
const _svgCache=new Map();
const SVG_CACHE_MAX=800;
function hamKey(h){
  const w=h.wear||{};
  /* ⚠️ baby(아기 크기)를 열쇠에 꼭 넣어야 한다 — 안 넣으면 아기와 다 큰 아이가
     같은 그림을 캐시에서 나눠 쓰게 되어, 자라도 그림이 안 바뀐다. */
  return h.shape+'|'+h.color+'|'+h.pattern+'|'+h.grade+'|'+(h.cone||'')+'|'+(w.hat||'')+'|'+(w.neck||'')+'|'+(w.hand||'')+'|'+(w.cone||'')+'|'+(h.mood||'')+'|'+(h.baby||'');
}
function hamSVG(h){
  const k=hamKey(h);
  let v=_svgCache.get(k);
  if(v===undefined){
    v=buildHamSVG(h);
    if(_svgCache.size>=SVG_CACHE_MAX) _svgCache.clear();
    _svgCache.set(k,v);
  }
  return v;
}
function buildHamSVG(h){
  const sh=SHAPES[h.shape], c=h.colorObj||COLORS[h.color], F=sh.face;
  const id='hc'+(++_uid);
  const fx=F.x, fy=F.y, s=F.s;
  let g='';

  if(h.grade>=5) g+=`<circle cx="50" cy="54" r="48" fill="#ffd0ea" opacity=".5"/><circle cx="50" cy="54" r="44" fill="#cfe6ff" opacity=".45"/>`;
  if(h.grade===4) g+=`<circle cx="50" cy="54" r="46" fill="#ffe9a8" opacity=".45"/>`;
  if(h.grade>=3) g+=`<circle cx="50" cy="54" r="44" fill="${c.light}" opacity=".35"/>`;

  if(sh.tail) g+=`<path d="M82 78 q10 1 8 9" stroke="${c.dark}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  if(sh.feet) g+=`<ellipse cx="${fx-15}" cy="87" rx="8" ry="5" fill="${c.dark}" opacity=".55"/><ellipse cx="${fx+15}" cy="87" rx="8" ry="5" fill="${c.dark}" opacity=".55"/>`;

  /* 여러 도형을 합친 모양(구름)은 확대 복사본을 뒤에 깔아 윤곽선을 만든다 */
  if(sh.grp) g+=`<g transform="translate(50,58) scale(1.05) translate(-50,-58)" opacity=".34">${sh.body(`fill="${c.dark}"`)}</g>`;

  g+=sh.ears(c);
  g+=sh.body(`fill="${c.base}" ${sh.grp?'':`stroke="${c.dark}" stroke-width="2" stroke-opacity=".4"`}`);
  /* 무늬와 반짝임을 몸통 안쪽에만 칠하는 틀.
     ⚠️ <clipPath> 는 <g> 를 무시한다 — 구름·거품·합체처럼 여러 도형을 묶은 몸통은
     무늬가 통째로 사라진다. 그런 모양(grp)만 <mask> 로 오려낸다(<mask> 는 <g> 를 받아준다). */
  const useMask=!!sh.grp;
  if(useMask) g+=`<mask id="${id}" maskUnits="userSpaceOnUse" x="-8" y="-8" width="116" height="116">${sh.body('fill="#fff"')}</mask>`;
  else        g+=`<clipPath id="${id}">${sh.body('')}</clipPath>`;
  const inside=useMask?`mask="url(#${id})"`:`clip-path="url(#${id})"`;

  let p='';
  if(h.pattern==='spot'){
    p=`<circle cx="${fx-22}" cy="${fy-14}" r="7" fill="${c.dark}" opacity=".45"/>
       <circle cx="${fx+24}" cy="${fy+2}" r="9" fill="${c.dark}" opacity=".4"/>
       <circle cx="${fx+4}"  cy="${fy+26}" r="6" fill="${c.dark}" opacity=".35"/>`;
  }else if(h.pattern==='stripe'){
    p=`<rect x="0" y="${fy-18}" width="100" height="7" fill="${c.dark}" opacity=".34"/>
       <rect x="0" y="${fy+4}"  width="100" height="7" fill="${c.dark}" opacity=".3"/>
       <rect x="0" y="${fy+26}" width="100" height="7" fill="${c.dark}" opacity=".26"/>`;
  }else if(h.pattern==='patch'){
    p=`<ellipse cx="${fx-13}" cy="${fy-2}" rx="17" ry="15" fill="${c.dark}" opacity=".42"/>`;
  }else if(h.pattern==='tux'){
    p=`<ellipse cx="${fx}" cy="${fy+34}" rx="42" ry="26" fill="${c.light}"/>`;
  }else if(h.pattern==='socks'){
    p=`<rect x="0" y="76" width="100" height="30" fill="${c.light}"/>`;
  }
  if(p) g+=`<g ${inside}>${p}</g>`;

  if(sh.shine) g+=`<g ${inside}><ellipse cx="${fx-14}" cy="${fy-22}" rx="11" ry="7" fill="#fff" opacity=".5" transform="rotate(-20 ${fx-14} ${fy-22})"/></g>`;

  /* 모양마다 붙는 장식 — 몸통·무늬 위, 얼굴 아래 (고양이 수염 · 푸딩 카라멜 · 보석 면) */
  if(sh.deco) g+=sh.deco(c,fx,fy,s);

  g+=`<ellipse cx="${fx}" cy="${fy+9*s}" rx="${14*s}" ry="${10*s}" fill="${c.light}"/>`;
  /* 😊 표정 — 그 아이한테 방금 무슨 일이 있었는지가 얼굴에 그대로 나온다.
     😊웃는 눈(방금 놀아줌) · 😴감은 눈(낮잠) · 😋오물오물(간식). */
  const er=4.8*s, ex=10.5*s, m=h.mood||'';
  g+=`<ellipse cx="${fx-21*s}" cy="${fy+8*s}" rx="${6*s}" ry="${3.6*s}" fill="${c.cheek}" opacity=".7"/>
      <ellipse cx="${fx+21*s}" cy="${fy+8*s}" rx="${6*s}" ry="${3.6*s}" fill="${c.cheek}" opacity=".7"/>`;

  const arc=(cx,dy,down)=>`<path d="M${cx-er} ${fy+dy} q${er} ${down?er*1.25:-er*1.4} ${er*2} 0"/>`;
  if(m==='sleep'){
    /* 아래로 휜 선 두 개 = 감은 눈 */
    g+=`<g stroke="#3d3450" stroke-width="${2.3*s}" fill="none" stroke-linecap="round">
          ${arc(fx-ex,0,true)}${arc(fx+ex,0,true)}</g>`;
  }else if(m==='happy'||m==='yum'){
    g+=`<g stroke="#3d3450" stroke-width="${2.3*s}" fill="none" stroke-linecap="round">
          ${arc(fx-ex,er*0.55,false)}${arc(fx+ex,er*0.55,false)}</g>`;
  }else{
    g+=`<circle cx="${fx-ex}" cy="${fy}" r="${er}" fill="#3d3450"/><circle cx="${fx+ex}" cy="${fy}" r="${er}" fill="#3d3450"/>
        <circle cx="${fx-9*s}" cy="${fy-1.7*s}" r="${1.6*s}" fill="#fff"/><circle cx="${fx+12*s}" cy="${fy-1.7*s}" r="${1.6*s}" fill="#fff"/>`;
  }

  g+=`<ellipse cx="${fx}" cy="${fy+7*s}" rx="${3.4*s}" ry="${2.6*s}" fill="#d98a9c"/>`;
  if(m==='sleep'){
    /* 콜콜 자는 입 — 작고 동그랗게 */
    g+=`<ellipse cx="${fx}" cy="${fy+12*s}" rx="${2.6*s}" ry="${3.2*s}" fill="${c.dark}" opacity=".55"/>`;
  }else if(m==='yum'){
    /* 오물오물 — 볼록한 입에 혀 한 점 */
    g+=`<path d="M${fx-6*s} ${fy+10.5*s} q${6*s} ${6.5*s} ${12*s} 0 q${-6*s} ${2.4*s} ${-12*s} 0 z" fill="${c.dark}" opacity=".6"/>
        <ellipse cx="${fx}" cy="${fy+13*s}" rx="${2.6*s}" ry="${1.7*s}" fill="#f19aae"/>`;
  }else if(m==='happy'){
    /* 활짝 웃는 입 */
    g+=`<path d="M${fx-7.5*s} ${fy+10*s} q${7.5*s} ${8*s} ${15*s} 0"
              stroke="${c.dark}" stroke-width="${2.2*s}" fill="none" stroke-linecap="round"/>`;
  }else{
    g+=`<path d="M${fx} ${fy+10*s} q${-4*s} ${5*s} ${-8*s} ${1.6*s} M${fx} ${fy+10*s} q${4*s} ${5*s} ${8*s} ${1.6*s}"
              stroke="${c.dark}" stroke-width="${2*s}" fill="none" stroke-linecap="round"/>`;
  }

  /* ⭐ 등급 장식은 몸에 아무것도 붙이지 않는다 — 꾸미기 아이템을 가리지 않게.
     등급은 뒤에 깔린 은은한 후광과 화면에 적히는 ★ 글자로만 보여준다. */

  /* 꾸미기 소품 */
  g+=wearSVG(h,h.wear);

  /* 🍨 콘 타기 — 햄쮜가 아이스크림 한 스쿱이 되어 콘 위에 올라앉는다.
     몸(소품까지 전부)을 한 덩어리로 줄여서 위로 올리고, 그 아래에 큰 콘을 그린다.
     콘은 반드시 몸보다 **먼저**(뒤에) 그린다 — 나중에 그리면 콘 테두리가 햄쮜를 덮어서
     「콘이 위에서 햄쮜를 누르는」 것처럼 보인다. 진짜 아이스크림도 스쿱이 테두리를 가린다. */
  const cw=h.wear&&h.wear.cone, ci=cw&&WEAR.cone.items[cw];
  if(ci){
    const hy=ci.hy||34, hs=ci.hs||0.68;
    g=ci.art(h.cone||'#ffe0ec')
      + `<g transform="translate(50,${hy}) scale(${hs}) translate(-50,-50)">${g}</g>`;
  }

  /* 🥚 아기 햄쮜 — 몸을 통째로 줄인다. 발밑(50,92)을 기준으로 줄여야
     바닥에 발을 붙인 채로 작아진다(가운데를 기준으로 줄이면 공중에 뜬다). */
  if(h.baby && h.baby<1){
    g=`<g transform="translate(50,92) scale(${h.baby}) translate(-50,-92)">${g}</g>`;
  }

}

const FL={}; const FKEYS=[]; const NTUB=FLAVORS.length;
/* 🍰 첫 진열장(Lv.20까지)이 몇 가지인지 — 「두 번째 진열장」 스티커의 기준이 된다.
   숫자 50을 그냥 적어두면 나중에 통을 더 넣을 때 어긋난다. */
const NTUB1=FLAVORS.filter(f=>f.lv<=20).length;
/* 🥕 두 번째 진열장까지가 몇 가지인지 — 「세 번째 진열장」 스티커의 기준 */
const NTUB2=FLAVORS.filter(f=>f.lv<=40).length;
{
  /* 통 값은 순서(index) 대신 「열리는 레벨 + 그 레벨에서 몇 번째인지」로 정한다.
     이러면 통을 새로 끼워 넣어도 이미 있던 통의 값이 흔들리지 않는다.
     레벨이 오를수록 값이 뛰지만 Lv.13 을 넘으면 완만해진다 — 안 그러면 뒤쪽 통을 살 수가 없다. */
  const nth={}, baseAt={}, stepAt={}; let base=160;
  for(let lv=2; lv<=40; lv++){ baseAt[lv]=base; stepAt[lv]=(lv<13?1.62:1.29); base*=stepAt[lv]; }
  /* 🥕 세 번째 진열장(Lv.41~)은 위 곡선을 그대로 이으면 통 하나가 수백억이 된다.
     여기서부터는 따로 깐다 — Lv.41 통이 5백만, 레벨마다 1.18배. */
  base=5000000;
  for(let lv=41; lv<=70; lv++){ baseAt[lv]=base; stepAt[lv]=1.18; base*=stepAt[lv]; }
  FLAVORS.forEach((f,i)=>{
    f.i=i; FL[f.k]=f; FKEYS.push(f.k);
    /* 같은 레벨 안에서는 다음 레벨 값까지를 셋으로 나눠 쓴다 — 값이 뒤집히지 않게 */
    const n=(nth[f.lv]=(nth[f.lv]||0)+1)-1;
    if(f.lv>1 && !f.top) f.coin=Math.round(baseAt[f.lv]*Math.pow(stepAt[f.lv],n/3)/10)*10;
    f.scoop=14+Math.round(Math.pow(f.lv,1.42)*5.4)+(f.lv>1?n*6:0);   /* 처음 주는 통 넷은 값이 같다 */
    /* 🍰 두 번째 진열장(Lv.21~40)은 뜨는 값이 자릿수부터 다르다.
       Lv.20 까지 다 모으고 나면 시간당 수백만이 들어오는데 뜨는 값이 수백 원이라
       코인이 쓸 데 없이 쌓이기만 했다. 여기서부터는 「모아서 쓰는 것」이 된다. */
    if(f.lv>40){
      /* 🥕 세 번째 진열장 — 1.32배씩 계속 뛰면 Lv.65 통은 한 번 뜨는 데 이천만이 넘는다.
         벌이는 (1+레벨*0.08) 로 완만하게만 늘어나므로 뜨는 값도 완만하게 올린다. */
      f.scoop=Math.round((380000+n*40000)*Math.pow(1.055, f.lv-41));
    }else if(f.lv>20) f.scoop=Math.round(f.scoop*Math.pow(1.32, f.lv-20));
  });
}
function scoopCost(f){ return Math.max(6, Math.round(f.scoop*(1-upgLv('spoon')*0.08))); }

  {dn:'냉장고',   lv:20, fridge:1},

function nextRoom(){

/* 방 한 칸을 꺼낸다 — 없으면 그때 만든다 */
function room(i){
  if(i===undefined) i=S.room|0;
  if(!Array.isArray(S.rooms)) S.rooms=[];
  if(!S.rooms[i]) S.rooms[i]={name:'', theme:'day', seat:[]};
  const r=S.rooms[i];
  if(!Array.isArray(r.seat)) r.seat=[];
  while(r.seat.length<seats()) r.seat.push(null);
  if(typeof r.name!=='string') r.name='';
  if(!THEMES[r.theme]) r.theme='day';
  /* 놓은 가구 — 없어진 가구나 자리에 안 맞는 가구(벽 것을 바닥에)는 치운다 */
  if(!r.spot || typeof r.spot!=='object') r.spot={};
  spotsOf(i).forEach(sp=>{
    const v=r.spot[sp.k];
    if(v && (!FURN[v] || FURN[v].kind!==sp.kind || !haveFurn(v))) r.spot[sp.k]=null;
  });
  /* 자리 한도 밖에 남은 햄쮜는 앞으로 당겨온다 — 안 그러면 화면에 안 보이는데
     다른 방으로도 못 옮기는 미아가 된다 */
  for(let j=seats(); j<r.seat.length; j++){
    const k=r.seat[j]; if(!k) continue;
    r.seat[j]=null;
    const free=r.seat.slice(0,seats()).indexOf(null);
    if(free>=0) r.seat[free]=k;
  }
  if(r.seat.length>seats()) r.seat.length=seats();   /* 남은 빈 칸은 잘라낸다 */
  return r;
}
function roomName(i){ if(i===undefined) i=S.room|0; return room(i).name || ROOMS[i].dn; }

   자리를 비워버리면 돌아왔을 때 남의 자리에 앉게 된다. */
function roomHams(i){ return room(i).seat.slice(0,seats()).filter(k=>k&&S.dex[k]&&!onTrip(k)); }

  if(tripFree()<=0){ toast('🎒 소풍 자리가 다 찼어요 — 🛒상점의 <b>소풍 가방</b>을 올려보세요'); return openTrip(); }
  const pool=tripPool();
  if(!pool.length){
    return openModal(`<h2>🎒 소풍 보내기<span class="x" onclick="closeModal()">닫기</span></h2>
      <div class="muted" style="text-align:center;line-height:1.8;padding:12px 0">
        소풍은 <b>🏠놀이방에 앉아 있는 햄쮜</b>가 갈 수 있어요.<br>
        ${tripOn()?'지금은 다들 소풍을 나가 있네요! 돌아오면 또 보내요 🥰':'먼저 방에 햄쮜를 앉혀주세요 🪑'}</div>
      <div class="row" style="justify-content:center">
        <button class="btn" onclick="closeModal();go('play')">🏠 놀이방으로</button>
        <button class="btn w" onclick="openTrip()">뒤로</button></div>`);
  }
  _tp.who=(_tp.who||[]).filter(k=>pool.indexOf(k)>=0);
  if(!_tp.k || !tripOpen(tripOf(_tp.k))) _tp.k=(TRIPS.filter(tripOpen).pop()||TRIPS[0]).k;
  const cur=tripOf(_tp.k);
  const n=_tp.who.length||1;
  openModal(`<h2>🎒 소풍 보내기<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="muted" style="margin-bottom:8px;line-height:1.7">
      햄쮜를 <b>${TRIP_MAX}마리까지</b> 골라 소풍을 보내요. 시간이 지나면 🪙🍒<b>선물</b>과
      <b>편지</b>를 갖고 돌아와요 💌<br>
      소풍 간 아이는 그동안 <b>방에 없어요</b> — 대신 다녀오면 <b>훌쩍 친해져</b> 있답니다 💗
      같이 간 아이들끼리도 <b>👯가까워져요</b>.</div>
    <div class="card" style="margin:0">
      <h3>🗺️ 어디로 갈까요?</h3>
      ${TRIPS.map(t=>{
        const ok=tripOpen(t);
        return `<div class="slot ${_tp.k===t.k?'on':''}" style="${ok?'':'opacity:.5'}"
                    onclick="${ok?`tripDest('${t.k}')`:`toast('가게 Lv.${t.lv} 부터 갈 수 있어요')`}">
          <span class="ph">${ok?t.em:'🔒'}</span>
          <div class="info"><b>${t.n}</b> <span class="muted">${ok?tripWait(t.min*60000):'Lv.'+t.lv+' 부터'}</span>
            <div class="muted">${t.d}</div></div>
          <span class="muted">${_tp.k===t.k?'✅':'고르기 ▸'}</span></div>`;
      }).join('')}
    </div>
    <div class="card" style="margin:9px 0 0">
      <h3>🐹 누가 갈까요? <small>${_tp.who.length}/${TRIP_MAX}마리</small></h3>
      <div class="shopgrid wide">${pool.map(k=>{
        const on=_tp.who.indexOf(k)>=0;
        return `<div class="scard" style="${on?'border-color:var(--acc);background:#ffeaf1':''}"
                    onclick="tripToggle('${k}')">
          <span class="ic">${hamPic(hamOf(k))}</span>
          <b>${on?'✅ ':''}${nameOf(k)}</b>
          <span class="fx">${heartStr(k)}</span>
        </div>`;
      }).join('')}</div>
    </div>
    <div class="card" style="margin:9px 0 0;text-align:center;font-size:13px;line-height:1.8">
      ${cur.em} <b>${cur.n}</b> · ⏳ ${tripWait(cur.min*60000)} · 🐹 ${_tp.who.length||'0'}마리<br>
      <span class="muted">돌아오면 <b>🪙+${fmt(tripPay(cur,n).coin)}</b> · <b>🍒+${tripPay(cur,n).top}</b> ·
        간 아이들 <b>💗+${cur.bond}</b>씩</span>
    </div>
    <div class="row" style="justify-content:center;margin-top:11px">
      <button class="btn ${_tp.who.length?'g':'w'}" ${_tp.who.length?'':'disabled'} onclick="tripGo()">🎒 다녀와!</button>
      <button class="btn w" onclick="openTrip()">뒤로</button>
    </div>`);
}
function tripPay(t,n){
  n=Math.max(1,n);
  const bag=upgLv('lunch');                 /* 🍱소풍 도시락 */
  return {
    coin: Math.round((900+S.lv*430)*t.coin*n*(1+dexCount()*0.05)*(1+bag*0.10)),
    top : Math.max(1, Math.round(t.top*n*(1+bag*0.08)))
  };
}
function tripDest(k){ _tp.k=k; sfx('tap'); reModal(openTripNew); }
/* 🎒🏆 고를 때마다 창을 통째로 다시 그리는데, openModal 이 스크롤을 맨 위로 올린다.
   아래쪽 아이를 고르면 화면이 위로 튀어서 다음 아이를 못 고른다 — 자리를 지켜준다. */
function reModal(fn){
  const m=$('#modal'), y=m?m.scrollTop:0;
  fn();
  const m2=$('#modal'); if(m2) m2.scrollTop=y;
}
function tripToggle(k){
  const i=_tp.who.indexOf(k);
  if(i>=0) _tp.who.splice(i,1);
  else{
    if(_tp.who.length>=TRIP_MAX){ sfx('boo'); toast(`🎒 한 번에 ${TRIP_MAX}마리까지만 갈 수 있어요`); return; }
    _tp.who.push(k);
  }
  sfx('tap'); reModal(openTripNew);
}
function tripGo(){
  if(tripFree()<=0){ sfx('boo'); toast('🎒 소풍 자리가 다 찼어요'); return; }
  const t=tripOf(_tp.k), who=_tp.who.filter(k=>S.dex[k] && !onTrip(k));
  if(!who.length){ sfx('boo'); return; }
  /* 🌻뒷마당에서 떠나면 문이 바로 밖이라 조금 빨리 돌아온다 — 떠나는 아이의 방으로 정한다 */
  const ms=Math.round(t.min*60000*traitFor(who[0]).trip);
  trips().push({k:t.k, who:who.slice(), at:Date.now(), till:Date.now()+ms, n:who.length});
  _tp={k:_tp.k, who:[]};
  sfx('gift'); vib([0,25,40,25]);
  save(); renderHUD(); renderView();
  openModal(`<h2>🎒 잘 다녀와!<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="row" style="justify-content:center;gap:5px;flex-wrap:wrap">
      ${who.map(k=>`<span class="hs" style="width:60px;height:60px">${hamSVG(hamOf(k))}</span>`).join('')}
    </div>
    <div style="text-align:center;font-size:14px;line-height:1.8;margin-top:6px">
      ${t.em} ${euro('<b>'+t.n+'</b>')} 출발했어요!<br>
      <span class="muted">${t.d}</span>
      <div style="font-size:18px;font-weight:800;margin-top:8px">⏳ ${tripWait(ms)} 뒤에 돌아와요</div>
      ${ms<t.min*60000?'<div class="muted">🌻 뒷마당에서 떠나서 조금 빨라요!</div>':''}
      <div class="muted" style="margin-top:5px">게임을 꺼둬도 시간은 흘러요 🥰</div>
    </div>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn" onclick="closeModal()">잘 다녀와 💕</button></div>`);
}
function tripDone(i){
  const list=trips();
  /* 번호를 안 주면 돌아온 무리 중 첫째를 맞이한다 */
  if(i===undefined){ i=list.findIndex(x=>tripLeftOf(x)<=0); }
  const tr=list[i];
  if(!tr || tripLeftOf(tr)>0) return;
  const t=tripOf(tr.k), who=(tr.who||[]).filter(k=>S.dex[k]);
  const pay=tripPay(t, who.length||1);
  S.coin+=pay.coin; S.top+=pay.top;
  S.stats.trip=(S.stats.trip||0)+1;
  if(!Array.isArray(S.tripSeen)) S.tripSeen=[];
  if(S.tripSeen.indexOf(t.k)<0) S.tripSeen.push(t.k);
  S.tripN=(S.tripN||0)+who.length;
  _mailing=true;
  try{
    who.forEach(k=>addBond(k,t.bond));
    /* 같이 다녀온 아이들끼리는 부쩍 가까워진다 */
    for(let i=0;i+1<who.length;i++) pbAdd(who[i],who[i+1],PB_PLAY*2);
  } finally{ _mailing=false; }
  const teller=who.length?pick(who):null;
  list.splice(i,1);
  who.forEach(k=>setMood(k,'happy'));
  sfx('star4'); vib([0,30,50,30,60]);
  checkBadges(); save(); renderHUD(); renderView();
  /* 소풍 이야기는 꼭 편지로 남는다 — 하루 상한과 상관없이 한 통 */
  if(teller && mailPush(teller,'trip')){
    S.mail[0].i=TRIPS.indexOf(t);
    S.mail[0].tp=TRIPS.indexOf(t);
    save();
  }
  openModal(`<h2>🎒 다녀왔어요!<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="row burst" style="justify-content:center;gap:5px;flex-wrap:wrap">
      ${who.map(k=>`<span class="hs" style="width:60px;height:60px">${hamSVG(hamOf(k))}</span>`).join('')}
    </div>
    <div style="text-align:center;font-size:14px;line-height:1.8;margin-top:6px">
      ${t.em} <b>${t.n}</b>에서 신나게 놀다 왔어요!<br>
      <span class="muted">${who.map(nameOf).join(' · ')}</span>
      <div style="font-size:19px;font-weight:800;margin-top:9px">🪙+${fmt(pay.coin)}　🍒+${pay.top}</div>
      <div class="muted" style="margin-top:5px">💗 간 아이들 <b>+${t.bond}</b>씩 · 👯 서로도 가까워졌어요
        ${teller?`<br>💌 <b>${nameOf(teller)}</b>가 소풍 이야기를 편지로 써뒀어요`:''}</div>
    </div>
    <div class="row" style="justify-content:center;margin-top:12px">
      ${teller?`<button class="btn" onclick="closeModal();openMail(0)">💌 편지 읽기</button>`:''}
      ${tripBack()?`<button class="btn g" onclick="tripDone()">🎉 다음 무리도 마중</button>`
                  :`<button class="btn w" onclick="closeModal()">잘 다녀왔어 💕</button>`}
    </div>`);
}

/* ==================================================================
   🌙 하루의 때 — 폰 시계를 보고 놀이방이 아침·낮·저녁·밤으로 바뀐다.
   ⚠️ 아이가 고른 🖼️배경은 그대로 두고 그 위에 얇은 색만 덮는다(.tod).
   테마를 통째로 갈아치우면 애써 고른 배경이 시간마다 사라져 버린다.
   때마다 잘하는 것이 다르다 — 아침엔 하트, 저녁엔 코인, 밤엔 자면서 버는 코인.
================================================================== */
const DAYPARTS={
  dawn :{k:'dawn', em:'🌅', n:'아침', h:'6시~11시',  bond:1.3, coin:1,    auto:1,
         d:'다들 기지개를 켜요 — 지금 놀아주면 <b>하트가 30% 더</b> 올라요'},
  day  :{k:'day',  em:'☀️', n:'낮',   h:'11시~5시',  bond:1,   coin:1,    auto:1,
         d:'가게가 제일 북적이는 때예요'},
  eve  :{k:'eve',  em:'🌇', n:'저녁', h:'5시~9시',   bond:1,   coin:1.25, auto:1,
         d:'노을이 들고 손님이 몰려요 — 놀아줄 때 <b>코인 25% 더</b>'},
  night:{k:'night',em:'🌙', n:'밤',   h:'9시~아침 6시', bond:1, coin:1,   auto:1.25,
         d:'다들 새근새근 자고 있어요 — <b>자는 동안 모이는 코인 25% 더</b>'}
};
function dayPart(){
  const h=new Date().getHours();
  if(h>=21||h<6) return DAYPARTS.night;
  if(h<11) return DAYPARTS.dawn;
  if(h<17) return DAYPARTS.day;
  return DAYPARTS.eve;
}
function isNight(){ return dayPart().k==='night'; }
/* 🌅 아침 인사 — 하루에 한 번, 잠에서 깬 아이들에게 인사하면 방 전체가 기분이 좋아진다 */
function hiReady(){ return dayPart().k==='dawn' && S.hi!==todayKey() && seatHams().length>0; }
function sayHi(){
  if(!hiReady()){ sfx('boo'); return; }
  const list=seatHams();
  S.hi=todayKey();
  _mailing=true;
  try{ list.forEach(k=>addBond(k,3)); } finally{ _mailing=false; }
  list.forEach(k=>setMood(k,'happy'));
  sfx('heart'); vib([0,20,40,20]);
  checkBadges(); save(); renderHUD(); renderView();
  toast(`🌅 <b>좋은 아침!</b> ${list.length}마리가 기지개를 켜며 인사했어요 — 💗+3씩`);
  if(list.length) mailAct(pick(list),'dawn',0.25);
}
/* 🌟 별똥별 — 밤에만, 여덟 시간에 한 번 하늘을 지나간다. 누르면 소원을 빌 수 있다 */
const WISH_GAP=8*3600000;
/* 🔭소원 망원경 한 칸에 15%씩 자주 뜬다 — 다 올리면 8시간이 3시간 12분 */
function wishGap(){ return Math.round(WISH_GAP*(1-upgLv('scope')*0.15)); }
function wishReady(){ return isNight() && Date.now()-(S.wishAt||0)>=wishGap(); }
function makeWish(){
  if(!wishReady()){ sfx('boo'); return; }
  S.wishAt=Date.now();
  const coin=Math.round((400+S.lv*220)*(1+dexCount()*0.04));
  const top=2+Math.floor(S.lv/12);
  S.coin+=coin; S.top+=top;
  S.stats.wish=(S.stats.wish||0)+1;
  const list=seatHams();
  _mailing=true;
  try{ list.forEach(k=>addBond(k,2)); } finally{ _mailing=false; }
  sfx('star4'); vib([0,25,45,25,45,30]);
  checkBadges(); save(); renderHUD(); renderView();
  openModal(`<h2>🌟 별똥별에 소원을 빌었어요<span class="x" onclick="closeModal()">닫기</span></h2>
    <div style="text-align:center;font-size:38px;line-height:1.4">🌠</div>
    <div style="text-align:center;font-size:14px;line-height:1.8">
      밤하늘에 별똥별이 길게 지나갔어요.<br>
      <span class="muted">자던 햄쮜들도 눈을 살짝 뜨고 같이 소원을 빌었대요 😴💫</span>
      <div style="font-size:19px;font-weight:800;margin-top:9px">🪙+${fmt(coin)}　🍒+${top}</div>
      ${list.length?`<div class="muted" style="margin-top:5px">💗 이 방 ${list.length}마리도 +2씩</div>`:''}
    </div>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn" onclick="closeModal()">고마워 별똥별 💕</button>
    </div>`);
  if(list.length) mailAct(pick(list),'wish',0.5);
}
/* noBuff=true 면 낮잠 보너스를 빼고 센다 — 안 보던 동안의 계산에 두 배를 소급하면 안 된다 */
/* 🌳 마당 햄쮜는 오늘 날씨를 탄다 — 비·눈에는 우산을 든 햄쮜가 오히려 제일 잘 번다 */
/* ==================================================================
   🏡 방 성격 — 방이 그동안 보기만 달랐다. 이제 방마다 잘하는 것이 하나씩 있다.
   ⚠️ 성격은 「몇 번째 방이냐」가 아니라 <b>아이가 고른 🖼️배경</b>에서 나온다 —
   그래야 배경 고르기가 취향이 아니라 <b>선택</b>이 되고, 방 열한 곳에 표를 따로 안 만들어도 된다.
   마당·뒷마당·냉장고는 배경이 붙박이라 성격도 붙박이다.
   숫자는 전부 「곱하기」다. 1 이면 아무 일도 없는 것과 같다.
================================================================== */
const TRAITS={
  day  :{em:'☀️', n:'낮 가게', coin:1.20, bond:1,    top:1, cd:1,   auto:1,    trip:1,
         d:'손님이 북적여서 <b>놀 때 코인 20% 더</b>'},
  night:{em:'🌙', n:'밤하늘',  coin:1,    bond:1.25, top:1, cd:1,   auto:1,    trip:1,
         d:'조용하고 아늑해서 <b>하트가 25% 더</b>'},
  sea  :{em:'🏖️', n:'바닷가',  coin:1,    bond:1,    top:1, cd:0.7, auto:1,    trip:1,
         d:'신이 나서 <b>노는 쉬는 시간이 30% 짧아요</b>'},
  sunset:{em:'🌇', n:'노을 마을', coin:1.10, bond:1.10, top:1,   cd:1,   auto:1,   trip:1,
          d:'해 질 무렵이라 <b>코인도 하트도 10%씩 더</b>'},
  forest:{em:'🌲', n:'깊은 숲',   coin:1,    bond:1,    top:1.3, cd:0.8, auto:1,   trip:1,
          d:'푹신한 낙엽 위라 <b>쉬는 시간 20% 짧고 🍒토핑도 더</b>'},
  snow :{em:'❄️', n:'눈나라',  coin:1,    bond:1,    top:1.6, cd:1, auto:1,    trip:1,
         d:'시원해서 <b>🍒토핑이 더 자주</b> 나와요'},
  yard :{em:'🌳', n:'마당',    coin:1,    bond:1,    top:1, cd:1,   auto:1,    trip:1,
         d:'<b>오늘 날씨</b>를 그대로 타요 (맑으면 140%)'},
  back :{em:'🌻', n:'뒷마당',  coin:1,    bond:1,    top:1, cd:1,   auto:1,    trip:0.85,
         d:'문이 바로 밖이라 <b>소풍이 15% 빨리</b> 돌아와요'},
  fridge:{em:'🧊', n:'냉장고', coin:1,    bond:1,    top:1, cd:1,   auto:1.25, trip:1,
         d:'아이스크림이 안 녹아서 <b>저절로 모이는 코인 25% 더</b>'}
};
function traitKey(i){
  if(isBackYard(i)) return 'back';
  if(isYard(i))     return 'yard';
  if(isFridge(i))   return 'fridge';
  const t=room(i).theme;
  return TRAITS[t]?t:'day';
}
function traitOf(i){ if(i===undefined) i=S.room|0; return TRAITS[traitKey(i)]||TRAITS.day; }
/* 그 햄쮜가 앉아 있는 방의 성격 — 어디에도 안 앉아 있으면 아무 일도 없는 것으로 친다 */
function traitFor(k){ const at=whereSeated(k); return at?traitOf(at.r):TRAITS.yard; }
function yardOne(k){
  const w=wxNow();
  if(w.wet && /umb/.test(wearOf(k).hand||'')) return 1.50;
  return w.mul;
}
function autoIncome(noBuff){
  let c=0;
  openIdx().forEach(i=>{
    const yard=isYard(i), tr=traitOf(i);
    roomHams(i).forEach(k=>{ c+=S.dex[k].g*(1+0.3*hearts(k))*0.3*(yard?yardOne(k):1)*buddyMul(k)*tr.auto; });
  });
  const buff=(!noBuff && napLeft())?NAP_MUL:1;
  /* 🌙 밤에는 다들 자고 있어서 오히려 저절로 모이는 코인이 잘 는다 */
  return c*(1+upgLv('regul')*0.25+upgLv('vault')*0.45+upgLv('royal')*0.55)*(1+S.lv*0.08)*buff*dayPart().auto*menuMul();
}
/* ==================================================================
   🎁 특별 햄쮜 — 통에서 뜨는 아이들과 아주 다르게 생긴 친구들.
   🔔주문 놀이에서 모은 ⭐로 하나씩 놀러 온다. 도감에도 따로 모인다.
================================================================== */
