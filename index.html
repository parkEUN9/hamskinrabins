const SP_KEYS=Object.keys(SPECIAL);
function spId(k){ return 'sp_'+k; }
function isSp(k){ return typeof k==='string' && k.slice(0,3)==='sp_'; }
function spOf(k){ return SPECIAL[String(k).slice(3)]; }
function spKeys(){ return SP_KEYS.map(spId).filter(k=>S.dex[k]); }
function spCount(){ return spKeys().length; }
/* 통 햄쮜·믹스쮜·특별 햄쮜를 한꺼번에 가리는 데 쓴다 */
function isTub(k){ return !isMix(k) && !isSp(k); }

/* ==================================================================
   😊 표정 — 방금 있었던 일이 얼굴에 잠깐 남는다.
   저장하지는 않는다. 스치는 기분이라 껐다 켜면 사라지는 게 맞다.
================================================================== */
const MOOD_MS=4200;
const _mood=new Map();                      /* 열쇠 -> {m, tm} */
function moodOf(k){
  if(!S.dex[k]) return '';
  const e=_mood.get(k);
  if(e) return e.m;
  if(napLeft()) return 'sleep';             /* 😴낮잠 — 다 같이 쿨쿨 */
  /* 🌙밤 — 자고 있다. 놀아주면 잠깐 깬다(_mood 가 먼저다).
     다만 <b>눌러서 들어간 창</b>에서는 깨어 있다(_awake) — 자는 얼굴만 보고 있으면
     「놀자고 하기가 미안해서」 아무것도 못 하겠다는 말을 들었다.
     🏠놀이방과 📖도감 목록은 그대로 잔다 — renderView 가 그리는 동안 _awake 를 내린다. */
  if(isNight() && !_awake) return 'sleep';
  /* 💗하트를 꽉 채운 아이에게 특별한 얼굴을 준 적이 있다 — 처음엔 하트 눈, 그다음엔
     초롱초롱한 눈(큰 눈 + 반짝임 둘 + 진한 볼터치 + 활짝 웃는 입). 둘 다 아이가
     「전보다 별로」라고 해서 되돌렸다. 하트를 다 채워도 얼굴은 평소 그대로다.
     다시 넣고 싶어지면 여기서 'love' 를 돌려주고 buildHamSVG 에 가지를 만들면 된다. */
  return '';
}
/* 🌙 「지금 눌러서 들어간 창을 그리는 중」이면 0보다 크다 — 그동안은 밤이어도 안 잔다.
   창을 여는 함수들을 아래에서 한 번에 감싸므로, 창마다 따로 손볼 필요가 없다. */
let _awake=0;
function wakeWrap(name){
  const f=window[name];
  if(typeof f!=='function') return;
  window[name]=function(){ _awake++; try{ return f.apply(this,arguments); } finally{ _awake--; } };
}
/* 눌러서 들어가는 창들 — 여기 있는 창에서는 햄쮜가 깨어 있다.
   ⚠️ 🏠놀이방·📖도감 목록을 그리는 함수는 절대 넣지 않는다(거기선 자야 한다). */
['openDex','openMixInfo','openSpInfo','openCloset','openDressPick','openSeatPick',
 'openPost','openMail','openWrite','openWritePick','openTrip','openTripNew',
 'openSport','openAlbum','openContPick','openBdayParty','openStory','openInfo',
 'openTravel','travHome','travStart','travToday','travEnd','travEndAsk',
 'openEgg','eggHome','eggGo','eggCare','eggHatch','eggStart','openMenu','menuMake','openReq',
 'openFest','festHome','festPick','festWho','festPlay','festPrize','festAgainAsk',
 'openTale','openTaleBook','openTaleHero','taleRead','talePick','taleAgainAsk',
 'openMem','memStart','memBoard','memWin','memQuit',
 'openParty','throwParty','partyPick','partyGuest'
].forEach(wakeWrap);

/* 그 아이 그림만 살짝 갈아끼운다 — 화면을 통째로 다시 그리면 폴짝 뛰던 게 끊긴다 */
function faceRefresh(k){
  const i=seatHams().indexOf(k); if(i<0) return;
  const el=$$('#terrace .tham')[i]; if(!el) return;
  const hs=el.querySelector('.hs'); if(hs) hs.innerHTML=hamSVG(hamOf(k));
}
function setMood(k,m){
  if(!S.dex[k]) return;
  const e=_mood.get(k); if(e) clearTimeout(e.tm);
  _mood.set(k,{m, tm:setTimeout(()=>{ _mood.delete(k); faceRefresh(k); }, MOOD_MS)});
  faceRefresh(k);
}
function hamOf(k,wearOv){
  const d=S.dex[k], m=d&&d.mix;
  const wear = wearOv!==undefined ? wearOv : (d?d.w:null);
  if(m){   /* 💞 믹스쮜 — 색을 섞고, 두 아이의 특징을 모아 한 모양으로 만든다 */
    if(!m.sa||!m.sb||!SHAPES[m.shape]) mixFixShape(m);
    return {shape:m.shape, color:k, colorObj:m.col, pattern:d.p, grade:d.g, cone:m.cone, wear, mood:moodOf(k),
            baby: m.baby ? babyScale(k) : 0};
  }
  if(isSp(k)){
    const s=spOf(k);
    return {shape:s.shape, color:s.color, pattern:d?d.p:'plain', grade:d?d.g:1, cone:s.c, wear, mood:moodOf(k)};
  }
  const f=FL[k];
  return {shape:f.shape, color:f.color, pattern:d?d.p:'plain', grade:d?d.g:1, cone:f.c, wear, mood:moodOf(k)};
}
/* 아이가 지어준 이름이 있으면 그 이름으로 부른다 */
function nameOf(k){
  const d=S.dex[k];
  if(d&&d.name) return d.name;
  return baseName(k);
}
/* 아이가 이름을 지어주기 전의 '원래 이름' */
function baseName(k){
  const d=S.dex[k];
  if(d&&d.mix) return d.mix.hn;
  if(isSp(k)) return spOf(k)?spOf(k).hn:'햄쮜';
  return FL[k]?FL[k].hn:'햄쮜';
}
/* 믹스쮜는 통 도감과 따로 센다 */
function isMix(k){ return typeof k==='string' && k.slice(0,4)==='mix_'; }
function mixKeys(){ return Object.keys(S.dex).filter(isMix); }
function mixCount(){ return mixKeys().length; }

function storyToday(){
  /* 날짜로 정해서 하루 종일 같은 이야기가 나오게 한다 */
  const t=todayKey(); let h=2166136261;
  for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=(h*16777619)>>>0; }
  return STORIES[h%STORIES.length];
}
function storyDone(){ return S.story && S.story.d===todayKey(); }
function storyReady(){ return !storyDone() && Object.keys(S.dex).length>0; }
function storyPay(o){
  /* 코인은 가게 크기에 맞춰 — 초반에도 후반에도 「받을 만한」 양이 되게 */
  const base=Math.round((260+S.lv*140)*(1+dexCount()*0.05));
  return {coin:Math.round(base*o.coin), top:o.top, bond:o.bond};
}
function openStory(){
  if(!Object.keys(S.dex).length){ sfx('boo'); toast('📖 햄쮜가 있어야 이야기가 생겨요 🍨'); return; }

  if(storyDone()){
    const picked=(S.story.p==='b')?st.b:st.a;
    sfx('tap');
    openModal(`<h2>${st.em} ${st.t}<span class="x" onclick="closeModal()">닫기</span></h2>
      <div class="card" style="margin:0;font-size:13.5px;line-height:1.9">${st.s}</div>
      <div class="card" style="margin:9px 0 0;font-size:13.5px;line-height:1.9">
        <b>${picked.em} ${picked.n}</b> 를 골랐어요<br><span class="muted">${picked.r}</span></div>
      <div class="muted" style="text-align:center;margin-top:8px">내일 또 새 이야기가 와요 📖</div>
      <div class="row" style="justify-content:center;margin-top:11px">
        <button class="btn" onclick="closeModal()">알겠어요!</button></div>`);
    return;
  }
  sfx('tap');
  const opt=(key,o)=>`<div class="slot" onclick="storyPick('${key}')">
      <span class="ph">${o.em}</span>
      <div class="info"><b>${o.n}</b><div class="muted">${o.d}</div></div>
      <span class="muted">고르기 ▸</span></div>`;
  openModal(`<h2>📖 오늘의 이야기<span class="x" onclick="closeModal()">닫기</span></h2>
    <div style="text-align:center;font-size:46px;line-height:1.2" class="burst">${st.em}</div>
    <div style="text-align:center;font-size:16px;font-weight:800;margin-top:2px">${st.t}</div>
    <div class="card" style="margin:9px 0 0;font-size:13.5px;line-height:1.9">${st.s}</div>
    <div style="margin-top:9px">${opt('a',st.a)}${opt('b',st.b)}</div>
    <div class="muted" style="text-align:center;margin-top:8px">틀린 답은 없어요 — 고른 대로 다른 일이 생겨요 🌱</div>`);
}
function storyPick(key){
  if(storyDone()){ sfx('boo'); return; }
  const st=storyToday(), o=(key==='b')?st.b:st.a;
  const own=Object.keys(S.dex);
  if(!own.length) return;
  const pay=storyPay(o);
  S.story={d:todayKey(), k:st.k, p:key};
  S.coin=Math.max(0, S.coin+pay.coin);
  S.top=Math.max(0, S.top+pay.top);
  /* 그 자리에 있던 아이들에게 마음이 간다 */
  const here=(seatHams().length?seatHams():own).slice(0,6);
  _mailing=true;
  try{ here.forEach(k=>addBond(k, pay.bond)); } finally{ _mailing=false; }
  const teller=pick(here);
  S.stats.story=(S.stats.story||0)+1;
  setMood(teller,'happy');
  sfx('star4'); vib([0,25,45,25]);
  checkBadges(); save(); renderHUD(); renderView();
  openModal(`<h2>${st.em} ${st.t}<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="letter">
      <div class="hs">${hamSVG(hamOf(teller))}</div>
      <div class="body"><span class="hi">${o.em} ${o.n}</span><br>${o.r}</div>
    </div>
    <div style="text-align:center;font-size:17px;font-weight:800;margin-top:9px">
      ${pay.coin>=0?`🪙+${fmt(pay.coin)}`:`🪙${fmt(pay.coin)}`}${pay.top?`　${pay.top>0?'🍒+'+pay.top:'🍒'+pay.top}`:''}　💗+${pay.bond}
    </div>
    <div class="muted" style="text-align:center;margin-top:6px">그 자리에 있던 <b>${here.length}마리</b>와 더 친해졌어요</div>
    <div class="row" style="justify-content:center;margin-top:11px">
      <button class="btn" onclick="closeModal()">좋아요!</button></div>`);
  /* 💌 그 아이가 오늘 있었던 일을 편지로 쓴다 */
  mailAct(teller,'story',0.75);
}

function giftCD(){ return Math.round(GIFT_CD*(1-upgLv('box')*0.08)); }
function giftLeft(){ return Math.max(0, giftCD()-(Date.now()-(S.giftAt||0))); }
/* 🫧퐁실쮜는 선물상자에서만 온다. 한 번 빗나갈 때마다 가능성이 조금씩 커지고,
   서른 번째에는 반드시 나온다 — 아이가 「끝내 못 만나는 일」은 없게 한다. */
const GIFT_SP='foam', GIFT_SP_PITY=30;
function giftSpRoll(){
  const id=spId(GIFT_SP), s=SPECIAL[GIFT_SP];
  if(!s || S.dex[id]) return null;
  S.giftP=(S.giftP||0)+1;
  const p=0.05+0.015*(S.giftP-1);
  if(S.giftP<GIFT_SP_PITY && Math.random()>=p) return null;
  S.dex[id]={g:s.g, p:pick(['plain','plain','spot','stripe']), n:1, bond:0, over:0,
             since:Date.now(), anniv:0, w:{hat:null,neck:null,hand:null,cone:null}};
  S.giftP=0;
  return GIFT_SP;
}
function openGift(){
  if(giftLeft()>0){

    toast(`🎁 선물이 아직 준비 중이에요 (${m}분 뒤)`); sfx('boo'); return;

  S.giftAt=Date.now();

  const top=Math.random()<0.4?ri(1,2):0;
  S.coin+=coin; S.top+=top;
  const sp=giftSpRoll();
  sfx('gift'); vib([0,30,50,30]); save(); renderHUD(); renderView();
  openModal(`<h2>🎁 선물상자<span class="x" onclick="closeModal()">닫기</span></h2>

/* ==================================================================
   🎂 함께한 날 — 햄쮜를 처음 만난 날부터 며칠째인지 세어 기념일을 챙겨준다.
   모으고 끝나는 게 아니라 「오래 함께 지낸 친구」가 생기게 하는 장치다.
================================================================== */
const ANNIV=[
  {d:7,   em:'🌱', n:'일주일',  coin:400,   top:2},
  {d:30,  em:'🌸', n:'한 달',   coin:1500,  top:5},
  {d:100, em:'🎂', n:'백 일',   coin:6000,  top:12},
  {d:365, em:'👑', n:'일 년',   coin:25000, top:30}
];
/* 만난 날이 1일째 — 아이가 세는 방식대로. 시각이 아니라 날짜로만 센다 */
function dayNo(t){ const d=new Date(t); return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000; }
function daysWith(k){
  const d=S.dex[k];
  if(!d || typeof d.since!=='number') return 0;
  return Math.max(1, dayNo(Date.now())-dayNo(d.since)+1);
}
/* 아직 안 챙긴 기념일 중 가장 큰 것 */
function annivDue(k){
  const d=S.dex[k]; if(!d) return null;
  const n=daysWith(k), got=d.anniv||0;
  for(let i=ANNIV.length-1;i>=0;i--) if(n>=ANNIV[i].d && got<ANNIV[i].d) return ANNIV[i];
  return null;
}
function annivKeys(){ return Object.keys(S.dex).filter(k=>annivDue(k)); }

/* ==================================================================
   🎂 햄쮜 생일 — 아이마다 생일이 하나씩 있다. 열쇠에서 뽑으므로 저장하지 않아도
   늘 같은 날이고, 낡은 저장에도 그냥 생긴다. 29~31일은 쓰지 않는다(달마다 없는 날이 생긴다).
   102마리가 336일에 흩어지므로 사나흘에 한 번쯤 생일이 돌아온다 — 기다릴 만한 간격이다.
================================================================== */
function bdayOf(k){
  let h=2166136261; const t='bd!'+String(k);
  for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=(h*16777619)>>>0; }
  return {m:(h%12)+1, d:(Math.floor(h/12)%28)+1};
}
function bdayLabel(k){ const b=bdayOf(k); return `${b.m}월 ${b.d}일`; }
function isBday(k){
  const n=new Date(), b=bdayOf(k);
  return (n.getMonth()+1)===b.m && n.getDate()===b.d;
}
/* 올해 파티를 열어줬는지 */
function partyDone(k){ const d=S.dex[k]; return !!(d && d.bp===new Date().getFullYear()); }
function bdayKeys(){ return Object.keys(S.dex).filter(k=>isBday(k) && !partyDone(k)); }
function bdayReady(){ return bdayKeys().length>0; }
/* 며칠 뒤가 생일인지 — 도감에 「곧이에요!」를 띄우려고 */
function bdayLeft(k){
  const n=new Date(), b=bdayOf(k);
  const y=n.getFullYear();
  const t0=Date.UTC(y, n.getMonth(), n.getDate())/86400000;
  let t1=Date.UTC(y, b.m-1, b.d)/86400000;
  if(t1<t0) t1=Date.UTC(y+1, b.m-1, b.d)/86400000;
  return t1-t0;
}
/* 🎂 파티에 차릴 것들 — 고른 것에 따라 <b>그림과 이야기</b>가 달라지고, 받는 것도 조금 기운다.

  _pt={k, cake:PCAKE[0].k, deco:PDECO[0].k, gift:PGIFT[0].k, who:[]};

function ptPool(k){
  const out=[];
  seatHams().forEach(x=>{ if(x!==k && out.indexOf(x)<0) out.push(x); });
  Object.keys(S.dex).forEach(x=>{ if(x!==k && out.indexOf(x)<0) out.push(x); });
  return out.slice(0,24);
}
function partyPick(kind, key){

function partyGuest(g){

function throwParty(k){
  if(!S.dex[k] || !isBday(k) || partyDone(k)) return;
  if(!_pt || _pt.k!==k) ptInit(k);
  const d=S.dex[k];
  const cake=ptOf(PCAKE,_pt.cake), deco=ptOf(PDECO,_pt.deco), gift=ptOf(PGIFT,_pt.gift);
  const who=_pt.who.filter(x=>S.dex[x]).slice(0,PARTY_GUEST);
  d.bp=new Date().getFullYear();
  d.bpN=(d.bpN|0)+1;                              /* 몇 번째 파티인지 — 촛불 개수가 된다 */
  /* 부른 친구 + 같은 방 친구가 다 같이 축하한다 */
  const room=seatHams().filter(x=>x!==k);
  const all=who.slice();
  room.forEach(x=>{ if(all.indexOf(x)<0) all.push(x); });
  const coin=Math.round((900+S.lv*420)*(1+dexCount()*0.06)*(cake.coin||1)*(1+who.length*0.08));
  const top=Math.round((8+Math.floor(S.lv/6))*(1+(cake.top||0)*0.12));
  S.coin+=coin; S.top+=top;
  _mailing=true;
  try{
    d.bond=100;                                   /* 생일인 아이는 하트가 가득 */
    all.forEach(g=>addBond(g, 10+(cake.bond||0)+(who.indexOf(g)>=0?6:0)));
    /* 파티에서 나란히 앉은 친구들은 부쩍 가까워진다 */
    pbPlayRoom(seatHams());
  } finally{ _mailing=false; }
  S.stats.party=(S.stats.party||0)+1;
  setMood(k,'happy'); all.forEach(g=>setMood(g,'happy'));
  /* 📸 차린 파티를 사진 한 장으로 남긴다 — 사진첩이 꽉 찼으면 그냥 넘어간다(파티는 열린다) */
  let shot=false;
  if(Array.isArray(S.album) && S.album.length<ALBUM_MAX){
    S.album.unshift({
      t:Date.now(), frame:'ribbon', cap:`${nameOf(k)} 생일 🎂`,
      party:{cake:cake.em, deco:deco.em, cd:ptCandles(k)},
      hams:[k].concat(who).slice(0,6).map(x=>({k:x, g:S.dex[x].g, p:S.dex[x].p,
        w:Object.assign({},wearOf(x)), bb:isBaby(x)?babyScale(x):0}))
    });
    shot=true;
  }
  sfx('star4'); vib([0,30,50,30,50,30,60,40]);
  checkBadges(); save(); renderHUD(); renderView();

    ${ptSceneHTML(k, who, cake, deco)}
    <div style="text-align:center;font-size:14.5px;line-height:1.8;margin-top:8px">
      <b>${nameOf(k)}</b>, 생일 축하해요! 🎂<br>
      <span class="muted">${all.length?`${all.length}마리가 다 같이 노래를 불러줬어요 🎵`:'조용하지만 따뜻한 파티였어요 🕯️'}</span>
    </div>
    <div class="score" style="margin-top:9px">
      <div><span>${cake.em} ${cake.n} 케이크</span><b style="font-weight:600;font-size:11.5px">${cake.d}</b></div>
      <div><span>${deco.em} ${deco.n}</span><b style="font-weight:600;font-size:11.5px">${deco.d}</b></div>
      <div><span>${gift.em} ${gift.n} 선물</span><b style="font-weight:600;font-size:11.5px">${gift.d}</b></div>
      <div class="tot"><span>생일 선물</span><b>🪙+${fmt(coin)} · 🍒+${top}</b></div>

    </div>
    <div class="muted" style="text-align:center;margin-top:7px">
      ${shot?'📸 파티 사진이 <b>사진첩</b>에 한 장 남았어요!':'📸 사진첩이 꽉 차서 사진은 못 남겼어요'}</div>

      <button class="btn w" onclick="closeModal()">고마워요 💕</button>

  mailAct(k,'bday',0.95);

const PERSONA_KEYS=Object.keys(PERSONA);
function personaKey(k){
  /* 통 햄쮜는 통 번호로 고루 나눈다 — 이름 해시로만 하면 어떤 성격은 일고여덟 마리뿐이 된다.
     5와 6은 서로소라 (i*5+1)%6 이 여섯 성격을 한 바퀴씩 돈다. */
  const f=FL[k];
  if(f && typeof f.i==='number') return PERSONA_KEYS[(f.i*5+1)%PERSONA_KEYS.length];
  /* 특별 햄쮜는 이야기가 정해져 있어서 성격을 못 박아둘 수 있다 (🫧퐁실쮜는 수줍이) */
  const sp=isSp(k)&&spOf(k);
  if(sp && PERSONA[sp.pers]) return sp.pers;
  let h=7919; const t='p!'+String(k);          /* 짝꿍·나머지 특별 햄쮜는 통 번호가 없어서 이름으로 */
  for(let i=0;i<t.length;i++) h=(h*33+t.charCodeAt(i))>>>0;
  return PERSONA_KEYS[h%PERSONA_KEYS.length];
}
function personaOf(k){ return PERSONA[personaKey(k)]; }
/* 편지에 든 문장을 「그 편지에서만은 늘 똑같이」 고르기 위한 자리 —
   읽을 때마다 인사말이 바뀌면 편지가 아니라 전광판이 된다. */
function mailSeed(m,salt){
  let h=((m.t||0)>>>0)^((salt||0)*2654435761);
  h=(h^(h>>>15))*2246822519; h=(h^(h>>>13))*3266489917;
  return (h^(h>>>16))>>>0;
}
function mailOne(m,arr,salt){ return arr[mailSeed(m,salt)%arr.length]; }

function mailPalName(m){
  const k=m&&m.pal;
  if(!k || k===m.k || !S.dex[k]) return null;   /* 자기가 자기 이야기를 쓰면 안 된다 */
  return nameOf(k);
}
function mailRoomName(m){
  const i=(m&&typeof m.rm==='number')?m.rm:(S.room|0);
  return roomName(i);
}

function mailUnread(){ return S.mail.filter(m=>!m.got).length; }
/* 날짜가 바뀌면 오늘 센 편지 수를 0으로 되돌린다 */
function mailDay(){

/* 편지를 보낼 아이 고르기 — 하트가 두 개 이상인 아이가 우선.
   방금 보낸 아이는 빼둔다 — 같은 아이가 연달아 쓰면 편지가 늘어난 티가 안 난다. */
/* 답장을 받고 아직 그 이야기를 못 쓴 아이 — 10분 지나면 「답장 고마워요」 편지를 쓸 차례다 */
const REPLY_WAIT=10*60*1000;
function replyDue(k){
  const d=S.dex[k];
  return !!(d && d.re && !d.re.done && Date.now()-(d.re.t||0) >= REPLY_WAIT);
}
function mailWho(){
  const own=Object.keys(S.dex);
  if(!own.length) return null;                  /* 아직 햄쮜가 없으면 편지도 없다 */
  const last=S.mail[0]&&S.mail[0].k;
  /* 💌 답장을 받은 아이가 제일 먼저 쓴다 — 답장했더니 아무 일도 없으면 김이 샌다 */
  const due=own.filter(k=>k!==last && replyDue(k));
  if(due.length) return pick(due);
  let pool=own.filter(k=>hearts(k)>=2);
  if(!pool.length) pool=own;
  const fresh=pool.filter(k=>k!==last);
  return pick(fresh.length?fresh:pool);
}
/* 문구 고르기 — 최근에 쓴 문구는 빼고 고른다.
   그냥 무작위로 뽑으면 쿠폰으로 다섯 통이 한꺼번에 갈 때 같은 글이 여러 장 나온다.
   아이는 그걸 바로 알아채고 「서로 베꼈나 봐」 하고 서운해한다. */
function mailIdx(pool,r){
  const recent=[], keep=pool.length-1;
  for(const m of S.mail){                       /* S.mail 은 최신이 앞 */
    if((m.r||'')===r){ recent.push(m.i); if(recent.length>=keep) break; }
  }
  const free=[];
  for(let i=0;i<pool.length;i++) if(recent.indexOf(i)<0) free.push(i);
  return pick(free.length?free:pool.map((_,i)=>i));
}
/* 편지 한 통을 우체통에 넣는다. r 이 있으면 「마음 편지」 */
function mailPush(k,r){
  if(!k||!S.dex[k]) return false;
  const rr=r||'';
  const pool=(rr&&MAIL_ACT_TPL[rr])||MAIL_TPL;
  /* 쓸 때의 「같은 방 친구」와 방을 적어둔다 — 편지에 이름이 나오면 아이가 제일 좋아하는데,
     읽을 때마다 새로 뽑으면 어제 편지의 친구가 오늘 바뀌어 버린다.
     이름 자체가 아니라 열쇠를 적어두므로, 나중에 이름을 바꿔줘도 편지가 같이 따라온다. */
  const at=whereSeated(k);
  let pals = at ? roomHams(at.r).filter(x=>x!==k) : [];
  if(!pals.length) pals=Object.keys(S.dex).filter(x=>x!==k);
  S.mail.unshift({k, t:Date.now(), i:mailIdx(pool,rr), r:rr, got:0,
                  pal:pals.length?pick(pals):null, rm:at?at.r:(S.room|0)});
  S.mail=S.mail.slice(0,MAIL_MAX);
  S.mailT=Date.now();
  return true;
}
/* ① 📮 배달 편지 — 켤 때(force) 한 통, 그 뒤로는 MAIL_GAP 이 지나야 한 통 */
function mailCheck(force){
  mailDay();
  if((S.mailN|0)>=mailDayMax()) return false;
  if(!force && Date.now()-(S.mailT||0)<MAIL_GAP) return false;
  const k=mailWho(); if(!k) return false;
  /* 답장을 받았으면 그 이야기부터 쓴다 */
  const due=replyDue(k);
  if(!mailPush(k, due?'reply':'')) return false;
  if(due) S.dex[k].re.done=1;
  S.mailN=(S.mailN|0)+1;
  save();
  return true;
}
/* ② 💗 마음 편지 — 무슨 일이 있어서 그 아이가 바로 쓴다.
   편지를 열면 addBond 가 불리므로, 그 안에서 또 편지가 나가지 않게 자물쇠를 건다. */

function mailAct(k,r,chance){
  if(_mailing) return false;
  if(!k||!S.dex[k]) return false;
  mailDay();
  if((S.mailA|0)>=MAIL_ACT) return false;
  if(Math.random()>=chance) return false;
  _mailing=true;
  try{
    if(!mailPush(k,r)) return false;

   화면에서는 공백으로 합쳐지지만, 미리보기에서 띄어쓰기가 벌어져 보여서 여기서 한 번 훑는다 */

/* 아이가 그 편지에 뭐라고 답했는지 — 편지에 적어두므로 다시 열어도 그대로다 */
function replyOf(m){ return (m&&m.re&&REPLIES[m.re])?m.re:null; }
function replyName(m){ const r=replyOf(m); return r?REPLIES[r].n:'따뜻하게'; }
function sendReply(i,rk){
  const m=S.mail[i]; if(!m||!REPLIES[rk]) return;
  if(m.re){ sfx('boo'); toast('💌 이 편지에는 이미 답장했어요'); return; }
  const k=m.k;
  if(!S.dex[k]){ sfx('boo'); return; }
  m.re=rk; m.reT=Date.now();
  const P=personaOf(k)||PERSONA.brave, pk=personaKey(k);
  const fav=REPLY_FAV[pk]===rk;
  /* 좋아하는 답장이면 하트가 두 배 — 아이가 「이 아이는 이런 걸 좋아하는구나」를 알아내게 */
  _mailing=true;
  let b={top:0};
  try{ b=addBond(k, fav?12:6); } finally{ _mailing=false; }
  S.stats.re=(S.stats.re||0)+1;
  /* 다음 편지에서 이 답장을 기억한다 */
  const d=S.dex[k];
  const kept=(d.re&&d.re.n)||0;
  d.re={k:rk, t:Date.now(), n:kept+1};
  /* 좋아하는 답장을 맞힌 아이는 도감에 적어둔다 — 모으는 재미를 하나 더 만든다 */
  if(fav) d.reFav=1;
  setMood(k, fav?'happy':'happy');
  sfx(fav?'star4':'gift'); vib(fav?[0,25,40,25]:20);
  checkBadges(); save(); renderHUD();
  const line=(REPLY_RE[pk]&&REPLY_RE[pk][rk])||'고마워요 💗';
  openModal(`<h2>💌 답장을 보냈어요<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="letter">
      <div class="hs">${hamSVG(hamOf(k))}</div>
      <div class="body"><span class="hi">${REPLIES[rk].em} ${REPLIES[rk].n} 답장했어요</span><br>${line}
        <span class="by">— ${nameOf(k)} ${P.em}</span></div>
    </div>
    <div class="muted" style="text-align:center;margin-top:8px;line-height:1.7">
      ${fav?`💕 <b>${nameOf(k)}가 제일 좋아하는 답장</b>이었어요 — 하트가 <b>두 배</b>로 올랐어요!`
           :`💗 하트가 조금 올랐어요 — ${nameOf(k)}${'은는'[jong(nameOf(k))?0:1]} 어떤 답장을 제일 좋아할까요?`}
      ${b.top?`<br>🍒 하트가 넘쳐서 토핑 +${b.top}`:''}
    </div>
    <div class="row" style="justify-content:center;margin-top:11px">
      <button class="btn" onclick="closeModal();openPost()">💌 우체통 보기</button>
      <button class="btn w" onclick="closeModal()">닫기</button>
    </div>`);
  if(tab==='play') renderView();
}

function useCoupon(){
  const i=$('#cp-in');
  /* 띄어쓰기와 느낌표는 무시한다 — 「쮜돌이는 숙녀!」를 그대로 적어도 찾아온다.
     ⚠️ 쿠폰 이름에 ! 를 넣지 않는다(넣으면 여기서 지워져 영영 안 맞는다). */
  const code=(i?String(i.value||''):'').replace(/[\s!！]/g,'');
  if(!code){ sfx('boo'); toast('🎫 쿠폰 번호를 적어주세요'); return; }
  const c=COUPONS[code];
  if(!c){ sfx('boo'); toast('🎫 그런 쿠폰은 없어요 — 번호를 다시 봐주세요'); if(i){ i.value=''; i.focus(); } return; }
  if((S.coupon||[]).includes(code)){ sfx('boo'); toast(`${c.em} <b>${c.name}</b> 쿠폰은 이미 받았어요`); return; }
  S.coupon.push(code);

  const got=[];
  if(c.coin){ S.coin+=c.coin; got.push(`🪙+${fmt(c.coin)}`); }
  if(c.top){ S.top+=c.top; got.push(`🍒+${c.top}`); }
  (c.wear||[]).forEach(id=>{
    const [slot,key]=id.split('_'), it=WEAR[slot]&&WEAR[slot].items[key];
    if(!it) return;
    /* 이미 옷장에 있으면 코인으로 바꿔준다 */
    if(ownWear(slot,key)){ S.coin+=400; got.push(`<span style="font-size:14px">${it.em} ${eun(it.name)} 이미 있어서 🪙+400</span>`); }
    else{ S.closet.push(id); got.push(`${it.em} ${it.name}`); }
  });
  (c.tub||[]).forEach(k=>{
    const f=FL[k]; if(!f) return;
    if(S.open.includes(k)){ S.top+=20; got.push(`<span style="font-size:14px">${f.n} 통은 이미 있어서 🍒+20</span>`); }
    else{ S.open.push(k); sel=k; got.push(`🍨 ${f.n} 통`); }
  });
  (c.furn||[]).forEach(k=>{
    const f=FURN[k]; if(!f) return;
    if(haveFurn(k)){ S.coin+=800; got.push(`<span style="font-size:14px">${f.em} ${eun(f.n)} 이미 있어서 🪙+800</span>`); }
    else{ S.furn.push(k); got.push(`${f.em} ${f.n}`); }
  });
  /* 🎁 특별 햄쮜를 데려오는 쿠폰. 이미 와 있으면 🍒로 바꿔준다 */
  (c.sp||[]).forEach(k=>{
    const sp=SPECIAL[k], id=spId(k);
    if(!sp) return;
    if(S.dex[id]){ S.top+=30; got.push(`<span style="font-size:14px">${sp.em} ${eun(sp.hn)} 이미 와 있어서 🍒+30</span>`); return; }
    S.dex[id]={g:sp.g, p:pick(['plain','plain','spot','stripe']), n:1, bond:0, over:0,
               since:Date.now(), anniv:0, w:{hat:null,neck:null,hand:null,cone:null}};
    got.push(`${sp.em} ${sp.hn}`);
  });
  /* 데려온 아이가 바로 편지를 한 통 쓴다 — 아이가 제일 좋아하는 부분이다 */
  if(c.spMail){
    const wasT=S.mailT;
    (c.sp||[]).forEach(k=>{ const id=spId(k);
      if(S.dex[id] && mailPush(id, c.spMail)) got.push(`💌 ${nameOf(id)}의 편지`); });
    S.mailT=wasT;
  }
  /* 🏆 오늘 운동회를 한 번 더 — 이미 열었어도 다시 열린다.
     그날 결과는 지워진다(다시 열 거라 볼 수가 없다). */
  if(c.sport){
    S.sport={d:'', res:null};
    got.push('🏆 오늘 운동회를 <b>한 번 더</b>');
  }
  /* ⚠️ 🎁여행 기념품을 주는 쿠폰은 만들지 않는다 — 기념품은 🧳여행에서만 나온다.
     모으는 재미가 놀이의 알맹이라, 쿠폰이 앞당겨 주면 여행을 갈 이유가 줄어든다. */
  /* 💌 편지 꾸러미 — 하루 상한과 상관없이 그 자리에서 꽂아준다.
     mailT 는 되돌려 놓는다 — 쿠폰 때문에 오늘 올 배달 편지가 8분 밀리면 안 된다. */
  if(c.mail){
    const wasT=S.mailT, sent=[];
    for(let i=0;i<c.mail;i++){ const k=mailWho(); if(k && mailPush(k, c.mailR||'gift')) sent.push(nameOf(k)); }
    S.mailT=wasT;
    if(sent.length) got.push(`💌 편지 ${sent.length}통 <span style="font-size:13px">(${sent.join(' · ')})</span>`);
  }

  sfx('gift'); checkBadges(); save(); renderHUD(); renderView();
  openModal(`<h2>🎫 쿠폰을 썼어요!<span class="x" onclick="closeModal()">닫기</span></h2>
    <div style="text-align:center;font-size:52px;line-height:1.2" class="burst">${c.em}</div>
    <div style="text-align:center;font-size:14.5px;margin-top:4px">
      <b>${c.name}</b>
      <div style="font-size:18px;font-weight:800;margin-top:8px;line-height:1.6">${got.join('<br>')}</div>
    </div>
    <div class="row" style="justify-content:center;margin-top:12px">
      ${(c.mail||c.spMail)?`<button class="btn" onclick="closeModal();openPost()">💌 편지 읽기</button>`
              :`<button class="btn" onclick="closeModal();go('scoop')">🍨 뜨러 가기</button>`}
      <button class="btn w" onclick="openCoupon()">🎫 또 쓰기</button>
    </div>`);
}

/* 저장이 막힌 환경(앱 설정에서 저장이 꺼진 경우 등)이면 한 번만 알려준다 */
let _saveWarned=false;
/* 되살리는 중에는 어떤 저장도 하지 않는다 —
   되살린 내용을 써 넣은 뒤 화면이 새로 뜨기 전에 save() 가 한 번이라도 돌면
   메모리에 남아 있는 「옛 가게」가 그대로 덮어써서, 되살리기가 안 된 것처럼 보인다. */
let _restoring=false;
function save(){
  if(_restoring) return;
  S.t=Date.now();
  try{ localStorage.setItem(SAVE,JSON.stringify(S)); }
  catch(e){
    if(!_saveWarned){
      _saveWarned=true;
      toast('⚠️ 저장이 되지 않는 상태예요 — ⚙️설정의 <b>저장 코드</b>를 복사해두세요');
    }
  }
}
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(SAVE); }catch(e){}
  if(!raw) return false;
  try{
    const d=JSON.parse(raw);
    if(!d||typeof d.coin!=='number') return false;
    S=Object.assign(freshState(),d);
    if(!Array.isArray(S.open)||!S.open.length) S.open=['vanilla','straw','choco','milk'];
    /* 처음부터 있는 통 넷은 값이 없다(공짜라서). 저장본에서 어쩌다 빠지면
       상점에 「🪙 NaN」 이라고 뜨므로, 없으면 도로 채워 넣는다. */
    FREE_TUBS.forEach(k=>{ if(!S.open.includes(k)) S.open.push(k); });
    if(!S.dex||typeof S.dex!=='object') S.dex={};
    if(!S.upg||typeof S.upg!=='object') S.upg={};
    if(!S.play||typeof S.play!=='object') S.play={toy:'pet',ballAt:0,bubbleAt:0};
    if(!S.play.ride||typeof S.play.ride!=='object') S.play.ride={};
    if(!S.wx ||typeof S.wx !=='object') S.wx={key:null,temp:null,at:0,mode:'gps',city:'seoul',place:'',err:0,gfail:0,tm:'',day:null};
    if(S.wx.gfail==null) S.wx.gfail=0;
    if(typeof S.wx.tm!=='string') S.wx.tm='';
    if(!cityOf(S.wx.city)) S.wx.city='seoul';
    if(S.wx.mode!=='city' && S.wx.mode!=='gps') S.wx.mode='gps';
    if(!S.det ||typeof S.det !=='object') S.det={d:'',n:0,win:0,all:0};
    if(!S.stats) S.stats={scoop:0,pet:0,best4:0,best5:0};
    if(S.stats.best5===undefined) S.stats.best5=0;
    if(!Array.isArray(S.closet)) S.closet=[];
    /* 옛 저장에는 없어진 소품 키가 남아 있을 수 있다(예: 콘 위에 얹던 🍒체리).
       옷장에 남은 것은 그리는 쪽에서 무시되지만, 입고 있는 것은 「뭔가 입은 걸로」 세어져서
       풀코디 판정이 어긋나므로 여기서 비워준다. */
    S.closet=S.closet.filter(id=>{ const [sl,key]=String(id).split('_');
      return WEAR[sl] && WEAR[sl].items[key]; });
    Object.keys(S.dex).forEach(k=>{ const w=S.dex[k]&&S.dex[k].w; if(!w) return;
      WEAR_SLOTS.forEach(sl=>{ if(w[sl] && !WEAR[sl].items[w[sl]]) w[sl]=null; }); });
    if(!Array.isArray(S.badge)) S.badge=[];
    if(!Array.isArray(S.coupon)) S.coupon=[];
    if(!S.stamp||typeof S.stamp!=='object') S.stamp={d:'',n:0,all:0};
    if(S.stamp.all==null) S.stamp.all=0;
    if(!S.star ||typeof S.star !=='object') S.star={d:'',k:null};
    if(!S.cup  ||typeof S.cup  !=='object') S.cup={at:0,win:0,play:0};
    if(!S.ord  ||typeof S.ord  !=='object') S.ord={done:0,perfect:0,star:0,best:0,rounds:0};
    ['done','perfect','star','best','rounds'].forEach(k=>{ if(typeof S.ord[k]!=='number') S.ord[k]=0; });
    if(!S.cont ||typeof S.cont !=='object') S.cont={d:'',best:0,win:0,play:0};
    if(!Array.isArray(S.album)) S.album=[];
    if(S.vib==null) S.vib=true;
    if(S.giftAt==null) S.giftAt=0;
    if(S.giftP==null)  S.giftP=0;
    if(typeof S.hi!=='string') S.hi='';
    if(typeof S.wroteD!=='string') S.wroteD='';
    if(typeof S.wroteN!=='number') S.wroteN=0;
    /* 🎒 소풍 — 한 무리만 나가던 옛 저장(S.trip)을 여러 무리(S.trips)로 옮긴다 */
    /* 🥚 알 — 부모가 없어졌으면 알도 없앤다(누구 알인지 모르는 알은 못 그린다) */
    if(!S.egg || typeof S.egg!=='object' || !S.egg.a || !S.dex[S.egg.a] || !S.dex[S.egg.b]) S.egg=null;
    else{
      S.egg.care=clamp(S.egg.care|0, 0, EGG_CARE);
      if(typeof S.egg.d!=='string') S.egg.d='';
    }
    /* 🥚 아기 — 태어난 때가 없으면 지금 태어난 것으로 본다(안 그러면 곧바로 다 커버린다) */
    babyKeys().forEach(k=>{
      const m=S.dex[k].mix;
      if(typeof m.born!=='number' || !m.born) m.born=Date.now();
      m.stage=clamp(m.stage|0, 0, BABY_STEP.length-1);
    });
    /* 🍨 나만의 아이스크림 — 없어진 통이나 모르는 콘·토핑이 적혀 있으면 고친다.
       ⚠️ 메뉴를 <b>버리지는 않는다</b> — 아이가 직접 만들고 이름까지 지어준 것이다. */
    if(!S.menu || typeof S.menu!=='object') S.menu={list:[], pick:-1};
    if(!Array.isArray(S.menu.list)) S.menu.list=[];
    S.menu.list=S.menu.list.filter(m=>m&&typeof m==='object').slice(0, MENU_MAX).map(m=>({
      n: String(m.n||'').slice(0,12),
      cone: MCONE.indexOf(m.cone)>=0 ? m.cone : 'cwaffle',
      sc: (Array.isArray(m.sc)?m.sc:[]).filter(k=>FL[k]).slice(0,3),
      top: MTOP_BY[m.top] ? m.top : 'none',
      at: typeof m.at==='number' ? m.at : Date.now()
    })).filter(m=>m.sc.length);            /* 스쿱이 하나도 안 남은 메뉴는 그릴 게 없다 */
    S.menu.pick = (S.menu.pick|0);
    if(S.menu.pick<0 || S.menu.pick>=S.menu.list.length) S.menu.pick=-1;
    /* 🌟 부탁 — 없어진 햄쮜나 모르는 종류가 적혀 있으면 지운다 */
    if(!S.req || typeof S.req!=='object') S.req={list:[], at:0};
    if(!Array.isArray(S.req.list)) S.req.list=[];
    S.req.list=S.req.list.filter(r=>r && REQT[r.t] && S.dex[r.k] && typeof r.say==='string');
    S.req.list=S.req.list.slice(0, REQ_MAX);
    /* 🎪 여름 축제 — 모르는 부스 열쇠가 적혀 있으면 지운다 */
    if(!S.fest || typeof S.fest!=='object') S.fest={on:0,start:0,day:'',done:[],prize:0};
    if(!Array.isArray(S.fest.done)) S.fest.done=[];
    S.fest.done=S.fest.done.filter(k=>FEST.some(f=>f.k===k));
    if(typeof S.fest.start!=='number' || !S.fest.start) S.fest.start=Date.now();
    /* 📚 이어지는 동화 — 주인공이 없어졌으면 주인공만 비운다(읽은 장은 지키지 않으면 아깝다) */
    if(!S.tale || typeof S.tale!=='object') S.tale={ch:0, day:'', picks:[], hero:'', done:0};
    if(!Array.isArray(S.tale.picks)) S.tale.picks=[];
    S.tale.ch=Math.max(0, Math.min(S.tale.ch|0, TALE.length));
    S.tale.picks=S.tale.picks.slice(0, S.tale.ch).map(x=>x==='b'?'b':'a');
    if(S.tale.hero && !S.dex[S.tale.hero]) S.tale.hero='';
    /* 🧳 여행 — 없어진 햄쮜나 모르는 기념품이 적혀 있으면 정리한다 */
    if(!S.trav || typeof S.trav!=='object') S.trav={on:0,start:0,who:[],got:[],day:'',n:0};
    if(!Array.isArray(S.trav.who)) S.trav.who=[];
    S.trav.who=S.trav.who.filter(k=>S.dex[k]);
    if(!Array.isArray(S.trav.got)) S.trav.got=[];
    S.trav.got=S.trav.got.filter(k=>SOUV_BY[k]);
    if(typeof S.trav.start!=='number' || !S.trav.start) S.trav.start=Date.now();
    /* 데려간 아이가 하나도 안 남았으면 여행은 끝난 것으로 본다 */
    if(S.trav.on && !S.trav.who.length) S.trav.on=0;
    if(!Array.isArray(S.souv)) S.souv=[];
    S.souv=S.souv.filter(k=>SOUV_BY[k]);
    /* 🏆 운동회 — 없어진 햄쮜가 낀 결과는 통째로 버린다(다시 보기만 못 할 뿐이다) */
    if(!S.sport || typeof S.sport!=='object') S.sport={d:'',res:null};
    if(typeof S.sport.d!=='string') S.sport.d='';
    if(S.sport.res && (!Array.isArray(S.sport.res.rows) || S.sport.res.rows.some(r=>!r||!S.dex[r.k]))) S.sport.res=null;
    if(!Array.isArray(S.sportWin)) S.sportWin=[];
    S.sportWin=S.sportWin.filter(k=>S.dex[k]);
    /* 🏪 손님 — 없어진 손님이나 없어진 통이 적혀 있으면 정리한다 */
    if(!S.guests || typeof S.guests!=='object') S.guests={};
    Object.keys(S.guests).forEach(gk=>{
      if(!GUESTS.some(g=>g.k===gk)){ delete S.guests[gk]; return; }
      const r=S.guests[gk];
      if(!r || typeof r!=='object'){ delete S.guests[gk]; return; }
      if(typeof r.n!=='number') r.n=0;
      if(typeof r.fk!=='string' || !FL[r.fk]){ r.fk=''; r.fav=0; }
      r.fav=r.fav?1:0; r.gift=r.gift?1:0;
    });
    if(!Array.isArray(S.trips)) S.trips=[];
    if(S.trip && typeof S.trip==='object' && S.trip.k && Array.isArray(S.trip.who) && S.trip.who.length){
      S.trips.push({k:S.trip.k, who:S.trip.who.slice(), at:S.trip.at||Date.now(), till:S.trip.till||0, n:S.trip.n||S.trip.who.length});
    }
    delete S.trip;
    /* 없어진 햄쮜가 끼어 있으면 빼고, 아무도 안 남은 무리는 접는다.
       한 아이가 두 무리에 낀 것도 여기서 막는다(먼저 나간 무리가 이긴다). */
    {
      const gone={};
      S.trips=S.trips.filter(t=>{
        if(!t || typeof t!=='object') return false;
        /* 모르는 곳이 적혀 있으면 무리를 버리지 말고 제일 가까운 곳으로 돌려놓는다 —
           버리면 나가 있던 아이들이 선물도 못 받고 사라진다 */
        if(!TRIPS.some(x=>x.k===t.k)) t.k=TRIPS[0].k;
        t.who=(Array.isArray(t.who)?t.who:[]).filter(k=>S.dex[k] && !gone[k]);
        t.who.forEach(k=>gone[k]=1);
        if(typeof t.till!=='number') t.till=0;
        return t.who.length>0;
      }).slice(0, 1+UPG.bag.max);
    }
    if(typeof S.tripN!=='number') S.tripN=0;
    if(!Array.isArray(S.tripSeen)) S.tripSeen=[];
    if(S.wishAt==null) S.wishAt=0;
    if(!S.story||typeof S.story!=='object') S.story={d:'',k:'',p:''};
    if(!S.pb || typeof S.pb!=='object') S.pb={};
    /* 🪑 자리 칸수를 줄였다(방마다 최대 6마리). 이미 그 위로 사둔 칸은 값을 돌려준다 —
       아무 일도 안 하는 칸을 그냥 들고 있게 두면 산 값을 삼키는 셈이 된다. */
    if(S.upg && typeof S.upg==='object'){
      let back=0;
      UPG_KEYS.forEach(k=>{
        const u=UPG[k], lv=S.upg[k]|0;
        if(lv>u.max){
          for(let j=u.max;j<lv;j++) back+=Math.round(u.base*Math.pow(u.mul,j));
          S.upg[k]=u.max;
        }
      });
      if(back>0){
        S.coin+=back; S.upgBack=(S.upgBack||0)+back;
        /* 화면이 다 그려진 뒤에 알려준다 — 여기서는 아직 토스트를 띄울 곳이 없다 */
        setTimeout(()=>toast(`🪑 방 자리가 <b>여섯</b>으로 바뀌어서, 넘치게 사둔 칸값 <b>🪙${fmt(back)}</b>을 돌려드렸어요`),1400);
      }
    }
    /* 없어진 햄쮜가 낀 단짝은 지운다 */
    Object.keys(S.pb).forEach(key=>{ const [a,b]=key.split('|'); if(!S.dex[a]||!S.dex[b]) delete S.pb[key]; });
    if(S.newsSeen==null) S.newsSeen='';   /* 마지막으로 본 새 소식 번호 — 안 봤으면 📢에 「새」 점이 붙는다 */
    /* 💞 낡은 저장의 짝꿍 햄쮜는 부모 중 한쪽 모양만 갖고 있다 — 합체 모양으로 바꿔준다 */
    Object.keys(S.dex).forEach(k=>{ const m=S.dex[k]&&S.dex[k].mix; if(m) mixFixShape(m); });
    if(!Array.isArray(S.mail)) S.mail=[];  /* 💌 받은 편지 */
    if(typeof S.mailD!=='string') S.mailD='';
    /* 💌 하루 한 통이던 옛 저장본에는 셈이 없다 — 0 으로 두면 오늘부터 새로 센다.
       mailT 를 0 으로 두면 켜자마자 한 통이 오는데, 그게 오히려 반갑다. */
    if(typeof S.mailN!=='number') S.mailN=0;
    if(typeof S.mailA!=='number') S.mailA=0;
    if(typeof S.mailT!=='number') S.mailT=0;
    S.mail=S.mail.filter(m=>m && S.dex[m.k]).slice(0,MAIL_MAX);   /* 없어진 햄쮜의 편지는 지운다 */
    S.mail.forEach(m=>{ if(typeof m.r!=='string') m.r=''; });      /* 옛 편지는 「배달 편지」로 본다 */
    /* 💌 문구를 무작위로만 고르던 때 우체통에 쌓인 「똑같은 편지」를 흩어준다.
       쿠폰으로 다섯 통이 한꺼번에 온 아이는 다섯 장이 다 같은 글이었다. 한 번만 고쳐주면 된다. */
    (()=>{
      const seen={};
      S.mail.forEach(m=>{
        const pool=(m.r&&MAIL_ACT_TPL[m.r])||MAIL_TPL;
        const used=seen[m.r]=seen[m.r]||[];
        if(used.length>=pool.length) used.length=0;
        if(!(m.i>=0 && m.i<pool.length) || used.indexOf(m.i)>=0){
          const free=[];
          for(let i=0;i<pool.length;i++) if(used.indexOf(i)<0) free.push(i);
          if(free.length) m.i=pick(free);
        }
        used.push(m.i);
      });
    })();
    if(!S.err || typeof S.err!=='object') S.err={d:'', t:[], got:0};
    if(!Array.isArray(S.err.t)) S.err.t=[];
    if(typeof S.errAll!=='number') S.errAll=0;
    /* 🛋️ 옛 저장본에는 「사둔 가구」가 없다 — 그때는 레벨만 되면 소품이 저절로 놓였다.
       이미 열려 있던 소품은 산 것으로 쳐주고, 아래에서 방마다 자동으로 놓아 준다.
       ⚠️ 이 블록은 room() 을 부르는 곳보다 **먼저** 와야 한다 — room() 이 haveFurn() 을 본다. */
    if(!Array.isArray(d.furn)){
      S.furn=FURN_FREE.slice();
      [[2,'plant'],[6,'sign'],[8,'teddy'],[11,'parasol']].forEach(p=>{ if((S.lv|0)>=p[0]) S.furn.push(p[1]); });
    }
    S.furn=S.furn.filter((k,i,a)=>FURN[k] && a.indexOf(k)===i);
    FURN_FREE.forEach(k=>{ if(S.furn.indexOf(k)<0) S.furn.push(k); });
    /* 🏠 옛 저장본(방이 하나뿐이던 때)에는 rooms 대신 seat / theme 이 들어 있다 → 첫째 방으로 옮긴다.
       판정은 반드시 **원본 d** 로 한다 — S 는 freshState() 가 이미 기본 방 하나를 넣어둬서
       S.rooms 를 보면 옛 저장본도 "방 있음"으로 보이고 앉아 있던 햄쮜가 사라진다. */
    if(!Array.isArray(d.rooms)||!d.rooms.length){
      S.rooms=[{name:'', theme:(THEMES[d.theme]?d.theme:'day'),
                seat:Array.isArray(d.seat)?d.seat.slice():[null,null]}];
    }
    delete S.seat; delete S.theme;
    S.rooms=S.rooms.slice(0,ROOMS.length);
    S.room=clamp(S.room|0, 0, ROOMS.length-1);
    for(let i=0;i<ROOMS.length;i++) if(S.rooms[i]) room(i);   /* 자리 수·배경·가구 보정 */
    if(!roomOk(S.room)) S.room=0;
    /* 놓인 가구 기록이 아예 없는 방(옛 저장본)은 가진 것 중에서 알아서 놓아 준다 */
    if(!Array.isArray(d.furn))
      S.rooms.forEach((r,i)=>{ if(r && !Object.keys(r.spot).length) autoFurn(i); });
    /* 같은 햄쮜가 두 방에 겹쳐 있으면(옛 저장본 꼬임) 앞쪽만 남긴다 */
    {
      const seen={};
      for(let i=0;i<ROOMS.length;i++){
        const r=S.rooms[i]; if(!r) continue;
        r.seat.forEach((k,j)=>{ if(!k) return; if(seen[k]) r.seat[j]=null; else seen[k]=1; });
      }
    }
    Object.keys(S.dex).forEach(k=>{
      const e=S.dex[k];
      if(e.bond==null) e.bond=0;
      if(typeof e.over!=='number') e.over=0;    /* 하트가 넘친 만큼 모아두는 곳 */
      /* 🎂 처음 만난 날. 예전 저장에는 없으니 오늘부터 세기 시작한다 —
         실제보다 늦게 잡히지만, 없던 날짜를 지어내는 것보다는 낫다. */
      if(typeof e.since!=='number') e.since=Date.now();
      if(typeof e.anniv!=='number') e.anniv=0;  /* 여기까지 받은 기념일 */
      if(!e.p) e.p='plain';
      if(!e.g) e.g=1;
      if(e.n==null) e.n=1;
      if(!e.w||typeof e.w!=='object') e.w={hat:null,neck:null,hand:null,cone:null};
    });
    /* 가게를 닫아둔 동안에도 단골 손님이 절반 속도로 벌어둔다 */
    const dt=clamp((Date.now()-(d.t||Date.now()))/1000,0,OFFLINE_MAX);
    const inc=autoIncome(true);
    if(dt>60 && inc>0){
      const got=Math.floor(inc*dt*OFFLINE_RATE);
      if(got>0){ S.coin+=got; awayReport={dt,got}; }
    }
    return true;
  }catch(e){ return false; }
}
/* 🥕 비싼 통을 뜰수록 경험치를 더 준다.
   Lv.20 까지는 한 번에 5로 그대로 두고(앞부분 진행이 흔들리면 안 된다),
   그 위로만 통 레벨만큼 얹는다. 안 그러면 Lv.41→65 에
   「제일 싼 통 5만 번 뜨기」가 제일 빠른 길이 되어 버린다 —
   새로 만든 통을 쓸수록 빨라지는 쪽이 맞다. */
function scoopExp(k){
  const f=FL[k];
  return (f && f.lv>20) ? Math.round((f.lv-20)*1.2) : 0;
}
function addExp(v){
  S.exp+=v; let up=0;
  while(S.exp>=expNeed(S.lv)){ S.exp-=expNeed(S.lv); S.lv++; up++; }
  if(up) onLevelUp();
}
function onLevelUp(){

const GOLD_TOP=3;                       /* 골든 스쿱에 드는 🍒토핑 */
/* 🍨 한 번에 많이 뜨기 — 50번을 뜨면 그중 한 마리는 ⭐4 이상이 꼭 나온다.
   값은 50번 값 그대로다(깎아주지 않는다). 대신 「꼭 나온다」는 약속이 보상이라
   아이가 별을 올리려고 같은 통을 몇 십 번씩 누르지 않아도 된다. */
const BIG_N=50;
function doScoop(n){
  if(digging) return;
  if(!sel){ sfx('boo'); toast('먼저 아래에서 통을 골라주세요 🍨'); return; }

  S.coin-=cost;
  dig(f,()=>finishScoop(sel,n,false));
}
/* 골든 스쿱 — 평소 값에 토핑을 얹으면 ★3 이상이 확정으로 나온다 */
function goldScoop(){
  if(digging) return;
  if(!sel){ toast('먼저 통을 골라주세요 🍨'); return; }
  const f=FL[sel], cost=scoopCost(f);
  if(S.top<GOLD_TOP){ sfx('boo'); toast(`🍒 토핑이 ${GOLD_TOP-S.top}개 더 필요해요`); return; }
  if(S.coin<cost){ sfx('boo'); toast(`🪙 코인이 ${fmt(cost-S.coin)} 더 필요해요`); return; }
  S.top-=GOLD_TOP; S.coin-=cost;

/* 한 번 뜨기 = 햄쮜 한 마리. 무늬와 등급이 무작위 */
function rollOne(k,forceHigh,force4){
  const f=FL[k];
  let g=+wpick(gradeW());
  S.pity++;
  if(S.pity>=15 && g<3){ g=3; }           /* 15번 안에 ★3 이상은 반드시 */
  if(forceHigh && g<3){ const r=Math.random(); g=r<0.02?5:r<0.24?4:3; }   /* 골든 스쿱 */
  if(force4 && g<4){ g=Math.random()<0.06?5:4; }                          /* 50번 뜨기의 약속 */
  if(g>=3) S.pity=0;
  const p=wpick(PAT_W);
  const d=S.dex[k];
  const res={k, g, p, isNew:!d, up:false};
  if(!d){
    S.dex[k]={g, p, n:1, bond:0, over:0, since:Date.now(), anniv:0, w:{hat:null,neck:null,hand:null,cone:null}};
    S.top+=2; addExp(26+scoopExp(k));
  }else{
    d.n++;
    if(g>d.g || (g===d.g && Math.random()<0.5)){ d.g=Math.max(d.g,g); d.p=p; res.up=g>0&&g>=d.g; }
    res.up=g>=d.g;
    addExp(5+scoopExp(k));
  }
  if(g===3){ S.top+=1; }
  if(g>=4){ S.top+=2; S.stats.best4++; }
  if(g>=5){ S.top+=3; S.stats.best5=(S.stats.best5||0)+1; }   /* ⭐5 는 통틀어 🍒+5 */
  S.stats.scoop++;
  return res;
}
function finishScoop(k,n,forceHigh){
  const gBefore=S.dex[k]?S.dex[k].g:0;          /* 이번에 별이 올랐는지 알려주려고 미리 적어둔다 */
  const topBefore=S.top;
  const out=[];
  for(let i=0;i<n;i++){
    /* 🍨 50번 뜨기의 약속 — 여기까지 ⭐4 이상이 하나도 없었다면 마지막 한 마리는 꼭 ⭐4 이상 */
    const need4 = n>=BIG_N && i===n-1 && out.every(o=>o.g<4);
    out.push(rollOne(k,forceHigh,need4));
  }
  /* 🍽️큰 쟁반 — 값을 안 내고 한 마리가 더 나올 때가 있다 */
  const tray=upgLv('tray') && Math.random()<upgLv('tray')*0.09;

  const best=out.reduce((a,o)=>Math.max(a,o.g),0);

    for(let n=0;n<oa.length;n++){ const s=room(oa[n]).seat.findIndex(x=>!x); if(s>=0){ ri=oa[n]; i=s; break; } }

  save(); show();
  toast(`${ega(nameOf(k))} ${euro('<b>'+roomName(ri)+'</b>')} 왔어요 🏠`);
}

     5와 6은 서로소라 (i*5+2)%6 이 여섯 놀이를 한 바퀴씩 돈다 → 통 50가지가 8~9마리씩 골고루 */
  if(f && typeof f.i==='number') return FAV_KEYS[(f.i*5+2)%FAV_KEYS.length];

}

const FURN_KEYS=Object.keys(FURN);
const FURN_FREE=['chair','balloon'];      /* 처음부터 가지고 있는 것 */
function haveFurn(k){ return Array.isArray(S.furn) && S.furn.indexOf(k)>=0; }
function furnCount(){ return Array.isArray(S.furn)?S.furn.length:0; }
function spotOf(sk){ return SPOTS.find(s=>s.k===sk) || YSPOTS.find(s=>s.k===sk); }
/* 이 방의 어느 자리에 무엇이 놓여 있는지 */
function furnAt(sk,i){ const v=room(i).spot[sk]; return (v && FURN[v])?v:null; }
/* 네 자리를 다 채운 방의 수 */
function roomsDone(){ let n=0; openIdx().forEach(i=>{ if(spotKeysOf(i).every(sk=>furnAt(sk,i))) n++; }); return n; }
/* 빈 자리에 가진 가구 중 제일 좋은 것을 알아서 놓는다 (옛 저장본 옮길 때만 쓴다) */
function autoFurn(i){
  const r=room(i), keys=spotKeysOf(i);
  spotsOf(i).forEach(sp=>{
    if(r.spot[sp.k]) return;
    const pick=S.furn.filter(k=>FURN[k].kind===sp.kind && !keys.some(x=>r.spot[x]===k))
                     .sort((a,b)=>FURN_KEYS.indexOf(b)-FURN_KEYS.indexOf(a));
    if(pick.length) r.spot[sp.k]=pick[0];
  });
}
/* 같은 가구를 한 방에 두 번 놓을 수는 없다 — 이미 놓인 자리를 비워 주고 옮긴다 */
function placeFurn(sk,k){
  const r=room(), sp=spotOf(sk);
  if(!sp || !FURN[k] || FURN[k].kind!==sp.kind || !haveFurn(k)){ sfx('boo'); return; }
  spotKeysOf().forEach(x=>{ if(r.spot[x]===k) r.spot[x]=null; });
  r.spot[sk]=k;
  errBump('furn');
  sfx('heart'); checkBadges(); save(); renderView(); closeModal();
  toast(`${FURN[k].em} ${eul(FURN[k].n)} ${sp.n}에 놓았어요`);
}
function clearFurn(sk){
  room().spot[sk]=null; sfx('tap'); save(); renderView(); closeModal();
  toast(`${eul(spotOf(sk).n)} 비웠어요`);
}
function buyFurn(k,sk){
  const f=FURN[k]; if(!f || haveFurn(k)) return;
  /* 선물로만 받는 가구는 살 수 없다 — 값이 없어서 사려고 하면 코인이 NaN 이 된다 */
  if(f.gift){ sfx('boo'); toast(`${f.em} ${f.n}${jong(f.n)?'은':'는'} 📚 동화를 다 읽으면 받아요`); return; }
  if(f.top){ if(S.top<f.top){ sfx('boo'); toast(`🍒 토핑이 ${f.top-S.top}개 더 필요해요`); return; } S.top-=f.top; }
  else{ if(S.coin<f.coin){ sfx('boo'); toast(`🪙 코인이 ${fmt(f.coin-S.coin)} 더 필요해요`); return; } S.coin-=f.coin; }
  S.furn.push(k); sfx('gift'); addExp(12);
  placeFurn(sk,k);                                  /* 산 자리에 바로 놓아 준다 */
  toast(`🛍️ ${f.em} ${eul('<b>'+f.n+'</b>')} 샀어요!`);
}
/* 한 자리에 놓을 것 고르기 — 가진 것은 바로 놓고, 안 산 것은 여기서 바로 산다 */
function openFurnPick(sk){
  const sp=spotOf(sk); if(!sp) return;
  const now=furnAt(sk);
  const cards=FURN_KEYS.filter(k=>FURN[k].kind===sp.kind).map(k=>{

/* ==================================================================

const PB_MAX=100;                       /* 여기까지 차면 단짝 */
const PB_PLAY=7;                        /* 나란히 앉아 같이 놀면 한 번에 오르는 양 */
function pbKey(a,b){ return a<b ? a+'|'+b : b+'|'+a; }
function pbGet(a,b){ return (S.pb&&S.pb[pbKey(a,b)])||0; }
/* 그 아이의 단짝 (없으면 null). 한 아이에 하나 — 먼저 100이 된 쪽이 임자다. */
function buddyOf(k){
  if(!S.pb||!S.dex[k]) return null;
  const pre=k+'|', suf='|'+k;
  for(const key in S.pb){
    if(S.pb[key]<PB_MAX) continue;
    let other=null;
    if(key.indexOf(pre)===0) other=key.slice(pre.length);
    else if(key.length>suf.length && key.slice(-suf.length)===suf) other=key.slice(0,-suf.length);
    if(other && S.dex[other]) return other;
  }
  return null;
}
/* 아직 단짝은 아니지만 제일 가까운 짝 — 도감에서 「조금만 더」를 보여주려고 */
function bestPbOf(k){
  if(!S.pb) return null;
  let best=null;
  const pre=k+'|', suf='|'+k;
  for(const key in S.pb){
    let other=null;
    if(key.indexOf(pre)===0) other=key.slice(pre.length);
    else if(key.length>suf.length && key.slice(-suf.length)===suf) other=key.slice(0,-suf.length);
    if(!other||!S.dex[other]) continue;
    const v=S.pb[key];
    if(!best||v>best.v) best={k:other, v:Math.round(v)};
  }
  return best;
}
function buddyPairs(){
  const seen={}, out=[];
  if(!S.pb) return out;
  for(const key in S.pb){
    if(S.pb[key]<PB_MAX) continue;
    const [a,b]=key.split('|');
    if(!S.dex[a]||!S.dex[b]) continue;
    if(seen[a]||seen[b]) continue;          /* 한 아이는 단짝 하나 */
    seen[a]=seen[b]=1; out.push([a,b]);
  }
  return out;
}
/* 단짝이 같은 방에 있으면 둘 다 더 잘 번다 */
function buddyMul(k){
  const b=buddyOf(k); if(!b) return 1;
  const x=whereSeated(k), y=whereSeated(b);
  return (x&&y&&x.r===y.r) ? 1.15 : 1;
}
function pbAdd(a,b,v){
  if(!a||!b||a===b||!S.dex[a]||!S.dex[b]) return false;
  /* 이미 단짝이 있는 아이는 더 안 쌓는다 — 단짝은 하나뿐이라야 특별하다 */
  if(buddyOf(a)||buddyOf(b)) return false;
  S.pb=S.pb||{};
  const key=pbKey(a,b), was=S.pb[key]||0;
  if(was>=PB_MAX) return false;
  S.pb[key]=Math.min(PB_MAX, was+v);
  if(S.pb[key]>=PB_MAX){
    sfx('star4'); vib([0,30,50,30,50,40]);
    toast(`👯 ${wagwa('<b>'+nameOf(a)+'</b>')} <b>${nameOf(b)}</b> 가 <b>단짝</b>이 됐어요! 같은 방에 두면 더 잘 벌어요`);

}

  if(!list || list.length<2) return;
  for(let i=0;i+1<list.length;i++) pbAdd(list[i], list[i+1], PB_PLAY);

function addBond(k,v,kind){
  const d=S.dex[k]; if(!d) return {up:false, top:0, fav:false};
  /* 🌟 부탁 확인용 자취 — 어떤 놀이를 언제 했는지만 적어둔다.
     ⚠️ d.pAt(따로 놀기 쉬는 시간)에는 절대 쓰지 않는다. 방 전체 놀이가 거기 쓰면

  if(kind){ d.rq=d.rq||{}; d.rq[kind]=Date.now(); }

  if(fav) v*=2;
  v*=dayPart().bond;                    /* 🌅 아침에는 하트가 잘 오른다 */
  const _tr=traitFor(k);
  v*=_tr.bond;                          /* 🏡 방 성격 — 🌙밤하늘 방은 하트가 잘 오른다 */
  const b0=hearts(k);

function rideAnim(el, rideEl, kind){
  const A=RIDE_ART[kind]; if(!A||!el||!rideEl||!el.animate) return 0;
  const rr=rideEl.getBoundingClientRect(), er=el.getBoundingClientRect();
  const sx=rr.width/A.w, sy=rr.height/A.h;              /* 그림이 화면에서 얼마나 커졌나 */

  const z=(parseFloat(rideEl.style.width)>0) ? rr.width/parseFloat(rideEl.style.width) : 1;
  const hx=er.left+er.width/2, hy=er.bottom;            /* 햄쮜 발밑 */
  /* 지금 서 있는 자세를 그대로 출발점으로 쓴다 — 산책 애니메이션이 밀어놓은 만큼을 무시하면 첫 프레임에서 순간이동한다.
     (.riding 이 붙는 동안 산책은 CSS 에서 멈춰 두므로 이 값은 애니메이션이 끝날 때까지 변하지 않는다) */
  const cs=getComputedStyle(el).transform;
  const base=(cs && cs!=='none') ? cs : 'translateX(-50%)';
  const at=(px,py,rot,sc)=>{
    const tx=(rr.left+px*sx-hx)/z, ty=(rr.top+py*sy-hy)/z;
    return `${base} translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) rotate(${rot}deg) scale(${sc})`;

  const P=A.path, n=P.length, D=4200;
  /* 걸어가기(0~14%) → 타기(14~78%) → 잠깐 멈춤(~85%) → 걸어 돌아오기(85~100%)
     구간마다 easing 을 따로 주어야 한다 — 전체에 ease-in-out 을 걸면 끝에서 후딱 끌려간다 */
  const frames=[{transform:base, offset:0, easing:'ease-in'}];
  P.forEach((p,i)=>frames.push({
    transform:at(p[0],p[1],p[2],p[3]),
    offset:+(0.14+0.64*(i+1)/n).toFixed(4),
    easing:'linear'
  }));
  const last=P[n-1];
  frames.push({transform:at(last[0],last[1],last[2],last[3]), offset:0.85, easing:'ease-in-out'});
  frames.push({transform:base, offset:1});
  el.animate(frames, {duration:D, fill:'none'});
  return D;
}

    for(let i=0;i<10;i++){
      const b=document.createElement('span'); b.className='fx bub'; b.textContent='🫧';
      b.style.left=rnd(5,92).toFixed(1)+'%'; b.style.bottom=rnd(8,60).toFixed(0)+'px';
      b.style.fontSize=rnd(13,26).toFixed(0)+'px'; b.style.animationDelay=(i*0.11).toFixed(2)+'s';
      r.appendChild(b); setTimeout(()=>b.remove(),3400);
    }
  }
}
function fxHeart(ev){
  const r=$('#terrace'); if(!r||!ev) return;
  const box=r.getBoundingClientRect();
  for(let i=0;i<3;i++){
    const s=document.createElement('span'); s.className='fx heart'; s.textContent=pick(['💗','💕','💖']);
    s.style.left=(ev.clientX-box.left+rnd(-14,14))+'px';
    s.style.top=(ev.clientY-box.top-10)+'px';
    s.style.animationDelay=(i*0.12).toFixed(2)+'s';
    r.appendChild(s); setTimeout(()=>s.remove(),1400);
  }
}

  const h=$('#terrace .hint');
  if(h) h.innerHTML=`🏠 ${roomName()} · 하트 ${totalHearts()}개`;

  $$('#terrace .tham').forEach((el,i)=>{
    if(!list[i]) return;

    if(t) t.textContent=hearts(list[i])?' 💗'+hearts(list[i]):'';

}

      </div>
      <div class="muted" style="margin-top:6px">한글 8자까지 — 「공주방」 「딸기방」 처럼 지어봐요</div>
    </div>
    ${isYard(i)
      ? `<div class="card" style="margin:9px 0 0">
          <h3>${wxNow().em} 마당 배경은 <b>오늘 날씨</b>가 정해요</h3>
          <div class="muted" style="line-height:1.7">
            ${traitOf(i).em} 이 방은 <b>${traitOf(i).n}</b> — ${traitOf(i).d}<br>
            지금 <b>${wxPlace()}</b>는 ${wxNow().em} <b>${wxNow().n}</b>${S.wx&&S.wx.temp!==undefined&&S.wx.temp!==null?` · ${S.wx.temp}°`:''} —
            비가 오면 하늘이 어두워지고, 눈이 오면 마당이 하얘져요.<br>${wxNow().tip}
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn w sm" onclick="wxWake(1)">🔄 날씨 새로 보기</button>
            <button class="btn w sm" onclick="openWxPlace()">📍 위치 정하기</button>
          </div>

          <h3>🧊 여기는 <b>냉장고 속</b>이에요</h3>
          <div class="muted" style="line-height:1.7">
            이 방만은 배경을 고를 수 없어요 — 늘 서늘한 냉장고 속이랍니다 ❄️<br>
            🧊 <b>${TRAITS.fridge.n}</b> — ${TRAITS.fridge.d}<br>

          ? '놀이기구는 <b>누르면 햄쮜가 타고 놀아요</b> — 코인도 받아요! 여기서 바로 살 수 있어요.'
          : '가구는 여기서 바로 살 수 있어요. 한 번 사면 <b>모든 방</b>에서 쓸 수 있고, 어느 방에 무엇을 놓을지는 방마다 따로 정해요.'}

function saveRoomName(){
  const el=$('#rm-in');
  const v=el?String(el.value||'').trim().replace(/[<>&"'`]/g,'').slice(0,8):'';
  room().name=v; sfx('heart'); save(); renderView();
  toast(v?`💕 이제 <b>${v}</b>${jong(v)?'이':'예'}에요!`:`${euro(ROOMS[S.room|0].dn)} 돌아왔어요`);
  openRoomDeco();
}
function resetRoomName(){
  room().name=''; sfx('tap'); save(); renderView();
  toast(`${euro(ROOMS[S.room|0].dn)} 돌아왔어요`);
  openRoomDeco();
}
function openSeatPick(i){
  const own=Object.keys(S.dex).sort((a,b)=>(FL[a]?FL[a].i:99+ (isMix(a)?1:0))-(FL[b]?FL[b].i:99));
  const R=room();
  const cards=own.map(k=>{
    const here=R.seat[i]===k, at=whereSeated(k);
    /* 다른 방에 있으면 어느 방인지 알려준다 — 한 마리는 한 방에만 있을 수 있다 */
    const away = at && !here;
    return `<div class="scard" style="${here?'border-color:var(--acc);box-shadow:0 0 0 3px #ffd9e4':''}">
      <span class="ic">${hamPic(hamOf(k))}</span>
      <b>${nameOf(k)}</b>
      <span class="fx"><span class="stars">${'★'.repeat(S.dex[k].g)}</span> · ${heartStr(k)}</span>
      ${away?`<span class="fx" style="color:var(--acc)">${at.r===(S.room|0)?`${at.s+1}번 자리에 있어요`:`${roomName(at.r)} 에 있어요`}</span>`:''}
      <button class="btn ${here?'w':''} sm" onclick="setSeat(${i},'${here?'':k}')">${here?'빼기':'데려오기'}</button>
    </div>`;
  }).join('');
  openModal(`<h2>🪑 ${roomName()} ${i+1}번 자리<span class="x" onclick="closeModal()">닫기</span></h2>
    ${own.length
      ? `<div class="muted" style="margin-bottom:7px">이 자리에 둘 햄쮜를 골라주세요. 다른 방에 있으면 <b>이 방으로 옮겨와요</b>.</div>
         <div class="shopgrid wide">${cards}</div>`
      : `<div class="muted">아직 만난 햄쮜가 없어요.<br>🍨탭에서 아이스크림 통을 떠보세요!</div>
         <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="closeModal();go('scoop')">🍨 뜨러 가기</button></div>`}`);
}
function setSeat(i,k){
  const R=room();
  if(!k) R.seat[i]=null;
  else{
    unseat(k);                       /* 어느 방에 있었든 먼저 빼낸다 */
    R.seat[i]=k;
  }
  if(k) errBump('seat');
  sfx('tap'); save(); closeModal(); renderAll();
  toast(k?`${ega(nameOf(k))} <b>${roomName()}</b> ${i+1}번 자리에 앉았어요 🪑`:'자리를 비웠어요');
}

/* ==================================================================
   7. 31 도감
================================================================== */
/* 📖 도감 보는 방법 — 통이 50가지라 그냥 늘어놓으면 찾기 힘들다. 저장하지는 않는다. */
let dexSort='num', dexOnlyMine=false;
const DEX_SORTS={num:'🔢 번호순', star:'⭐ 별순', heart:'💗 하트순', name:'🔤 이름순'};
function setDexSort(v){ dexSort=DEX_SORTS[v]?v:'num'; sfx('tap'); renderView(); }
/* ⚠️ 이 버튼은 <b>거를 게 있을 때만</b> 보여준다(0 < 만난 수 < NTUB).
   통을 다 만난 저장에서는 걸러도 89칸 그대로라 눌러도 아무 일이 안 일어나고,
   하나도 못 만났으면 반대로 텅 빈 화면이 된다. 둘 다 아이한테는 「고장」으로 보인다. */
function toggleDexMine(){ dexOnlyMine=!dexOnlyMine; sfx('tap'); renderView(); }

/* 📖 도감 접기 — 묶음마다 접힘을 따로 기억한다(0 펼침 / 1 접힘).
   ⚠️ 저장 코드에는 안 들어간다 — 화면 취향이라 다른 폰으로 옮길 것이 아니다. */
const DEX_FOLDS=['tub','mix','baby','sp'];
function dexFolds(){ if(!S.dexFold||typeof S.dexFold!=='object') S.dexFold={}; return S.dexFold; }
function dexFolded(k){ return !!dexFolds()[k]; }
function dexFold(k){
  const f=dexFolds();
  f[k]=f[k]?0:1;
  sfx('tap'); save(); renderDexTab();
}
function dexFoldAll(){
  const f=dexFolds(), on=DEX_FOLDS.every(k=>f[k]);   /* 다 접혀 있으면 이번엔 다 편다 */
  DEX_FOLDS.forEach(k=>{ f[k]=on?0:1; });
  sfx(on?'gift':'tap'); save(); renderDexTab();
  if(!on) window.scrollTo(0,0);                      /* 다 접었으면 맨 위로 올려준다 */
}
/* 머리글 — 누르면 접힌다. 접혀 있으면 삼각형이 옆을 본다 */
function dexH3(k, inner){
  return `<h3 class="fold" onclick="dexFold('${k}')">
    <span class="cv">${dexFolded(k)?'▶':'▼'}</span>${inner}</h3>`;
}
function renderDexTab(){
  /* 고른 순서대로 줄을 세운다 — 아직 못 만난 통은 언제나 뒤로 */
  let flavors=FLAVORS.slice();
  if(dexOnlyMine) flavors=flavors.filter(f=>S.dex[f.k]);
  const gOf=f=>S.dex[f.k]?S.dex[f.k].g:-1;
  if(dexSort==='star')       flavors.sort((a,b)=>gOf(b)-gOf(a) || a.i-b.i);
  else if(dexSort==='heart') flavors.sort((a,b)=>(S.dex[b.k]?hearts(b.k):-1)-(S.dex[a.k]?hearts(a.k):-1) || a.i-b.i);
  else if(dexSort==='name')  flavors.sort((a,b)=>(!!S.dex[b.k])-(!!S.dex[a.k]) || nameOf(a.k).localeCompare(nameOf(b.k),'ko'));

  const cards=flavors.map(f=>{
    const d=S.dex[f.k];
    if(!d) return `<div class="dcard lock" onclick="openDex('${f.k}')">
        <div class="qm">?</div><div class="nm">${S.open.includes(f.k)?f.n:'???'}</div></div>`;
    return `<div class="dcard g${d.g}" onclick="openDex('${f.k}')">
        <span class="st">${'★'.repeat(d.g)}</span>
        <span class="hs">${hamSVG(hamOf(f.k))}</span>
        <div class="nm">${nameOf(f.k)}${wearCount(f.k)?' 🎀':''}</div>
        <span class="ht">💗${hearts(f.k)}</span></div>`;
  }).join('');
  const c=dexCount();
  const stars=Object.keys(S.dex).reduce((a,k)=>a+S.dex[k].g,0);
  $('#view').innerHTML=`
  <div class="row" style="margin-bottom:8px">
    <button class="btn w sm" style="width:100%" onclick="dexFoldAll()">
      ${DEX_FOLDS.every(k=>dexFolded(k))?'📖 다 펼치기':'📕 다 접기 — 아래까지 한눈에'}</button>
  </div>
  <div class="card">
    ${dexH3('tub', `📖 통 도감 <small>${c} / ${NTUB}마리</small>`)}
    <div class="bar"><div style="width:${c/NTUB*100}%"></div></div>
    <div class="muted" style="margin-top:6px">통마다 햄쮜가 딱 한 마리씩 살아요 · ⭐ 모두 ${stars}개 · 💗 모두 ${totalHearts()}개</div>
    ${dexFolded('tub') ? '' : `
      <div class="dexsort">${Object.keys(DEX_SORTS).map(v=>
        `<button class="${dexSort===v?'on':''}" onclick="setDexSort('${v}')">${DEX_SORTS[v]}</button>`).join('')}</div>
      ${(c>0 && c<NTUB) ? `
        <button class="btn ${dexOnlyMine?'g':'w'} sm" style="width:100%;margin-top:6px" onclick="toggleDexMine()">
          ${dexOnlyMine?`📖 통 전부 보기 (${NTUB}가지)`:`🐹 만난 햄쮜만 보기 (${c}마리)`}</button>` : ''}`}
  </div>
  ${dexFolded('tub') ? '' : `<div class="dexgrid">${cards}</div>`}
  <div class="card" style="margin-top:9px">
    ${dexH3('mix', `💞 믹스쮜 <small>${mixCount()}마리</small>`)}
    ${dexFolded('mix') ? '' : `
    <div class="muted" style="margin-bottom:7px">둘을 짝지어주면 새 햄쮜가 태어나요. 딸기쮜＋바나나쮜＝<b>딸바쮜</b>!</div>
    ${mixOnly().length
      ? `<div class="mixgrid">${mixOnly().map(k=>`
          <div class="mcard" onclick="openMixInfo('${k}')">
            <span class="st">${'★'.repeat(S.dex[k].g)}</span>
            <span class="hs">${hamSVG(hamOf(k))}</span>
            <div class="nm">${nameOf(k)}</div>
          </div>`).join('')}</div>`
      : ''}
    <div class="row" style="margin-top:${mixOnly().length?'8px':'0'}">
      <button class="btn sm" style="width:100%" onclick="mixA=null;mixB=null;openMixLab()">💞 짝꿍 만들기</button>
    </div>`}
  </div>
  <div class="card" style="margin-top:9px">
    ${dexH3('baby', `${eggMini(eggCareNow(),19)} 아기 햄쮜 <small>${babyKeys().length}마리</small>`)}
    ${dexFolded('baby') ? '' : `
    <div class="muted" style="margin-bottom:7px">
      👯<b>단짝</b>이 된 두 아이에게 알이 생겨요. 사흘 품으면 태어나고, <b>며칠에 걸쳐 자라요</b> 🐣
      ${egg()?`<br>${eggMini(egg().care|0,20)} 지금 <b>${nameOf(egg().a)} 💞 ${nameOf(egg().b)}</b>의 알을 품고 있어요
        (${egg().care|0}/${EGG_CARE}) — 🏠<b>${eggRoomName()}</b>에 놓여 있어요`:''}</div>
    ${babyKeys().length
      ? `<div class="mixgrid">${babyKeys().map(k=>`
          <div class="mcard" onclick="openMixInfo('${k}')">
            <span class="st">${'★'.repeat(S.dex[k].g)}</span>
            <span class="hs">${hamSVG(hamOf(k))}</span>
            <div class="nm">${nameOf(k)}</div>
            <div class="nm" style="font-size:9.5px;color:var(--ink2)">${BABY_STAGE[babyStage(k)]}</div>
          </div>`).join('')}</div>`
      : ''}
    <div class="row" style="margin-top:${babyKeys().length?'8px':'0'}">
      <button class="btn sm" style="width:100%" onclick="openEgg()">
        ${eggMini(eggCareNow())} 아기 햄쮜</button>
    </div>`}
  </div>
  <div class="card" style="margin-top:9px">
    ${dexH3('sp', `🎁 특별 햄쮜 <small>${spCount()} / ${SP_KEYS.length}마리</small>`)}
    ${dexFolded('sp') ? '' : `
    <div class="muted" style="margin-bottom:7px">🔔주문 놀이에서 모은 <b>⭐${S.ord.star||0}개</b>로 찾아오는 친구들이에요.
      🫧퐁실쮜만 <b>🎁선물상자</b>에서 나와요. 눌러보면 알려줘요.</div>
    <div class="dexgrid">${spCardsHTML()}</div>`}
  </div>
  <div class="card">
    <h3>📚 더 보기</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      <button class="btn w sm" onclick="openAlbum()">📸 사진첩 (${S.album.length}장)</button>
      <button class="btn w sm" onclick="openBadges()">🏅 스티커판 (${S.badge.length}/${BADGES.length})</button>
      <button class="btn w sm" style="grid-column:1/-1" onclick="openStats()">🧾 내 기록 보기</button>
    </div>
  </div>`;
}
/* 🏅스티커판과 🧾내 기록은 도감 탭에 그대로 두면 스크롤이 너무 길어져서 창으로 뺐다.
   스티커가 예순세 장이라 이것만으로도 화면 두 개 분량이었다. */
function openBadges(){
  sfx('tap');
  openModal(`<h2>🏅 스티커판<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="muted" style="margin-bottom:8px">모은 스티커 <b>${S.badge.length} / ${BADGES.length}장</b> —
      스티커를 누르면 어떻게 받는지 알려줘요. 받으면 🍒토핑도 같이 와요!</div>
    <div class="stkgrid">${BADGES.map(b=>{
      const got=S.badge.includes(b.k);

        <div class="e">${got?b.em:'❔'}</div><div class="n">${got?b.n:'???'}</div></div>`;

function openStats(){

      <div class="muted" style="line-height:2">
        🥄 뜬 횟수 <b>${fmt(S.stats.scoop)}</b>번 · 🖐️ 쓰담쓰담 <b>${fmt(S.stats.pet)}</b>번<br>
        💫 ⭐5 만난 횟수 <b>${fmt(S.stats.best5||0)}</b>번 · ✨ ⭐4 <b>${fmt(S.stats.best4)}</b>번<br>
        💗 하트 <b>${totalHearts()}</b>개 · 🎀 꾸민 친구 <b>${dressedCount()}</b>마리<br>
        📖 도감 <b>${dexCount()} / ${NTUB}</b>마리 · 💞 믹스쮜 <b>${mixCount()}</b>마리<br>

/* ---------- 꾸미기(옷장) ----------
   소품은 한 번 사면 옷장에 남아서 모든 햄쮜가 돌려 입는다. */
let closetSlot='hat';
/* ⚠️ 값이 없는 소품(gift)은 여기서 걸러야 한다 — 안 그러면 상점에 🪙NaN 이 뜬다 */
function wearPriceHTML(it){ return it.gift?'🎪 축제 선물':(it.top?`🍒${it.top}`:`🪙${fmt(it.coin)}`); }
function canAffordWear(it){ return it.gift?false:(it.top ? S.top>=it.top : S.coin>=it.coin); }
function openCloset(k,slot){
  if(!S.dex[k]){ toast('먼저 이 햄쮜를 만나야 해요 🍨'); return; }
  if(slot) closetSlot=slot;
  const sl=closetSlot, w=wearOf(k), items=WEAR[sl].items;
  const tabs=WEAR_SLOTS.map(s=>{
    const on=wearOf(k)[s];
    return `<div class="${s===sl?'on':''}" onclick="openCloset('${k}','${s}')">
      <span class="e">${on?WEAR[s].items[on].em:WEAR[s].em}</span>${WEAR[s].name}</div>`;
  }).join('');
  const cards=Object.keys(items).map(key=>{
    const it=items[key], own=ownWear(sl,key), on=w[sl]===key;
    return `<div class="it ${on?'on':''} ${own||canAffordWear(it)?'':'no'}"
                onclick="${own?`equipWear('${k}','${sl}','${key}')`:`buyWear('${sl}','${key}','${k}')`}">
      ${on?'<span class="chk">✅</span>':''}
      <div class="e">${it.em}</div><div class="n">${it.name}</div>
      <div class="p">${own?(on?'입고 있어요':'입히기'):wearPriceHTML(it)}</div>
    </div>`;
  }).join('');
  const ownAny=WEAR_SLOTS.some(s=>Object.keys(WEAR[s].items).some(key=>ownWear(s,key)));
  openModal(`<h2>👗 ${nameOf(k)} 꾸미기<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="wprev">
      <span class="sp" style="left:4%;top:14%">✨</span><span class="sp" style="right:6%;top:26%;animation-delay:.5s">💗</span>
      <span class="sp" style="left:12%;bottom:8%;animation-delay:.9s">⭐</span>
      <span class="hs">${hamSVG(hamOf(k))}</span>
    </div>
    <div class="muted" style="text-align:center;margin-bottom:8px">
      ${wearCount(k)?`${wearCount(k)}가지를 입었어요${isFullSet(k)?' — <b>풀코디!</b> 🎀':''}`:'무엇을 입혀볼까요?'}
    </div>
    <div class="wrow">${tabs}</div>
    ${sl==='cone'?`<div class="muted" style="margin:-3px 0 7px;line-height:1.6">
      🍨 <b>햄쮜가 아이스크림 한 스쿱이 되어 콘 위에 올라앉아요.</b>
      모자·목걸이·손 소품도 같이 올라타요.
    </div>`:''}
    <div class="wpick">${cards}</div>
    <div class="row" style="justify-content:center;margin-top:10px">
      ${ownAny?`<button class="btn w sm" onclick="randomWear('${k}')">🎲 마음대로 꾸미기</button>`:''}
      ${wearCount(k)?`<button class="btn w sm" onclick="stripWear('${k}')">🧺 다 벗기</button>`:''}
      <button class="btn sm" onclick="openRename('${k}')">✏️ 이름 바꾸기</button>
    </div>
    <div class="muted" style="margin-top:8px;line-height:1.6">
      한 번 산 소품은 <b>옷장에 남아서</b> 다른 햄쮜도 돌려 입을 수 있어요.<br>
      머리·목·손을 다 채우면 <b>풀코디 스티커</b> 를 받아요 🎀
    </div>`);
}
/* k 를 주면 사자마자 그 햄쮜가 입는다. 상점에서는 k 없이 옷장에만 넣는다. */
function buyWear(slot,key,k){
  const it=WEAR[slot].items[key];
  if(ownWear(slot,key)){                                    /* 이미 있으면 두 번 사지 않는다 */
    if(k) equipWear(k,slot,key); else toast(`${it.em} ${eun(it.name)} 이미 옷장에 있어요`);
    return;
  }
  if(it.gift){ sfx('boo'); toast(`${it.em} ${eun(it.name)} 🎪축제 대상으로 받아요`); return; }
  if(!canAffordWear(it)){
    sfx('boo');
    toast(it.top?`🍒 토핑이 ${it.top-S.top}개 더 필요해요`:`🪙 코인이 ${fmt(it.coin-Math.floor(S.coin))} 더 필요해요`);
    return;
  }
  if(it.top) S.top-=it.top; else S.coin-=it.coin;
  S.closet.push(slot+'_'+key);
  sfx('coin');
  toast(`${it.em} ${eul('<b>'+it.name+'</b>')} 옷장에 넣었어요!`);
  if(k) equipWear(k,slot,key);
  else{ checkBadges(); save(); renderHUD(); renderView(); }
}
function equipWear(k,slot,key){
  const d=S.dex[k]; if(!d) return;
  if(!d.w) d.w={hat:null,neck:null,hand:null,cone:null};
  d.w[slot]=(d.w[slot]===key)?null:key;                     /* 같은 걸 또 누르면 벗는다 */
  sfx(d.w[slot]?'heart':'tap');
  if(d.w[slot]) errBump('dress');
  checkBadges(); save(); renderHUD(); renderView(); openCloset(k,slot);
}
function stripWear(k){
  const d=S.dex[k]; if(!d) return;
  d.w={hat:null,neck:null,hand:null,cone:null};
  sfx('tap'); save(); renderHUD(); renderView(); openCloset(k);
}
function randomWear(k){
  const d=S.dex[k]; if(!d) return;
  d.w={hat:null,neck:null,hand:null,cone:null};
  WEAR_SLOTS.forEach(s=>{
    const own=Object.keys(WEAR[s].items).filter(key=>ownWear(s,key));
    if(own.length && Math.random()<0.85) d.w[s]=pick(own);
  });
  sfx('star4'); checkBadges(); save(); renderHUD(); renderView(); openCloset(k);
  toast('🎲 짜잔! 이렇게 꾸며봤어요');
}
function openRename(k){
  openModal(`<h2>✏️ 이름 바꾸기<span class="x" onclick="openCloset('${k}')">뒤로</span></h2>
    <div class="big">${hamSVG(hamOf(k))}</div>
    <div class="card" style="margin:0">
      <h3>어떻게 불러줄까요?</h3>
      <input id="nm-in" class="tin" maxlength="8" placeholder="${baseName(k)}" value="${S.dex[k].name||''}"
             onkeydown="if(event.key==='Enter'){renameHam('${k}')}">
      <div class="row" style="margin-top:8px">
        <button class="btn" onclick="renameHam('${k}')">💕 이 이름으로!</button>
        <button class="btn w" onclick="resetName('${k}')">원래 이름(${baseName(k)})</button>
      </div>
      <div class="muted" style="margin-top:6px">한글 8자까지 쓸 수 있어요</div>
    </div>`);
  setTimeout(()=>{ const i=$('#nm-in'); if(i) i.focus(); },120);
}
function renameHam(k){
  const i=$('#nm-in');
  let v=i?String(i.value||'').trim().replace(/[<>&"'`]/g,'').slice(0,8):'';
  if(!v){ resetName(k); return; }
  S.dex[k].name=v; sfx('heart'); save(); renderView();
  toast(`💕 이제 <b>${v}</b> 라고 부를게요!`);
  openCloset(k);
}
function resetName(k){
  delete S.dex[k].name; sfx('tap'); save(); renderView();
  toast(`${baseName(k)} 로 되돌렸어요`);
  openCloset(k);
}

/* ==================================================================
   8. 상점
================================================================== */
function canBuyTub(f){
  if(S.open.includes(f.k)) return false;
  if(f.lv>S.lv) return false;
  return f.top ? S.top>=f.top : S.coin>=f.coin;
}
/* 주문 놀이를 아직 한 번도 안 해봤거나, 특별 햄쮜가 곧 열리면 알려준다 */
/* 🎮 놀이터 점 — 주문·대회·숨바꼭질·탐정·도장판·심부름 중에 「지금 할 수 있는 게」 있으면 켠다.
   놀이가 한 탭으로 모이면서, 이 점 하나가 「오늘 할 일이 남았어요」 신호가 된다. */
function orderDot(){
  if(!Object.keys(S.dex).length) return false;
  if(stampReady()||errReady()||contReady()||storyReady()||bdayReady()||tripBack()||sportReady()||travReady()||taleReady()||festReady()) return true;
  if(reqList().length) return true;   /* 🌟 부탁이 남아 있으면 놀이터에 점이 붙는다 */
  if(eggReady()||eggHatchable()) return true;   /* 🥚 품어줄 알이 있으면 */
  if(tripFree()>0 && tripPool().length) return true;   /* 🎒 보낼 자리와 갈 아이가 있다 */
  if(!cupLeft()||detLeft()) return true;
  if(!(S.ord.rounds||0)) return true;
  const n=spNext();
  return !!n && (S.ord.star||0) >= SPECIAL[n].star-3;
}
function storeDot(){
  return FLAVORS.some(canBuyTub) || UPG_KEYS.some(k=>upgLv(k)<UPG[k].max && S.coin>=upgCost(k));
}
/* 🛒 이미 산 소품·다 올린 장비는 기본으로 접어둔다 — 상점 스크롤이 「살 수 있는 것」만 남는다 */
function toggleShopAll(){ S.shopAll=!S.shopAll; sfx('tap'); save(); renderView(); }
function renderStoreTab(){
  const next=FLAVORS.filter(f=>!S.open.includes(f.k));
  const shown=next.slice(0,8);
  const tubs=shown.map(f=>{
    const lock=f.lv>S.lv, ok=canBuyTub(f);
    return `<div class="scard ${lock?'locked':''}">
      <span class="ic"><span style="display:block;width:44px;height:31px;margin:0 auto;border-radius:50% 50% 32% 32%;background:linear-gradient(160deg,${f.c2},${f.c});box-shadow:inset -4px -5px 0 rgba(0,0,0,.08)"></span></span>
      <b>${f.n}</b>
      <span class="fx">${lock?`🔒 가게 Lv.${f.lv}`:`사는 햄쮜<br><b>${f.hn}</b><br>${SHAPES[f.shape].name}·${COLORS[f.color].name}`}</span>
      <span class="pr">${f.top?`🍒 ${f.top}`:`🪙 ${fmt(f.coin)}`}</span>
      <button class="btn ${ok?'g':'w'} sm" ${ok?'':'disabled'} onclick="buyTub('${f.k}')">${lock?'잠김':'사기'}</button>
    </div>`;
  }).join('');
  const upsDone=UPG_KEYS.filter(k=>upgLv(k)>=UPG[k].max);
  const upsList=S.shopAll?UPG_KEYS:UPG_KEYS.filter(k=>upgLv(k)<UPG[k].max);
  const ups=upsList.map(k=>{
    const u=UPG[k], lv=upgLv(k), max=lv>=u.max, c=upgCost(k), open=upgOpen(k);
    /* 아직 레벨이 안 되면 무엇이 기다리는지만 보여준다 — 목표가 보여야 레벨을 올릴 마음이 생긴다 */
    if(!open) return `<div class="scard locked">
      <span class="ic">🔒</span><b>${u.name}</b>
      <span class="fx">${u.desc}<br><b>가게 Lv.${u.lv}</b> 부터 열려요</span>
      <span class="pr">🪙 ${fmt(u.base)} 부터</span>
      <button class="btn w sm" disabled>Lv.${u.lv} 필요</button>
    </div>`;
    return `<div class="scard">
      <span class="ic">${u.em}</span><b>${u.name}</b>
      <span class="fx">${u.desc}<br>지금 <b>Lv.${lv}</b> / ${u.max}</span>
      <span class="pr">${max?'✨ 최대':'🪙 '+fmt(c)}</span>
      <button class="btn ${max||S.coin<c?'w':'g'} sm" ${max||S.coin<c?'disabled':''} onclick="buyUpg('${k}')">${max?'완료':'올리기'}</button>
    </div>`;
  }).join('');
  const wearAll=[]; WEAR_SLOTS.forEach(sl=>Object.keys(WEAR[sl].items).forEach(key=>wearAll.push([sl,key])));
  const wearDone=wearAll.filter(([sl,key])=>ownWear(sl,key));
  const wearList=S.shopAll?wearAll:wearAll.filter(([sl,key])=>!ownWear(sl,key));
  const shopDone=wearDone.length+upsDone.length;
  const wears=wearList.map(([sl,key])=>{
    const it=WEAR[sl].items[key], own=ownWear(sl,key), ok=canAffordWear(it);
    return `<div class="scard ${own?'':(ok?'':'locked')}">
      <span class="ic">${it.em}</span><b>${it.name}</b>
      <span class="fx">${sl==='cone'?'이 콘 위에 올라앉아요':WEAR[sl].name+'에 달아요'}</span>
      <span class="pr">${own?'✅ 가지고 있어요':wearPriceHTML(it)}</span>
      <button class="btn ${own?'w':(ok?'g':'w')} sm" ${own||!ok?'disabled':''} onclick="buyWear('${sl}','${key}','')">${own?'옷장에 있음':'사기'}</button>
    </div>`;
  }).join('');

  $('#view').innerHTML=`
  ${shopDone?`<div class="card" style="padding:8px 10px">
    <button class="btn ${S.shopAll?'g':'w'} sm" style="width:100%" onclick="toggleShopAll()">
      ${S.shopAll?`🧺 이미 산 것 접어두기 (${shopDone}가지)`:`🧺 이미 산 것도 보기 (${shopDone}가지)`}</button>
    <div class="muted" style="margin-top:6px">${S.shopAll
      ? '이미 산 소품과 다 올린 장비까지 모두 보여주고 있어요.'
      : `이미 산 소품·다 올린 장비 <b>${shopDone}가지</b>는 접어두었어요 — <b>살 수 있는 것</b>만 보여요.`}</div>
  </div>`:''}
  <div class="card">
    <h3>🍧 새 아이스크림 통 <small>${unlocked().length} / ${NTUB}가지</small></h3>
    ${next.length

function buyUpg(k){
  const u=UPG[k], c=upgCost(k);
  if(upgLv(k)>=u.max){ toast('이미 최대예요'); return; }
  if(!upgOpen(k)){ sfx('boo'); toast(`🔒 가게 <b>Lv.${u.lv}</b> 부터 올릴 수 있어요`); return; }
  if(S.coin<c){ sfx('boo'); toast(`🪙 코인이 ${fmt(c-S.coin)} 더 필요해요`); return; }
  S.coin-=c; S.upg[k]=upgLv(k)+1; sfx('coin');
  /* 🪑자리 늘리기와 🏡넓은 가게는 둘 다 자리를 늘린다 */
  if(k==='seat'||k==='hall') for(let i=0;i<ROOMS.length;i++) if(S.rooms[i]) S.rooms[i].seat.push(null);
  addExp(14); save(); renderAll();
  toast(`${u.em} ${u.name} Lv.${upgLv(k)} 로 올렸어요!`);
}

    ['🧳','여행 가기','여행을 갈 때 <b>햄쮜를 가방에 넣어 데려가요</b> — 🎮놀이터의 <b>🧳여행 가기</b>에서 <b>세 마리까지</b> 고르면 돼요.<br>여행하는 동안 <b>하루에 한 번</b> 「오늘의 여행」을 누르면, 그날 있었던 일을 <b>엽서</b>로 써 보내고 <b>기념품</b>을 하나씩 주워 와요. 엽서에는 <b>진짜 그날 날씨와 지금 있는 곳 이름</b>이 들어간답니다 📍<br>🎒소풍과 달리 <b>방에서 빠지지 않아요</b> — 며칠씩 걸리니까 그동안 코인을 못 벌면 너무 아깝잖아요.<br>기념품은 <b>열두 가지</b>이고, 여행이 끝나도 <b>그대로 남아요</b>. 집에 오면 「🏠 여행 끝내기」를 눌러 큰 선물을 받으세요 🎁'],
    ['🏆','햄쮜 운동회','🎮놀이터에서 <b>하루에 한 번</b>, 햄쮜를 <b>네 마리까지</b> 내보내 세 종목을 겨뤄요.<br>🏃<b>달리기</b> — ⭐별이 많을수록 빨라요(오늘 <b>날씨</b>도 봐요) · 🪢<b>줄다리기</b> — 💗하트가 높을수록 힘이 세고 <b>👯단짝이 같이 나가면 1.5배</b> · 🎁<b>보물찾기</b> — <b>날마다 유리한 성격이 달라요</b>(미리 알려줘요!).<br>그러니까 <b>누구를 내보낼지</b> 고르는 게 놀이예요 — 그동안 모으고 키운 게 여기서 다 쓰여요. 1·2·3등에게 🥇🥈🥉메달과 💗하트를 주고, 1등은 신나서 <b>편지</b>를 써요!'],
    ['🏪','단골 손님','🔔주문 놀이를 하다 보면 <b>가게 밖에서 손님 햄쮜</b>가 찾아와요 — 모모 · 뚱이 · 별이 · 구름 · 포포 · 달래 · 쿠키 · 초코 · 딸랑이 · 풀잎 <b>열 마리</b>랍니다(도감에는 안 들어와요).<br>자꾸 오면 <b>단골</b>이 되고(♥ 다섯 단계), 단골일수록 <b>팁</b>을 더 줘요. 끝까지 단골이 되면 고맙다며 <b>🎁선물</b>을 놓고 가요!<br>손님마다 <b>좋아하는 맛</b>이 하나씩 있어요 — 그 맛을 <b>딱 맞게</b> 만들어 주면 알아낼 수 있고, 🎮놀이터의 <b>🏪손님 목록</b>에 적혀요.'],
    ['🎒','소풍 보내기','🎮놀이터에서 햄쮜를 <b>세 마리까지</b> 골라 소풍을 보낼 수 있어요 — 🏞️시냇가 · 🌳숲속 · ⛰️뒷산 · 🌊바닷가 · 🎡놀이공원. 가는 곳마다 <b>걸리는 시간</b>과 <b>선물</b>이 달라요.<br><b>게임을 꺼둬도 시간은 흘러요</b> — 이따 다시 켜면 돌아와 있어요! 돌아오면 🪙🍒선물과 함께 💗하트가 훌쩍 오르고, <b>같이 간 아이들끼리도 👯가까워져요</b>. 소풍 이야기는 <b>편지</b>로 써서 보내준답니다 💌<br>소풍 간 아이는 그동안 <b>방에 없어요</b> — 그동안은 코인을 못 벌어요.<br>처음엔 <b>한 무리</b>만 보낼 수 있는데, 🛒상점에서 <b>🎒소풍 가방</b>(Lv.15부터)을 올리면 <b>한 무리씩 더</b> 보낼 수 있어요 — 다 올리면 <b>네 무리</b>가 동시에 나가요!'],
    ['✏️','내가 먼저 편지 쓰기','💌우체통이나 📖도감 상세에서 <b>내가 먼저</b> 편지를 쓸 수 있어요. <b>인사 · 하고픈 말 · 맺음말</b>을 하나씩 골라 붙이면 편지가 되고, 보내면 그 아이가 <b>바로 답장</b>을 써줘요.<br>하고픈 말은 여섯 가지인데 <b>햄쮜마다 제일 듣고 싶은 이야기</b>가 달라요 — 맞히면 하트가 <b>두 배</b>! 알아낸 이야기는 📖도감에 적혀요. 하루에 <b>세 통</b>까지 쓸 수 있어요.'],
    ['💌','편지에 답장하기','편지를 읽고 <b>답장 세 개</b> 중 하나를 골라 보낼 수 있어요. 햄쮜마다 <b>좋아하는 답장</b>이 달라서, 맞히면 하트가 <b>두 배</b>로 올라요! 알아낸 답장은 📖도감에 적혀요.'],
    ['🌟','오늘의 친구','매일 아침 친구 한 마리가 <b>오늘의 친구</b>가 돼요. 그 친구를 쓰담쓰담하면 코인과 하트를 <b>두 배</b>로 받아요!'],
    ['🙈','숨바꼭질','아이스크림 컵 세 개 중 하나에 햄쮜가 숨어요. 맞히면 🍒토핑을 줘요. 8분에 한 번 할 수 있어요.'],
    ['🎮','놀이터 (탭)','아래 <b>🎮놀이터</b> 탭에 놀이가 다 모여 있어요 — 📅도장판·🎯심부름·🔔주문받기·🏆꾸미기 대회·🙈숨바꼭질·🕵️햄쮜 탐정.<br><b>🔔손님 주문받기</b> 는 한 판에 손님 <b>3명</b>이 차례로 와서 주문해요. 한 판에 손님 <b>3명</b>이 차례로 와서 주문해요. <b>콘 → 맛 → 토핑</b> 순서로 골라 주문서대로 만들면 한 칸에 1점 — 세 명 모두 딱 맞히면 <b>9점 = ⭐3개</b>! 틀려도 ⭐를 하나는 받아요. 잘못 골랐으면 <b>↩다시 고르기</b>. <b>쉬는 시간이 없어서</b> 하고 싶은 만큼 할 수 있어요.'],
    ['🎁','특별 햄쮜','주문 놀이로 모은 <b>⭐</b>가 쌓이면 <b>통에서는 안 나오는</b> 특별한 햄쮜가 하나씩 놀러 와요 — 🐰토끼쮜·🐤병아리쮜·🐱냥쮜·🧸곰돌쮜·🐼판다쮜·🌸꽃쮜·🦄유니콘쮜·🍮푸딩쮜·💎보석쮜·👼천사쮜·🫧퐁실쮜·🪨돌쮜·🌙꿈나라쮜 <b>열세 마리</b>! 📖도감이나 🎮놀이터 탭에서 눌러보면 알려줘요. 특별 햄쮜는 또 뜰 수 없으니 <b>🍒토핑으로 ⭐를 올려줄 수 있어요.</b>'],
    ['🏆','꾸미기 대회','하루에 한 번 열려요. 매일 <b>오늘의 주제 소품</b>이 정해지는데, 그 소품을 입은 햄쮜를 내보내면 점수가 <b>확</b> 올라요. 머리·목·손을 다 채우고(풀코디) 💗하트가 많으면 더 유리해요. 1등은 🥇 상품이 아주 커요!'],
    ['📸','사진첩','🏠놀이방 오른쪽 위 <b>📸</b> 를 누르면 지금 함께 있는 햄쮜들 사진을 찍어요. 테두리를 고르고 제목을 지어 <b>사진첩</b>에 12장까지 모을 수 있어요.'],
    ['💞','짝꿍 만들기','햄쮜 둘을 짝지어주면 <b>새 햄쮜</b>가 태어나요. 딸기쮜＋바나나쮜＝<b>딸바쮜</b>! 색깔도 두 햄쮜를 섞은 <b>세상에 하나뿐인 색</b>이에요. 📖도감 탭에서 만들 수 있어요(🍒'+MIX_TOP+', 둘 다 💗하트 '+MIX_NEED_HEART+'개 이상).'],
    ['🎵','춤추기','🏠놀이방에서 <b>🎵춤추기</b>를 고르고 아무 곳이나 누르면 노래가 나오고 다 같이 춤을 춰요. ⚽공놀이를 하면 햄쮜들이 <b>공을 우르르 쫓아갑니다</b>.'],
    ['🏠','놀이방 여러 개','🏠놀이방 탭 맨 위에서 <b>방을 골라</b> 옮겨다닐 수 있어요. 방은 모두 <b>열한 곳</b>이고 가게 레벨이 오르면 하나씩 열려요 — Lv.1 · 5 · <b>8 🌳마당</b> · 10 · 15 · <b>20 🧊냉장고</b> · 25 · <b>30 🌻뒷마당</b> · 35 · 45 · 55. 아직 안 열린 방은 <b>다음 한 곳만</b> 보여줘요. 한 방에는 <b>여섯 마리</b>까지 앉아요.<br>방마다 <b>이름과 배경을 따로</b> 정하고 <b>다른 햄쮜</b>를 둘 수 있어요. 한 마리는 한 방에만 있을 수 있고, ⏰저절로 모이는 코인은 <b>모든 방</b>의 햄쮜가 함께 벌어줘요!'],
    ['🏡','방마다 성격이 있어요','방은 이제 보기만 다른 게 아니에요 — <b>고른 🖼️배경이 곧 그 방의 성격</b>이랍니다!<br>☀️<b>낮 가게</b> 놀 때 코인 20% 더 · 🌙<b>밤하늘</b> 하트 25% 더 · 🏖️<b>바닷가</b> 노는 쉬는 시간 30% 짧게 · ❄️<b>눈나라</b> 🍒토핑이 더 자주 · 🌳<b>마당</b> 오늘 날씨 그대로 · 🌻<b>뒷마당</b> 🎒소풍이 15% 빨리 · 🧊<b>냉장고</b> 저절로 모이는 코인 25% 더.<br>그러니까 <b>어떤 아이를 어느 방에 둘지</b>가 중요해졌어요 — 👯단짝까지 같이 생각해보세요!'],
    ['🧊','냉장고와 뒷마당','두 방은 다른 방과 조금 달라요. <b>🧊냉장고</b>(Lv.20)는 배경을 고를 수 없고 늘 <b>냉장고 속</b>이에요 — 냉동실 문과 선반이 있답니다. <b>🌻뒷마당</b>(Lv.30)은 🌳마당처럼 <b>오늘 날씨</b>를 따라가고 <b>놀이기구</b>도 놓을 수 있어요. 앞마당보다 수수한 <b>텃밭</b>이랍니다.'],
    ['🌳','마당과 오늘 날씨','Lv.8이 되면 <b>🌳마당</b>이 열려요. 마당 배경은 내가 고르는 게 아니라 <b>지금 그곳의 진짜 날씨</b>를 따라가요 — 맑으면 파란 하늘, 비가 오면 어둑어둑, 눈이 오면 온통 하얘져요. 날씨가 좋으면 마당 햄쮜가 <b>코인을 더 많이</b> 벌고, ☔비·눈이 오는 날엔 <b>우산을 든 햄쮜</b>가 제일 잘 벌어요! 위치는 🎨 → 📍위치 정하기 에서 <b>폰 위치</b>나 <b>도시</b>로 정해요.'],
    ['🛝','마당 놀이기구','마당에는 가구 대신 <b>놀이기구</b>를 놓아요 — 🛝미끄럼틀 · 🎠회전목마 · 🪁연날리기 · 🏖️모래성 · 🎋그네. <b>누르면 햄쮜가 진짜로 타고 놀아요!</b> 탈 때마다 코인과 하트를 받고, 9초 쉬었다 또 탈 수 있어요. ⭐가 많고 💗하트가 많은 햄쮜가 탈수록 더 많이 받아요.'],
    ['🕵️','햄쮜 탐정','🍨탭 아래 <b>🕵️햄쮜 탐정</b> — 아이스크림 한 통이 사라졌어요! 내가 가진 햄쮜들이 <b>용의자</b>로 나오고, 힌트를 하나씩 열어보며 범인을 찾아요. 고를 기회는 <b>두 번</b>. 힌트를 <b>덜 보고</b> 맞히면 상이 더 커져요. 하루 3판이고, 🕹️<b>게임기</b>를 사두면 <b>5판</b>이 돼요.'],
    ['🎨','방 꾸미기','방 그림의 <b>오른쪽 위 🎨</b> 를 누르면 방 <b>이름</b>을 지어주고(「공주방」처럼!) <b>배경</b>을 고를 수 있어요. ☀️낮 가게 · 🌙밤하늘 · 🏖️바닷가 · ❄️눈나라 — 가게 레벨이 오르면 열려요.'],
    ['⚙️','설정 · 저장 코드','오른쪽 위 <b>⚙️</b> 에서 소리·진동을 끄고 켜요. <b>저장 코드</b>를 복사해두면 폰을 바꿔도 모은 햄쮜를 되살릴 수 있어요!'],
    ['⏰','가만히 있어도','방에 앉힌 햄쮜는 <b>저절로 코인</b>을 모아줘요. 게임을 꺼둔 동안에도 절반 속도로 최대 12시간 쌓입니다.'],
    ['✨','반짝 게이지 · 골든 스쿱','🍨뜨기 화면의 <b>✨반짝 게이지</b>가 가득 차면 다음에 뜨는 햄쮜는 <b>⭐3개 이상</b>이에요(15번마다 한 번). 🍒토핑 '+GOLD_TOP+'개를 더 얹는 <b>골든 스쿱</b>은 기다리지 않고 바로 ⭐3개 이상이 나옵니다.'],
    ['🎫','쿠폰','쿠폰 번호를 알고 있다면 🍨뜨기 화면 아래의 <b>🎫쿠폰</b> 에 적어보세요. 코인·토핑·예쁜 소품·새 통·방 가구를 선물로 받아요.']
  ];

const ERR_N=3;
function errOf(k){ return ERR.find(e=>e.k===k); }
function errToday(){
  const day=todayKey();
  if(!S.err || typeof S.err!=='object' || S.err.d!==day || !Array.isArray(S.err.t)){
    const bag=ERR.filter(e=>!e.ok || e.ok());
    const t=[];
    let r=daySeed();
    while(t.length<ERR_N && bag.length){
      r=(r*1103515245+12345)&0x7fffffff;
      const e=bag.splice(r%bag.length,1)[0];
      t.push({k:e.k, p:0});
    }
    S.err={d:day, t, got:0};
  }
  S.err.t=S.err.t.filter(x=>errOf(x.k));       /* 없어진 심부름은 버린다 */
  return S.err;
}
function errDone(){ return errToday().t.filter(x=>x.p>=errOf(x.k).n).length; }
function errAll(){ const e=errToday(); return e.t.length>0 && errDone()>=e.t.length; }
function errReady(){ return errAll() && !errToday().got; }

function errBump(k,by){
  const e=errToday(); const d=errOf(k); if(!d) return;
  let just=false;
  e.t.forEach(x=>{
    if(x.k!==k || x.p>=d.n) return;
    x.p=Math.min(d.n, x.p+(by||1));
    if(x.p>=d.n) just=true;
  });
  if(just){
    sfx('nw'); vib([0,25,45,25]);
    toast(errAll()? '🎯 심부름을 다 했어요! <b>선물을 받아요</b>' : `🎯 <b>${d.d}</b> 다 했어요!`);
    checkBadges();
  }
  save();
}

    </div>
    ${rev?`<div class="muted" style="text-align:center;margin-top:7px">
      맞힌 횟수 <b>${S.cup.win}</b>번 / 해본 횟수 ${S.cup.play}번</div>`:''}`);
}
function pickCup(i){
  if(cupPick>=0 || cupAns<0) return;                /* 한 판에 한 번만 */
  cupPick=i;
  S.cup.at=Date.now(); S.cup.play++; errBump('cup');
  const win=(i===cupAns), got=[];
  if(win){
    S.cup.win++;
    const t=ri(2,3), c=Math.ceil(120*(1+S.lv*0.25));
    S.top+=t; S.coin+=c; addBond(cupWho,6);
    toast(`🎉 정답! 🍒+${t} · 🪙+${fmt(c)}`);
  }else{
    const c=Math.ceil(60*(1+S.lv*0.2));
    S.coin+=c;
    toast(`🙈 아쉬워요! 그래도 🪙+${fmt(c)}`);
  }
  sfx(win?'nw':'boo'); vib(win?[0,35,55,35]:14); addExp(win?6:2); checkBadges(); save(); renderHUD();
  renderCup(true);
  setTimeout(()=>{ if(tab==='scoop'||tab==='play') renderView(); },10);
}
