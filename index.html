/* ==================================================================
   🕵️ 햄쮜 탐정 — 「누가 아이스크림을 몰래 먹었을까?」
   아이가 가진 햄쮜가 그대로 용의자로 나온다. 힌트를 하나씩 열어보며
   딱 한 마리만 남게 좁혀 간다. 방에 🕹️게임기를 놓으면 거기서도 열린다.
================================================================== */
const DET_BASE=3;                      /* 하루 세 판 */
/* 🕹️게임기를 사두면 두 판 더 — 방에 놓지 않아도 가지고만 있으면 된다 */
function detMax(){ return DET_BASE + (haveFurn('arcade')?2:0); }
const DET_N=6;                         /* 용의자 수 (가진 햄쮜가 적으면 줄어든다) */
/* 힌트 종류 — 한 마리를 보고 「맞다/아니다」를 딱 가를 수 있는 것만 쓴다 */
const DET_Q=[
  {k:'hat',   ask:h=>!!wearOf(h).hat,
   yes:'머리에 무언가를 쓰고 있었어요', no:'머리에는 아무것도 안 썼어요'},
  {k:'hand',  ask:h=>!!wearOf(h).hand,
   yes:'손에 무언가를 들고 있었어요',   no:'손에는 아무것도 안 들었어요'},
  {k:'neck',  ask:h=>!!wearOf(h).neck,
   yes:'목에 무언가를 걸고 있었어요',   no:'목에는 아무것도 안 걸었어요'},
  {k:'g3',    ask:h=>S.dex[h].g>=3,
   yes:'⭐가 세 개 이상이었어요',       no:'⭐가 두 개 이하였어요'},
  {k:'g4',    ask:h=>S.dex[h].g>=4,
   yes:'⭐가 네 개 이상이었어요',       no:'⭐가 세 개 이하였어요'},
  {k:'heart', ask:h=>hearts(h)>=2,
   yes:'하트가 두 개 이상이었어요',     no:'하트가 한 개 이하였어요'},
  {k:'sp',    ask:h=>isSp(h),
   yes:'🎁특별 햄쮜였어요',            no:'특별 햄쮜는 아니었어요'},
  {k:'mix',   ask:h=>isMix(h),
   yes:'💞짝꿍에서 나온 햄쮜였어요',    no:'짝꿍에서 나온 햄쮜는 아니었어요'},
  {k:'name3', ask:h=>nameOf(h).replace(/<[^>]*>/g,'').length>=4,
   yes:'이름이 네 글자 이상이었어요',   no:'이름이 세 글자 이하였어요'},
  {k:'tail',  ask:h=>!!SHAPES[hamOf(h).shape].tail,
   yes:'꼬리가 보였어요',              no:'꼬리는 안 보였어요'},
  {k:'ear',   ask:h=>{const e=SHAPES[hamOf(h).shape]; return !!(e.ears && e.ears(COLORS.cream)); },
   yes:'귀가 쏙 나와 있었어요',        no:'귀는 안 보였어요'}
];
function detToday(){
  const d=todayKey();
  if(S.det.d!==d){ S.det.d=d; S.det.n=0; S.det.win=0; }
  return S.det;
}
function detLeft(){ return Math.max(0, detMax()-detToday().n); }
let dg=null;                           /* 진행 중인 판 (저장하지 않는다) */
function detMake(){
  const own=Object.keys(S.dex);
  if(own.length<4) return null;
  /* 용의자를 뽑는다 */
  const pool=own.slice().sort(()=>Math.random()-0.5).slice(0, Math.min(DET_N, own.length));
  const who=pick(pool);
  /* 힌트를 하나씩 더해서 딱 한 마리만 남을 때까지 좁힌다 */
  const qs=DET_Q.slice().sort(()=>Math.random()-0.5);
  const clues=[]; let left=pool.slice();
  for(let n=0;n<qs.length && left.length>1;n++){
    const q=qs[n], v=q.ask(who);
    const kept=left.filter(k=>q.ask(k)===v);
    if(kept.length===left.length) continue;            /* 아무도 안 걸러지면 쓸모없는 힌트 */
    left=kept; clues.push({t:v?q.yes:q.no, k:q.k});
    if(clues.length>=4) break;
  }
  if(left.length!==1) return null;                     /* 못 좁혔으면 다시 뽑는다 */
  /* 힌트 하나로 끝나면 너무 쉽다 — 범인에게 맞는 힌트를 하나 더 붙여준다 */
  for(let n=0;n<qs.length && clues.length<2;n++){
    const q=qs[n];
    if(clues.some(c=>c.k===q.k)) continue;
    clues.push({t:q.ask(who)?q.yes:q.no, k:q.k});
  }
  clues.sort(()=>Math.random()-0.5);                   /* 답이 마지막 힌트에만 있지 않게 섞는다 */
  return {pool, who, clues, open:1, tries:0, done:false, win:false};
}
function openDet(){
  if(Object.keys(S.dex).length<4){
    sfx('boo'); toast('🕵️ 햄쮜가 <b>네 마리</b>는 있어야 탐정 놀이를 할 수 있어요 🍨'); return;
  }
  if(!detLeft() && !dg){
    sfx('boo'); toast(`🕵️ 오늘 탐정 놀이는 다 했어요 — 내일 또 와요! (하루 ${detMax()}판)`); return;
  }
  /* 진행 중이던 판이 가리키는 햄쮜가 저장을 바꾸면서 없어졌을 수 있다 —
     그대로 그리면 drawDet 이 S.dex[k].g 에서 죽어 창이 통째로 안 뜬다. 그럴 땐 새 판을 만든다. */
  if(dg && (!S.dex[dg.who] || dg.pool.some(k=>!S.dex[k]))) dg=null;
  if(!dg || dg.done){
    let g=null;
    for(let t=0;t<40 && !g;t++) g=detMake();
    if(!g){ sfx('boo'); toast('🕵️ 지금은 서로 너무 비슷해서 문제를 못 만들었어요 — 꾸미기를 해주면 쉬워져요 👗'); return; }
    dg=g; detToday().n++; S.det.all=S.det.all||0; save();
  }
  sfx('tap'); drawDet();
}
function detHint(){
  if(!dg||dg.done) return;
  if(dg.open>=dg.clues.length){ toast('🕵️ 힌트는 이게 다예요 — 잘 골라봐요!'); return; }
  dg.open++; sfx('tap'); drawDet();
}
function detPick(k){
  if(!dg||dg.done) return;
  if(k===dg.who){
    dg.done=true; dg.win=true;
    const bonus=Math.max(0, dg.clues.length-dg.open) + (dg.tries?0:1);   /* 힌트를 덜 보고 한 번에 맞히면 더 준다 */
    const coin=Math.ceil((300+S.lv*S.lv*18)*(1+bonus*0.4));
    const top=1+bonus;
    S.coin+=coin; S.top+=top; S.det.win++; S.det.all=(S.det.all||0)+1; errBump('det');
    addExp(14); addBond(k,4);
    sfx('star4'); vib([0,30,50,30,50,40]);
    checkBadges(); save(); renderHUD();
    drawDet({coin, top, bonus});
    return;
  }
  dg.tries++;
  sfx('boo'); vib(30);
  if(dg.tries>=2){
    dg.done=true; dg.win=false;
    save(); renderHUD(); drawDet();
    return;
  }
  toast(`🕵️ ${eun(nameOf(k))} 아니었어요 — 힌트를 다시 읽어봐요!`);
  drawDet();
}
function drawDet(pay){
  const done=dg.done;
  const cards=dg.pool.map(k=>{
    const out = done && k!==dg.who;
    return `<div class="dcard ${done&&k===dg.who?'g5':''}" style="${out?'opacity:.35':''}"
                 onclick="${done?'':`detPick('${k}')`}">
      ${done&&k===dg.who?'<span class="chk">🕵️</span>':''}
      <span class="st">${'★'.repeat(S.dex[k].g)}</span>
      ${isSp(k)?'<span class="kd" title="특별 햄쮜">🎁</span>'

    : `<div class="slot" onclick="detHint()"><span class="ph">❔</span>
         <div class="info"><b>힌트 ${i+1}</b><div class="muted">눌러서 열어보기</div></div>
         <span class="muted">열기 ▸</span></div>`).join('');
  openModal(`<h2>🕵️ 햄쮜 탐정<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="muted" style="line-height:1.7;margin-bottom:8px">
      🍨 <b>아이스크림 한 통이 사라졌어요!</b> 힌트를 읽고 범인 햄쮜를 찾아주세요.
      <br><span style="font-size:.94em">카드에 ★별 · 💗하트 · 🎁특별 · 💞짝꿍 이 적혀 있어요 — 힌트와 맞춰보세요!</span>
      <br>오늘 남은 판 <b>${detLeft()}</b> / ${detMax()} · 지금까지 맞힌 것 <b>${S.det.all||0}</b>번
      ${done?'':`<br>고를 기회는 <b>두 번</b>이에요 ${dg.tries?'— 한 번 틀렸어요!':''}`}
    </div>
    <div class="card" style="margin:0">${clues}</div>
    <div class="dexgrid" style="margin-top:9px">${cards}</div>
    ${done
      ? (dg.win
        ? `<div class="card" style="margin:9px 0 0;text-align:center">
             <h3>🎉 딩동댕! 범인은 ${nameOf(dg.who)}</h3>
             <div class="muted" style="line-height:1.8">
               🪙+${fmt(pay?pay.coin:0)} · 🍒+${pay?pay.top:0}
               ${pay&&pay.bonus?`<br>✨ 힌트를 덜 보고 맞혀서 <b>보너스</b>까지!`:''}
             </div>
           </div>`
        : `<div class="card" style="margin:9px 0 0;text-align:center">
             <h3>🕵️ 범인은 ${nameOf(dg.who)} 였어요</h3>
             <div class="muted">아쉬워요 — 다음엔 힌트를 하나 더 열어봐요!</div>
           </div>`)
      : ''}

      ${done && detLeft()

}

function spUpCost(id){ const g=S.dex[id]?S.dex[id].g:1; return [0,5,9,15,24,24][Math.min(5,g)]||24; }
function spUpOdds(id){
  const d=S.dex[id]; if(!d) return 0;

  const d=S.dex[id]; if(!d) return;

  S.top-=c;
  S.stats.spTry=(S.stats.spTry||0)+1;
  if(Math.random()<spUpOdds(id)){
    d.g++; d.sfail=0;

  }
}

function eggCare(){
  const e=egg();
  if(!e || !eggReady()){ sfx('boo'); return eggHome(); }
  e.care=(e.care|0)+1;
  e.d=todayKey();
  const coin=Math.round((400+S.lv*180)*(1+dexCount()*0.03));
  S.coin+=coin;
  _mailing=true;
  try{ [e.a,e.b].forEach(k=>{ if(S.dex[k]) addBond(k,12); }); } finally{ _mailing=false; }
  [e.a,e.b].forEach(k=>{ if(S.dex[k]) setMood(k,'happy'); });
  S.stats.egg=(S.stats.egg||0)+1;
  sfx('heart'); vib([0,25,45,25]);
  checkBadges(); save(); renderHUD(); renderView();
  const left=EGG_CARE-(e.care|0);
  toast(`🥚 폭신폭신 품어줬어요 — 🪙+${fmt(coin)} · 부모 💗+12씩`);
  if(left<=0){ eggHome(); return; }
  eggHome();
  mailAct(pick([e.a,e.b]),'egg',0.5);
}
function eggHatch(){
  const e=egg();
  if(!e || !eggHatchable()){ sfx('boo'); return eggHome(); }
  const a=e.a, b=e.b;
  if(!S.dex[a]||!S.dex[b]){ S.egg=null; save(); sfx('boo'); toast('🥚 부모 햄쮜가 없어졌어요'); return; }
  const key=babyKeyOf(a,b);
  if(S.dex[key]){ S.egg=null; save(); return openMixInfo(key); }
  const [x,y]=[String(a),String(b)].sort();
  const cx=anyCol(x), cy=anyCol(y);
  /* 아기는 부모 색을 섞은 뒤 <b>흰빛을 더 섞어</b> 뽀얗게 만든다 — 그래야 아기처럼 보인다 */
  const pale=h=>mixHex(mixHex(h,'#ffffff'),h);
  const da=S.dex[x], db=S.dex[y];
  let g=Math.max(1, Math.min(5, Math.round(((da.g||1)+(db.g||1))/2)));
  S.dex[key]={
    g, p:pick([da.p||'plain', db.p||'plain']), n:1, bond:0, over:0,
    since:Date.now(), anniv:0, w:{hat:null,neck:null,hand:null,cone:null},
    mix:{
      a:x, b:y, baby:1, born:Date.now(), stage:0,
      hn:babyNameOf(x,y),
      sa:anyShape(x), sb:anyShape(y),
      shape:ensureMixShape(anyShape(x), anyShape(y)),
      cone:pale(mixHex(anyCone(x), anyCone(y))),
      col:{ name:'아기 색',
            base :pale(mixHex(cx.base ,cy.base)),
            light:pale(mixHex(cx.light,cy.light)),
            dark :mixHex(cx.dark ,cy.dark),
            cheek:mixHex(cx.cheek,cy.cheek) }
    }
  };
  S.egg=null;
  S.stats.baby=(S.stats.baby||0)+1;
  addExp(40); sfx('nw'); vib([0,40,60,40,60,40,80]);
  _mailing=true;
  try{ [x,y].forEach(k=>addBond(k,25)); } finally{ _mailing=false; }
  checkBadges(); save(); renderHUD(); renderView();
  openModal(`<h2>🐣 태어났어요!<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="big burst" id="hambig">${hamSVG(hamOf(key))}</div>
    <div style="text-align:center;font-size:14.5px;line-height:1.9">
      <b style="font-size:17px">${nameOf(key)}</b> ${'⭐'.repeat(g)}<br>
      <span class="muted"><b>${nameOf(x)}</b>와 <b>${nameOf(y)}</b>의 아기예요</span></div>
    <div class="card" style="margin:9px 0 0;text-align:center;font-size:13.5px;line-height:1.9">
      아직 아주 <b>작아요</b> 🐣<br>
      <b>이틀</b>이 지나면 어린이가 되고, <b>닷새</b>가 지나면 다 커요.<br>
      <span class="muted">그동안 많이 놀아주세요 — 📖도감에서 볼 수 있어요</span></div>
    <div class="row" style="justify-content:center;margin-top:11px">
      <button class="btn" onclick="closeModal();openMixInfo('${key}')">🐣 보러 가기</button>
      <button class="btn w" onclick="closeModal()">반가워! 🥰</button></div>`);
  mailAct(key,'baby',1);
}
/* 자랐는지 살펴보고, 자랐으면 알려준다 — 30초마다 한 번씩 본다 */
function babyGrow(){
  const grew=[];
  babyKeys().forEach(k=>{
    const m=S.dex[k].mix, st=babyStage(k);
    if(st>(m.stage|0)){
      m.stage=st;
      /* 다 크면 이름에서 「아기」를 뗀다 — 아이가 직접 지어준 이름은 그대로 둔다 */
      if(babyGrown(k) && !S.dex[k].name) m.hn=String(m.hn||'').replace('아기쮜','쮜');
      grew.push(k);
    }
  });
  if(!grew.length) return grew;
  grew.forEach(k=>{
    const coin=Math.round((1400+S.lv*520)*(1+dexCount()*0.03));
    S.coin+=coin; S.top+=4;
    _mailing=true;
    try{ addBond(k,20); } finally{ _mailing=false; }
    setMood(k,'happy');
  });
  checkBadges(); save();
  return grew;
}

/* ==================================================================
   🍨 나만의 아이스크림 — 아이가 직접 만들어 이름을 짓고 간판에 건다.
   ⚠️ 콘 그림은 WEAR.cone 의 art() 를 그대로 쓴다(같은 그림을 두 벌 두지 않는다).
   ⚠️ 토핑 열쇠(MTOP 의 k)를 지우거나 바꾸면 안 된다 — 저장에 그대로 들어 있다.
================================================================== */
const MENU_MAX=6;               /* 여섯 개까지 저장 */
const MCONE=['cwaffle','csugar','cchoco','crain','ccup'];
const MTOP=[
  {k:'none',  em:'',   n:'없이'},
  {k:'cherry',em:'🍒', n:'체리'},
  {k:'straw', em:'🍓', n:'딸기'},
  {k:'choco', em:'🍫', n:'초코칩'},
  {k:'rain',  em:'🌈', n:'무지개 뿌리기'},
  {k:'cookie',em:'🍪', n:'쿠키'},
  {k:'star',  em:'⭐', n:'별사탕'},
  {k:'foam',  em:'🫧', n:'마시멜로'}
];
const MTOP_BY={}; MTOP.forEach(x=>MTOP_BY[x.k]=x);
function menuS(){
  if(!S.menu||typeof S.menu!=='object') S.menu={list:[], pick:-1};
  if(!Array.isArray(S.menu.list)) S.menu.list=[];
  return S.menu;
}
function menuList(){ return menuS().list; }
/* 간판에 걸린 메뉴 — 없으면 null */
function menuOn(){
  const m=menuS(), i=m.pick|0;
  return (i>=0 && m.list[i]) ? m.list[i] : null;
}
/* 간판 효과 — 스쿱이 많을수록, 토핑을 얹을수록 조금 더 */
function menuMul(){
  const m=menuOn(); if(!m) return 1;
  return 1 + 0.06 + 0.02*(m.sc||[]).length + ((m.top&&m.top!=='none')?0.03:0);
}
function menuPct(m){
  m=m||menuOn(); if(!m) return 0;
  return Math.round((0.06 + 0.02*(m.sc||[]).length + ((m.top&&m.top!=='none')?0.03:0))*100);
}
/* 🍨 그림 — 콘 위에 스쿱을 쌓고 꼭대기에 토핑을 얹는다.
   위로 쌓이므로 보이는 칸을 위쪽으로 넓힌다(viewBox 의 y 를 음수로). */
function sundaeSVG(m, w){
  if(!m) return '';
  const cone=WEAR.cone.items[MCONE.indexOf(m.cone)>=0?m.cone:'cwaffle'];
  const sc=(m.sc||[]).filter(k=>FL[k]).slice(0,3);
  const c0=sc.length?FL[sc[0]].c:'#ffd7e4';
  let g='';
  /* 아래에서 위로 — 뒤에 그린 것이 위에 온다 */
  const at=[{y:44,r:23},{y:24,r:21},{y:5,r:19}];
  sc.forEach((k,i)=>{
    const f=FL[k], a=at[i];
    const line=(COLORS[f.color]&&COLORS[f.color].dark)||'#d8a8bb';
    g+=`<circle cx="50" cy="${a.y}" r="${a.r}" fill="${f.c}" stroke="${line}" stroke-width="2.2"/>
        <ellipse cx="${50-a.r*0.34}" cy="${a.y-a.r*0.38}" rx="${a.r*0.34}" ry="${a.r*0.2}"
                 fill="#fff" opacity=".45" transform="rotate(-22 ${50-a.r*0.34} ${a.y-a.r*0.38})"/>`;
  });
  const t=MTOP_BY[m.top]||MTOP[0];
  if(t.em){
    const ty=sc.length?at[sc.length-1].y-at[sc.length-1].r+4:52;
    g+=`<text x="50" y="${ty}" text-anchor="middle" font-size="19">${t.em}</text>`;
  }
  const ww=w||110;
  return `<svg viewBox="-6 -22 112 128" width="${ww}" height="${Math.round(ww*128/112)}"
               xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;overflow:visible">
    ${cone.art(c0)}${g}</svg>`;
}
function menuName(m){ return (m&&m.n)||'이름 없는 아이스크림'; }
/* 만드는 중인 것 — 저장하기 전까지는 여기 있다 */

/* ⚠️ 다시 그릴 때 스크롤 자리를 지킨다 — 아래쪽 토핑을 고를 때마다 맨 위로 튀면 못 쓴다 */
function mkCone(k){ _mk.cone=k; sfx('tap'); reModal(menuMake); }

function mkUndo(){ _mk.sc.pop(); sfx('tap'); reModal(menuMake); }
function mkTop(k){ _mk.top=k; sfx('tap'); reModal(menuMake); }
/* ⚠️ 글자를 칠 때마다 창을 다시 그리면 키보드가 닫힌다 — 위쪽 이름만 살짝 갈아끼운다 */
function mkName(v){ _mk.n=String(v||'').slice(0,12); }

const REQT_KEYS=Object.keys(REQT);
function reqS(){ if(!S.req||typeof S.req!=='object') S.req={list:[], at:0}; if(!Array.isArray(S.req.list)) S.req.list=[]; return S.req; }
function reqList(){ return reqS().list.filter(r=>REQT[r.t] && S.dex[r.k]); }
function reqOk(r){ try{ return !!REQT[r.t].ok(r); }catch(e){ return false; } }
/* 지금 방에 앉아 있는 아이들 — 부탁은 앉아 있는 아이만 한다(안 보이는 아이가 조르면 찾기 힘들다) */
function seatPool(){
  const a=[]; openIdx().forEach(i=>roomHams(i).forEach(k=>{ if(a.indexOf(k)<0) a.push(k); }));
  return a;
}
function reqHas(k){ return reqList().some(r=>r.k===k); }
/* 새 부탁 하나 만들기 — 이미 이뤄진 부탁은 만들지 않는다 */
function reqMake(){
  const pool=seatPool().filter(k=>!reqHas(k));
  if(!pool.length) return null;
  for(let n=0;n<14;n++){
    const k=pick(pool), t=pick(REQT_KEYS), T=REQT[t];
    let v;
    try{ v=T.pick(k); }catch(e){ continue; }
    if(v===null || v===undefined) continue;
    const r={k, t, v, at:Date.now(),
             n0: t==='scoop' ? dexN(v) : (t==='photo' ? (S.album||[]).length : 0)};
    if(reqOk(r)) continue;                       /* 이미 이뤄진 것은 부탁이 아니다 */
    try{ r.say=T.say(k,v); }catch(e){ continue; }
    reqS().list.push(r);
    reqS().at=Date.now();
    return r;
  }
  return null;
}
function reqTick(){
  const q=reqS();
  if(reqList().length>=REQ_MAX) return null;
  if(Date.now()-(q.at||0) < (reqList().length?REQ_GAP:0)) return null;
  return reqMake();
}
function reqPay(){
  return {coin:Math.round((620+S.lv*300)*(1+dexCount()*0.03)), top:2+Math.floor(Math.random()*3), bond:18};
}
/* 이뤄진 부탁을 걷어 상을 준다 — 돌려주는 값은 방금 이뤄진 부탁들 */
function reqCheck(){
  const q=reqS(), done=[];
  q.list=reqList().filter(r=>{
    if(!reqOk(r)) return true;
    done.push(r);
    return false;
  });
  if(!done.length) return done;
  done.forEach(r=>{
    const p=reqPay();
    S.coin+=p.coin; S.top+=p.top;
    S.stats.req=(S.stats.req||0)+1;
    _mailing=true;
    try{ addBond(r.k,p.bond); } finally{ _mailing=false; }
    setMood(r.k,'happy');
    r.pay=p;
  });
  checkBadges(); save();
  return done;
}

const FEST_N=FEST.length;
function fest(){ if(!S.fest||typeof S.fest!=='object') S.fest={on:0,start:0,day:'',done:[],prize:0}; return S.fest; }
function festOn(){ return !!fest().on; }
function festDone(){ return (fest().done||[]).filter(k=>FEST.some(f=>f.k===k)); }
function festDayNo(){ return festOn()? Math.max(1, dayNo(Date.now())-dayNo(fest().start)+1) : 0; }
/* 오늘까지 열린 부스 수 — 하루에 하나씩 열린다 */
function festOpenN(){ return Math.min(FEST_N, festDayNo()); }
function festNext(){ return FEST.slice(0, festOpenN()).filter(f=>festDone().indexOf(f.k)<0)[0] || null; }
function festReady(){ return festOn() && !!festNext() && fest().day!==todayKey(); }
function festOver(){ return festDone().length>=FEST_N; }
function festPool(){
  const a=[]; openIdx().forEach(i=>roomHams(i).forEach(k=>{ if(a.indexOf(k)<0) a.push(k); }));
  return a.length?a:Object.keys(S.dex);
}
/* 점수 — ⭐등급과 💗하트가 밑바탕이고, 부스마다 유리한 성격이 크게 얹힌다 */
function festScore(k,f){
  const d=S.dex[k]||{};
  const g=(d.g||1)*8, b=Math.min(28,(d.bond||0)/4);
  const p=(personaKey(k)===f.best)?26:0;
  return g+b+p+Math.random()*24;
}
function festTier(sc){ return sc>=64?2:(sc>=40?1:0); }

function tale(){
  if(!S.tale||typeof S.tale!=='object') S.tale={ch:0, day:'', picks:[], hero:'', done:0};
  return S.tale;
}
function taleCh(){ return Math.min(tale().ch|0, TALE.length); }
function taleOver(){ return taleCh()>=TALE.length; }
/* 하루에 한 장만 — 그래야 열흘이 간다 */
function taleReady(){ return !taleOver() && tale().day!==todayKey() && Object.keys(S.dex).length>0; }
function taleHero(){
  const h=tale().hero;
  return (h && S.dex[h]) ? h : (seatHams()[0] || Object.keys(S.dex)[0] || '');
}
function taleHeroName(){ const h=taleHero(); return h?nameOf(h):'햄쮜'; }
function talePay(o){
  const base=Math.round((420+S.lv*220)*(1+dexCount()*0.05));
  return {coin:Math.round(base*o.coin), top:o.top, bond:o.bond};
}

/* ==================================================================
   🧩 짝 맞추기 — 카드를 뒤집어 같은 햄쮜 얼굴 둘을 찾는다.
   여기까지의 놀이는 다 「누르면 받는 것」이라 아이가 <b>스스로 잘해서</b> 이기는 자리가
   없었다. 이건 진짜로 기억을 쓰는 놀이다. 카드에 나오는 얼굴은 <b>내가 모은 햄쮜</b>다.
   ⚠️ <b>지는 법이 없다.</b> 시간 제한도, 실패도 없다 — 몇 번을 뒤집든 끝은 나고 별만 달라진다.
   ⚠️ 하루 제한도 없다. 큰 선물만 하루 한 번이고, 그 뒤에도 계속 놀 수 있다 —
      「오늘 할 일」이 하나 더 늘면 안 되고, 재미있어서 또 하는 놀이여야 한다.
================================================================== */
const MEM_LV=[
  {k:'e', em:'🐣', n:'쉬워요',   pairs:3, cols:3},
  {k:'m', em:'🐹', n:'보통',     pairs:6, cols:4},
  {k:'h', em:'🏆', n:'어려워요', pairs:8, cols:4}
];
const MEM_DAY=1;                        /* 큰 선물을 받는 횟수 (하루) */
function memS(){
  if(!S.mem||typeof S.mem!=='object'||Array.isArray(S.mem)) S.mem={best:{},day:'',n:0};
  if(!S.mem.best||typeof S.mem.best!=='object'||Array.isArray(S.mem.best)) S.mem.best={};
  return S.mem;
}
function memLvOf(k){ return MEM_LV.find(x=>x.k===k)||MEM_LV[0]; }
function memBonusLeft(){
  const m=memS();
  return m.day===todayKey() ? Math.max(0, MEM_DAY-(m.n|0)) : MEM_DAY;
}
function memBest(k){ const b=memS().best[k]; return (typeof b==='number'&&b>0)?b:0; }
/* 별 — 적게 뒤집을수록 많다. 아무리 많이 뒤집어도 <b>하나는 준다</b> */
function memStars(lv, moves){
  if(moves<=Math.ceil(lv.pairs*1.4)) return 3;
  if(moves<=Math.ceil(lv.pairs*2.3)) return 2;
  return 1;
}
/* 카드에 쓸 얼굴 — 방에 앉은 아이를 먼저 쓴다(눈에 익은 얼굴이라 기억하기 쉽다) */
function memPool(){
  const out=[];
  seatHams().forEach(k=>{ if(S.dex[k]&&out.indexOf(k)<0) out.push(k); });
  Object.keys(S.dex).forEach(k=>{ if(out.indexOf(k)<0) out.push(k); });
  return out;
}
/* ⚠️ 같은 얼굴이 두 쌍으로 들어가면 넉 장이 똑같아 보인다 — 마리 수가 모자라면 못 연다 */
function memOk(lv){ return Object.keys(S.dex).length >= lv.pairs; }
let _mg=null;                           /* 진행 중인 판 (저장하지 않는다) */
function openMem(){
  sfx('tap'); _mg=null;
  const own=Object.keys(S.dex).length;
  openModal(`<h2>🧩 짝 맞추기<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="muted" style="margin-bottom:9px;line-height:1.8">
      카드를 뒤집어 <b>같은 햄쮜 얼굴 둘</b>을 찾는 놀이예요 🃏<br>
      카드에 나오는 얼굴은 <b>내가 모은 햄쮜</b>랍니다.<br>
      <b>적게 뒤집을수록</b> ⭐가 많아요 — 시간 제한은 없어요, 천천히 해도 돼요 😊<br>
      ${memBonusLeft()>0
        ? '🎁 오늘 <b>첫 판</b>에는 선물이 <b>세 배</b>예요!'
        : '🎁 오늘 큰 선물은 받았어요 — 그래도 <b>얼마든지 더</b> 놀 수 있어요'}</div>
    ${MEM_LV.map(lv=>{
      const ok=memOk(lv), b=memBest(lv.k);
      return `<div class="slot ${ok?'on':''}" style="${ok?'':'opacity:.5'}"
                  onclick="${ok?`memStart('${lv.k}')`:`toast('🧩 햄쮜가 <b>${lv.pairs}마리</b>는 있어야 할 수 있어요 (지금 ${own}마리)')`}">
        <span class="ph">${lv.em}</span>
        <div class="info"><b>${lv.n}</b> — 카드 ${lv.pairs*2}장 (${lv.pairs}쌍)
          <div class="muted">${b?`제일 잘한 기록 <b>${b}번</b> 만에 다 맞췄어요`
                                :(ok?'아직 안 해봤어요':`햄쮜 ${lv.pairs}마리가 필요해요`)}</div></div>
        <span class="muted">${ok?'해볼래요 ▸':'🔒'}</span></div>`;
    }).join('')}
    <div class="row" style="justify-content:center;margin-top:11px">
      <button class="btn w" onclick="closeModal()">나중에</button></div>`);
}
function memStart(lk){
  const lv=memLvOf(lk);
  if(!memOk(lv)){ sfx('boo'); toast(`🧩 햄쮜가 <b>${lv.pairs}마리</b>는 있어야 해요`); return; }
  const pool=memPool().slice(0, lv.pairs);
  const cards=pool.concat(pool).sort(()=>Math.random()-0.5);
  _mg={lv, cards, up:[], got:[], moves:0, lock:false, ks:pool.slice()};
  sfx('tap');
  memBoard();
}
function memBoard(msg){
  if(!_mg) return openMem();
  const g=_mg, lv=g.lv;
  openModal(`<h2>${lv.em} ${lv.n}<span class="x" onclick="memQuit()">그만</span></h2>
    <div class="muted" id="mgtop" style="text-align:center;margin-bottom:8px;line-height:1.6">
      ${msg||`뒤집은 횟수 <b>${g.moves}</b>번 · 찾은 짝 <b>${g.got.length/2}</b>/${lv.pairs}`}</div>
    <div class="memgrid c${lv.cols}">${g.cards.map((k,i)=>`
      <div class="mcd" id="mc${i}" onclick="mgTap(${i})">
        <div class="in">
          <div class="bk">🍨</div>
          <div class="ft"><span class="hs">${hamSVG(hamOf(k))}</span></div>
        </div></div>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:11px">
      <button class="btn w sm" onclick="memQuit()">그만할래요</button></div>`);
}
/* 위쪽 글만 갈아끼운다 — 창을 다시 그리면 뒤집히던 카드가 멈춘다 */
function mgTop(){
  const el=$('#mgtop'); if(!el||!_mg) return;
  el.innerHTML=`뒤집은 횟수 <b>${_mg.moves}</b>번 · 찾은 짝 <b>${_mg.got.length/2}</b>/${_mg.lv.pairs}`;
}
function mgTap(i){
  const g=_mg; if(!g||g.lock) return;
  if(g.got.indexOf(i)>=0 || g.up.indexOf(i)>=0) return;
  const el=$('#mc'+i); if(!el) return;
  el.classList.add('up'); sfx('tap');
  g.up.push(i);
  if(g.up.length<2) return;
  g.moves++; mgTop();
  const [a,b]=g.up;
  if(g.cards[a]===g.cards[b]){
    g.up=[];
    g.got.push(a,b);
    setTimeout(()=>{
      [a,b].forEach(x=>{ const e=$('#mc'+x); if(e){ e.classList.remove('up'); e.classList.add('got'); } });
      sfx('heart'); vib(18); mgTop();
      if(g.got.length>=g.cards.length) setTimeout(memWin, 520);
    }, 160);
  }else{
    g.lock=true;
    [a,b].forEach(x=>{ const e=$('#mc'+x); if(e) e.classList.add('miss'); });
    setTimeout(()=>{
      [a,b].forEach(x=>{ const e=$('#mc'+x); if(e){ e.classList.remove('up','miss'); } });
      g.up=[]; g.lock=false;
    }, 700);
  }
}
function memPay(lv, stars, bonus){
  const coin=Math.round((300+S.lv*140)*(lv.pairs/3)*(0.6+0.22*stars)*(bonus?3:1)*(1+dexCount()*0.03));
  const top = bonus ? (stars>=3?6:(stars>=2?4:2)) : 0;
  return {coin, top};
}
function memWin(){
  const g=_mg; if(!g) return;
  const lv=g.lv, moves=g.moves, stars=memStars(lv,moves);
  const m=memS();
  if(m.day!==todayKey()){ m.day=todayKey(); m.n=0; }
  const bonus=memBonusLeft()>0;
  if(bonus) m.n=(m.n|0)+1;
  const best=memBest(lv.k);
  const isBest=!best || moves<best;
  if(isBest) m.best[lv.k]=moves;
  const pay=memPay(lv, stars, bonus);
  S.coin+=pay.coin; S.top+=pay.top;
  S.stats.mem=(S.stats.mem||0)+1;
  if(stars>=3) S.stats.mem3=(S.stats.mem3||0)+1;
  _mailing=true;
  try{ g.ks.forEach(k=>addBond(k,4)); } finally{ _mailing=false; }
  g.ks.forEach(k=>setMood(k,'happy'));
  addExp(3);
  sfx('star4'); vib([0,30,50,30,60]);
  const ks=g.ks.slice();
  _mg=null;
  checkBadges(); save(); renderHUD(); renderView();
  openModal(`<h2>🎉 다 맞췄어요!<span class="x" onclick="closeModal()">닫기</span></h2>
    <div style="text-align:center;font-size:34px;line-height:1.3" class="burst">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div style="text-align:center;font-size:14.5px;line-height:1.8;margin-top:2px">
      <b>${lv.n}</b>를 <b>${moves}번</b> 만에 다 맞췄어요!
      ${isBest?'<br><b style="color:var(--acc)">✨ 제일 잘한 기록이에요!</b>':
               `<br><span class="muted">제일 잘한 기록은 <b>${memBest(lv.k)}번</b>이에요</span>`}
    </div>
    <div class="row" style="justify-content:center;gap:4px;flex-wrap:wrap;margin-top:9px">
      ${ks.slice(0,6).map(k=>`<span class="hs" style="width:40px;height:40px;display:block">${hamSVG(hamOf(k))}</span>`).join('')}
    </div>
    <div class="score" style="margin-top:9px">
      <div class="tot"><span>${bonus?'🎁 오늘 첫 판 선물 (세 배!)':'받은 것'}</span>
        <b>🪙+${fmt(pay.coin)}${pay.top?` · 🍒+${pay.top}`:''}</b></div>
      <div class="tot"><span>같이 논 햄쮜</span><b>💗+4씩</b></div>
    </div>
    ${bonus?'':'<div class="muted" style="text-align:center;margin-top:6px">오늘 큰 선물은 받았지만 <b>얼마든지 더</b> 놀 수 있어요 😊</div>'}
    <div class="row" style="justify-content:center;margin-top:11px">
      <button class="btn g" onclick="memStart('${lv.k}')">🔄 한 판 더!</button>
      <button class="btn" onclick="openMem()">🧩 다른 난이도</button>
      <button class="btn w" onclick="closeModal()">그만할래요</button>
    </div>`);
  if(ks.length) mailAct(pick(ks),'mem',0.4);
}
function memQuit(){
  /* ⚠️ 그만두어도 아무 벌도 없다 — 되돌아가기만 한다 */
  _mg=null; sfx('tap'); openMem();
}

/* ==================================================================
   🧳 여행 가기 — 아이가 여행을 갈 때, 햄쮜를 가방에 넣어 데려간다.
   🎒소풍과 달리 <b>방에서 빠지지 않는다</b> — 며칠짜리라 손해까지 있으면
   여행 내내 가게가 멈춘다. 대신 하루에 한 번만 열 수 있다.
   엽서에는 그날의 <b>진짜 날씨와 진짜 지역 이름</b>이 들어간다.
================================================================== */
const TRAV_MAX=3;                       /* 가방에 넣을 수 있는 마리 수 */
/* 여행은 보통 사흘이다 — <b>사흘이면 기념품을 다 모을 수 있게</b> 날짜를 잡는다.
   ⚠️ 하루에 하나씩 주면 열두 밤이 걸려서, 진짜 여행이 끝나 집에 와도
   앨범이 텅 비어 있다. 아이가 여행하는 동안 끝나는 놀이여야 한다. */
const TRAV_DAYS=3;
function souvPerDay(){ return Math.ceil(SOUV.length/TRAV_DAYS); }
/* 부산 여행 기념품 — 하루에 souvPerDay()가지씩 줍는다. 다 모으면 여행 앨범이 된다 */
const SOUV=[
  {k:'hotteok', em:'🥟', n:'씨앗호떡',      d:'봉투가 뜨거워서 손을 호호 불었어요'},
  {k:'milmyeon',em:'🍜', n:'밀면',          d:'면이 미끄러워서 자꾸 놓쳤어요'},
  {k:'eomuk',   em:'🍢', n:'어묵 꼬치',     d:'국물이 제일 맛있었어요'},
  {k:'sand',    em:'🏖️', n:'해운대 모래',   d:'주머니에 넣었더니 다 새어 나왔어요'},
  {k:'bridge',  em:'🌉', n:'광안대교 사진', d:'밤에 다리에 불이 다 켜졌어요'},
  {k:'gamcheon',em:'🏘️', n:'감천마을 지도', d:'집들이 색깔별로 줄 서 있었어요'},
  {k:'shell',   em:'🐚', n:'자갈치 조개',   d:'귀에 대면 바다 소리가 나요'},
  {k:'feather', em:'🕊️', n:'갈매기 깃털',   d:'과자를 뺏길 뻔했어요'},
  {k:'camellia',em:'🌺', n:'동백꽃',        d:'책 사이에 끼워서 말릴 거예요'},
  {k:'tower',   em:'🗼', n:'부산타워 열쇠고리', d:'꼭대기에서 아래를 봤어요'},
  {k:'gukbap',  em:'🍲', n:'돼지국밥 그릇', d:'뜨거워서 후후 불면서 먹었어요'},
  {k:'train',   em:'🚋', n:'해변열차 표',   d:'창밖이 계속 바다였어요'}
];
const SOUV_BY={}; SOUV.forEach(x=>SOUV_BY[x.k]=x);
/* 엽서에 넣을 지역 이름 — 괄호 설명(「서울 (위치 대신)」)은 떼고 이름만 쓴다 */
function travPlace(){ return String(wxPlace()).replace(/\s*\(.*$/,'').trim() || '우리 동네'; }
function trav(){ if(!S.trav||typeof S.trav!=='object') S.trav={on:0,start:0,who:[],got:[],day:'',n:0}; return S.trav; }
function travOn(){ return !!trav().on; }
function travWho(){ return (trav().who||[]).filter(k=>S.dex[k]); }
/* 여행 며칠째인가 — 떠난 날이 1일째 */
function travDayNo(){ return travOn() ? Math.max(1, dayNo(Date.now())-dayNo(trav().start)+1) : 0; }
function travReady(){ return travOn() && trav().day!==todayKey() && travWho().length>0; }
function souvGot(){ return (trav().got||[]).filter(k=>SOUV_BY[k]); }
function souvLeft(){ return SOUV.filter(x=>souvGot().indexOf(x.k)<0); }
function travPool(){
  const a=[]; openIdx().forEach(i=>roomHams(i).forEach(k=>{ if(a.indexOf(k)<0) a.push(k); }));
  return a;
}
let _tv={who:[]};

      <b>기념품</b>을 ${souvPerDay()}가지씩 주워 와요 —

function travToggle(k){
  const i=_tv.who.indexOf(k);
  if(i>=0) _tv.who.splice(i,1);
  else{
    if(_tv.who.length>=TRAV_MAX){ sfx('boo'); toast(`🧳 가방에는 ${TRAV_MAX}마리까지만 들어가요`); return; }
    _tv.who.push(k);
  }
  sfx('tap'); reModal(openTravel);
}
function travStart(){
  const who=_tv.who.filter(k=>S.dex[k]);

        <b>${TRAV_DAYS}밤</b>이면 기념품을 다 모을 수 있어요</span>
    </div>

/* 오늘의 여행 — 하루에 한 번 */
function travToday(){
  if(!travReady()){ sfx('boo'); return travHome(); }
  const who=travWho();
  const t=trav();
  t.day=todayKey(); t.n=(t.n|0)+1;
  /* 기념품 — 아직 없는 것 중에서 <b>하루치</b>를 준다.
     ⚠️ souvLeft() 를 그대로 깎으면 안 된다(원본 배열이 아니라 새 배열이지만
     같은 것을 두 번 뽑지 않도록 뽑은 것은 빼면서 고른다). */
  const left=souvLeft().slice();
  const give=[];
  while(give.length<souvPerDay() && left.length){
    const x=pick(left);
    left.splice(left.indexOf(x),1);
    give.push(x); t.got.push(x.k);
  }
  const isNew = give.length>0;
  /* 열두 가지를 다 모은 뒤에도 빈손으로 보내지 않는다 — 하나를 또 줍는다 */
  if(!isNew) give.push(pick(SOUV));
  const sv=give[0];
  const day=travDayNo();
  const coin=Math.round((1400+S.lv*520)*(1+day*0.15)*who.length*(1+dexCount()*0.04)*(0.7+0.3*give.length));
  const top=Math.max(2, Math.round(4+day*1.4+give.length*1.5));
  S.coin+=coin; S.top+=top;
  S.stats.trav=(S.stats.trav||0)+1;
  _mailing=true;
  try{ who.forEach(k=>addBond(k,18)); pbPlayRoom(who); } finally{ _mailing=false; }
  who.forEach(k=>setMood(k,'happy'));
  sfx('gift'); vib([0,25,40,25,50]);
  checkBadges(); save(); renderHUD(); renderView();
  const k=pick(who);
  openModal(`<h2>🧳 여행 ${day}일째<span class="x" onclick="closeModal()">닫기</span></h2>
    <div class="burst" style="text-align:center;font-size:15px;font-weight:800;line-height:1.4">
      ${isNew?`🎁 기념품 <b>${give.length}가지</b>를 주워 왔어요!`
             :`🎁 <b>${sv.n}</b>${eul(sv.n)} 또 주웠어요`}</div>
    <div style="margin-top:7px;display:grid;gap:5px">
      ${give.map(x=>`<div style="display:flex;align-items:center;gap:8px;background:var(--card);
          border:2px solid var(--line);border-radius:11px;padding:5px 9px">
        <span style="font-size:25px;flex:0 0 auto;line-height:1.1">${x.em}</span>
        <span style="min-width:0"><b style="font-size:12.5px">${x.n}</b>
          <div class="muted" style="font-size:11px;line-height:1.45">${x.d}</div></span>
      </div>`).join('')}
    </div>
    <div class="score" style="margin-top:10px">
      <div><span>📍 오늘 있는 곳</span><b>${travPlace()} ${wxNow().em} ${wxNow().n}</b></div>
      <div><span>🎁 모은 기념품</span><b>${souvGot().length} / ${SOUV.length}가지</b></div>
      <div class="tot"><span>오늘 받은 것</span><b>🪙+${fmt(coin)} · 🍒+${top}</b></div>
      <div class="tot"><span>같이 간 햄쮜</span><b>💗+18씩</b></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:11px">
      <button class="btn" onclick="closeModal();openPost()">💌 엽서 읽기</button>
      <button class="btn w" onclick="travHome()">🧳 여행 수첩</button>
    </div>`);
  /* 💌 엽서 — 부산 이야기가 담긴 것과 여행 이야기가 담긴 것을 섞어 보낸다.
     ⚠️ 부산 엽서는 <b>여행에서만</b> 온다(쿠폰으로 미리 주지 않는다). */
  mailAct(k, Math.random()<0.5?'busan':'trav', 1);
}

/* ==================================================================
   🏆 햄쮜 운동회 — 하루에 한 번, 내 햄쮜 넷을 내보내 세 종목을 겨룬다.
   종목마다 <b>무엇이 유리한지 미리 알려준다</b> — ⭐별 · 💗하트 · 🎭성격 · 👯단짝 · 🌤️날씨.
   그러니까 놀이는 「누구를 내보낼까」이고, 그동안 모아온 것들이 여기서 한꺼번에 쓰인다.
   보물찾기에 유리한 성격은 <b>날마다 바뀐다</b> — 어제 1등이 오늘도 1등이면 고를 이유가 없다.
================================================================== */
const SPORT_N=4;                        /* 내보낼 수 있는 마리 수 (📣응원 깃대로 늘어난다) */
function sportMax(){ return SPORT_N+upgLv('cheer'); }
function sportSeed(){
  let h=2166136261; const t='sport!'+todayKey();
  for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=(h*16777619)>>>0; }
  return h;
}
/* 오늘 🎁보물찾기에 유리한 성격 — 날마다 바뀐다 */
function sportPersona(){ return PERSONA_KEYS[sportSeed()%PERSONA_KEYS.length]; }
function sportReady(){ return !(S.sport && S.sport.d===todayKey()); }
/* 오늘 날씨가 달리기에 어떤가 — 마당 날씨를 그대로 쓴다 */
function sportWx(){
  const w=wxNow();
  if(w.wet)  return {m:0.8, d:`${w.em} ${w.n} — 바닥이 미끄러워서 <b>달리기가 조금 어려워요</b>`};
  if(w.mul>=1.2) return {m:1.2, d:`${w.em} ${w.n} — 날이 좋아서 <b>달리기가 잘 돼요</b>`};
  return {m:1, d:`${w.em} ${w.n} — 달리기에 딱 좋지도 나쁘지도 않아요`};
}
const SPORT_EV=[
  {k:'run', em:'🏃', n:'달리기',   d:'⭐<b>별</b>이 많을수록 빨라요 · 오늘 <b>날씨</b>도 봐요'},
  {k:'tug', em:'🪢', n:'줄다리기', d:'💗<b>하트</b>가 높을수록 힘이 세요 · 👯<b>단짝</b>이 같이 나오면 <b>1.5배</b>'},
  {k:'hunt',em:'🎁', n:'보물찾기', d:'오늘은 <b>어떤 성격</b>이 잘 찾을까요? (날마다 달라요)'}
];
/* 한 종목 점수 — 뽑기 운을 조금 섞어서 늘 같은 아이만 이기지 않게 한다 */
function sportScore(k, ev, team){
  const d=S.dex[k]; if(!d) return 0;
  const luck=Math.random()*3;
  if(ev==='run'){
    return (d.g||1)*3*sportWx().m + luck;
  }
  if(ev==='tug'){
    const b=buddyOf(k);
    const withBuddy = b && team.indexOf(b)>=0;
    return hearts(k)*2.2*(withBuddy?1.5:1) + luck;
  }
  /* hunt */
  return (personaKey(k)===sportPersona()?7:2.2) + luck;
}
let _sp={who:[]};

  const a=[];

  else{
    if(_sp.who.length>=sportMax()){ sfx('boo'); toast(`🏆 ${sportMax()}마리까지만 나갈 수 있어요`); return; }
    _sp.who.push(k);
  }
  sfx('tap'); reModal(openSport);

const SPORT_MEDAL=['🥇','🥈','🥉'];
function sportGo(){
  if(!sportReady()){ sfx('boo'); return; }
  const team=_sp.who.filter(k=>S.dex[k]);
  if(team.length<2){ sfx('boo'); return; }
  /* 종목별 점수를 내고 합쳐서 줄을 세운다 */
  const rows=team.map(k=>{
    const ev={};
    SPORT_EV.forEach(e=>ev[e.k]=sportScore(k,e.k,team));
    const tot=SPORT_EV.reduce((a,e)=>a+ev[e.k],0);
    return {k, ev, tot};
  }).sort((a,b)=>b.tot-a.tot);
  const total=Math.round(rows.reduce((a,r)=>a+r.tot,0));
  const base=Math.round((700+S.lv*380)*(1+dexCount()*0.05));
  const coin=Math.round(base*(0.7+total/60));
  const top=3+Math.floor(total/14);
  S.coin+=coin; S.top+=top;
  S.stats.sport=(S.stats.sport||0)+1;
  if(!Array.isArray(S.sportWin)) S.sportWin=[];
  if(S.sportWin.indexOf(rows[0].k)<0) S.sportWin.push(rows[0].k);
  _mailing=true;
  try{
    rows.forEach((r,i)=>addBond(r.k, i===0?14:(i===1?10:7)));
    pbPlayRoom(team);                    /* 같이 나간 아이들은 부쩍 가까워진다 */
  } finally{ _mailing=false; }
  const res={d:todayKey(), pers:sportPersona(), wx:sportWx().d,
             rows:rows.map(r=>({k:r.k, ev:{run:Math.round(r.ev.run*10)/10, tug:Math.round(r.ev.tug*10)/10, hunt:Math.round(r.ev.hunt*10)/10},
                                tot:Math.round(r.tot*10)/10})),
             coin, top};
  S.sport={d:todayKey(), res};
  team.forEach(k=>setMood(k,'happy'));
  sfx('star4'); vib([0,30,50,30,50,30,60,40]);
  checkBadges(); save(); renderHUD(); renderView();
  sportShow(res);
  mailAct(rows[0].k,'sport',0.9);
}

/* ==================================================================
   🏪 단골 손님 — 지금까지 손님은 늘 「내 햄쮜」였다. 이제 <b>가게 밖에서 오는 손님 햄쮜</b>가 섞인다.
   자꾸 오는 손님은 단골이 되고, 단골이 될수록 <b>팁</b>을 더 준다.
   손님마다 <b>좋아하는 맛</b>이 하나씩 있는데, 그 맛을 딱 맞게 만들어 주면 알아낼 수 있다.
   ⚠️ 손님은 도감에 들어오지 않는다 — 모으는 아이와 대접하는 손님은 다른 재미다.
================================================================== */
const GUESTS=[
  {k:'g1',  hn:'모모',    em:'🎀', shape:'round',  color:'peach', p:'plain',  c:'#ffd9c2',
   line:'저 또 왔어요! 오늘도 잘 부탁해요'},
  {k:'g2',  hn:'뚱이',    em:'🍯', shape:'bun',    color:'honey', p:'spot',   c:'#f7d9a8',
   line:'배가 고파서 뛰어왔어요… 큰 걸로요!'},
  {k:'g3',  hn:'별이',    em:'⭐', shape:'star',   color:'gold',  p:'plain',  c:'#ffe9a8',
   line:'반짝이는 걸로 주세요! 반짝!'},
  {k:'g4',  hn:'구름',    em:'☁️', shape:'cloud',  color:'sky',   p:'plain',  c:'#d9ecff',
   line:'…(조용히 손가락으로 가리켜요)'},
  {k:'g5',  hn:'포포',    em:'🫧', shape:'fizz',   color:'aqua',  p:'socks',  c:'#cdeef2',
   line:'톡톡 튀는 거! 톡톡한 거요!'},
  {k:'g6',  hn:'달래',    em:'🌙', shape:'moon',   color:'lav',   p:'stripe', c:'#e2d3f7',
   line:'밤에 먹을 거예요. 조용한 맛으로요'},
  {k:'g7',  hn:'쿠키',    em:'🍪', shape:'cookie', color:'cocoa', p:'patch',  c:'#e0bb92',
   line:'한 입만 베어 물 거예요. 진짜로요'},
  {k:'g8',  hn:'초코',    em:'🐹', shape:'round',  color:'coal',  p:'tux',    c:'#c9c3d1',
   line:'멋있는 걸로 주세요. 멋있는 거요'},
  {k:'g9',  hn:'딸랑이',  em:'🔔', shape:'jelly',  color:'rose',  p:'spot',   c:'#ffd4e6',
   line:'딸랑딸랑! 저 왔다고 알리는 거예요'},
  {k:'g10', hn:'풀잎',    em:'🌿', shape:'leafy',  color:'grass', p:'plain',  c:'#d8eec0',
   line:'초록초록한 걸 제일 좋아해요'}
];
const GUEST_LV=[0,3,8,15,25,40];        /* 몇 번 대접하면 단골 몇 단계가 되는지 */
const GUEST_MAX=GUEST_LV.length-1;
function guestOf(gk){ return GUESTS.find(g=>g.k===gk)||GUESTS[0]; }
function guestRec(gk){
  if(!S.guests || typeof S.guests!=='object') S.guests={};
  if(!S.guests[gk]) S.guests[gk]={n:0, fk:'', fav:0, gift:0};
  return S.guests[gk];
}
function guestMet(gk){ return !!(S.guests && S.guests[gk] && S.guests[gk].n>0); }
function guestLv(gk){
  const n=(S.guests&&S.guests[gk]&&S.guests[gk].n)||0;
  let lv=0;
  for(let i=1;i<GUEST_LV.length;i++) if(n>=GUEST_LV[i]) lv=i;
  return lv;
}
function guestHearts(gk){ const lv=guestLv(gk); return '♥'.repeat(lv)+'♡'.repeat(GUEST_MAX-lv); }
/* 손님이 좋아하는 맛 — 처음 만난 날 내가 가진 통 중에서 하나 정해서 적어둔다.
   가진 통에서 골라야 아이가 실제로 만들어 줄 수 있다. */
function guestFav(gk){
  const r=guestRec(gk), pool=unlocked();
  if(!r.fk || !FL[r.fk] || pool.indexOf(r.fk)<0){
    r.fk = pool.length ? pool[Math.floor(Math.random()*pool.length)] : '';
  }
  return r.fk;
}
/* 단골일수록 팁을 더 준다. 🍰손님 방석은 그 위에 한 칸당 5%씩 더 얹는다 */
/* 🍨 간판에 메뉴가 걸려 있으면 손님이 기분 좋게 팁을 더 준다 */
function guestTip(gk){ return (1+guestLv(gk)*0.12+upgLv('guest')*0.05)*(menuOn()?1.1:1); }
function guestHam(gk){
  const g=guestOf(gk);
  return {shape:g.shape, color:g.color, pattern:g.p, grade:3, cone:null};
}
/* 손님이 얼마나 자주 오는지 — 처음 몇 판은 안 오다가 차차 반반이 된다 */
function guestChance(){
  const r=S.ord.rounds||0;
  if(r<1) return 0;
  /* 🍰손님 방석 한 칸에 4%씩 더 자주 온다.
     ⚠️ 상한도 같이 올려야 한다 — 상한이 0.5로 고정이면 열일곱 판만 해도 이미 상한이라
     방석을 아무리 사도 아무 일이 안 일어난다(처음에 그렇게 만들었다가 고쳤다). */
  const g=upgLv('guest');
  return Math.min(0.5+g*0.04, 0.2+r*0.03+g*0.04);
}
function guestPick(){
  /* 이미 만난 손님이 다시 올 확률을 높인다 — 그래야 단골이 쌓인다 */
  const met=GUESTS.filter(g=>guestMet(g.k));
  if(met.length && Math.random()<0.7) return pick(met).k;
  return pick(GUESTS).k;
}
/* 손님 카드에 쓰는 이름·그림 — 내 햄쮜 손님과 밖에서 온 손님을 한 자리에서 다룬다 */
function custName(c){ return c && c.g ? guestOf(c.g).hn : nameOf(c&&c.who); }
function custEm(c){ return c && c.g ? guestOf(c.g).em : ''; }
function custSVG(c){ return c && c.g ? hamSVG(guestHam(c.g)) : hamSVG(hamOf(c.who)); }

/* ---- 한 판 ---- */
let og=null;                            /* 진행 중인 판 (저장하지 않는다) */
/* 🙈 기억 손님 — 주문서가 잠깐 보였다가 사라진다. 기억해서 만들면 🍒토핑을 더 준다.
   처음 몇 판은 나오지 않는다 — 규칙부터 익히고 나서 어려워져야 재미있다. */
const MEMO_FROM=3, MEMO_SHOW=4200, MEMO_PEEK=2200;
function memoChance(){ return (S.ord.rounds||0)>=MEMO_FROM ? 0.34 : 0; }
let memoTimer=null;
function memoHide(c,ms){
  clearTimeout(memoTimer);
  memoTimer=setTimeout(()=>{
    if(og && og.cur===c && !og.done){ c.hid=true; if(tab==='order') renderView(); }
  }, ms);
}
/* 손님이 바뀔 때마다 불러준다 — 기억 손님이면 주문서를 감출 시계를 건다 */
function armMemo(){
  clearTimeout(memoTimer); memoTimer=null;
  const c=og&&og.cur;
  if(c && c.memo && !c.hid) memoHide(c, MEMO_SHOW);
}
/* 👀 살짝 다시 보기 — 한 번 보면 기억 상은 못 받지만, 아이가 막막해지지 않게 길을 열어둔다 */
function ordPeek(){
  const c=og&&og.cur;
  if(!c || !c.memo || !c.hid || og.done) return;
  c.peek=true; c.hid=false; sfx('tap');
  renderView(); memoHide(c, MEMO_PEEK);
}
function newCustomer(prev){
  const own=Object.keys(S.dex), pool=unlocked();
  /* 🏪 밖에서 온 손님이냐, 내 햄쮜냐 */
  let g=null, who=null;
  if(Math.random()<guestChance()){
    let tryN=0;
    g=guestPick();
    while(g===prev && tryN++<6) g=guestPick();
  }else{
    who=pick(own); let tryN=0;
    while(own.length>1 && who===prev && tryN++<6) who=pick(own);
  }
  /* 단골 손님은 좋아하는 맛을 자주 시킨다 — 그래야 아이가 무엇을 좋아하는지 알아낼 수 있다 */
  let fl=pick(pool);
  if(g){ const fk=guestFav(g); if(fk && pool.indexOf(fk)>=0 && Math.random()<0.55) fl=fk; }
  const opts=[fl], want=Math.min(4,pool.length);
  while(opts.length<want){ const c=pick(pool); if(opts.indexOf(c)<0) opts.push(c); }
  opts.sort(()=>Math.random()-0.5);
  return {who, g, want:{cn:pick(CONE_KEYS), fl, tp:pick(TOP_KEYS)},
          got:{cn:null,fl:null,tp:null}, opts, step:0, hit:-1,
          memo:Math.random()<memoChance(), hid:false, peek:false};
}
function startRound(){
  if(!Object.keys(S.dex).length){ sfx('boo'); toast('먼저 햄쮜를 만나야 손님이 와요 🍨'); return; }
  og={i:0, sc:0, log:[], cur:newCustomer(null), done:false, pay:null, newSp:[], streak:0, memoHit:0};
  sfx('tap'); if(tab==='order') renderAll(); else go('order');
  armMemo();
}
function quitRound(){ clearTimeout(memoTimer); memoTimer=null; og=null; sfx('tap'); renderView(); }
function ordPick(v){
  if(!og||og.done||!og.cur) return;
  const c=og.cur, st=c.step;
  if(st<0||st>2) return;
  c.got[ORD_STEP[st]]=v; c.step++;
  sfx(st===1?'scoop':'tap'); vib(10);
  renderView();
  if(c.step>=3) setTimeout(serveCustomer,560);      /* 다 만든 모습을 잠깐 보여준다 */
}
function ordBack(){
  if(!og||og.done||!og.cur||og.cur.step<=0||og.cur.step>=3) return;
  og.cur.step--; og.cur.got[ORD_STEP[og.cur.step]]=null;
  sfx('tap'); renderView();
}
function serveCustomer(){
  if(!og||og.done||!og.cur||og.cur.step<3) return;
  const c=og.cur, w=c.want, g=c.got;
  clearTimeout(memoTimer); memoTimer=null;
  c.hit=(g.cn===w.cn?1:0)+(g.fl===w.fl?1:0)+(g.tp===w.tp?1:0);
  og.sc+=c.hit;
  og.log.push({who:c.who, g:c.g, hit:c.hit, want:w, got:g, memo:c.memo, peek:c.peek});
  S.ord.done=(S.ord.done||0)+1;
  if(c.hit===3){
    S.ord.perfect=(S.ord.perfect||0)+1; sfx('nw');
    /* 🙈 기억 손님을 「다시 보기」 없이 맞히면 상을 준다 */
    if(c.memo && !c.peek){ S.top+=1; og.memoHit++; toast('🙈 <b>기억 손님</b> 주문을 딱 맞혔어요! 🍒+1'); }
  }
  else sfx(c.hit?'coin':'boo');
  /* 🔥 연달아 딱 맞히면 코인을 더 준다 — 한 명 한 명이 이어져 있다는 느낌을 준다 */
  og.streak = c.hit===3 ? (og.streak||0)+1 : 0;
  if(og.streak>=2){
    const b=Math.ceil(60*og.streak*(1+S.lv*0.15));
    S.coin+=b; toast(`🔥 <b>${og.streak}명 연속</b> 딱 맞혔어요! 🪙+${fmt(b)}`);
  }
  if(c.g) guestServed(c);
  else    addBond(c.who, c.hit===3?6:3);
  errBump('cust'); if(c.hit===3) errBump('hit');
  og.i++;
  if(og.i>=ORD_N){ finishRound(); return; }
  og.cur=newCustomer(c.g||c.who);
  save(); renderHUD(); renderView();
  armMemo();
}
/* 🏪 밖에서 온 손님을 대접하고 나서 */
function guestServed(c){
  const gk=c.g, gd=guestOf(gk), r=guestRec(gk), was=guestLv(gk);
  r.n=(r.n|0)+1;
  S.stats.guest=(S.stats.guest||0)+1;
  const lv=guestLv(gk);
  /* 단골일수록 팁을 더 준다 */
  const tip=Math.ceil((40+S.lv*22)*(c.hit/3)*guestTip(gk));
  if(tip>0) S.coin+=tip;
  og.tip=(og.tip||0)+tip;
  /* 좋아하는 맛을 딱 맞게 만들어 주면 알아낸다 */
  if(c.hit===3 && c.want.fl===r.fk && !r.fav){
    r.fav=1;
    sfx('star4');

function joinContest(k,ok){
  if(!contReady()){ sfx('boo'); toast('오늘 대회는 이미 끝났어요 🎀'); return; }
  if(!S.dex[k]) return;
  /* 아무것도 안 입힌 채로 하루 한 번을 써버리지 않게 한 번 되묻는다 */
  if(!ok && wearCount(k)===0){ contWarn=k; sfx('boo'); renderContPick(); return; }
  contWarn=null;
  const [ts,tk]=contTheme(), w=wearOf(k), d=S.dex[k], n=wearCount(k);
  const rows=[];
  rows.push([`👗 꾸민 소품 ${n}개`, n*20]);
  rows.push([`${WEAR[ts].items[tk].em} 오늘의 주제`, w[ts]===tk?40:0]);
  if(n===3) rows.push(['✨ 머리·목·손 풀코디', 20]);
  rows.push([`💗 하트 ${hearts(k)}개`, hearts(k)*4]);
  rows.push([`⭐ ${d.g}개`, d.g*5]);
  rows.push(['🙂 심사위원 기분', ri(0,15)]);
  const tot=rows.reduce((a,r)=>a+r[1],0);
  const rank= tot>=115?1:(tot>=75?2:3);
  const m=1+S.lv*0.25;
  const pay=[null,{t:5,c:Math.ceil(200*m),b:12,e:12},
                  {t:3,c:Math.ceil(120*m),b:8, e:8},
                  {t:1,c:Math.ceil(60*m), b:5, e:5}][rank];
  S.cont.d=todayKey(); S.cont.play=(S.cont.play||0)+1;
  S.cont.best=Math.max(S.cont.best||0,tot);
  if(rank===1) S.cont.win=(S.cont.win||0)+1;
  S.top+=pay.t; S.coin+=pay.c;
  addBond(k,pay.b); addExp(pay.e);
  mailAct(k,'cont',0.40);              /* 💌 무대에 섰던 이야기를 편지로 */
  contRes={k,rows,tot,rank,pay};
  sfx(rank===1?'star4':'nw'); vib(rank===1?[0,30,50,30,50,30]:[0,30,50,30]);
  checkBadges(); save(); renderHUD(); renderContResult();
  setTimeout(()=>{ if(tab==='scoop'||tab==='play') renderView(); },10);
}

/* ---------- 📤 사진을 그림 파일로 ----------
   화면의 사진은 HTML+CSS 라서 그대로는 파일이 안 된다. 같은 그림을 SVG 한 장으로
   다시 그리고(햄쮜는 이미 SVG 라서 그대로 끼워 넣는다) canvas 에 옮겨 PNG 로 만든다.
   폰에서는 나온 그림을 꾹 눌러 저장하는 게 제일 쉬워서, 버튼과 함께 그림도 같이 띄운다. */
const PH_W=560, PH_H=556;
function photoSVG(p){
  const F=FRAMES[p.frame]||FRAMES.ribbon;
  const px=28, py=28, pw=PH_W-56, ph=400;
  const hams=p.hams.filter(h=>{ const d=S.dex[h.k]; return (d&&d.mix)||FL[h.k]; });
  const n=Math.max(1,hams.length);
  const size=Math.min(226, Math.floor((pw-24)/n));
  const x0=px+(pw-size*n)/2, baseY=py+ph-26;
  const inner=hams.map((h,i)=>{
    const d=S.dex[h.k], m=d&&d.mix;
    const one=m ? hamSVG({shape:m.shape, color:h.k, colorObj:m.col, pattern:h.p||'plain',
                          grade:h.g||1, cone:m.cone, wear:h.w, baby:photoBaby(h,m)})
                : hamSVG({shape:FL[h.k].shape, color:FL[h.k].color, pattern:h.p||'plain',
                          grade:h.g||1, cone:FL[h.k].c, wear:h.w});
    /* 같은 햄쮜를 두 마리 넣으면 clipPath 아이디가 겹친다 → 자리마다 다르게 바꿔 준다 */
    const body=one.replace(/^<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'').replace(/hc(\d+)/g,'hc$1s'+i);
    return `<svg x="${Math.round(x0+i*size)}" y="${Math.round(baseY-size)}" width="${size}" height="${size}"
              viewBox="0 0 100 100" overflow="visible">${body}</svg>`;
  }).join('');
  const cn=[[px+16,py+44,'start'],[px+pw-16,py+44,'end'],
            [px+16,py+ph-14,'start'],[px+pw-16,py+ph-14,'end']];
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const font=`font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI Emoji',sans-serif"`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${PH_W}" height="${PH_H}" viewBox="0 0 ${PH_W} ${PH_H}">
    <defs>
      <linearGradient id="phsky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${F.g1}"/><stop offset="1" stop-color="${F.g2}"/></linearGradient>
      <clipPath id="phpic"><rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="20"/></clipPath>
    </defs>
    <rect x="4" y="4" width="${PH_W-8}" height="${PH_H-8}" rx="26" fill="#ffffff" stroke="${F.line}" stroke-width="8"/>
    <g clip-path="url(#phpic)">
      <rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="url(#phsky)"/>
      <rect x="${px}" y="${py+ph*0.64}" width="${pw}" height="${ph*0.36}" fill="${F.fl}"/>
      ${F.cn.map((e,i)=>`<text x="${cn[i][0]}" y="${cn[i][1]}" text-anchor="${cn[i][2]}"
        font-size="34" opacity=".9" ${font}>${e}</text>`).join('')}
      ${inner}
    </g>
    <text x="${PH_W/2}" y="${py+ph+52}" text-anchor="middle" font-size="34" font-weight="700"
      fill="#5c3a49" ${font}>${esc(p.cap||'우리 가게에서 📸')}</text>
    <text x="${PH_W/2}" y="${py+ph+94}" text-anchor="middle" font-size="24"
      fill="#9a8790" ${font}>${esc(dateLabel(p.t))} · 햄스킨라빈스</text>
  </svg>`;
}
function svgToPNG(svg,w,h){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=w*2; c.height=h*2;                        /* 두 배로 그려 또렷하게 */
      const g=c.getContext('2d');
      g.fillStyle='#ffffff'; g.fillRect(0,0,c.width,c.height);
      g.drawImage(img,0,0,c.width,c.height);
      try{
        const url=c.toDataURL('image/png');
        c.toBlob(b=>res({url, blob:b}), 'image/png');
      }catch(e){ rej(e); }
    };
    img.onerror=()=>rej(new Error('그림을 만들지 못했어요'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}

    const d=new Date();
    const pad=n=>String(n).padStart(2,'0');
    a.download=`hamskin-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    sfx('gift'); toast('💾 그림을 내려받았어요');
  }catch(e){ sfx('boo'); toast('저장이 안 되면 그림을 <b>꾹 눌러</b> 저장해 주세요'); }

/* ==================================================================
   💞 믹스쮜 — 햄쮜 둘을 짝지어 새 햄쮜가 태어난다
      딸기쮜 + 바나나쮜 = 딸바쮜 처럼 이름 앞 글자를 하나씩 따서 붙이고,
      색은 두 햄쮜의 색을 진짜로 섞어서 세상에 없던 색을 만든다.
================================================================== */
const MIX_TOP=5;                      /* 짝지어줄 때 드는 🍒토핑 */
const MIX_NEED_HEART=1;               /* 둘 다 하트가 이만큼은 있어야 한다 */

function mixHex(a,b){                 /* 색 두 개의 한가운데 색 */
  const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const [r1,g1,b1]=p(a), [r2,g2,b2]=p(b);
  const m=(x,y)=>Math.round((x+y)/2).toString(16).padStart(2,'0');
  return '#'+m(r1,r2)+m(g1,g2)+m(b1,b2);
}
function mixKeyOf(a,b){               /* 순서가 달라도 같은 짝은 같은 아이 */
  const [x,y]=[a,b].sort((p,q)=>FL[p].i-FL[q].i);
  return 'mix_'+x+'_'+y;
}
function mixNameOf(a,b){
  const [x,y]=[a,b].sort((p,q)=>FL[p].i-FL[q].i);
  return FL[x].n.charAt(0)+FL[y].n.charAt(0)+'쮜';
}
function canMix(a,b){
  if(!a||!b||a===b) return '서로 다른 햄쮜 둘을 골라주세요';
  if(!S.dex[a]||!S.dex[b]) return '아직 만나지 못한 햄쮜예요';
  if(!isTub(a)||!isTub(b)) return '통에서 뜬 햄쮜끼리만 짝지을 수 있어요';
  if(S.dex[mixKeyOf(a,b)]) return `이 짝의 <b>${mixNameOf(a,b)}</b> 는 이미 태어났어요`;
  if(hearts(a)<MIX_NEED_HEART||hearts(b)<MIX_NEED_HEART)
    return `둘 다 💗하트가 ${MIX_NEED_HEART}개 이상이어야 해요 — 더 놀아주세요`;
  if(S.top<MIX_TOP) return `🍒토핑이 ${MIX_TOP-S.top}개 더 필요해요`;
  return null;
}
function makeMix(a,b){
  const why=canMix(a,b);
  if(why){ sfx('boo'); toast(why); return; }
  const [x,y]=[a,b].sort((p,q)=>FL[p].i-FL[q].i);
  const fx=FL[x], fy=FL[y], dx=S.dex[x], dy=S.dex[y];
  const cx=COLORS[fx.color], cy=COLORS[fy.color];

  S.top-=MIX_TOP;
  const key=mixKeyOf(x,y);
  let g=Math.max(dx.g,dy.g);
  if(g<=3){ if(Math.random()<0.3) g++; }                      /* 둘보다 좋아질 수도 */
  else if(g===4 && Math.random()<0.08) g=5;                   /* ⭐4 둘이면 아주 드물게 ⭐5 */
  S.dex[key]={
    g, p:pick([dx.p,dy.p]), n:1, bond:0, over:0, since:Date.now(), anniv:0, w:{hat:null,neck:null,hand:null,cone:null},
    mix:{
      a:x, b:y, hn:mixNameOf(x,y),
      /* 예전엔 둘 중 한쪽 모양을 그냥 골랐다 — 그러면 색만 바뀐 것처럼 보여서
         짝지어 줄 이유가 없었다. 몸은 첫째, 귀는 둘째, 장식은 둘 다 얹는다. */
      sa:fx.shape, sb:fy.shape,
      shape: ensureMixShape(fx.shape, fy.shape),
      cone : mixHex(fx.c,fy.c),
      col  : {
        name :'섞은 색',
        base :mixHex(cx.base ,cy.base),
        light:mixHex(cx.light,cy.light),
        dark :mixHex(cx.dark ,cy.dark),
        cheek:mixHex(cx.cheek,cy.cheek)
      }
    }
  };
  addExp(30); sfx('nw'); vib([0,40,60,40,60,40]); checkBadges(); save(); renderHUD(); renderView();
  showMixBorn(key);
}

/* GPS 좌표에서 제일 가까운 도시를 찾는다. 「우리 동네」라고만 뜨면 위치가 틀려도 알 수가 없다.
   위도 1도 ≈ 111km, 경도는 위도만큼 좁아지므로 cos 를 곱해 준다. */
function nearCity(la,lo){
  let best=CITIES[0], bd=Infinity;
  const kx=Math.cos(la*Math.PI/180);
  CITIES.forEach(c=>{
    const dy=(c.la-la)*111, dx=(c.lo-lo)*111*kx, d=dy*dy+dx*dx;
    if(d<bd){ bd=d; best=c; }
  });
  return {c:best, km:Math.sqrt(bd)};
}
function geoPlace(la,lo){
  const r=nearCity(la,lo);
  return r.km<=14 ? r.c.n : `${r.c.n} 근처`;
}
const WX_TTL=1800000;                    /* 30분에 한 번만 물어본다 */

  const m=/T(\d{2}):(\d{2})/.exec(String(t||''));
  if(!m) return '';
  const h=+m[1];
  /* 0시를 「새벽 12시」, 12시를 「오후 12시」라고 하면 아이가 헷갈린다 — 말하는 대로 적는다 */
  if(h===0)  return '밤 12시';
  if(h===12) return '낮 12시';
  const ap = h<6?'새벽' : (h<12?'오전' : (h<18?'오후':'저녁'));

    p=>{ S.wx.gfail=0; wxAsk(p.coords.latitude, p.coords.longitude, geoPlace(p.coords.latitude,p.coords.longitude)); },
    ()=>wxGeoFallback(loud),

   wxFresh() 가 30분을 재고 있으므로 자주 불러도 실제로 물어보는 건 30분에 한 번뿐이다. */
function wxWake(loud){
  if(wxFresh() && !loud) return;
  if((S.wx&&S.wx.mode)==='city'){ wxUseCity(S.wx.city||'seoul'); return; }
  /* GPS 가 방금 실패했으면 3시간은 도시로 대신 보되, 모드는 gps 그대로 둔다 */
  const gf=(S.wx&&S.wx.gfail)||0;
  if(!loud && gf && Date.now()-gf < WX_GEO_RETRY) wxGeoFallback(0);

/* ---------- ⚙️ 설정 · 저장 코드 ---------- */
function b64enc(str){
  const b=new TextEncoder().encode(str); let out='';
  for(let i=0;i<b.length;i+=0x4000) out+=String.fromCharCode.apply(null,b.subarray(i,i+0x4000));
  return btoa(out);
}
/* 저장 코드는 메신저·메모장·주소창을 거쳐서 돌아온다. 그 사이에 흔히 이렇게 망가진다 —
   ① 「+」가 공백으로 바뀐다(주소창·일부 메신저).
   ② 「+ /」가 「- _」로 바뀐다(base64url).
   ③ 끝의 「=」가 잘려 나간다.
   여기서 전부 되돌려주지 않으면 아이가 「코드를 알아볼 수 없어요」만 보게 된다.
   ①은 까다롭다 — 붙여넣을 때 앞뒤에 붙은 공백까지 「+」로 바꾸면 오히려 코드가 깨진다.
   그래서 「공백을 지운 것」과 「공백을 +로 되돌린 것」 두 가지를 다 만들어 보고,
   JSON 이 열리는 쪽을 정답으로 고른다(decodeSave). */
function b64fix(code, spaceIsPlus){
  let s=String(code).trim();
  s = spaceIsPlus ? s.replace(/ /g,'+') : s;
  s=s.replace(/\s/g,'');                     /*    줄바꿈·탭은 언제나 지운다 */
  s=s.replace(/-/g,'+').replace(/_/g,'/');   /* ② base64url 되돌리기 */
  s=s.replace(/[^A-Za-z0-9+/=]/g,'');        /*    그 밖의 이물질 제거 */
  s=s.replace(/=+$/,'');
  while(s.length%4) s+='=';                  /* ③ 패딩 다시 채우기 */
  return s;
}
function b64dec(code, spaceIsPlus){
  const bin=atob(b64fix(code, spaceIsPlus));
  const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
/* 저장 코드를 읽어낸다. 두 가지 해석을 다 시도하고, 안 되면 왜 안 되는지 알려준다.
   why — 'char'(글자가 깨짐) · 'cut'(중간이 잘림) · 'other'(우리 코드가 아님) */
function decodeSave(code){
  let why='other';
  for(const plus of [false,true]){
    let txt;
    try{ txt=b64dec(code, plus); }
    catch(e){ if(why==='other') why='char'; continue; }
    try{
      const d=JSON.parse(txt);
      if(d && typeof d.coin==='number') return {ok:true, d};
    }catch(e){ why='cut'; }
  }
  return {ok:false, why};
}

/* 💾 파일로 저장 — 18KB 가 넘는 코드를 메신저로 주고받다 보면 잘리기 쉽다.
   파일로 내려받아 두면 한 글자도 잃지 않는다. */
function downloadSave(){
  const code=saveCode();
  if(!code){ sfx('boo'); toast('💾 저장 코드를 만들지 못했어요'); return; }
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  const name=`hamskin-save-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.txt`;
  try{
    const url=URL.createObjectURL(new Blob([code],{type:'text/plain'}));
    const a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    sfx('coin'); vib(20);
    toast(`💾 <b>${name}</b> 로 저장했어요 — 안전한 곳에 두세요`);
  }catch(e){ sfx('boo'); toast('💾 파일로 저장할 수 없는 환경이에요 — 코드를 복사해 주세요'); }
}
/* 📁 파일에서 되살리기 */
function pickSaveFile(){ const el=$('#sv-file'); if(el) el.click(); }
function loadSaveFile(input){
  const f=input && input.files && input.files[0];
  input.value='';
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>restoreFrom(String(r.result||''), '📁 '+f.name);
  r.onerror=()=>{ sfx('boo'); toast('📁 파일을 읽지 못했어요'); };
  r.readAsText(f);
}
function applySaveCode(){
  const el=$('#sv-in'); const code=el?String(el.value||'').trim():'';
  if(!code){ sfx('boo'); toast('📥 저장 코드를 붙여넣어 주세요'); return; }
  restoreFrom(code, '📥 붙여넣은 코드');
}
function restoreFrom(code, from){
  code=String(code||'').trim();
  if(!code){ sfx('boo'); toast('📥 되살릴 내용이 비어 있어요'); return; }
  /* 왜 안 되는지 알려줘야 아이도 어른도 고칠 수 있다 — 「알아볼 수 없어요」만 뜨면 손쓸 방법이 없다 */
  const r=decodeSave(code);
  if(!r.ok){
    sfx('boo');
    toast(r.why==='cut'
      ? `📥 코드가 <b>중간에 잘린 것 같아요</b> — 처음부터 끝까지 전부 복사했는지 봐주세요
         <span style="font-size:.9em">(받은 길이 ${fmt(code.length)}글자)</span>`
      : r.why==='char'
      ? '📥 코드에 이상한 글자가 섞였어요 — 메모장에 붙여넣었다가 <b>전부 다시 복사</b>해 주세요'
      : '📥 햄스킨라빈스 저장 코드가 아닌 것 같아요');
    return;
  }
  const d=r.d;
  /* 무엇으로 바뀌는지 먼저 보여준다 — 엉뚱한 코드를 넣고 지금 가게를 날리는 일이 없게 */
  const nDex=d.dex&&typeof d.dex==='object'?Object.keys(d.dex).length:0;
  askConfirm('📥 되살리기',
    `${from} 안에 이런 가게가 들어 있어요 —<br>
     <b>가게 Lv.${d.lv||1}</b> · 햄쮜 <b>${nDex}마리</b> · 🪙${fmt(d.coin||0)} · 🍒${fmt(d.top||0)}<br><br>
     지금 가게는 사라지고 <b>이 가게</b>로 바뀌어요. 계속할까요?`,'되살리기',()=>{
      /* ① 먼저 모든 저장을 잠근다 — 이 순간부터 옛 가게는 어디에도 써지지 않는다 */
      _restoring=true;
      stopTick();
      window.removeEventListener('beforeunload',save);
      window.removeEventListener('pagehide',save);
      /* ② 되살릴 내용을 써 넣는다 */
      try{ localStorage.setItem(SAVE,JSON.stringify(d)); }
      catch(e){
        _restoring=false; startTick();
        sfx('boo'); toast('📥 저장 공간이 가득 찼어요 — 사진첩을 좀 지우고 다시 해보세요');
        return;
      }
      /* ③ 화면을 새로 연다. 창을 닫을 때 부른 뒤로가기와 부딪혀 새로고침이 씹히는 일이 있어서
         조금 뒤에 한 번 더 확실하게 밀어준다(폰에서 실제로 겪던 증상). */
      toast('📥 되살리는 중이에요…');
      try{ location.reload(); }catch(e){}
      setTimeout(()=>{ try{ location.replace(location.pathname+location.search); }catch(e){} }, 600);
    });
}

/* ⚠️ 말풍선은 #terrace 가 overflow:hidden 이라, 길면 가장자리 햄쮜의 말이 잘린다.
   그래서 한 마디는 **열 글자 안쪽**으로 짓고, 아래 mumbleOf 에서 한 번 더 걸러낸다. */
const MUMBLE_MAX=10;
const MUMBLE=['놀자!','헤헤','간식 주세요','졸려요…','좋아 좋아♪','예쁘다!','쓰담쓰담…','히히',
              '아이스크림 최고!','또 놀아줘요','룰루랄라','배고파요','간지러워요','신난다!',
              '오늘 뭐 할까?','볼이 말랑말랑','한 입만…','두근두근','폴짝!','기지개~',
              '여기 포근해요','다들 어디 갔지?','나 여기 있어요','콧노래 룰루'];
const MUMBLE_LOVE=['제일 좋아!','같이 있자','고마워요 💗','내 친구 💕','행복해요','보고 싶었어요',
                   '옆에 있어줘요','나만 봐요 💗','제일제일 좋아'];
const MUMBLE_NAP=['쿨쿨…','zZ','꿈꾸는 중…','😴','포근해…','조금만 더…'];
/* 말풍선 — 아무 말이나 하는 것보다 **그 아이 사정**이 섞이면 훨씬 살아 있어 보인다.
   좋아하는 놀이 · 함께한 날 · ⭐ · 오늘의 친구 · 마당 날씨를 넣는다. */
function mumbleOf(k){
  if(napLeft() || isNight()) return pick(MUMBLE_NAP);
  if(Math.random()<0.20) return pick(['♪','💗','😴','✨','🎵','🍨','🎀','💫','🥰']);
  const pool=MUMBLE.slice();
  if(hearts(k)>=3) pool.push(...MUMBLE_LOVE);
  const t=TOYS[favToy(k)];
  if(t) pool.push(t.em+' 하고파', t.name+' 최고!');
  const dw=daysWith(k);
  if(dw>=7) pool.push('벌써 '+dw+'일째!');
  const d=S.dex[k];
  if(d && d.g>=4) pool.push('나 반짝반짝!','오늘 좀 예뻐요');
  if(S.star && S.star.k===k) pool.push('오늘은 내 날!');
  if(isYard(S.room|0)){
    const w=wxNow();
    pool.push(w.wet?'빗소리 좋아요':'바깥 공기 좋다','여기 넓어서 좋다');
  }
  const fit=pool.filter(s=>s.length<=MUMBLE_MAX);
  return pick(fit.length?fit:MUMBLE);
}

/* 안드로이드 뒤로가기 버튼으로 창이 닫히게 한다(앱이 그냥 종료되는 것을 막는다).
   창을 처음 열 때 방문기록 하나를 끼워 넣고, 뒤로가기가 오면 그걸 창 닫기로 쓴다. */
let _backArmed=false;
let _backTm=0;                       /* 미뤄둔 뒤로가기 (아래 closeModal 주석 참고) */
function openModal(html){
  const veil=$('#veil');
  /* 「닫고 → 바로 다른 창 열기」 흐름이면 미뤄둔 뒤로가기를 취소한다.
     끼워둔 방문기록은 그대로 두고 쓰므로 다시 넣지 않는다. */
  if(_backTm){ clearTimeout(_backTm); _backTm=0; }
  $('#modal').innerHTML=html;
  if(!veil.classList.contains('on')){
    veil.classList.add('on');
    if(!_backArmed){ _backArmed=true; try{ history.pushState({m:1},''); }catch(e){} }
  }
  /* ⚠️ 맨 위로 올리는 건 <b>창을 보이게 한 다음</b>이다.
     숨어 있는 동안 준 scrollTop 은 먹지 않아서, 다음에 연 창이 <b>앞 창이 내려가 있던 자리</b>에서
     시작했다 — 도움말을 열었는데 한가운데부터 보이는 식이었다. */
  $('#modal').scrollTop=0;
}
let _selfBack=0;                     /* 내가 부른 뒤로가기가 몇 개 날아가 있는지 */
function closeModal(fromBack){
  const veil=$('#veil');
  if(!veil.classList.contains('on')){ _backArmed=false; return; }
  veil.classList.remove('on');
  if(!_backArmed) return;
  if(fromBack){ _backArmed=false; return; }
  /* ⚠️ 여기서 history.back() 을 바로 부르면 안 된다.
     「닫고 → 바로 다른 창 열기」(closeModal();openMail(0) 같은 자리가 열 곳쯤 있다)에서는
     back() 이 처리되기 전에 pushState 가 끼어들어 방문기록이 어긋난다.
     그러면 _backArmed 는 켜져 있는데 끼워둔 기록은 사라져서, 그다음 「닫기」가
     페이지를 통째로 뒤로 보내버린다 — 📢뉴스를 보고 돌아온 뒤였다면 뉴스로 튄다.
     그래서 한 박자 미루고, 그새 창이 다시 열렸으면 없던 일로 한다. */
  _backTm=setTimeout(()=>{
    _backTm=0;
    if($('#veil').classList.contains('on')) return;   /* 다시 열렸다 — 기록은 그대로 둔다 */
    _backArmed=false; _selfBack++;
    try{ history.back(); }catch(e){}
  },0);
}
window.addEventListener('popstate',()=>{
  /* 창을 닫으려고 내가 부른 뒤로가기라면 여기서 끝 — 탭까지 움직이면 안 된다 */
  if(_selfBack>0){ _selfBack--; return; }
  if($('#veil').classList.contains('on')){ closeModal(true); return; }   /* 창만 닫고 앱은 그대로 */
  /* 다른 탭에 있었다면 먼저 첫 탭으로 — 실수로 앱이 닫히는 것을 막는다 */
  if(typeof tab!=='undefined' && tab!=='scoop'){
    go('scoop');
    try{ history.pushState({t:1},''); }catch(e){}
  }
});

/* 💬 말풍선은 햄쮜 한가운데에 붙는데, #terrace 가 overflow:hidden 이라
   가장자리 햄쮜의 말은 잘려 나간다. 그린 뒤에 안쪽으로 밀어 넣는다.
   자리는 layout 값(offsetLeft)으로 재고 산책 폭(--d)까지 더해 둔다 —
   getBoundingClientRect 로 재면 그때그때 산책 중인 위치라 계속 어긋난다. */
function fitBubbles(){
  const t=$('#terrace'); if(!t) return;
  const tw=t.clientWidth;
  $$('#terrace .tham').forEach(el=>{
    const b=el.querySelector('.hb'); if(!b) return;
    b.style.marginLeft='0px';
    const d=parseFloat(getComputedStyle(el).getPropertyValue('--d'))||0;
    const c=el.offsetLeft, half=b.offsetWidth/2;
    const lo=c-half-d, hi=c+half+d;
    let dx=0;
    if(lo<3) dx=3-lo; else if(hi>tw-3) dx=tw-3-hi;
    if(dx) b.style.marginLeft=Math.round(dx)+'px';
  });
}

let lastT=Date.now(), saveAcc=0, wxAcc=0, mailAcc=0, _napOn=false, _timer=null;
function tick(){
  const now=Date.now(), dt=clamp((now-lastT)/1000,0,5); lastT=now;
  const inc=autoIncome();
  if(inc>0) S.coin+=inc*dt;
  renderHUD();
  saveAcc+=dt; if(saveAcc>=10){ saveAcc=0; save(); }
  /* 🌤️ 마당에 들어올 때만 물어보면 게임을 계속 켜둔 채로는 아침 날씨가 밤까지 그대로 남는다.
     1분에 한 번 두드리기만 하고, 진짜로 물어볼지는 wxFresh() 가 정한다(30분). */
  wxAcc+=dt;
  if(wxAcc>=60){ wxAcc=0; if(roomOk(YARD_I)) wxWake(); }
  /* 💌 노는 동안에도 편지가 배달된다 — 30초에 한 번 두드리고,
     진짜로 보낼지는 mailCheck() 가 정한다(8분 간격 · 하루 3통). */
  /* 😴 낮잠이 시작되거나 끝나면 얼굴이 바뀌므로 놀이방을 한 번 다시 그린다 */
  const nap=napLeft()>0;
  if(nap!==_napOn){ _napOn=nap; if(tab==='play') renderView(); }
  mailAcc+=dt;
  if(mailAcc>=30){
    mailAcc=0;
    /* 🥚 아기가 자랐는지 먼저 본다 — 부탁 축하와 창이 겹치지 않게 하나씩 */
    const _grew=babyGrow();
    if(_grew.length) babyGrewTell(_grew);
    /* 🌟 부탁 — 이뤄진 것을 먼저 걷고, 자리가 남으면 새 부탁이 생긴다 */
    else reqCelebrate(reqCheck());
    if(reqTick()){ renderView(); }
    /* 🎒 돌아온 무리는 무리마다 한 번씩만 알려준다 — 마중은 아이가 직접 나가게 둔다 */
    {
      const back=tripBackList().filter(t=>!_tripTold[t.at]);
      if(back.length){
        back.forEach(t=>_tripTold[t.at]=1);
        sfx('gift');
        toast(`🎒 <b>소풍에서 돌아왔어요!</b>${back.length>1?` (${back.length}무리)`:''} — 🎮놀이터에서 마중 나가주세요`);
        renderHUD(); renderView();
      }
      /* 다 맞이했으면 셈을 비운다 — 안 그러면 계속 쌓인다 */
      if(!tripOn()) _tripTold={};
    }
    if(mailCheck()){
      sfx('gift'); toast('💌 <b>편지가 왔어요!</b> — 💌우체통에서 읽어보세요');
      renderHUD(); if(tab==='play') renderView();
    }
  }
}
function startTick(){ if(!_timer){ lastT=Date.now(); _timer=setInterval(tick,250); } }
function stopTick(){ if(_timer){ clearInterval(_timer); _timer=null; } }

/* 앱을 접었다 펴는 흐름 — 접을 때 저장하고 소리를 멈추고, 펼 때 그동안의 수입을 준다 */
let hidAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    hidAt=Date.now(); save(); stopTick();
    if(AC && AC.suspend) try{ AC.suspend(); }catch(e){}
  }else{
    if(hidAt){
      const dt=clamp((Date.now()-hidAt)/1000,0,OFFLINE_MAX), inc=autoIncome(true);
      if(dt>60 && inc>0){
        const got=Math.floor(inc*dt*OFFLINE_RATE);
        if(got>0){ S.coin+=got; toast(`🐹 안 보는 동안 햄쮜가 🪙+${fmt(got)} 모아뒀어요`); }
      }
      hidAt=0; save();
    }
    if(tripBack()) toast('🎒 <b>소풍에서 돌아왔어요!</b> — 🎮놀이터에서 마중 나가주세요');
    if(mailCheck()) toast('💌 <b>편지가 왔어요!</b> 🏠놀이방이나 💌우체통에서 읽어보세요');
    startTick(); renderAll();
    if(roomOk(YARD_I)) wxWake();     /* 🌤️ 접어뒀다 펴면 그새 날씨가 바뀌었을 수 있다 */
  }
});

/* ---------- 시작 ---------- */
if(!load()) S=freshState();
mailCheck(true);        /* 💌 게임을 켜면 편지 한 통이 와 있다 (그 뒤로는 8분마다) */
initHUD();
applyTheme();
renderAll();
startTick();
if(roomOk(YARD_I)) setTimeout(()=>wxWake(),900);   /* 🌤️ 마당이 열렸으면 오늘 날씨를 받아둔다 */
window.addEventListener('beforeunload',save);
window.addEventListener('pagehide',save);

/* 홈 화면에 설치해서(PWA) 인터넷 없이도 열리게 — sw.js 가 같은 폴더에 있을 때만 동작한다.
   file:// 로 직접 열거나 서비스워커가 없는 환경에서는 그냥 조용히 넘어간다. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
setTimeout(()=>{
  if(!S.tut){ S.tut=1; save(); showTutorial(); }   /* 처음이면 튜토리얼부터 */
  else runStartQueue();                             /* 그 다음엔 오프라인 보고 → 도장판 */
},320);
</script>
